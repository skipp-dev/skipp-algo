[build]
builder = "DOCKERFILE"
dockerfilePath = "services/signals_producer/Dockerfile"
# Auto-deploy trigger paths (gitignore-style). The producer runs
# `python -m open_prep.realtime_signals`, so its real code lives in open_prep/
# and newsstack_fmp/ — NOT in services/signals_producer/ (which holds only the
# Dockerfile + this file). Without open_prep/** here, changes there (e.g. the
# 2026-07-08 rt_notify push hook) silently did NOT redeploy the producer.
# Config-as-code watchPatterns OVERRIDE the dashboard setting, so this list must
# be complete — add any new cross-repo runtime dependency of the producer here.
# Completeness is now enforced by
# tests/test_signals_producer_service_contract.py::test_railway_watch_patterns_cover_every_copied_module
# (every Dockerfile COPY source must be covered). Deeply-transitive changes can
# still be deployed manually via
# `railway redeploy --service smc-signals-producer --from-source`.
watchPatterns = [
    "open_prep/**",
    "newsstack_fmp/**",
    "terminal_fmp_insights.py",
    "cisco_ai_defense.py",
    "open_prep_boundary.py",
    "terminal_technicals.py",
    "terminal_fmp_technicals.py",
    "terminal_tradingview_news.py",
    "databento_utils.py",
    "smc_core/**",
    "scripts/smc_newsapi_ai.py",
    "scripts/smc_atomic_write.py",
    "requirements.txt",
    "services/signals_producer/**",
]

[deploy]
# Long-running worker: the realtime signal engine polls FMP forever and serves
# the latest signals over /signals (consumed by sibling services on the
# private network).  The engine must bind its telemetry HTTP server to the
# Railway-provided port so /healthz is reachable by Railway's healthcheck.
# The Python entrypoint reads PORT as its telemetry default; keep the command
# free of literal "$PORT" arguments because Railway startCommand does not
# reliably shell-expand them.
startCommand = "python -m open_prep.realtime_signals"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "smc-signals-producer"
