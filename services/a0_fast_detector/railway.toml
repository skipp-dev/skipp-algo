[build]
builder = "DOCKERFILE"
dockerfilePath = "services/a0_fast_detector/Dockerfile"
watchPatterns = [
    "open_prep/a0_contract.py",
    "open_prep/a0_stream.py",
    "open_prep/a0_stream_state.py",
    "newsstack_fmp/_market_cal.py",
    "services/a0_fast_detector/**",
]

[deploy]
startCommand = "python -m services.a0_fast_detector.worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "a0-fast-shadow"
