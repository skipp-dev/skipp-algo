groups:
  - name: a0-fast-shadow
    rules:
      - alert: A0FastStreamDisconnected
        expr: a0_fast_stream_connected == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A0-Fast shadow stream is disconnected

      - alert: A0FastSlowReaderDrops
        expr: increase(a0_fast_queue_dropped_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A0-Fast bounded queue dropped bars and forced resync

      - alert: A0FastRecordRejections
        expr: increase(a0_fast_records_rejected_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: A0-Fast rejected Databento bars before decision processing

      - alert: A0FastResyncStuck
        expr: a0_fast_resync_required_symbols > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A0-Fast symbols remain fail-closed awaiting reconstruction

      - alert: A0FastQueuePressure
        expr: a0_fast_queue_depth / clamp_min(a0_fast_queue_capacity, 1) > 0.8
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: A0-Fast queue remains above 80 percent capacity

      - alert: A0FastStaleStream
        expr: a0_fast_stream_connected == 1 and a0_fast_last_record_age_seconds > 8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A0-Fast stream is connected but no fresh bar arrived
