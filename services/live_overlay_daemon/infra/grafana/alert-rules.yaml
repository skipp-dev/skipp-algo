    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer RSS exceeds 2048 MB for > 5 min — footprint regression
      runbook: 'Footprint-regression detector, NOT an OOM alarm. The Railway limit is
        8 GB (MEMORY_LIMIT_GB=8.00, verified 2026-07-15), so 2048 MB is 25% of it and
        carries no OOM risk; OOM is owned solely by lo-railway-memory-ratio-high (0.75
