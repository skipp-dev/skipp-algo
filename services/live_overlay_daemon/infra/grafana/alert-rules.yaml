    condition: C
    # Same gt-0-inert hole as lo-evidence-audit-branch-age-unknown: a snapshot
    # that parses without `wsh.newest_date` yields age_known=0 AND
    # age_seconds=0, so the stale rule reads 0>604800=false and the unloadable
