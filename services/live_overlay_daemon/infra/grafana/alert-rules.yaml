  - uid: lo-evidence-audit-branch-age-unknown
    title: Phase-A audit branch age unknown (snapshot loads but carries no date)
    condition: C
    # Complement of the stale rule above. `_coerce` (evidence_freshness_bridge)
    # hard-codes loaded=1.0 and tolerates missing keys, so a snapshot that
    # PARSES but carries no `audit_branch.last_commit_date` yields
    # age_known=0 AND age_seconds=0 -- the stale rule reads 0>345600=false and
    # lo-evidence-snapshot-unloadable reads loaded<1=false. Both stay green
    # with zero data (the gt-0-inert class). This is not theoretical: the
    # GitHub Contents-API envelope decoded to exactly that shape ("EMPTY
    # snapshot with loaded=1, keeping the stale alert silently green" --
    # _fetch_url, post-review finding 1); the cause was fixed, the DETECTION
    # was not. Gated on `loaded` so an unloadable snapshot pages once (via
    # lo-evidence-snapshot-unloadable) instead of twice. `== bool 0` is
    # mandatory: a bare `== 0` returns 0 and gt-0 reads 0>0=false -- inert.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_freshness_loaded{job="live_overlay"} * (live_overlay_evidence_audit_branch_age_known{job="live_overlay"}
          == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The evidence snapshot loads but carries no audit-branch commit date -- the
        stale rule cannot see this state and stays green with zero data.
      runbook: live_overlay_evidence_audit_branch_age_known is 0 while the snapshot loaded=1.
        The producer is publishing a snapshot whose `audit_branch.last_commit_date` is
        missing/empty/unparseable (schema drift or a truncated write). Inspect the payload
        at EVIDENCE_FRESHNESS_SNAPSHOT_URL and see evidence-freshness-snapshot.yml. Staleness
        is only computed once an age is KNOWN.
  - uid: lo-evidence-wsh-stale
