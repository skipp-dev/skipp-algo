apiVersion: 1
groups:
- orgId: 1
  name: live-overlay-critical
  folder: SMC Live Overlay
  interval: 1m
  rules:
  - uid: lo-scrape-missing
    title: Metrics scrape missing
    condition: C
    # absent() yields an empty vector when HEALTHY → NoData is the normal state,
    # not the alarm. The alarm fires via absent()==1; keep NoData quiet.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_uptime_seconds{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Prometheus is not scraping live-overlay metrics
      runbook: Check metrics-collector service and /metrics auth/path wiring.
  - uid: lo-core-signal-missing
    title: Core readiness signal missing
    condition: C
    # absent()==1 is the alarm; a healthy empty vector must not page as NoData.
    #
    # Covers all FOUR readiness inputs, not just overlay_fresh (2026-07-23).
    # lo-scrape-missing catches a whole-daemon outage, but a SELECTIVE export
    # bug in one gauge was alert-blind, and each consumer fails silently rather
    # than loudly when its input vanishes:
    #   * feed_healthy -> lo-feed-down-market-open computes
    #     market_us_open * ((1 - feed_healthy) + bar-age-term). Vector
    #     arithmetic inner-joins, so an empty (1 - feed_healthy) empties the
    #     whole sum -- the bar-age term is lost too and the feed-down alert
    #     dies entirely, exactly when the feed is the thing in question.
    #   * workers_healthy -> lo-workers-degraded reads `< 1` on an empty
    #     vector, which never crosses the threshold.
    #   * overlay_symbols -> lo-no-symbols evaluates `$A == 0 && $E == 1 && …`
    #     over an inner-joined math expression, so an empty $A empties the
    #     whole condition and the zero-symbols alert never fires. It was left
    #     out of the original three by oversight, not by decision: the failure
    #     mode is identical to workers_healthy and nothing else covers it
    #     (lo-overlay-stale reads overlay_age_seconds, a different series).
    # Grafana's default NoData handling is not a substitute: these rules
    # leave noDataState unset, and a DatasourceNoData instance carries none of
    # our severity labels or runbooks, so its routing is a notification-policy
    # detail rather than a guarantee stated in this file.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_overlay_fresh{job="live_overlay"}) or
          absent(live_overlay_feed_healthy{job="live_overlay"}) or
          absent(live_overlay_workers_healthy{job="live_overlay"}) or
          absent(live_overlay_overlay_symbols{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A core readiness metric (overlay_fresh / feed_healthy / workers_healthy
        / overlay_symbols) is missing from scrape output
      runbook: Query each of live_overlay_overlay_fresh, live_overlay_feed_healthy,
        live_overlay_workers_healthy and live_overlay_overlay_symbols to find which one
        vanished, then verify the daemon /metrics output and the exporter logic for that
        gauge. While it is missing, its consumer (lo-workers-degraded /
        lo-feed-down-market-open / lo-no-symbols) cannot fire.
  - uid: lo-feed-down-market-open
    title: Feed unhealthy while market open
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Two critical paths, not one: `1 - feed_healthy` catches loud failures
        # (BentoError/circuit-break clears _feed_ready) and never-seen bars
        # (is_ready() is False while last_bar_at <= 0), but a SILENT stall keeps
        # _feed_ready set and only ages the last bar — feed_healthy stays 1
        # until the 3600s payload-staleness gate (truth-audit 2026-07-22 F-1:
        # critical was blind for up to ~1h). The bar-age term closes that gap at
        # 600s = 2x the lo-last-bar-stale-open high threshold (escalation
        # ladder, NOT a duplicate 300s page) and past the supervisor's 180s
        # stall-detect + heal window, so a successful self-heal never pages.
        # Gated on age_known so the unknown-age 0.0 cannot read as fresh.
        expr: "live_overlay_market_us_open{job=\"live_overlay\"} * (\n  (1 - live_overlay_feed_healthy{job=\"\
          live_overlay\"})\n  + (\n    live_overlay_last_bar_age_known{job=\"live_overlay\"\
          }\n    * (live_overlay_last_bar_age_seconds{job=\"live_overlay\"} > bool\
          \ 600)\n  )\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Live overlay feed is DOWN or silently stalled (no bar > 10 min) during
        market-open for > 5 min
      runbook: Check Railway logs for BentoError / circuit breaker; verify DATABENTO_API_KEY
        validity. If feed_healthy is still 1, this is the silent-stall path — check
        supervisor partial_restarts/circuit_breakers counters and last_bar_age_seconds
        (supervisor stall-detect is 180s; escalation here means self-heal did not
        restore bars).
  - uid: lo-workers-degraded
    title: Workers unhealthy
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_workers_healthy{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: One or more worker threads are dead
      runbook: Check worker_liveness in /health. Railway may need restart (ON_FAILURE
        should auto-recover).
  - uid: lo-overlay-stale
    title: Overlay data stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: "(\n  live_overlay_overlay_age_seconds{job=\"live_overlay\"}\n  * live_overlay_overlay_age_known{job=\"\
          live_overlay\"}\n)\n+ (\n  (1 - live_overlay_overlay_age_known{job=\"live_overlay\"\
          })\n  * 3601\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 3600
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Overlay age > 1h — compute cycle likely hung or erroring
      runbook: Check full_compute_cycle_errors rate. Verify feed is pushing bars (last_bar_age_seconds).
  - uid: lo-no-symbols
    title: Zero overlay symbols after warmup
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_overlay_symbols{job="live_overlay"}
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_uptime_seconds{job="live_overlay"}
        instant: true
    - refId: D
      datasourceUid: grafanacloud-prom
      model:
        # Restart detection via start-time changes — increase() over
        # live_overlay_daemon_restarts_total (a constant-1 gauge) was
        # always 0, so the "restarted AND 0 symbols before 600s uptime"
        # fast path of this alert could never fire (found 2026-07-08;
        # same inert class as lo-daemon-restarts-high, fixed 2026-07-07).
        expr: changes(live_overlay_process_start_time_seconds{job="live_overlay"}[10m])
        instant: true
    - refId: E
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"}
        instant: true
    # Gated on market-open ($E == 1): the equity feed only streams bars during
    # US market hours, so zero symbols overnight is NORMAL — and a redeploy
    # outside market hours (which wipes the in-memory overlay) would otherwise
    # false-fire this critical every time (observed 2026-07-08: a docs-only
    # daemon deploy at 05:51 UTC / 02:15 ET cleared 69 held symbols to 0 while
    # the market was closed). During market hours, zero symbols after warmup is
    # a real compute/feed failure and still fires.
    - refId: C
      datasourceUid: __expr__
      model:
        type: math
        expression: $A == 0 && $E == 1 && ($B > 600 || $D > 0)
    for: 5m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: No symbols computed after 10 min uptime WHILE the US market is open
      runbook: Service is up and the US market is open but the compute cycle never
        produced symbols. Check feed + compute logs. (Zero symbols outside market
        hours is expected and does not fire.)
  - uid: lo-restart-data-loss-closed
    title: Overlay data lost after restart (market closed)
    condition: C
    # Truth-audit F-1: a restart (deploy or ON_FAILURE escalation) wipes the
    # in-memory bar/overlay caches. During US market hours lo-no-symbols
    # catches the empty state; overnight it is deliberately silent (a
    # closed-market redeploy clearing 69 held symbols was its documented
    # false-fire case), so a nightly restart silently dropped every held
    # symbol with no signal until the next open. This complement fires
    # WARNING (visibility, not paging) when the daemon restarted recently
    # (uptime < 6h), has held zero overlay symbols for 30m+, and the market
    # is closed. It self-resolves at 6h uptime or when data returns; a
    # long-running daemon holding weekend data never trips it.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_overlay_symbols{job="live_overlay"}
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_uptime_seconds{job="live_overlay"}
        instant: true
    - refId: E
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: math
        expression: $A == 0 && $E == 0 && $B > 600 && $B < 21600
    for: 30m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Daemon restarted while the market was closed and all previously held overlay
        symbols were wiped — consumers see empty overlays until bars accumulate after the
        next open.
      runbook: Expected after any overnight deploy/restart (in-memory caches do not survive
        restarts); no action needed if a deploy just happened. If no deploy explains it,
        check the restart-cause panel and Railway logs for an ON_FAILURE crash escalation.
  - uid: lo-bridge-contract-missing
    title: Generic bridge contract missing
    condition: D
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="uptimerobot"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="uptimerobot"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) == 1)) or on() vector(0))
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="github_workflow"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="github_workflow"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) == 1)) or on() vector(0))
        instant: true
    - refId: C
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="railway_metrics"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="railway_metrics"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) == 1)) or on() vector(0))
        instant: true
    - refId: D
      datasourceUid: __expr__
      model:
        type: math
        expression: ($A > 0) || ($B > 0) || ($C > 0)
    for: 5m
    # Structurally unreachable: every leg ends in `or on() vector(0)`, so the
    # queries always return a value whenever Prometheus answers. Declared to
    # satisfy the gated-expr lint; a dead exporter still trips the four
    # unconditional absent() legs, not NoData.
    noDataState: OK
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: One or more generic bridge contracts are missing from the scrape
      # 2026-07-08: the last_success_age / last_scrape_duration legs are gated
      # on bridge_enabled == 1 — a deliberately DISABLED bridge omits those two
      # series by design (metrics._bridge_last_success_age) and must not page
      # critical. The four unconditional legs still catch a dead exporter.
      runbook: Verify the live_overlay exporter is running and emitting all required
        live_overlay_bridge_* contract families for all configured bridges (uptimerobot,
        github_workflow, railway_metrics).
  - uid: sp-memory-critical
    title: Signals Producer RSS > 3072 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: signals_producer_process_resident_memory_bytes{job="signals_producer"}
          / 1024 / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 3072
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer RSS exceeds 3072 MB — severe footprint regression
      runbook: 'NOT an OOM alarm: the Railway limit is 8 GB (MEMORY_LIMIT_GB=8.00,
        verified 2026-07-15), so 3072 MB is 37% of it. OOM risk is owned solely by
        lo-railway-memory-ratio-critical (0.90 of the *reported* limit). This fires
        only if RSS more than doubles past its worst observed envelope (7d p95 1199
        MB, max 1514 MB) — i.e. a real leak or a runaway workload change. Inspect
        poll_once / the newsstack poller and the watchlist size, and compare against
        the ratio alert before restarting anything.'
  - uid: sp-scrape-down
    title: Signals Producer scrape target down
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: up{job="signals_producer"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Cannot scrape smc-signals-producer /metrics — container may be down
      runbook: Check Railway deploy logs. Verify SIGNALS_SERVICE_URL env var in Alloy
        service. Check UptimeRobot /healthz.
  - uid: lo-memory-critical
    title: Live Overlay RSS > 3072 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_process_resident_memory_bytes{job="live_overlay"} / 1024
          / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 3072
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-live-overlay RSS exceeds 3072 MB — severe footprint regression
      runbook: 'NOT an OOM alarm: the Railway limit is 8 GB (MEMORY_LIMIT_GB=8.00,
        verified 2026-07-15), so 3072 MB is 37% of it. OOM risk is owned solely by
        lo-railway-memory-ratio-critical (0.90 of the *reported* limit). This fires
        only far outside the observed envelope (7d p95 259 MB, max 920 MB) — check
        Databento feed accumulation and reconnect cycles.'
  - uid: alloy-scrape-self-down
    title: Alloy self-scrape target down
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: up{job="alloy"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Alloy self-scrape failing — metrics pipeline is blind
      runbook: If Alloy self-scrape is down, NO metrics from any container reach Grafana.
        Check Railway deploy logs for alloy container crash/OOM.
  - uid: alloy-memory-critical
    title: Alloy RSS > 1536 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: process_resident_memory_bytes{job="alloy"} / 1024 / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 1536
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Alloy (metric-collector) RSS exceeds 1536 MB — severe footprint regression
      runbook: 'NOT an OOM alarm: the Railway limit is 8 GB (MEMORY_LIMIT_GB=8.00,
        verified 2026-07-15), so 1536 MB is 19% of it. OOM risk is owned solely by
        lo-railway-memory-ratio-critical (0.90 of the *reported* limit). Fires only
        far outside the observed envelope (7d p95 310 MB, max 326 MB) — check for WAL
        corruption or stuck remote-write.'
  - uid: alloy-targets-down
    title: Alloy scrape targets unreachable
    condition: C
    # The expr includes absent(up{...}); a healthy all-present fleet yields an
    # empty vector → NoData is normal. Alarm fires via the >0 count / absent==1.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (count(up{job=~"signals_producer|live_overlay"} == 0) > 0) or absent(up{job="signals_producer"})
          or absent(up{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: One or more Railway services are unreachable from Alloy
      runbook: Check Railway internal networking. Verify OVERLAY_SERVICE_URL and SIGNALS_SERVICE_URL
        env vars. Target service may have crashed.
- orgId: 1
  name: live-overlay-warning
  folder: SMC Live Overlay
  interval: 5m
  rules:
  - uid: lo-last-bar-stale-open
    title: Last bar stale while market open
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: "live_overlay_market_us_open{job=\"live_overlay\"} * (\n  (1 - live_overlay_last_bar_age_known{job=\"\
          live_overlay\"})\n  + (\n    live_overlay_last_bar_age_known{job=\"live_overlay\"\
          }\n    * (live_overlay_last_bar_age_seconds{job=\"live_overlay\"} > bool\
          \ 300)\n  )\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: No fresh bar for > 5 min while market is open
      runbook: Check feed thread liveness and Databento connectivity. Compare with
        feed_healthy/workers_healthy.
  - uid: lo-circuit-breaker-increase
    title: Circuit breaker triggered (15m)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: increase(live_overlay_feed_circuit_breakers{job="live_overlay"}[15m])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
