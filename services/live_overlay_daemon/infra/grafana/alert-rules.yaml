  - uid: lo-news-snapshot-stale
    title: News snapshot stale
    condition: C
    # Gated on live_overlay_market_us_open == 1 (as a multiplicative factor):
    # the producer (smc-live-news-refresh.yml) runs `cron: 2 * * * 1-5` —
    # hourly Mon-Fri only. Over a weekend or NYSE holiday it deliberately does
    # not run, so the snapshot legitimately ages past the 3h budget and this
    # rule false-fired for the entire weekend (observed 2026-07-11 Sat: firing
    # 17h with the last Fri 23:25 UTC refresh healthy). market_us_open is
    # holiday-aware and mirrors the same stand-down already applied to
    # lo-news-ingest-stale. The product yields a present 0 (not an empty
    # vector) when the market is closed, so no NoData handling is needed. On a
    # weekday the hourly cron keeps age < 3h; a genuine weekday producer break
    # still fires within 3h of the next market open.
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Gated on snapshot_age_known so a missing timestamp (age_seconds=0) does not read as fresh.
        expr: live_overlay_provider_news_snapshot_loaded{job="live_overlay"} * (live_overlay_provider_news_snapshot_age_seconds{job="live_overlay"}
          > bool 10800) * live_overlay_provider_news_snapshot_age_known{job="live_overlay"} * live_overlay_market_us_open{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: News provider snapshot is older than 3 hours during the US regular session
      runbook: Check NEWS_SNAPSHOT_PATH producer job (smc-live-news-refresh.yml, hourly
        Mon-Fri) and file update cadence; inspect fetched_at_unix in snapshot. Weekend/holiday
        staleness is gated out via live_overlay_market_us_open and does not page.
  - uid: lo-news-snapshot-age-unknown
    title: News snapshot age unknown (loads but carries no timestamp)
    condition: C
    # The stale rule above says "loads but is older than 3h" -- it can only
    # say that once an age is KNOWN. snapshot_age_known is `fetched_at_unix > 0`
    # or a parseable generated_at, and `_provider_health_snapshot` tolerates a
    # missing timestamp while keeping loaded=1.0, so a snapshot that parses
    # without a usable date yields age_known=0 AND age_seconds=0: the stale
    # rule reads 0>10800=false and lo-news-snapshot-unavailable reads
    # loaded<1=false. The producer heartbeat is then unwatched. Gated on
    # `loaded` to page once, not twice.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_provider_news_snapshot_loaded{job="live_overlay"} * (live_overlay_provider_news_snapshot_age_known{job="live_overlay"}
          == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The news provider snapshot loads but carries no timestamp -- the producer
        heartbeat is unwatched and the stale rule stays green with zero data.
      runbook: live_overlay_provider_news_snapshot_age_known is 0 while loaded=1. The
        snapshot at NEWS_SNAPSHOT_PATH/URL parsed but has no/zero `fetched_at_unix` or
        an unparseable `generated_at` (schema drift, a truncated write, or a stale seed).
        Inspect the payload; check smc-live-news-refresh.yml and the seed file.
  - uid: lo-news-ingest-stale
    title: News ingest stale (no new stories accepted)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_provider_news_last_ingest_age_seconds{job="live_overlay"}
          and on(job, instance) (live_overlay_provider_news_last_ingest_age_known{job="live_overlay"}
          == 1))
