      summary: The smc_micro_profiles_generated ASOF_DATE is more than five days old — beyond the normal
        T-1 + weekend refresh cadence, the generator input has genuinely stopped advancing.
      runbook: Inspect the latest smc-library-refresh run and pine/generated/smc_micro_profiles_generated.pine.
