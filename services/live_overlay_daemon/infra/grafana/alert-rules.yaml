    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # supervisor_heals increments on every silent automatic feed-worker
        # restart. One heal is routine; a recurring rate means the feed is
        # flapping and only the supervisor is masking it (previously this
        # counter was exported but consumed by NO alert or dashboard).
        expr: sum(increase(live_overlay_feed_supervisor_heals{job="live_overlay"}[1h]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
