apiVersion: 1
groups:
- orgId: 1
  name: live-overlay-critical
  folder: SMC Live Overlay
  interval: 1m
  rules:
  - uid: lo-scrape-missing
    title: Metrics scrape missing
    condition: C
    # absent() yields an empty vector when HEALTHY → NoData is the normal state,
    # not the alarm. The alarm fires via absent()==1; keep NoData quiet.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_uptime_seconds{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Prometheus is not scraping live-overlay metrics
      runbook: Check metrics-collector service and /metrics auth/path wiring.
  - uid: lo-core-signal-missing
    title: Core readiness signal missing
    condition: C
    # absent()==1 is the alarm; a healthy empty vector must not page as NoData.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_overlay_fresh{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: Core readiness metric missing from scrape output
      runbook: Verify daemon /metrics output and exporter logic for overlay_fresh
        gauge.
  - uid: lo-feed-down-market-open
    title: Feed unhealthy while market open
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"} * (1 - live_overlay_feed_healthy{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Live overlay feed is DOWN during market-open for > 5 min
      runbook: Check Railway logs for BentoError / circuit breaker. Verify DATABENTO_API_KEY
        validity.
  - uid: lo-workers-degraded
    title: Workers unhealthy
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_workers_healthy{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: One or more worker threads are dead
      runbook: Check worker_liveness in /health. Railway may need restart (ON_FAILURE
        should auto-recover).
  - uid: lo-overlay-stale
    title: Overlay data stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: "(\n  live_overlay_overlay_age_seconds{job=\"live_overlay\"}\n  * live_overlay_overlay_age_known{job=\"\
          live_overlay\"}\n)\n+ (\n  (1 - live_overlay_overlay_age_known{job=\"live_overlay\"\
          })\n  * 3601\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 3600
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      summary: Overlay age > 1h — compute cycle likely hung or erroring
      runbook: Check full_compute_cycle_errors rate. Verify feed is pushing bars (last_bar_age_seconds).
  - uid: lo-no-symbols
    title: Zero overlay symbols after warmup
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_overlay_symbols{job="live_overlay"}
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_uptime_seconds{job="live_overlay"}
        instant: true
    - refId: D
      datasourceUid: grafanacloud-prom
      model:
        # Restart detection via start-time changes — increase() over
        # live_overlay_daemon_restarts_total (a constant-1 gauge) was
        # always 0, so the "restarted AND 0 symbols before 600s uptime"
        # fast path of this alert could never fire (found 2026-07-08;
        # same inert class as lo-daemon-restarts-high, fixed 2026-07-07).
        expr: changes(live_overlay_process_start_time_seconds{job="live_overlay"}[10m])
        instant: true
    - refId: E
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"}
        instant: true
    # Gated on market-open ($E == 1): the equity feed only streams bars during
    # US market hours, so zero symbols overnight is NORMAL — and a redeploy
    # outside market hours (which wipes the in-memory overlay) would otherwise
    # false-fire this critical every time (observed 2026-07-08: a docs-only
    # daemon deploy at 05:51 UTC / 02:15 ET cleared 69 held symbols to 0 while
    # the market was closed). During market hours, zero symbols after warmup is
    # a real compute/feed failure and still fires.
    - refId: C
      datasourceUid: __expr__
      model:
        type: math
        expression: $A == 0 && $E == 1 && ($B > 600 || $D > 0)
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: No symbols computed after 10 min uptime WHILE the US market is open
      runbook: Service is up and the US market is open but the compute cycle never
        produced symbols. Check feed + compute logs. (Zero symbols outside market
        hours is expected and does not fire.)
  - uid: lo-bridge-contract-missing
    title: Generic bridge contract missing
    condition: D
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="uptimerobot"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="uptimerobot"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="uptimerobot"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="uptimerobot"}) == 1)) or on() vector(0))
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="github_workflow"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="github_workflow"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="github_workflow"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="github_workflow"}) == 1)) or on() vector(0))
        instant: true
    - refId: C
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(absent(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_configured{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_scrape_success{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum(absent(live_overlay_bridge_error_info{job="live_overlay",bridge="railway_metrics"}) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_success_age_seconds{job="live_overlay",bridge="railway_metrics"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) == 1)) or on() vector(0))
          +
          sum((absent(live_overlay_bridge_last_scrape_duration_seconds{job="live_overlay",bridge="railway_metrics"}) and on() (max(live_overlay_bridge_enabled{job="live_overlay",bridge="railway_metrics"}) == 1)) or on() vector(0))
        instant: true
    - refId: D
      datasourceUid: __expr__
      model:
        type: math
        expression: ($A > 0) || ($B > 0) || ($C > 0)
    for: 5m
    # Structurally unreachable: every leg ends in `or on() vector(0)`, so the
    # queries always return a value whenever Prometheus answers. Declared to
    # satisfy the gated-expr lint; a dead exporter still trips the four
    # unconditional absent() legs, not NoData.
    noDataState: OK
    labels:
      severity: critical
    annotations:
      summary: One or more generic bridge contracts are missing from the scrape
      # 2026-07-08: the last_success_age / last_scrape_duration legs are gated
      # on bridge_enabled == 1 — a deliberately DISABLED bridge omits those two
      # series by design (metrics._bridge_last_success_age) and must not page
      # critical. The four unconditional legs still catch a dead exporter.
      runbook: Verify the live_overlay exporter is running and emitting all required
        live_overlay_bridge_* contract families for all configured bridges (uptimerobot,
        github_workflow, railway_metrics).
  - uid: sp-memory-critical
    title: Signals Producer RSS > 900 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: signals_producer_process_resident_memory_bytes{job="signals_producer"}
          / 1024 / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 900
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: smc-signals-producer memory exceeds 900 MB — OOM kill imminent
      runbook: 'Railway free tier: 1 GB limit. Immediately inspect /metrics for FD
        leak. May need manual restart.'
  - uid: sp-scrape-down
    title: Signals Producer scrape target down
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: up{job="signals_producer"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: Cannot scrape smc-signals-producer /metrics — container may be down
      runbook: Check Railway deploy logs. Verify SIGNALS_SERVICE_URL env var in Alloy
        service. Check UptimeRobot /healthz.
  - uid: lo-memory-critical
    title: Live Overlay RSS > 900 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_process_resident_memory_bytes{job="live_overlay"} / 1024
          / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 900
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: smc-live-overlay memory exceeds 900 MB — OOM kill imminent
      runbook: Railway 1 GB limit. Check feed accumulation and reconnect cycles.
  - uid: alloy-scrape-self-down
    title: Alloy self-scrape target down
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: up{job="alloy"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: Alloy self-scrape failing — metrics pipeline is blind
      runbook: If Alloy self-scrape is down, NO metrics from any container reach Grafana.
        Check Railway deploy logs for alloy container crash/OOM.
  - uid: alloy-memory-critical
    title: Alloy RSS > 512 MB
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: process_resident_memory_bytes{job="alloy"} / 1024 / 1024
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 512
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: Alloy (metric-collector) memory exceeds 512 MB — OOM risk
      runbook: Railway container limit applies. Alloy should use < 100 MB normally.
        Check for WAL corruption or stuck remote-write.
  - uid: alloy-targets-down
    title: Alloy scrape targets unreachable
    condition: C
    # The expr includes absent(up{...}); a healthy all-present fleet yields an
    # empty vector → NoData is normal. Alarm fires via the >0 count / absent==1.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (count(up{job=~"signals_producer|live_overlay"} == 0) > 0) or absent(up{job="signals_producer"})
          or absent(up{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: One or more Railway services are unreachable from Alloy
      runbook: Check Railway internal networking. Verify OVERLAY_SERVICE_URL and SIGNALS_SERVICE_URL
        env vars. Target service may have crashed.
- orgId: 1
  name: live-overlay-warning
  folder: SMC Live Overlay
  interval: 5m
  rules:
  - uid: lo-last-bar-stale-open
    title: Last bar stale while market open
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: "live_overlay_market_us_open{job=\"live_overlay\"} * (\n  (1 - live_overlay_last_bar_age_known{job=\"\
          live_overlay\"})\n  + (\n    live_overlay_last_bar_age_known{job=\"live_overlay\"\
          }\n    * (live_overlay_last_bar_age_seconds{job=\"live_overlay\"} > bool\
          \ 300)\n  )\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      summary: No fresh bar for > 5 min while market is open
      runbook: Check feed thread liveness and Databento connectivity. Compare with
        feed_healthy/workers_healthy.
  - uid: lo-circuit-breaker-increase
    title: Circuit breaker triggered (15m)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: increase(live_overlay_feed_circuit_breakers{job="live_overlay"}[15m])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      summary: Feed circuit breaker increased in last 15m
      runbook: Persistent Databento outage. Service may need restart if breaker keeps
        incrementing.
  - uid: lo-bento-errors-rate
    title: Elevated Databento error rate
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: rate(live_overlay_feed_bento_errors{job="live_overlay"}[5m])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.1
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Sustained Databento error rate > 0.1/s for 10 min
      runbook: Check Databento status page. May indicate API key quota or network
        issues.
  - uid: lo-auth-denied-spike
    title: Auth denied spike on smc_live
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: increase(live_overlay_smc_live_auth_denied{job="live_overlay"}[15m])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
          operator:
            type: and
          query:
            params:
            - A
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Auth denied requests spiked in the last 15m
      runbook: Potential token drift or probing. Validate OVERLAY_SECRET_TOKEN rollout
        in Pine consumers.
  - uid: lo-request-rate-absent-open
    title: TradingView/Pine is not polling the live overlay (US market open)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_expected_market_traffic{job="live_overlay"} *
          live_overlay_market_us_open{job="live_overlay"} *
          (live_overlay_uptime_seconds{job="live_overlay"} > bool 600) *
          (rate(live_overlay_smc_live_requests_total{job="live_overlay"}[10m]) < bool 0.001)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: No TradingView/Pine /smc_live requests since the US market opened,
        while polling is expected
      runbook: The Pine request.get() overlay consumer has sent zero /smc_live
        requests since the US market opened, but this deployment is armed to expect
        it (LIVE_OVERLAY_EXPECT_MARKET_TRAFFIC=1). If the Pine consumer is not live
        yet, set LIVE_OVERLAY_EXPECT_MARKET_TRAFFIC=0 to stand the watchdog down.
        If it should be polling, check the published Pine request URL,
        OVERLAY_SECRET_TOKEN rollout, and the Railway public endpoint.
  - uid: lo-expected-traffic-not-armed
    title: Pine-polling watchdog is turned off
    # Paused 2026-07-01: the TradingView/Pine request.get() consumer is not yet
    # rolled out, so this deployment is deliberately unarmed
    # (LIVE_OVERLAY_EXPECT_MARKET_TRAFFIC=0). This rule's own runbook condones the
    # not-armed state during rollout, so the nag is stood down rather than paging.
    # Set isPaused: false (and re-upsert) when arming for production.
    isPaused: true
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_expected_market_traffic{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: The TradingView/Pine /smc_live polling watchdog is disabled
        (LIVE_OVERLAY_EXPECT_MARKET_TRAFFIC=0)
      runbook: Once the Pine request.get() overlay is live in production, set
        LIVE_OVERLAY_EXPECT_MARKET_TRAFFIC=1 so a stalled or absent Pine consumer
        alerts. Leave 0 for dev, warm-standby, or while the consumer is not yet
        rolled out.
  - uid: lo-request-rate-drop-open
    title: TradingView/Pine polling dropped to zero (US market open)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"} * (rate(live_overlay_smc_live_requests_total{job="live_overlay"}[10m])
          < bool 0.001) * (live_overlay_uptime_seconds{job="live_overlay"} > bool
          600) * (increase(live_overlay_smc_live_requests_total{job="live_overlay"}[1h])
          > bool 5)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: TradingView/Pine was polling /smc_live earlier today but has dropped
        to near zero while the US market is open
      runbook: Pine was polling /smc_live earlier today but has stopped. Check the
        Pine consumer/chart, OVERLAY_SECRET_TOKEN rollout, and the Railway public
        endpoint.
  - uid: lo-compute-errors-rate
    title: Compute cycle errors
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (sum(increase(live_overlay_full_compute_cycle_errors{job="live_overlay"}[15m]))
          or vector(0)) + (sum(increase(live_overlay_flow_patch_cycle_errors{job="live_overlay"}[15m]))
          or vector(0))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Compute cycles are erroring persistently
      runbook: Check Railway logs for stack traces in compute.py. Likely data quality
        issue in cached bars.
  - uid: lo-error-budget-burn-critical
    title: SLO error budget page (5m & 1h)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: ((sum(rate(live_overlay_smc_live_errors_total{job="live_overlay"}[5m]))
          / clamp_min(sum(rate(live_overlay_smc_live_requests_total{job="live_overlay"}[5m])),
          1e-9)) / 0.01)
        instant: true
    - refId: B
      datasourceUid: grafanacloud-prom
      model:
        expr: ((sum(rate(live_overlay_smc_live_errors_total{job="live_overlay"}[1h]))
          / clamp_min(sum(rate(live_overlay_smc_live_requests_total{job="live_overlay"}[1h])),
          1e-9)) / 0.01)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: math
        expression: ($A > 14.4) && ($B > 14.4)
    for: 5m
    labels:
      severity: critical
    annotations:
