  - uid: lo-daemon-restarts-high
    title: Daemon restarts high (15m crash-loop)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Restarts are counted as CHANGES of the process start-time gauge.
        # The previous expr used increase(live_overlay_daemon_restarts_total),
        # but that "counter" is set to 1 once per process and stays constant —
        # Prometheus sees 1,1,1,... across restarts (no reset detectable), so
        # increase() was always 0 and this crash-loop alert could NEVER fire
        # (found 2026-07-07). start_time_seconds jumps on every restart.
        # Window is 15m, NOT 24h: a deploy also jumps start_time, and a busy day
        # ships ~15 daemon deploys — a 24h window read that as a crash loop and
        # false-fired high for hours (2026-07-08). A genuine crash loop restarts
        # many times within minutes, so a short window separates it from routine
        # deploys spread across the day while still catching the real thing.
        expr: sum(changes(live_overlay_process_start_time_seconds{job="live_overlay"}[15m]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: high
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: More than 3 daemon restarts within 15 min (crash-loop; routine deploys spread over a day no
        longer trip this).
      runbook: Check Railway deployment/restart logs for the crash loop, and the
        "Restart Causes (24h)" dashboard panel (changes() of
        live_overlay_daemon_start_time_seconds by cause) for the cause breakdown.
        The live_overlay_daemon_restart_cause_*_total counters no longer exist -- they
        reset to 1 each process and carried no cross-restart history.
  - uid: lo-feed-supervisor-heals-recurring
