            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: smc-signals-producer got no market data for 5+ min during US extended-hours (04:00-20:00 ET) — likely an FMP outage (poll loop alive, every fetch empty). Pages ~15 min after onset (5-min stall + 10-min for:).
      runbook: Check signals_producer_fmp_request_errors_total and the FMP status page. last_poll_age stays ~0 because the loop runs; signals are frozen until non-empty quotes return.
- orgId: 1
  name: evidence-and-workflow-freshness
  folder: SMC Live Overlay
  interval: 1m
  rules:
  - uid: lo-workflow-run-failed
    title: Monitored workflow latest run failed
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Genuine failure verdicts only (failure=4, timed_out=8,
        # startup_failure=10) — matching the #3251/#3253 doctrine that
        # cancelled (5) and stale (11) are non-signals: a merge-train
        # concurrency cancel as the newest run used to page "run failed"
        # for up to 24h (found 2026-07-08).
        expr: max by (workflow) ((live_overlay_github_workflow_phase_code{job="live_overlay"} == 4) or
          (live_overlay_github_workflow_phase_code{job="live_overlay"} == 8) or
          (live_overlay_github_workflow_phase_code{job="live_overlay"} == 10))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: A monitored GitHub Actions workflow's latest run ended in failure/timed_out/startup_failure (cancelled and stale are intentionally non-paging).
      runbook: Open the named workflow in GitHub Actions; direct signal the adr0023/promotion/c13 crons
        were missing (red for weeks unseen).
  - uid: lo-workflow-no-green-24h
    title: Monitored workflow no successful run in 24h
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # `== bool 0`, not `== 0`: a bare filter returns the value 0 on a match,
        # and the gt-0 threshold then reads 0>0=false -- inert. bool maps it to
        # 1 so a failed latest run actually fires (found 2026-07-07).
        expr: min by (workflow) (live_overlay_github_workflow_latest_success{job="live_overlay"}) == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 24h
    labels:
      severity: warning
    annotations:
      summary: A monitored workflow has had no successful run for 24h (daily crons should reset this each
        day).
      runbook: Check the workflow's recent runs; a persistent 0 means the daily cron is failing or not
        firing.
  - uid: lo-ci-full-suite-red
    title: CI full-suite red on main
    condition: C
    # The generic no-green-24h rule above only catches a workflow that stays
    # dark for a whole DAY. The main-push `CI` workflow runs the FULL pytest
    # suite on every merge, so a red latest run means merged code broke tests
    # that `fast-gates` (the only REQUIRED check) does not run — and auto-merge
    # rides right over it. 2026-07-09: CI sat red ~5h through 6 merges, invisible
    # under the 24h rule. Fire after 2h so a same-day regression pages while a
    # quick red->green fix (a flake healed on the next push) rides out.
    # `== bool 0` (not `== 0`): a bare filter yields 0 on a match and gt-0 reads
    # 0>0=false -- inert; bool maps a red latest run to 1 so it actually fires.
    # NOTE: this fires only while `CI` is in the daemon's watch scope
    # (GITHUB_WORKFLOW_MONITOR_IDS unset = all workflows, the default).
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: min by (workflow) (live_overlay_github_workflow_latest_success{job="live_overlay",workflow="CI"})
          == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: The main-push CI workflow (full pytest suite) has been red for 2h -- a merge broke tests
        that the required fast-gates check does not run.
      runbook: Open the newest CI run on main and find the failing test; fast-gates stays green because it
        runs a subset. Fix-forward or revert; then confirm CI goes green on the next main push.
  - uid: lo-workflow-run-stale
    title: Monitored workflow has not run recently
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max by (workflow) (live_overlay_github_workflow_latest_age_seconds{job="live_overlay"})
          > 172800
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: A monitored workflow's newest run is older than 48h -- the cron may be disabled or never
        firing.
      runbook: Verify the workflow schedule and that GitHub Actions crons are enabled (60-day inactivity
        auto-disables them).
  - uid: lo-evidence-snapshot-unloadable
    title: Evidence snapshot unloadable
    condition: C
    # loaded==0 means the bridge could not read the snapshot at all (missing
    # URL/token, base64 envelope, network). `< bool 1` maps that to 1 so the
    # gt-0 threshold trips; a bare `loaded == 0` returns the value 0 and reads
    # 0>0=false -- inert (same class as lo-evidence-ledger-empty, found
    # 2026-07-07). This MUST be its own rule: an unloadable snapshot reports
    # snapshot_age_seconds=0, so the stale (age>86400) rule below can never
    # catch it.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_freshness_loaded{job="live_overlay"} < bool 1
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: critical
    annotations:
      summary: The evidence-freshness bridge cannot load the snapshot (loaded=0) -- the ledger/audit/fills
        freshness signals are blind.
      runbook: Check EVIDENCE_FRESHNESS_SNAPSHOT_URL(_TOKEN) on the daemon and that the producer branch
        exists; see services/live_overlay_daemon/evidence_freshness_bridge.py.
  - uid: lo-evidence-snapshot-stale
    title: Evidence snapshot stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_freshness_snapshot_age_seconds{job="live_overlay"} > 86400
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: critical
    annotations:
      summary: The evidence-freshness snapshot loads but is older than 24h -- the producer workflow has
        stopped committing.
      runbook: Run/inspect .github/workflows/evidence-freshness-snapshot.yml; without it the ledger/audit/fills
        freshness signals go stale.
  - uid: lo-evidence-ledger-stale
    title: ADR-0023 magnitude ledger stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      # 432000s = 5 days. The append cron is weekday-only, so over a weekend
      # the newest row is Friday and the once-daily snapshot lags a further
      # day; at 3 days this false-fired every Monday. 5 days absorbs a normal
      # weekend + a Monday holiday + the snapshot lag, while still catching a
      # genuinely stuck cron well inside its 10-day commit-back gap budget
      # (post-review finding: threshold mis-sized vs Mon-Fri cadence).
      model:
        expr: live_overlay_evidence_ledger_age_seconds{job="live_overlay"} > 432000
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      summary: The magnitude shadow ledger's newest row is older than 5 days -- the daily measurement
        stopped growing (the 2026-06/07 silent freeze).
      runbook: Check adr0023-magnitude-shadow-daily runs and the accumulate_family_events pool; the ledger
        should gain a row every weekday.
  - uid: lo-evidence-ledger-empty
    title: ADR-0023 magnitude ledger empty
    condition: C
    # An EMPTY ledger reads as age-unknown (age=0), not age-old, so the
    # stale rule above can never fire on it — the exact hole that let the
    # post-#3213 empty 1D ledger read as "fresh". This rule alarms on a
    # ledger that has stayed at zero rows for > 3 days (a cold start is fine;
    # a persistently empty ledger means the daily cron never committed a row
    # / the accumulated pool never became available). The `< bool 1` modifier
    # is load-bearing: a bare `< 1` filter returns the row VALUE (0) on an
    # empty ledger, so the Grafana `gt 0` threshold below reads 0 > 0 = false
    # and the alarm could NEVER fire (verified live 2026-07-06). `bool` maps
    # the comparison to 1/0, so an empty ledger yields 1 and the threshold
    # trips. noDataState OK: only a missing metric (daemon down) yields no
    # series, which is a separate liveness concern.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_ledger_rows{job="live_overlay"} < bool 1
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3d
    labels:
      severity: critical
    annotations:
      summary: The magnitude shadow (1D) ledger has had zero rows for > 3 days -- the daily measurement
        is not committing rows (distinct from a cold start).
      runbook: Check that adr0023-magnitude-shadow-daily commits a row each weekday and that the
        accumulated FamilyEvent pool is available (dispatch the one-time reseed if not).
  - uid: lo-evidence-audit-branch-stale
    title: Phase-A audit branch stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_audit_branch_age_seconds{job="live_overlay"} > 345600
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      summary: The data/phase-a-audit branch has had no commit in > 4 days -- the C13 audit-push / reconcile
        publish has stopped.
      runbook: Check the c13 reconcile/audit-push launchd jobs and lib_c13_data_push.sh publish clone;
        the branch should gain commits on trading days.
  - uid: lo-evidence-wsh-stale
    title: WSH earnings snapshot stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_wsh_age_seconds{job="live_overlay"} > 604800
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: The WSH earnings snapshot on the audit branch is older than 7 days (secondary earnings
        filter; looser budget).
      runbook: 'Known limitation: the WSH filter needs IBKR conIds on the watchlist rows; see automation/launchd/README.md.'
  - uid: lo-evidence-incubation-fills-stalled
    title: C8 incubation fills stalled
    condition: C
    # The C8 execution-promotion ladder needs closed paper trades, but orders can
    # be submitted every day while NOTHING fills (paper TWS down/unreachable) -- a
    # silent stall that never advances the ladder toward live capital. Fires when
    # no fill has ever landed (filled_total == bool 0) AND incubation is actively
    # fresh (newest record < 5d) AND that age is known. Multiplicative gating: the
    # product is 1 only when all three hold, so the gt-0 threshold fires. A genuine
    # pause lets the incubation age go stale (>5d), dropping the gate, so an
    # intentional stop does not page. `for: 3d` rides out the normal ramp-up
    # before the first fills land.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_fills_filled_total{job="live_overlay"} == bool 0)
          * (live_overlay_evidence_fills_newest_incubation_age_seconds{job="live_overlay"} < bool 432000)
          * live_overlay_evidence_fills_newest_incubation_age_known{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3d
    labels:
      severity: warning
    annotations:
      summary: The C8 paper-incubation ladder is submitting orders but 0 have ever filled -- execution is
        stalled (paper TWS down/unreachable?).
      runbook: Check the paper TWS/IBKR gateway is up on port 7497 during the 09:28 ET order window and the
        23:05 reconcile; inspect cache/live/smoke_HALT and the newest incubation_<DATE>.jsonl fill_price fields.
  - uid: lo-evidence-submit-failed
    title: C8 paper submits are failing
    condition: C
    # A paper bracket that places but lands no resting leg (every leg
    # cancelled/rejected, e.g. IB error-110 on a sub-tick TP/SL) records
    # submit_failed instead of a phantom paper_submitted (2026-07-08). Fires when
    # >=1 such failure has happened AND nothing has EVER filled -- "submits are
    # actively dying", the specific root cause the generic stall alert cannot name
    # (and which it misses once incubation goes stale). Clears the moment any real
    # fill lands (filled_total > 0). `for: 6h` rides out a single bad submit day.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_fills_submit_failed_total{job="live_overlay"} > bool 0)
          * (live_overlay_evidence_fills_filled_total{job="live_overlay"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 6h
    labels:
      severity: warning
    annotations:
      summary: C8 paper submits are placing brackets that never rest (all legs cancelled/rejected, e.g. IB
        error-110) and nothing has ever filled -- the bracket dies at submit.
      runbook: Inspect the newest incubation_<DATE>.jsonl for action=submit_failed; check TP/SL prices snap to
        the min tick (scripts/execute_ibkr_watchlist.py _round_to_min_tick) and the paper TWS is up on 7497.
  - uid: lo-c13-submitter-stale-checkout
    title: C13 submitter on stale checkout
    condition: C
    # The paper-submit cron runs against the C13 Mac's LOCAL checkout with no
    # auto-pull; a fix merged to origin/main (e.g. #3297's min-tick snap) never
    # reaches the box that submits until someone pulls. That gap kept the C8
    # ladder at 0 fills for weeks with every PR "merged" but undeployed. Fires
    # when the submit-order-path code on the Mac is behind origin/main (>0) AND
    # that reading is known (the Mac published it). Unrelated main churn does NOT
    # count -- only commits touching the submit path. `for: 12h` rides out a
    # same-day merge->pull; pages if a submit fix stays undeployed past the next
    # daily submit.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_c13_submit_code_behind_commits{job="live_overlay"} > bool 0)
          * live_overlay_evidence_c13_submit_code_behind_commits_known{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 12h
    labels:
      severity: warning
    annotations:
      summary: The C13 paper-submit Mac is running order-path code behind origin/main -- a merged fix has not
        been deployed to the box that submits; nothing new takes effect until it is pulled.
      runbook: On the submit Mac, cd to the checkout and `git pull --ff-only` (never --no-verify); confirm
        scripts/execute_ibkr_watchlist.py + run_smc_live_incubation.py match origin/main, then re-run phase-a.
  - uid: lo-fmp-bandwidth-approaching
    title: FMP bandwidth approaching monthly quota
    condition: C
    # FMP meters a rolling-30-day DATA-VOLUME quota (150 GB); a "90% used" email
    # was previously our only signal. Fires when our recorded FMP byte
    # consumption this month reaches >=80% of the configured limit. The usage
    # snapshot accumulates by calendar month -- a close proxy for FMP's rolling
    # meter. `for: 1h` rides out a single scrape.
    # The scalar() term adds the 24/7 signals-producer's FMP consumption (a
    # SEPARATE Railway service / job whose bytes never reach the ingest snapshot,
    # yet it is the single largest FMP consumer). `or vector(0)` makes an absent
    # producer contribute 0, never null the numerator; adding it can only make
    # the quota fire EARLIER, never mask a real breach.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_provider_usage_bytes{job="live_overlay",provider="fmp"}
          + scalar(sum(increase(signals_producer_fmp_response_bytes_total{job="signals_producer"}[30d])) or vector(0)))
          / on(provider) live_overlay_provider_bandwidth_limit_bytes{job="live_overlay",provider="fmp"}
          > 0.80
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: FMP data-volume consumption this month has reached >=80% of the configured monthly
        bandwidth quota (150 GB default).
      runbook: Check the FMP dashboard usage; reduce poll frequency / page limits in newsstack_fmp/config.py
        (FMP_*_LIMIT) or raise FMP_MONTHLY_BANDWIDTH_LIMIT_BYTES if the plan tier changed.
  - uid: lo-fmp-bandwidth-critical
    title: FMP bandwidth near monthly quota
    condition: C
    # Escalation of lo-fmp-bandwidth-approaching: >=95% of the FMP monthly volume
    # quota -- exhaustion (and blanket ingest failures) is imminent. Includes the
    # signals-producer's FMP consumption (see lo-fmp-bandwidth-approaching) so the
    # critical threshold reflects TOTAL consumption, not ingest-only.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_provider_usage_bytes{job="live_overlay",provider="fmp"}
          + scalar(sum(increase(signals_producer_fmp_response_bytes_total{job="signals_producer"}[30d])) or vector(0)))
          / on(provider) live_overlay_provider_bandwidth_limit_bytes{job="live_overlay",provider="fmp"}
          > 0.95
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: FMP data-volume consumption this month has reached >=95% of the monthly bandwidth
        quota -- ingest will start failing when the quota is exhausted.
      runbook: Immediately reduce FMP polling (newsstack_fmp/config.py FMP_*_LIMIT / poll interval) or
        upgrade the FMP plan; raise FMP_MONTHLY_BANDWIDTH_LIMIT_BYTES to match a new plan.
  - uid: lo-provider-rate-limited
    title: Data provider is being rate-limited (429s)
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # 429 hits per provider over the last 6h. The vendors send no X-RateLimit-*
        # headers, so this counter (bumped across the ingest/provider clients; see
        # runbook) is the only "we are being throttled" signal. increase() handles the
        # monthly reset of the underlying gauge; a bare increase feeding the gt-0
        # threshold is linter-safe (0 = not throttled correctly does not fire).
        expr: increase(live_overlay_provider_usage_rate_limit_hits{job="live_overlay"}[6h])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: A data provider (Massive/Benzinga/Unusual Whales/FMP/Databento/Finnhub) returned HTTP
        429 in the last 6h -- ingest is brushing its rate limit; retries are currently absorbing it.
      runbook: Reduce polling frequency / concurrency for the throttled provider (newsstack_fmp poll
        intervals) or raise the plan tier. Counter sources are newsstack_fmp/_bz_http.py (bz/massive/
        UW), ingest_fmp.py + open_prep/macro.py (fmp), databento_client.py, terminal_finnhub.py.
  - uid: lo-provider-usage-snapshot-series-missing
    title: Provider-usage snapshot series missing
    condition: C
    # absent()==1 is the alarm; a healthy empty vector must not page as NoData.
    # If these gauges vanish from scrape output the FMP bandwidth + provider-429
    # alerts above silently lose their input -- they are all computed off this
    # same ingest-side usage snapshot.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_provider_usage_loaded{job="live_overlay"})
          or absent(live_overlay_provider_usage_snapshot_age_seconds{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Provider-usage snapshot metrics are missing from scrape output
      runbook: Check /metrics exposure for the live_overlay_provider_usage_* gauges and
        scrape-target label wiring; the FMP bandwidth and provider-429 alerts all read
        this snapshot, so a missing series blinds them too.
  - uid: lo-provider-usage-snapshot-unloaded
    title: Provider-usage snapshot not loaded
    condition: C
    # loaded==0 => the daemon could not read the monthly usage snapshot (missing
    # PROVIDER_USAGE_SNAPSHOT_URL/path, or an unreadable/malformed file). The FMP
    # quota gauges then read 0 and the 80/95% alerts go quiet -- a silent blind
    # spot. `== bool 0` yields a present 0/1 series (never NoData); `for: 2h`
    # rides out the cold-start window before the daily open-prep snapshot lands.
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_provider_usage_loaded{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: Provider-usage monthly snapshot is not loaded (FMP quota telemetry blind)
      runbook: Verify PROVIDER_USAGE_SNAPSHOT_URL / PROVIDER_USAGE_SNAPSHOT_PATH and that
        the daily open-prep workflow commits artifacts/monitoring/provider_usage.json;
        the daemon serves loaded=0 with an error label until the snapshot is readable.
  - uid: lo-provider-usage-snapshot-stale
    title: Provider-usage snapshot stale
    condition: C
    # loaded * (age > bool 4d) yields a present 0 when fresh or unloaded and 1
    # when a LOADED snapshot has aged past 4 days. 4d (not 24h) tolerates the
    # daily open-prep cadence plus a weekend/holiday gap without false-firing.
    # When the age is unknown the daemon emits age_seconds=0, so the product is 0
    # (no fire) -- no NoData handling needed.
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_provider_usage_loaded{job="live_overlay"} * (live_overlay_provider_usage_snapshot_age_seconds{job="live_overlay"}
          > bool 345600)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: Provider-usage monthly snapshot is older than 4 days (FMP quota figures may be stale)
      runbook: The daily open-prep workflow has not refreshed
        artifacts/monitoring/provider_usage.json within 4 days. Check the open-prep run
        and the snapshot publish path; the FMP bandwidth % is computed from this file.
  - uid: lo-sweep-trap-shadow-stale
    title: Sweep-trap shadow snapshot stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Precomputed 0/1 staleness gauge (age > OVERLAY_SWEEP_TRAP_SHADOW_MAX_AGE_SECS,
        # default 96h, tolerates one skipped weekday run). Alerting on the precomputed
        # gauge instead of a bare age comparison keeps the gt-0 threshold live (the
        # gt-0-inert class). See services/live_overlay_daemon/sweep_trap_shadow_bridge.py.
        expr: max(live_overlay_sweep_trap_shadow_snapshot_stale{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: The WS4a sweep-trap shadow eval has not published a fresh snapshot within its max-age budget
      runbook: The daily sweep-trap-shadow-daily workflow has not refreshed
        artifacts/monitoring/sweep_trap_shadow.json within OVERLAY_SWEEP_TRAP_SHADOW_MAX_AGE_SECS.
        Check the sweep-trap-shadow-daily workflow runs and their auto-PRs (each run pushes a
        dynamic bot/sweep-trap-shadow-ledger-<run_id>-<attempt> branch; no static branch exists).
        Observe-only — no score impact; a stale snapshot only means the promotion evidence stopped accruing.
  - uid: lo-sweep-trap-shadow-age-unknown
    title: Sweep-trap shadow snapshot age unknown (no real data loaded)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Complement of the stale rule: a MISSING/UNREADABLE snapshot (and the
        # committed no-data seed, generated_at=0) yields age_known=0 AND stale=0,
        # so the gt-0 stale rule stays green with zero data — the gt-0-inert
        # class. `== bool 0` (not `== 0`) is mandatory: a bare match returns 0
        # and the gt-0 threshold reads 0>0=false (inert).
        expr: max(live_overlay_sweep_trap_shadow_snapshot_age_known{job="live_overlay"}) == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    # Rides out daemon restarts/deploy churn and transient fetch failures; a
    # genuinely absent feed holds age_known=0 far longer than 2h. A missing
    # SERIES (daemon down) is lo-scrape-missing's job, not this rule's.
    for: 2h
    noDataState: OK
    labels:
      severity: warning
    annotations:
      summary: The sweep-trap shadow bridge has never loaded a real snapshot (missing/unreadable file or the no-data seed)
      runbook: live_overlay_sweep_trap_shadow_snapshot_age_known is 0 — the daemon is
        serving the committed no-data seed (generated_at=0) or cannot fetch/read the
        snapshot at SWEEP_TRAP_SHADOW_SNAPSHOT_URL. Check that the daily
        sweep-trap-shadow-daily workflow publishes bot/live-sweep-trap-shadow (needs
        GH_PAT; the publish step only warns when it is missing) and that the daemon URL
        points at it. The stale alert cannot cover this state — stale is only computed
        once an age is KNOWN.
  - uid: lo-sweep-trap-shadow-promotable
    title: Sweep-trap shadow verdict is PROMOTABLE (WS4b candidate)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # verdict_code 2 == PROMOTABLE (Brier beats baseline AND top/bottom-tercile
        # lift positive on >= MIN_OOS=40 samples). `max without (verdict)` collapses
        # the verdict label so the series stays continuous across verdict changes;
        # `for: 72h` then requires the value to hold PROMOTABLE for 3 consecutive
        # days (a single dip resets the pending timer). Deliberately NOT
        # min_over_time(...[3d]), which would false-fire on partial data before a
        # full 3-day window of samples exists.
        expr: max without (verdict) (live_overlay_sweep_trap_shadow_verdict_code{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 72h
    # Positive/notification alert — a missing series (daemon down) is covered by
    # lo-scrape-missing, and must NOT fire this WS4b prompt.
    noDataState: OK
    labels:
      severity: info
    annotations:
      summary: The WS4a sweep-trap shadow verdict has held PROMOTABLE for 3 days — WS4b promotion candidate
      runbook: The observe-only sweep_trap_quality_score has beaten baseline Brier with
        positive top/bottom-tercile lift on >= 40 samples for 3 consecutive days. This is the
        WS4b trigger — review live_overlay_sweep_trap_shadow_{brier_delta,lift,sample_count} on
        the "Sweep-Trap Shadow (WS4a)" dashboard row, then decide whether to grant the detector
        score-budget weight (confluence currently reads the coarse SWEEP_QUALITY_SCORE, not
        SWEEP_TRAP_QUALITY_SCORE). Not an incident — an action prompt.
- orgId: 1
  name: credential-health
  folder: SMC Live Overlay
  interval: 1m
  # API-key / credential health, sourced from the daily credential-health-check
  # probe (scripts/credential_health_check.py -> live_overlay_credential_health_*).
  # Until now these gauges were charted but NOT alerted, and the probe's only
  # alarm (a GitHub issue) is inert because repo Issues are disabled -- so an
  # expired key surfaced nowhere. `== bool 0` (not `== 0`) is mandatory: a bare
  # match returns 0 and the gt-0 threshold reads 0>0=false (inert).
  rules:
  - uid: lo-credential-fmp-invalid
    title: FMP API key invalid
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_fmp_api_key_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: The FMP API key is failing its daily auth probe (401/403/402) -- the core FMP data pipeline
        will start failing.
      runbook: Rotate FMP_API_KEY (or resolve billing on a 402) and update the secret; see
        scripts/credential_health_check.py probe_fmp.
  - uid: lo-credential-databento-invalid
    title: Databento API key invalid
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_databento_api_key_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: The Databento API key is failing its daily auth probe -- OPRA options flow ingestion will
        stop.
      runbook: Rotate DATABENTO_API_KEY and update the secret; see scripts/credential_health_check.py
        probe_databento.
  - uid: lo-credential-databento-delivery-invalid
    title: Databento delivery stalled (billing/entitlement)
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_databento_delivery_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: critical
    annotations:
      summary: Databento auth is OK but delivery has stalled (402 unpaid invoice or entitlement lapse) --
        data silently stops while auth stays 200 (2026-06-12 post-mortem).
      runbook: Check the Databento invoice/entitlement; see scripts/credential_health_check.py
        probe_databento_delivery and the databento_delivery staleness_days gauge.
  - uid: lo-credential-benzinga-invalid
    title: Benzinga/Massive API key invalid
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_benzinga_key_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: high
    annotations:
      summary: The Benzinga/Massive API key is failing its daily auth probe -- the Core News lane and
        hourly live-news cron will stop ingesting.
      runbook: Rotate BENZINGA_API_KEY (the paid Massive reseller key) and confirm BENZINGA_PROVIDER
        transport; see scripts/credential_health_check.py probe_benzinga.
  - uid: lo-credential-finnhub-invalid
    title: Finnhub API key invalid
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_finnhub_api_key_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: The Finnhub API key is failing its daily auth probe -- terminal_finnhub and open_prep macro
        Finnhub lookups will fail. Optional provider; only alerts when FINNHUB_API_KEY is configured.
      runbook: Rotate FINNHUB_API_KEY and update the secret; see scripts/credential_health_check.py
        probe_finnhub. If Finnhub is unused, remove the secret and the probe self-skips.
  - uid: lo-credential-github-pat-invalid
    title: GitHub PAT invalid or expiring
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_github_pat_validity_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: high
    annotations:
      summary: The GH_PAT is failing its daily probe -- every workflow that opens auto-PRs, publishes
        snapshots, or refreshes the TV cookie will start failing.
      runbook: Rotate GH_PAT and update the secret; see scripts/credential_health_check.py
        probe_github_pat and the github_pat_validity_days_left gauge.
  - uid: lo-credential-tv-cookie-invalid
    title: TradingView storage-state cookie expired
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_tv_storage_state_age_valid{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: high
    annotations:
      summary: The TradingView storage-state cookie is past its 72h TTL -- the next Pine publish will fail
        at preflight (complements lo-tradingview-credential-age-high).
      runbook: Refresh the cookie via npm run tv:storage-state (or the storage-refresh workflow) and
        update TV_STORAGE_STATE.
  - uid: lo-credential-monitor-stale
    title: Credential-health snapshot is stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_snapshot_age_seconds{job="live_overlay"} > 129600
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      summary: The daily credential-health snapshot is older than 36h -- the probe cron or its snapshot
        publish has silently stopped and every credential gauge is now stale-green (the exact 12-day
        blind spot this monitor exists to prevent).
      runbook: Check the credential-health-check workflow runs and the bot/live-tv-credential-snapshot
        publish step (GH_PAT push). Do NOT trust the other credential alerts until this clears.
  - uid: lo-credential-snapshot-missing
    title: Credential-health snapshot not loaded
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_loaded{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: high
    annotations:
      summary: The daemon is up but could not load any credential-health snapshot -- credential
        observability is blind (distinct from lo-scrape-missing which covers the daemon being down).
      runbook: Check TRADINGVIEW_CREDENTIAL_SNAPSHOT_URL and the bot/live-tv-credential-snapshot branch;
        confirm the daily probe published a report.
