      summary: The realtime trading-signals snapshot is not loading at all (loaded=0)
        - A0/A1/A2 overlays are blank and the stale rule cannot see it.
      runbook: Check SIGNALS_SERVICE_URL / SIGNALS_SNAPSHOT_URL and the local signals
        snapshot path on the daemon; grep the compute logs for signals-snapshot fetch
        failures. A frozen but present last-good snapshot fires
        lo-trading-signals-snapshot-stale instead.
