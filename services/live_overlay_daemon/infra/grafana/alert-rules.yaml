  - uid: lo-evidence-ledger-stale
    title: ADR-0023 magnitude ledger stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      # 432000s = 5 days. The append cron is weekday-only, so over a weekend
      # the newest row is Friday and the once-daily snapshot lags a further
      # day; at 3 days this false-fired every Monday. 5 days absorbs a normal
      # weekend + a Monday holiday + the snapshot lag, while still catching a
      # genuinely stuck cron well inside its 10-day commit-back gap budget
      # (post-review finding: threshold mis-sized vs Mon-Fri cadence).
      model:
        # Gated on _known so an empty newest_date (age_seconds=0) does not read as fresh.
        expr: (live_overlay_evidence_ledger_age_seconds{job="live_overlay"} * live_overlay_evidence_ledger_age_known{job="live_overlay"}) > 432000
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The magnitude shadow ledger's newest row is older than 5 days -- the daily measurement
        stopped growing (the 2026-06/07 silent freeze).
      runbook: Check adr0023-magnitude-shadow-daily runs and the accumulate_family_events pool; the ledger
        should gain a row every weekday.
  - uid: lo-evidence-ledger-empty
    title: ADR-0023 magnitude ledger empty
    condition: C
    # An EMPTY ledger reads as age-unknown (age=0), not age-old, so the
    # stale rule above can never fire on it — the exact hole that let the
    # post-#3213 empty 1D ledger read as "fresh". This rule alarms on a
    # ledger that has stayed at zero rows for > 3 days (a cold start is fine;
    # a persistently empty ledger means the daily cron never committed a row
    # / the accumulated pool never became available). The `< bool 1` modifier
    # is load-bearing: a bare `< 1` filter returns the row VALUE (0) on an
    # empty ledger, so the Grafana `gt 0` threshold below reads 0 > 0 = false
    # and the alarm could NEVER fire (verified live 2026-07-06). `bool` maps
    # the comparison to 1/0, so an empty ledger yields 1 and the threshold
    # trips. noDataState OK: only a missing metric (daemon down) yields no
    # series, which is a separate liveness concern.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_ledger_rows{job="live_overlay"} < bool 1
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3d
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The magnitude shadow (1D) ledger has had zero rows for > 3 days -- the daily measurement
        is not committing rows (distinct from a cold start).
      runbook: Check that adr0023-magnitude-shadow-daily commits a row each weekday and that the
        accumulated FamilyEvent pool is available (dispatch the one-time reseed if not).
  - uid: lo-evidence-ledger-age-unknown
    title: Magnitude ledger age unknown (rows present but no parseable newest_date)
    condition: C
    # Third leg of the ledger triangle: -stale catches a KNOWN-but-old date,
    # -empty catches rows==0, and this catches the state neither can see --
    # rows > 0 (so -empty is silent) while `ledger.newest_date` is
    # missing/empty/unparseable, which makes age_known=0 AND age_seconds=0 so
    # -stale reads 0>432000=false. That is a live schema-drift shape here (cf.
    # the 2026-07-15 two-schema mtime resolver that emitted a populated-looking
    # status="ok" payload the reader could not parse). `rows > bool 0` keeps
    # this from double-paging with lo-evidence-ledger-empty on a fully empty
    # snapshot; `loaded` keeps it from double-paging with -unloadable.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_evidence_freshness_loaded{job="live_overlay"} * (live_overlay_evidence_ledger_rows{job="live_overlay"}
          > bool 0) * (live_overlay_evidence_ledger_age_known{job="live_overlay"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The magnitude ledger reports rows but no parseable newest_date -- the stale rule
        cannot see this state and stays green.
      runbook: live_overlay_evidence_ledger_age_known is 0 while rows > 0 and the snapshot
        loaded=1. The producer is emitting ledger rows whose `newest_date` is
        missing/empty/unparseable (expected YYYY-MM-DD) -- typically schema drift between the
        writer and evidence_freshness_bridge. Inspect the payload at
        EVIDENCE_FRESHNESS_SNAPSHOT_URL and the adr0023-magnitude-shadow-daily writer.
  - uid: lo-evidence-audit-branch-stale
    title: Phase-A audit branch stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
