            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Feed supervisor healed workers more than twice in the last hour
      runbook: The feed is crash-flapping behind the supervisor. Check
        live_overlay_feed_bento_errors / circuit_breakers and Databento status
        before the self-healing hides a real outage.
