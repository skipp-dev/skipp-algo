  - uid: lo-bar-cache-depth-low
    title: Bar cache too shallow for the rolling features
    condition: C
    # Added with the metrics from #3903, which were emitted for exactly this
    # visibility and then consumed by nothing. Below ~20 bars per symbol the
    # squeeze, relative-volume and ATS z-score features degrade SILENTLY —
    # they do not error, they just stop being computable — so without this rule
    # the cache can thrash at the symbol cap with no signal moving at all.
    # Gated on market-open and past warmup: a shallow cache right after a
    # restart is expected, not a defect.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_market_us_open{job="live_overlay"}
          * (live_overlay_uptime_seconds{job="live_overlay"} > bool 900)
          * (live_overlay_bar_symbols{job="live_overlay"} > bool 0)
          * (live_overlay_bars_per_symbol{job="live_overlay"} < bool 20)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Fewer than 20 bars per symbol in the live cache while the US session is open —
        squeeze, relative volume and the ATS z-score are silently unavailable.
      runbook: Check live_overlay_bar_symbols against the configured symbol cap and the
        eviction counters. Demand above the cap makes the cache churn one bar per symbol
        (#3903). Raise the cap or narrow the requested universe; do not read a healthy
        bar_count as healthy depth — bar_count/bar_symbols is the number that matters.
