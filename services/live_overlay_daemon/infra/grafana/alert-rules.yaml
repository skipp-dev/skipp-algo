      summary: The daily credential-health snapshot is older than 36h -- the probe cron or its snapshot
        publish has silently stopped and every credential gauge is now stale-green (the exact 12-day
        blind spot this monitor exists to prevent).
      runbook: Check the credential-health-check workflow runs and the bot/live-tv-credential-snapshot
        publish step (GH_PAT push). Do NOT trust the other credential alerts until this clears.
  - uid: lo-credential-monitor-age-unknown
    title: Credential-health snapshot age unknown (loaded but undated)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Complement of lo-credential-monitor-stale, mirroring
        # lo-sweep-trap-shadow-age-unknown. A snapshot that LOADS but carries no
        # parseable `generated_at` yields snapshot_age_known=0 and
        # snapshot_age_seconds=0 (metrics.py `_credential_health_snapshot`
        # deliberately reports unknown-age as not-stale so a fresh daemon does
        # not self-alarm). That leaves a hole between the two existing rules:
        # the stale rule reads (0*0)>129600=false (inert, the gt-0-inert class)
        # -- its `* age_known` factor stops an unknown age from reading as
        # fresh-and-stale, but 0 was already below the threshold, so the undated
        # state stays silent either way -- and
        # lo-credential-snapshot-missing reads loaded==0=false. So an undated
        # report serves stale-green credential gauges with NOTHING watching --
        # the same 12-day blind spot the monitor exists to prevent. A missing/
        # malformed `generated_at` is not hypothetical: it was an observed
        # producer bug (ops-digest, 2026-07-15).
        #
        # `loaded * (age_known == bool 0)` fires only for loaded=1 AND
        # age_known=0, so it cannot double-fire with lo-credential-snapshot-missing.
        # `== bool 0` (not `== 0`) is mandatory: a bare match returns 0 and the
        # gt-0 threshold reads 0>0=false (inert).
        expr: live_overlay_credential_health_loaded{job="live_overlay"} * (live_overlay_credential_health_snapshot_age_known{job="live_overlay"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    # 1h matches the sibling stale rule. A loaded-but-undated report is a
    # structural producer defect, not deploy churn: once the file is readable,
    # a missing `generated_at` persists until the producer is fixed.
    for: 1h
    noDataState: OK
    labels:
      # Never below the sibling stale rule (lo-credential-monitor-stale is
      # critical). An undated snapshot is not milder than a stale one: it means
      # that rule can no longer fire for this chain at all, so the freshness axis
      # is lost rather than merely aged. Enforced by
      # test_age_unknown_severity_never_below_its_stale_rule.
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The credential-health snapshot loads but has no parseable generated_at -- its freshness
        is unverifiable and lo-credential-monitor-stale can never fire.
      runbook: live_overlay_credential_health_snapshot_age_known is 0 while _loaded is 1 -- the report at
        TRADINGVIEW_CREDENTIAL_SNAPSHOT_URL is missing a `generated_at` or it is malformed (must be
        ISO-8601). Check the credential-health-check workflow's report writer. Until this clears the
        age-based stale alert is blind, so do NOT trust the other credential gauges' freshness.
  - uid: lo-credential-snapshot-missing
    title: Credential-health snapshot not loaded
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_credential_health_loaded{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: high
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The daemon is up but could not load any credential-health snapshot -- credential
        observability is blind (distinct from lo-scrape-missing which covers the daemon being down).
      runbook: Check TRADINGVIEW_CREDENTIAL_SNAPSHOT_URL and the bot/live-tv-credential-snapshot branch;
        confirm the daily probe published a report.
- orgId: 1
  name: pre-a0-shadow
  folder: PRE-A0
  interval: 1m
  rules:
  - uid: pre-a0-scrape-missing
    title: PRE-A0 metrics scrape missing
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(pre_a0_enabled{job="a0_fast"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [0]
          operator: {type: and}
          query: {params: [A]}
    for: 3m
    labels: {severity: critical}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: PRE-A0 telemetry is no longer reaching Grafana Cloud.
      runbook: Check the metrics-collector a0_fast target, A0_FAST_SERVICE_URL, and the a0-fast-shadow /metrics endpoint.
  - uid: pre-a0-model-unavailable
    title: PRE-A0 model unavailable while enabled
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: pre_a0_enabled{job="a0_fast"} * (pre_a0_model_ready{job="a0_fast"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [0]
          operator: {type: and}
          query: {params: [A]}
    for: 5m
    labels: {severity: critical}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: PRE-A0 is enabled but its local fail-closed model contract is unavailable.
      runbook: Inspect a0-fast-shadow startup logs and verify the model artifact identity, signature, validity window, and runtime contract.
  - uid: pre-a0-calibration-invalid
    title: PRE-A0 calibration invalid
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: pre_a0_enabled{job="a0_fast"} * (pre_a0_calibration_valid{job="a0_fast"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [0]
          operator: {type: and}
          query: {params: [A]}
    for: 5m
    labels: {severity: critical}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: PRE-A0 calibration validation is failing.
      runbook: Keep PRE-A0 in shadow/fail-closed mode and inspect calibration window, thresholds, and artifact review_after.
  - uid: pre-a0-runtime-errors
    title: PRE-A0 runtime integrity errors
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: sum(increase(pre_a0_inference_errors_total{job="a0_fast"}[5m])) + sum(increase(pre_a0_duplicate_decision_ids_total{job="a0_fast"}[5m])) + sum(increase(pre_a0_persistence_errors_total{job="a0_fast"}[5m]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [0]
          operator: {type: and}
          query: {params: [A]}
    for: 0s
    labels: {severity: critical}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: PRE-A0 reported an inference, duplicate-decision, or persistence integrity error.
      runbook: Inspect a0-fast-shadow logs and snapshots; preserve the confirmed-A0 path and do not promote the model.
  - uid: pre-a0-input-drift
    title: PRE-A0 input quality degraded
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: sum(increase(pre_a0_feature_missing_total{job="a0_fast"}[15m])) + sum(increase(pre_a0_feature_out_of_range_total{job="a0_fast"}[15m]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [10]
          operator: {type: and}
          query: {params: [A]}
    for: 5m
    labels: {severity: high}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: PRE-A0 feature missingness or range violations exceeded the shadow threshold.
      runbook: Compare the live feature distribution with the training manifest before retraining or promotion.
  - uid: pre-a0-shadow-data-missing
    title: PRE-A0 shadow snapshots missing under live load
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (increase(a0_fast_records_received_total{job="a0_fast"}[15m]) > bool 100) * (a0_fast_evidence_ready{job="a0_fast"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params: [0]
          operator: {type: and}
          query: {params: [A]}
    for: 5m
    labels: {severity: critical}
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A0-Fast receives market records but verified PRE-A0 evidence is not flowing.
      runbook: Check normalization, resync/replay, PRE-A0 inference, snapshot flushes, volume files, and /evidencez before claiming that measurement is active.
