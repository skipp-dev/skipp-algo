      runbook: Check bridge error_info, API tokens, quotas, and upstream service status.
  - uid: lo-bridge-last-success-stale
    title: Live Overlay bridge last success stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: '(live_overlay_bridge_enabled{job="live_overlay"} == bool 1)
          * on(job, bridge)
          (live_overlay_bridge_last_success_age_seconds{job="live_overlay"} > bool 900)'
        instant: true
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Live Overlay bridge has not succeeded recently
      runbook: Inspect live_overlay_bridge_error_info and bridge-specific detail panels.
  - uid: lo-vix-unavailable
    title: VIX level unavailable
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # (age * known) + ((1 - known) * 5401): never-fetched exports age_known=0 /
        # age_seconds=0.0, so the 5401 sentinel — not a misleading fresh 0 — crosses
        # the 5400 threshold (same arithmetic contract as lo-overlay-stale). The FMP
        # ^VIX poll runs on the overlay refresh cadence (OVERLAY_REFRESH_SECS,
        # default 1800s) around the clock, so 5400s = 3 consecutive missed polls.
        expr: "(\n  live_overlay_vix_age_seconds{job=\"live_overlay\"}\n  * live_overlay_vix_age_known{job=\"\
          live_overlay\"}\n)\n+ (\n  (1 - live_overlay_vix_age_known{job=\"live_overlay\"\
          })\n  * 5401\n)\n"
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 5400
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: VIX stale > 90m or never fetched — FMP ^VIX poll failing (clients see
        a frozen or null vix_level while core overlay health stays green)
      runbook: Check credential-health FMP panels and FMP quota alerts; grep daemon
        logs for "VIX poll disabled" (FMP loader construction failed). Since truth-audit
        F-3 that failure is retried once an hour (_VIX_LOADER_RETRY_SECS), so a restart
        is NOT required to recover from a transient boot error -- if VIX is still absent
        an hour later the cause is persistent (key, quota, DNS), not the missed boot.
        Poll cadence = OVERLAY_REFRESH_SECS (default 30m); threshold = 3 missed polls.
- orgId: 1
  name: signals-producer-readiness
  folder: SMC Live Overlay
  interval: 1m
  rules:
  - uid: sp-watchlist-empty
    title: Signals Producer watchlist empty
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (signals_producer_watchlist_symbols{job="signals_producer"} == bool
          0) or on() vector(1)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer has zero watchlist symbols
      runbook: Verify OPEN_PREP_SNAPSHOT_URL / latest_open_prep_run.json exists and
        contains ranked_v2 symbols.
  - uid: sp-snapshot-missing
    title: Signals Producer snapshot missing
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (1 - signals_producer_open_prep_snapshot_loaded{job="signals_producer"})
          or on() vector(1)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer has not loaded an Open-Prep snapshot
      runbook: Check Railway env OPEN_PREP_SNAPSHOT_URL and verify the snapshot endpoint
        returns a JSON object.
  - uid: sp-poll-stale
    title: Signals Producer poll stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (signals_producer_last_poll_age_seconds{job="signals_producer"} > bool
          300) or on() vector(1)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer has not completed a poll cycle in > 5 min
      runbook: Check producer logs for FMP client failures, network errors, or telemetry
        server crashes.
  - uid: sp-client-disabled
    title: Signals Producer FMP client disabled (no data possible)
    condition: C
    # signals_producer_client_disabled is a 0/1 gauge rendered unconditionally:
    # 1 means FMPClient.from_env() failed at boot (e.g. missing FMP_API_KEY)
    # and every cycle publishes empty signals while loop-liveness (readyz-age,
    # poll_age, updated_epoch) would otherwise stay green. Producer-down is
    # covered by sp-scrape-down, so NoData here is OK.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max(signals_producer_client_disabled{job="signals_producer"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer is running without an FMP client — it can never fetch quotes and publishes empty signals every cycle. /readyz reports 503 "client disabled (<reason>)".
      runbook: Check signals_producer_client_disabled_info{reason=...} for the failure class, verify FMP_API_KEY is set on the smc-signals-producer Railway service, then redeploy/restart — the client is only constructed at boot.
  - uid: sp-data-stale
    title: Signals Producer data stale (market-hours FMP outage)
    condition: C
    # signals_producer_data_stale is a 0/1 gauge the producer self-computes:
    # market-open AND no non-empty FMP fetch for > DATA_STALL_SECONDS. It catches
    # a market-hours data outage that last_poll_age / readyz miss — those mark
    # loop-liveness and stay green even when every fetch returns empty. The
    # producer being down is covered by sp-scrape-down, so NoData here is OK.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max(signals_producer_data_stale{job="signals_producer"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer got no market data for 5+ min during US extended-hours (04:00-20:00 ET) — likely an FMP outage (poll loop alive, every fetch empty). Pages ~15 min after onset (5-min stall + 10-min for:).
      runbook: Check signals_producer_fmp_request_errors_total and the FMP status page. last_poll_age stays ~0 because the loop runs; signals are frozen until non-empty quotes return.
  - uid: sp-fmp-profile-bulk-used
    title: Signals Producer unexpectedly used FMP profile-bulk
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: sum(increase(signals_producer_fmp_endpoint_requests_total{job="signals_producer",endpoint="/stable/profile-bulk"}[15m]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 0s
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The realtime signals producer called the provider-wide profile-bulk endpoint, which previously burned about 113 MB every six minutes.
      runbook: Inspect _enrich_watchlist_live and recent deploys. Realtime avg-volume gaps must use bounded per-symbol profile lookups with negative caching; never restore profile-bulk in this service.
  - uid: sp-fmp-byte-burn-high
    title: Signals Producer FMP bandwidth burn is unexpectedly high
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: sum(increase(signals_producer_fmp_endpoint_response_bytes_total{job="signals_producer"}[1h]))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 50000000
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: smc-signals-producer transferred more than 50 MB of FMP payloads in one hour.
      runbook: Break down signals_producer_fmp_endpoint_response_bytes_total by endpoint. Normal 200-symbol minute quotes measured about 5.4 MB/hour; profile-bulk previously exceeded 1 GB/hour.
  - uid: sp-fmp-extended-shadow-stale
    title: FMP extended-hours shadow probe is stale
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max(signals_producer_extended_shadow_enabled{job="signals_producer"}) * (max(signals_producer_market_session{job="signals_producer",session="premarket"}) + max(signals_producer_market_session{job="signals_producer",session="postmarket"})) * (max(signals_producer_extended_shadow_last_poll_age_seconds{job="signals_producer"}) > 180)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The enabled FMP extended-hours shadow probe has not completed for more than three minutes during premarket or postmarket.
      runbook: Check the three batch endpoint counters and producer logs. Live extended-hours signals remain disabled; do not enable them while this alert is active.
  - uid: sp-fmp-shadow-no-fresh-data
    title: FMP dedicated extended-hours feeds have no fresh rows
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max(signals_producer_extended_shadow_enabled{job="signals_producer"}) * (max(signals_producer_market_session{job="signals_producer",session="premarket"}) + max(signals_producer_market_session{job="signals_producer",session="postmarket"})) * (sum(signals_producer_extended_shadow_fresh_rows{job="signals_producer",feed=~"aftermarket_quote|aftermarket_trade"}) < bool 1)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: FMP's dedicated aftermarket quote and trade endpoints returned no rows with a timestamp from the last five minutes.
      runbook: Compare endpoint request/error/byte counters and the regular-reference fresh-row gauge. Keep extended-hours signal publishing disabled until dedicated data is reliably current.
  - uid: sp-fmp-postmarket-baseline-missing
    title: FMP postmarket adapter has no close-volume baseline
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max(signals_producer_extended_shadow_enabled{job="signals_producer"}) * max(signals_producer_market_session{job="signals_producer",session="postmarket"}) * (max(signals_producer_postmarket_baseline_symbols{job="signals_producer"}) < bool 1)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The postmarket shadow adapter has no same-session regular-close cumulative-volume baseline, so price rows cannot become signal-ready.
      runbook: Verify that the producer completed at least one successful regular-session quote poll and persisted postmarket_close_volume. Keep extended-hours signal publishing disabled until the baseline is present.
- orgId: 1
  name: evidence-and-workflow-freshness
  folder: SMC Live Overlay
  interval: 1m
  rules:
  - uid: lo-workflow-run-failed
    title: Monitored workflow latest run failed
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Genuine failure verdicts only (failure=4, timed_out=8,
        # startup_failure=10) — matching the #3251/#3253 doctrine that
        # cancelled (5) and stale (11) are non-signals: a merge-train
        # concurrency cancel as the newest run used to page "run failed"
        # for up to 24h (found 2026-07-08).
        expr: max by (workflow) ((live_overlay_github_workflow_phase_code{job="live_overlay"} == 4) or
          (live_overlay_github_workflow_phase_code{job="live_overlay"} == 8) or
          (live_overlay_github_workflow_phase_code{job="live_overlay"} == 10))
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A monitored GitHub Actions workflow's latest run ended in failure/timed_out/startup_failure (cancelled and stale are intentionally non-paging).
      runbook: Open the named workflow in GitHub Actions; direct signal the adr0023/promotion/c13 crons
        were missing (red for weeks unseen).
  - uid: lo-workflow-no-green-24h
    title: Monitored workflow no successful run in 24h
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # `== bool 0`, not `== 0`: a bare filter returns the value 0 on a match,
        # and the gt-0 threshold then reads 0>0=false -- inert. bool maps it to
        # 1 so a failed latest run actually fires (found 2026-07-07).
        expr: min by (workflow) (live_overlay_github_workflow_latest_success{job="live_overlay"}) == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 24h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A monitored workflow has had no successful run for 24h (daily crons should reset this each
        day).
      runbook: Check the workflow's recent runs; a persistent 0 means the daily cron is failing or not
        firing.
  - uid: lo-ci-workflow-series-missing
    title: CI workflow series missing while workflow bridge is enabled
    condition: C
    # Guards the workflow="CI" label pin used by lo-ci-full-suite-red (below):
    # every workflow rule in this group is noDataState: OK, so if the CI
    # workflow is renamed, dropped from GITHUB_WORKFLOW_MONITOR_IDS, or
    # scrolls out of the runs page, its series vanish and the red-suite alert
    # goes permanently green. This companion fires exactly then: bridge
    # enabled but no CI-labeled series. With the bridge disabled the expr is
    # empty -> NoData -> OK (intended stand-down; contract-missing covers the
    # family).
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_bridge_enabled{bridge="github_workflow",job="live_overlay"} == bool 1) and on() absent(live_overlay_github_workflow_latest_success{workflow="CI",job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The github_workflow bridge is enabled but exports no series for the workflow
        named "CI" -- lo-ci-full-suite-red (pinned to that label) cannot fire and a red
        main-push suite would be invisible.
      runbook: Check GITHUB_WORKFLOW_MONITOR_IDS on the daemon service and the workflow
        name in .github/workflows (a rename must be mirrored in the alert label pin).
        live_overlay_github_workflow_runs_seen_total shows whether the bridge sees any
        runs at all.
  - uid: lo-ci-full-suite-red
    title: CI full-suite red on main
    condition: C
    # The generic no-green-24h rule above only catches a workflow that stays
    # dark for a whole DAY. The main-push `CI` workflow runs the FULL pytest
    # suite on every merge, so a red latest run means merged code broke tests
    # that `fast-gates` (the only REQUIRED check) does not run — and auto-merge
    # rides right over it. 2026-07-09: CI sat red ~5h through 6 merges, invisible
    # under the 24h rule. Fire after 2h so a same-day regression pages while a
    # quick red->green fix (a flake healed on the next push) rides out.
    # `== bool 0` (not `== 0`): a bare filter yields 0 on a match and gt-0 reads
    # 0>0=false -- inert; bool maps a red latest run to 1 so it actually fires.
    # NOTE: this fires only while `CI` is in the daemon's watch scope
    # (GITHUB_WORKFLOW_MONITOR_IDS unset = all workflows, the default).
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: min by (workflow) (live_overlay_github_workflow_latest_success{job="live_overlay",workflow="CI"})
          == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The main-push CI workflow (full pytest suite) has been red for 2h -- a merge broke tests
        that the required fast-gates check does not run.
      runbook: Open the newest CI run on main and find the failing test; fast-gates stays green because it
        runs a subset. Fix-forward or revert; then confirm CI goes green on the next main push.
  # lo-workflow-run-stale below can only fire while a flow still HAS a run on the
  # fetched page: once it stops running its age series vanishes and the rule goes
  # NoData -> OK -> silent, exactly when it should page. This rule is the absence
  # counterpart -- it reads a declared workflow's presence gauge, which stays at 0
  # instead of disappearing. Gated on the bridge scraping successfully so a token
  # outage reports as a bridge fault (lo-bridge-*) rather than as vanished flows.
  - uid: lo-workflow-expected-missing
    title: Declared workflow produced no runs
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: |-
          sum(
            (min by (workflow) (live_overlay_github_workflow_expected_present{job="live_overlay"}) == bool 0)
            and on() (max(live_overlay_bridge_scrape_success{job="live_overlay",bridge="github_workflow"}) == 1)
          ) or on() vector(0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 6h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A workflow listed in GITHUB_WORKFLOW_MONITOR_EXPECTED has produced no run on the
        monitored branch within the fetched page -- its cron may be disabled, deleted or renamed.
      runbook: Check the workflow in the GitHub Actions tab. If it was intentionally removed or
        renamed, update GITHUB_WORKFLOW_MONITOR_EXPECTED to match; otherwise re-enable the cron
        (60-day repo inactivity auto-disables scheduled workflows). If the flow does still run but
        rarely, its newest run may have scrolled past GITHUB_WORKFLOW_MONITOR_PER_PAGE (max 100)
        -- that needs pagination in github_workflow_bridge, not a config change.
  - uid: lo-workflow-run-stale
    title: Monitored workflow has not run recently
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: max by (workflow) (live_overlay_github_workflow_latest_age_seconds{job="live_overlay"})
          > 172800
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A monitored workflow's newest run is older than 48h -- the cron may be disabled or never
        firing.
      runbook: Verify the workflow schedule and that GitHub Actions crons are enabled (60-day inactivity
        auto-disables them).
  - uid: lo-evidence-snapshot-unloadable
    title: Evidence snapshot unloadable
    condition: C
    # loaded==0 means the bridge could not read the snapshot at all (missing
    # URL/token, base64 envelope, network). `< bool 1` maps that to 1 so the
    # gt-0 threshold trips; a bare `loaded == 0` returns the value 0 and reads
    # 0>0=false -- inert (same class as lo-evidence-ledger-empty, found
    # 2026-07-07). This MUST be its own rule: an unloadable snapshot reports
    # snapshot_age_seconds=0, so the stale (age>86400) rule below can never
