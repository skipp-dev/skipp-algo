  # API-key / credential health, sourced from the daily credential-health-check
  # probe (scripts/credential_health_check.py -> live_overlay_credential_health_*).
  # Until now these gauges were charted but NOT alerted, and the probe's only
  # alarm (a GitHub issue) is inert because repo Issues are disabled -- so an
  # expired key surfaced nowhere. `== bool 0` (not `== 0`) is mandatory: a bare
  # match returns 0 and the gt-0 threshold reads 0>0=false (inert).
