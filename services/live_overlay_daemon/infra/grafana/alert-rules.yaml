        envelope (7d p95 1199 MB, max 1514 MB), so firing means the footprint left its
        historical range — check poll_once / the newsstack poller for a leak and the
        watchlist size for a workload change. Do NOT re-anchor this to a fraction of a
        guessed tier: the 512 MB and 768 MB predecessors were both derived from a 1 GB
        free-tier limit that never applied to this service, and each fired continuously
        against legitimate steady state (~880 MB as of 2026-07-15). If steady state
        grows past this threshold again, confirm the new plateau is intentional and
        re-cut against the *measured* envelope.'
