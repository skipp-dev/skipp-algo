            type: gt
            params:
            - 21600
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    # The market_us_open gate empties the expr outside RTH (nights, weekends,
    # NYSE holidays) — that is a stand-down, not an incident. Without this the
    # Grafana default (NoData) raised a spurious DatasourceNoData instance
    # every night (observed 2026-07-03, pending from 10:40 UTC while ingest
    # was healthy).
    noDataState: OK
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: No new news stories ingested in over 6 hours
      runbook: News flows in bursts, so a quiet window is normal; a 6h+ gap while
        the US regular session is open (live_overlay_market_us_open gates this
        rule holiday-aware — the prior Mon-Fri/12-21-UTC arithmetic fired on NYSE
        holidays) indicates the producer accepts fetches but no new items (cursor
        stuck, provider auth, or upstream outage). Inspect last_ingest_success_at
        in the snapshot vs generated_at.
