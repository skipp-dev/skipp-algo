  - uid: lo-trading-signals-snapshot-unavailable
    title: Trading signals snapshot unavailable
    condition: C
    # loaded==0 means compute._load_signals_snapshot returned {} — no
    # SIGNALS_SERVICE_URL, no SIGNALS_SNAPSHOT_URL and no readable local
    # snapshot. Neither sibling rule can see that state: both
    # lo-trading-signals-snapshot-stale (via the exporter's own `stale` verdict,
    # which stays 0 while age_known==0) and lo-trading-signals-snapshot-age-unknown
    # (literally multiplied by `..._loaded`) read 0 when nothing loaded at all,
    # so a fresh deploy or a misconfigured URL leaves the A0/A1/A2 overlays blank
    # with every signals alert green. Mirrors lo-news-snapshot-unavailable and
    # lo-tv-binding-snapshot-unloadable (found 2026-07-23).
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_trading_signals_loaded{job="live_overlay"} < bool 1
        instant: true
    - refId: C
      datasourceUid: __expr__
