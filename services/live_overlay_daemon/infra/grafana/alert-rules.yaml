      summary: The evidence snapshot loads but carries no WSH newest_date -- the stale rule
        cannot see this state and stays green with zero data.
      runbook: live_overlay_evidence_wsh_age_known is 0 while the snapshot loaded=1. The
        producer is publishing a snapshot whose `wsh.newest_date` is missing/empty/unparseable.
        Inspect the payload at EVIDENCE_FRESHNESS_SNAPSHOT_URL and see evidence-freshness-snapshot.yml.
  - uid: lo-evidence-incubation-fills-stalled
    title: C8 incubation fills stalled
    condition: C
    # The C8 execution-promotion ladder needs closed paper trades, but orders can
    # be submitted every day while NOTHING fills (paper TWS down/unreachable) -- a
    # silent stall that never advances the ladder toward live capital. Fires when
    # no fill has ever landed (filled_total == bool 0) AND incubation is actively
    # fresh (newest record < 5d) AND that age is known. Multiplicative gating: the
    # product is 1 only when all three hold, so the gt-0 threshold fires. A genuine
    # pause lets the incubation age go stale (>5d), dropping the gate, so an
    # intentional stop does not page. `for: 3d` rides out the normal ramp-up
    # before the first fills land.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_fills_filled_total{job="live_overlay"} == bool 0)
          * (live_overlay_evidence_fills_newest_incubation_age_seconds{job="live_overlay"} < bool 432000)
          * live_overlay_evidence_fills_newest_incubation_age_known{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 3d
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The C8 paper-incubation ladder is submitting orders but 0 have ever filled -- execution is
        stalled (paper TWS down/unreachable?).
      runbook: Check the paper TWS/IBKR gateway is up on port 7497 during the 09:28 ET order window and the
        23:05 reconcile; inspect cache/live/smoke_HALT and the newest incubation_<DATE>.jsonl fill_price fields.
  - uid: lo-evidence-submit-failed
    title: C8 paper submits are failing
    condition: C
    # A paper bracket that places but lands no resting leg (every leg
    # cancelled/rejected, e.g. IB error-110 on a sub-tick TP/SL) records
    # submit_failed instead of a phantom paper_submitted (2026-07-08). Fires when
    # >=1 such failure has happened AND nothing has EVER filled -- "submits are
    # actively dying", the specific root cause the generic stall alert cannot name
    # (and which it misses once incubation goes stale). Clears the moment any real
    # fill lands (filled_total > 0). `for: 6h` rides out a single bad submit day.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_fills_submit_failed_total{job="live_overlay"} > bool 0)
          * (live_overlay_evidence_fills_filled_total{job="live_overlay"} == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 6h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: C8 paper submits are placing brackets that never rest (all legs cancelled/rejected, e.g. IB
        error-110) and nothing has ever filled -- the bracket dies at submit.
      runbook: Inspect the newest incubation_<DATE>.jsonl for action=submit_failed; check TP/SL prices snap to
        the min tick (scripts/execute_ibkr_watchlist.py _round_to_min_tick) and the paper TWS is up on 7497.
  - uid: lo-c13-submitter-stale-checkout
    title: C13 submitter on stale checkout
    condition: C
    # The paper-submit cron runs against the C13 Mac's LOCAL checkout with no
    # auto-pull; a fix merged to origin/main (e.g. #3297's min-tick snap) never
    # reaches the box that submits until someone pulls. That gap kept the C8
    # ladder at 0 fills for weeks with every PR "merged" but undeployed. Fires
    # when the submit-order-path code on the Mac is behind origin/main (>0) AND
    # that reading is known (the Mac published it). Unrelated main churn does NOT
    # count -- only commits touching the submit path. `for: 12h` rides out a
    # same-day merge->pull; pages if a submit fix stays undeployed past the next
    # daily submit.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_evidence_c13_submit_code_behind_commits{job="live_overlay"} > bool 0)
          * live_overlay_evidence_c13_submit_code_behind_commits_known{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 12h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The C13 paper-submit Mac is running order-path code behind origin/main -- a merged fix has not
        been deployed to the box that submits; nothing new takes effect until it is pulled.
      runbook: On the submit Mac, cd to the checkout and `git pull --ff-only` (never --no-verify); confirm
        scripts/execute_ibkr_watchlist.py + run_smc_live_incubation.py match origin/main, then re-run phase-a.
  - uid: lo-fmp-bandwidth-approaching
    title: FMP bandwidth approaching monthly quota
    condition: C
    # FMP meters a rolling-30-day DATA-VOLUME quota (150 GB); a "90% used" email
    # was previously our only signal. Fires when our recorded FMP byte
    # consumption this month reaches >=80% of the configured limit. The usage
    # snapshot accumulates by calendar month -- a close proxy for FMP's rolling
    # meter. `for: 1h` rides out a single scrape.
    # The scalar() term adds the 24/7 signals-producer's FMP consumption (a
    # SEPARATE Railway service / job whose bytes never reach the ingest snapshot,
    # yet it is the single largest FMP consumer). `or vector(0)` makes an absent
    # producer contribute 0, never null the numerator; adding it can only make
    # the quota fire EARLIER, never mask a real breach.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_provider_usage_bytes{job="live_overlay",provider="fmp"}
          + scalar(sum(increase(signals_producer_fmp_endpoint_response_bytes_total{job="signals_producer"}[30d])) or vector(0)))
          / on(provider) live_overlay_provider_bandwidth_limit_bytes{job="live_overlay",provider="fmp"}
          > 0.80
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: FMP data-volume consumption this month has reached >=80% of the configured monthly
        bandwidth quota (150 GB default).
      runbook: Check the FMP dashboard usage; reduce poll frequency / page limits in newsstack_fmp/config.py
        (FMP_*_LIMIT) or raise FMP_MONTHLY_BANDWIDTH_LIMIT_BYTES if the plan tier changed.
  - uid: lo-fmp-bandwidth-critical
    title: FMP bandwidth near monthly quota
    condition: C
    # Escalation of lo-fmp-bandwidth-approaching: >=95% of the FMP monthly volume
    # quota -- exhaustion (and blanket ingest failures) is imminent. Includes the
    # signals-producer's FMP consumption (see lo-fmp-bandwidth-approaching) so the
    # critical threshold reflects TOTAL consumption, not ingest-only.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: (live_overlay_provider_usage_bytes{job="live_overlay",provider="fmp"}
          + scalar(sum(increase(signals_producer_fmp_endpoint_response_bytes_total{job="signals_producer"}[30d])) or vector(0)))
          / on(provider) live_overlay_provider_bandwidth_limit_bytes{job="live_overlay",provider="fmp"}
          > 0.95
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 15m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: FMP data-volume consumption this month has reached >=95% of the monthly bandwidth
        quota -- ingest will start failing when the quota is exhausted.
      runbook: Immediately reduce FMP polling (newsstack_fmp/config.py FMP_*_LIMIT / poll interval) or
        upgrade the FMP plan; raise FMP_MONTHLY_BANDWIDTH_LIMIT_BYTES to match a new plan.
  - uid: lo-provider-rate-limited
    title: Data provider is being rate-limited (429s)
    condition: C
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # 429 hits per provider over the last 6h. The vendors send no X-RateLimit-*
        # headers, so this counter (bumped across the ingest/provider clients; see
        # runbook) is the only "we are being throttled" signal. increase() handles the
        # monthly reset of the underlying gauge; a bare increase feeding the gt-0
        # threshold is linter-safe (0 = not throttled correctly does not fire).
        expr: increase(live_overlay_provider_usage_rate_limit_hits{job="live_overlay"}[6h])
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 5m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: A data provider (Massive/Benzinga/Unusual Whales/FMP/Databento/Finnhub) returned HTTP
        429 in the last 6h -- ingest is brushing its rate limit; retries are currently absorbing it.
      runbook: Reduce polling frequency / concurrency for the throttled provider (newsstack_fmp poll
        intervals) or raise the plan tier. Counter sources are newsstack_fmp/_bz_http.py (bz/massive/
        UW), ingest_fmp.py + open_prep/macro.py (fmp), databento_client.py, terminal_finnhub.py.
  # UID kept <=40 chars: Grafana rejects longer UIDs with HTTP 400, and the
  # upsert applies group-by-group, so one over-long UID strands every later
  # group in a partial-apply mixed state (2026-07-13..15 outage; see
  # validate_alert_groups' MAX_UID_LENGTH guard).
  - uid: lo-provider-usage-series-missing
    title: Provider-usage snapshot series missing
    condition: C
    # absent()==1 is the alarm; a healthy empty vector must not page as NoData.
    # If these gauges vanish from scrape output the FMP bandwidth + provider-429
    # alerts above silently lose their input -- they are all computed off this
    # same ingest-side usage snapshot.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: absent(live_overlay_provider_usage_loaded{job="live_overlay"})
          or absent(live_overlay_provider_usage_snapshot_age_seconds{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 10m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Provider-usage snapshot metrics are missing from scrape output
      runbook: Check /metrics exposure for the live_overlay_provider_usage_* gauges and
        scrape-target label wiring; the FMP bandwidth and provider-429 alerts all read
        this snapshot, so a missing series blinds them too.
  - uid: lo-provider-usage-snapshot-unloaded
    title: Provider-usage snapshot not loaded
    condition: C
    # loaded==0 => the daemon could not read the monthly usage snapshot (missing
    # PROVIDER_USAGE_SNAPSHOT_URL/path, or an unreadable/malformed file). The FMP
    # quota gauges then read 0 and the 80/95% alerts go quiet -- a silent blind
    # spot. `== bool 0` yields a present 0/1 series (never NoData); `for: 2h`
    # rides out the cold-start window before the daily open-prep snapshot lands.
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_provider_usage_loaded{job="live_overlay"} == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 2h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Provider-usage monthly snapshot is not loaded (FMP quota telemetry blind)
      runbook: Verify PROVIDER_USAGE_SNAPSHOT_URL / PROVIDER_USAGE_SNAPSHOT_PATH and that
        the daily open-prep workflow commits artifacts/monitoring/provider_usage.json;
        the daemon serves loaded=0 with an error label until the snapshot is readable.
  - uid: lo-provider-usage-snapshot-stale
    title: Provider-usage snapshot stale
    condition: C
    # loaded * (age > bool 4d) yields a present 0 when fresh or unloaded and 1
    # when a LOADED snapshot has aged past 4 days. 4d (not 24h) tolerates the
    # daily open-prep cadence plus a weekend/holiday gap without false-firing.
    # When the age is unknown the daemon emits age_seconds=0, so the product is 0
    # (no fire) -- no NoData handling needed.
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Gated on snapshot_age_known so a missing updated_at (age_seconds=0) does not read as fresh.
        expr: live_overlay_provider_usage_loaded{job="live_overlay"} * (live_overlay_provider_usage_snapshot_age_seconds{job="live_overlay"}
          > bool 345600) * live_overlay_provider_usage_snapshot_age_known{job="live_overlay"}
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 1h
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: Provider-usage monthly snapshot is older than 4 days (FMP quota figures may be stale)
      runbook: The daily open-prep workflow has not refreshed
        artifacts/monitoring/provider_usage.json within 4 days. Check the open-prep run
        and the snapshot publish path; the FMP bandwidth % is computed from this file.
  - uid: lo-provider-usage-snapshot-age-unknown
    title: Provider-usage snapshot age unknown (loads but carries no updated_at)
    condition: C
    # The stale rule above says "loads but is older than 4d" -- it can only
    # say that once an age is KNOWN. snapshot_age_known is derived from a
    # parseable `updated_at`, and `_coerce` keeps loaded=1.0 while tolerating a
    # missing `updated_at` (it returns None), so a snapshot that parses without
    # a usable date yields age_known=0 AND age_seconds=0: the stale rule reads
    # 0>345600=false and lo-provider-usage-snapshot-unloaded reads loaded<1=false.
    # The producer heartbeat is then unwatched and the FMP-quota + provider-429
    # alerts lose their input. Gated on `loaded` to page once, not twice.
    noDataState: OK
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        expr: live_overlay_provider_usage_loaded{job="live_overlay"} * (live_overlay_provider_usage_snapshot_age_known{job="live_overlay"}
          == bool 0)
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: critical
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The provider-usage snapshot loads but carries no updated_at -- the producer
        heartbeat is unwatched and the stale rule stays green with zero data.
      runbook: live_overlay_provider_usage_snapshot_age_known is 0 while loaded=1. The
        snapshot at PROVIDER_USAGE_SNAPSHOT_URL/PATH parsed but has no/zero `updated_at`
        (schema drift, a truncated write, or a stale seed). Inspect the payload; check
        the daily open-prep workflow that commits artifacts/monitoring/provider_usage.json.
  - uid: lo-sweep-trap-shadow-stale
    title: Sweep-trap shadow snapshot stale
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Precomputed 0/1 staleness gauge (age > OVERLAY_SWEEP_TRAP_SHADOW_MAX_AGE_SECS,
        # default 96h, tolerates one skipped weekday run). Alerting on the precomputed
        # gauge instead of a bare age comparison keeps the gt-0 threshold live (the
        # gt-0-inert class). See services/live_overlay_daemon/sweep_trap_shadow_bridge.py.
        expr: max(live_overlay_sweep_trap_shadow_snapshot_stale{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    for: 30m
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The WS4a sweep-trap shadow eval has not published a fresh snapshot within its max-age budget
      runbook: The daily sweep-trap-shadow-daily workflow has not refreshed
        artifacts/monitoring/sweep_trap_shadow.json within OVERLAY_SWEEP_TRAP_SHADOW_MAX_AGE_SECS.
        Check the sweep-trap-shadow-daily workflow runs — staleness is driven by the snapshot
        publish to the static bot/live-sweep-trap-shadow branch (first created 2026-07-13); the
        per-run bot/sweep-trap-shadow-ledger-<run_id> PRs are the separate ledger commit-back.
        Observe-only — no score impact; a stale snapshot only means the promotion evidence stopped accruing.
  - uid: lo-sweep-trap-shadow-age-unknown
    title: Sweep-trap shadow snapshot age unknown (no real data loaded)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # Complement of the stale rule: a MISSING/UNREADABLE snapshot (and the
        # committed no-data seed, generated_at=0) yields age_known=0 AND stale=0,
        # so the gt-0 stale rule stays green with zero data — the gt-0-inert
        # class. `== bool 0` (not `== 0`) is mandatory: a bare match returns 0
        # and the gt-0 threshold reads 0>0=false (inert).
        expr: max(live_overlay_sweep_trap_shadow_snapshot_age_known{job="live_overlay"}) == bool 0
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
    # Rides out daemon restarts/deploy churn and transient fetch failures; a
    # genuinely absent feed holds age_known=0 far longer than 2h. A missing
    # SERIES (daemon down) is lo-scrape-missing's job, not this rule's.
    for: 2h
    noDataState: OK
    labels:
      severity: warning
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The sweep-trap shadow bridge has never loaded a real snapshot (missing/unreadable file or the no-data seed)
      runbook: live_overlay_sweep_trap_shadow_snapshot_age_known is 0 — the daemon is
        serving the committed no-data seed (generated_at=0) or cannot fetch/read the
        snapshot at SWEEP_TRAP_SHADOW_SNAPSHOT_URL. Check that the daily
        sweep-trap-shadow-daily workflow publishes bot/live-sweep-trap-shadow (needs
        GH_PAT; the publish step only warns when it is missing) and that the daemon URL
        points at it. The stale alert cannot cover this state — stale is only computed
        once an age is KNOWN.
  - uid: lo-sweep-trap-shadow-promotable
    title: Sweep-trap shadow verdict is PROMOTABLE (WS4b candidate)
    condition: C
    data:
    - refId: A
      datasourceUid: grafanacloud-prom
      model:
        # verdict_code 2 == PROMOTABLE (Brier beats baseline AND top/bottom-tercile
        # lift positive on >= MIN_OOS=40 samples). `max without (verdict)` collapses
        # the verdict label so the series stays continuous across verdict changes;
        # `for: 72h` then requires the value to hold PROMOTABLE for 3 consecutive
        # days (a single dip resets the pending timer). Deliberately NOT
        # min_over_time(...[3d]), which would false-fire on partial data before a
        # full 3-day window of samples exists.
        expr: max without (verdict) (live_overlay_sweep_trap_shadow_verdict_code{job="live_overlay"})
        instant: true
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
    for: 72h
    # Positive/notification alert — a missing series (daemon down) is covered by
    # lo-scrape-missing, and must NOT fire this WS4b prompt.
    noDataState: OK
    labels:
      severity: info
    annotations:
      runbook_url: https://github.com/skipp-dev/skipp-algo/blob/main/services/live_overlay_daemon/OPS.md
      summary: The WS4a sweep-trap shadow verdict has held PROMOTABLE for 3 days — WS4b promotion candidate
      runbook: The observe-only sweep_trap_quality_score has beaten baseline Brier with
        positive top/bottom-tercile lift on >= 40 samples for 3 consecutive days. This is the
        WS4b trigger — review live_overlay_sweep_trap_shadow_{brier_delta,lift,sample_count} on
        the "Sweep-Trap Promotion Evidence" dashboard row, then decide whether to grant the detector
        score-budget weight (confluence currently reads the coarse SWEEP_QUALITY_SCORE, not
        SWEEP_TRAP_QUALITY_SCORE). Not an incident — an action prompt.
- orgId: 1
  name: credential-health
