# Grafana notification routing (contact points + notification policy) as code.
#
# Source of truth for HOW alerts reach humans — the companion to
# ``alert-rules.yaml`` (which defines WHICH conditions alert). Applied to
# Grafana Cloud by ``scripts/grafana_notification_routing_upsert.py`` via the
# provisioning API (POST/PUT /api/v1/provisioning/contact-points + PUT
# /api/v1/provisioning/policies), the same auth path the alert-rules upsert
# uses. Deployed on push by
# ``.github/workflows/live-overlay-notification-routing-publish.yml``.
#
# Secret handling: the Slack webhook is NEVER committed. ``${SLACK_WEBHOOK_URL}``
# is substituted from the environment at apply time (CI injects the
# SLACK_WEBHOOK_URL secret; local runs read it from the env). The placeholder is
# the only representation that lives in git.
#
# Before this file, routing was configured live-only via the Grafana UI, so a
# Grafana rebuild would have silently dropped every route and delivered alerts
# nowhere (which is exactly the state this file was born from: 0 contact points,
# root receiver "empty", 2026-07-11).
apiVersion: 1

# Slack contact point. type=slack + settings.url = an incoming-webhook URL.
contactPoints:
  - name: slack-smc-alerts
    type: slack
    settings:
      url: ${SLACK_WEBHOOK_URL}
    disableResolveMessage: false

# Notification policy tree (single tree per org; the PUT replaces it wholesale,
# so this file must describe the WHOLE intended tree).
#
# root.receiver = slack-smc-alerts is a deliberate catch-all: every firing alert
# reaches Slack even if a future rule carries a severity outside the explicit
# route below (e.g. an unlabelled or `info` alert), so nothing is silently
# dropped. The explicit severity route documents the intended credential/ops
# coverage and is the seam to split severities to other channels later.
policy:
  receiver: slack-smc-alerts
  group_by:
    - grafana_folder
    - alertname
  routes:
    # 2026-08-29: eigene Route fuer required Checks, VOR der generischen
    # Severity-Route (Reihenfolge entscheidet, `continue: false` unten stoppt).
    #
    # Warum eine eigene: am 2026-08-29 war `main` 47 min rot und niemand merkte
    # es. Die Regel hatte den Ausfall gesehen (Pending 07:46->08:33), aber alle
    # Regeln dieses Stacks tragen bis dahin `warning` und landen im selben
    # Kanal, gruppiert nach `grafana_folder`+`alertname` -- 546 Zustandswechsel
    # in 14 h. Ein rotes required Gate war darin nicht auffindbar.
    #
    # Zwei Unterschiede zur generischen Route, beide absichtlich:
    #   * `group_by: [alertname]` -- nicht mit den Ordner-Geschwistern in eine
    #     Benachrichtigung einsammeln.
    #   * `repeat_interval: 30m` -- solange main rot ist, wiederholt melden
    #     statt einmal zu piepen und zu schweigen (Grafana-Vorgabe: 4h).
    #
    # Der EMPFAENGER bleibt bewusst derselbe Slack-Kontaktpunkt: ein eigener
    # Kanal (oder Pager) ist eine Operator-Entscheidung ueber ein Ziel, das
    # dieses Repo nicht erfinden kann. Die Route ist die Naht dafuer.
    - receiver: slack-smc-alerts
      object_matchers:
        - [required_check, "=", "true"]
      group_by:
        - alertname
      group_wait: 30s
      repeat_interval: 30m
      continue: false
    # 2026-08-31 (Wirkungs-Sweep Befund E): die generische Severity-Route ist
    # ENTFERNT, weil sie an der Instanz nachweislich nichts tat. Gemessen an der
    # Live-Policy, nicht an dieser Datei:
    #
    #   * Sie setzte denselben Empfaenger wie die Wurzel (slack-smc-alerts).
    #   * Sie ueberschrieb KEIN einziges Zustellfeld -- kein group_by, kein
    #     group_wait/group_interval, kein repeat_interval. Alles wurde von der
    #     Wurzel geerbt.
    #   * Sie waehlte damit 171 von 173 Regeln aus und behandelte sie exakt so,
    #     wie die Wurzel sie ohnehin behandelt.
    #
    # Ihre Begruendung war, die "Naht" fuer eine spaetere Aufteilung nach
    # Severity zu sein. Das ist Zukunfts-Prosa ohne Mechanismus: nichts liest
    # sie zum richtigen Zeitpunkt, und bis dahin liess der Baum aussehen, als
    # gaebe es eine Severity-Behandlung. Eine Aufteilung braucht ohnehin eine
    # NEUE Route mit abweichendem Ziel oder Timing -- sie entsteht dann, nicht
    # als Platzhalter davor.
    #
    # Das Verhalten bleibt unveraendert: die Wurzel ist Auffangbecken, jede
    # Meldung landet weiter im selben Kanal mit derselben Gruppierung. Die
    # required-Check-Route oben steht davor und terminiert, also aendert der
    # Wegfall auch an ihr nichts.
    #
    # Die Severity-Labels selbst bleiben und tragen Information (gemessen:
    # critical 66, warning 90, high 15, info 2) -- vakuum war der KONSUMENT,
    # nicht das Feld.
