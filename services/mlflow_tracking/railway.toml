[build]
builder = "DOCKERFILE"
dockerfilePath = "services/mlflow_tracking/Dockerfile"
watchPatterns = [
    "services/mlflow_tracking/**",
]

[deploy]
startCommand = "python -m services.mlflow_tracking.server"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "mlflow-tracking"
