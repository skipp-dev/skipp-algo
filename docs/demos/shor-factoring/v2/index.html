<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A slide-led interactive explanation of how Shor's algorithm factors two-digit numbers."
    >
    <title>Shor's Algorithm — Presentation Walkthrough V2</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Restart the V2 walkthrough">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Quantum Factoring Lab</span>
        </a>
        <div class="topbar-actions">
          <span class="version-label">VERSION 2 · SLIDE-LED</span>
          <a class="text-link" href="../index.html">Open original version ↗</a>
        </div>
      </header>

      <section class="control-strip" aria-label="Choose a number">
        <form id="number-form" class="number-form" novalidate>
          <label for="number-input">Number to factor</label>
          <div class="number-entry">
            <input
              id="number-input"
              name="number"
              type="number"
              inputmode="numeric"
              min="10"
              max="99"
              step="1"
              value="15"
              aria-describedby="input-guidance input-error"
            >
            <button class="button button-primary" type="submit">Build walkthrough</button>
          </div>
          <p id="input-guidance">Enter any whole number from 10 to 99.</p>
          <p id="input-error" class="input-error" role="alert" hidden></p>
        </form>

        <div class="presets" aria-label="Prepared examples">
          <span>Prepared examples</span>
          <div>
            <button type="button" class="preset is-active" data-example="15" aria-pressed="true">15</button>
            <button type="button" class="preset" data-example="21" aria-pressed="false">21</button>
            <button type="button" class="preset" data-example="35" aria-pressed="false">35</button>
          </div>
        </div>

        <div class="current-result" aria-live="polite">
          <span>Current result</span>
          <strong id="result-preview">15 = 3 × 5</strong>
        </div>
      </section>

      <nav class="story-rail" aria-label="Walkthrough stages">
        <div id="stage-buttons" class="stage-buttons"></div>
      </nav>

      <section class="presentation-frame" aria-labelledby="stage-title">
        <div class="progress-line" aria-hidden="true">
          <span id="progress-fill"></span>
        </div>

        <article id="stage" class="stage" aria-live="polite">
          <header class="stage-heading">
            <div>
              <p id="stage-kicker" class="stage-kicker"></p>
              <h1 id="stage-title"></h1>
            </div>
            <p id="stage-counter" class="stage-counter"></p>
          </header>
          <div id="stage-content" class="stage-content"></div>
        </article>

        <footer class="presentation-controls">
          <button id="previous-button" class="button button-secondary" type="button">
            ← Previous
          </button>
          <p class="keyboard-help">Use ← and → to present</p>
          <button id="next-button" class="button button-primary" type="button">
            Next →
          </button>
        </footer>
      </section>

      <footer class="page-footer">
        <p>
          Educational simulation. All arithmetic is exact; the quantum
          measurement is a deterministic visual explanation.
        </p>
      </footer>
    </main>

    <script src="../shor-math.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
