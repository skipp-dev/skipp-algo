# Cisco AI Security Scanner — Skill-Scan-Policy für skipp-algo
#
# Verbraucher: VS-Code-Extension `cisco-ai.cisco-ai-security-scanner`
#   skill-scanner.scanPolicy     = "custom"     <- ohne das wird DIESE Datei ignoriert
#   skill-scanner.scanPolicyFile = <Pfad hierher>
# Gleiche Datei ad hoc:
#   skill-scanner scan-all <dir> --recursive --use-behavioral --use-trigger \
#     --policy configs/skill_scan_policy.yaml
#
# ---------------------------------------------------------------------------
# ACHTUNG — gemessen 2026-08-22, nicht aus der Doku übernommen:
# Eine Liste, die hier auftaucht, ERSETZT die Liste des Presets, sie ergänzt sie
# NICHT.  `skip_in_docs` mit zwei Einträgen zu schreiben hätte die 14 Einträge
# des `balanced`-Presets still gelöscht — der Scan wäre grüner geworden UND
# blinder.  Deshalb steht die Liste unten VOLLSTÄNDIG da.
# Wächter: tests/test_skill_scan_policy.py (fällt, wenn ein Preset-Eintrag fehlt).
# ---------------------------------------------------------------------------

policy_name: skipp-algo
policy_version: "1.0"
preset_base: balanced

rule_scoping:
  # 14 Einträge aus `balanced` (unverändert) …
  skip_in_docs:
    - COMMAND_INJECTION_JS_CHILD_PROCESS
    - COMMAND_INJECTION_JS_FUNCTION_CONSTRUCTOR
    - DATA_EXFIL_JS_FS_ACCESS
    - DATA_EXFIL_JS_NETWORK
    - FIND_EXEC_PATTERN
    - GLOB_HIDDEN_FILE_TARGETING
    - PROMPT_INJECTION_IGNORE_INSTRUCTIONS
    - SECRET_CONNECTION_STRING
    - TOOL_ABUSE_SYSTEM_MODIFICATION
    - code_execution_generic
    - command_injection_generic
    - credential_harvesting_generic
    - script_injection_generic
    - system_manipulation_generic
    # KEINE Ergänzungen. Der erste Entwurf trug hier MDBLOCK_PYTHON_EVAL_EXEC und
    # MDBLOCK_PYTHON_SUBPROCESS ein, um die Verwundbarkeits-Beispiele in
    # .github/skills/security-review/references/ ruhigzustellen. Gemessen
    # 2026-08-22: wirkungslos. `skip_in_docs` wird ausschließlich in
    # core/analyzers/static.py ausgewertet; beide MDBLOCK-Regeln stammen aus
    # core/analyzers/behavioral_analyzer.py, der die Policy-Scoping-Felder gar
    # nicht liest. Der Eintrag hätte konfiguriert ausgesehen und nichts getan.
    # Gelöst wurde es stattdessen an der Quelle: die betroffenen Blöcke sind
    # Muster-Kataloge und jetzt als ```text ausgezeichnet, nicht als ```python.
    # Damit bleiben beide Regeln überall scharf.

severity_overrides: []

# Global abgeschaltet — jede Zeile mit Grund, sonst gehört sie nicht hierher.
disabled_rules:
  # Feuerte auf 35 von 35 Skills der Population (2026-08-22), also auch auf jedes
  # Fremd-Skill, das wir nicht bearbeiten können.  Kategorie ist `policy_violation`
  # (Vertriebshygiene für VERÖFFENTLICHTE Skill-Pakete), nicht Sicherheit; keins
  # dieser Skills wird veröffentlicht.  Eine Regel, die auf 100 % der Menge
  # feuert, trennt nichts — sie kostet nur die Aufmerksamkeit, die die 13
  # verbleibenden Befunde brauchen.
  - MANIFEST_MISSING_LICENSE
