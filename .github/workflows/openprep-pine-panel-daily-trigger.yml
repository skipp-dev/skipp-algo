# live-window: any-trigger  # F-V6-F2.1 (2026-05-02)
name: openprep-pine-panel-daily-trigger

# Dispatches the Open-Prep TradingView panel publish workflow after the
# scheduled run-open-prep-daily producer succeeds on main.
#
# Safety posture:
# - reacts only to scheduled producer runs (not manual reruns)
# - always dispatches with allow_create=false to avoid duplicate scripts
# - publish workflow itself has serialized concurrency

on:
  workflow_run:
    workflows:
      - run-open-prep-daily
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: openprep-pine-panel-daily-trigger
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  dispatch-openprep-panel-publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Dispatch openprep-pine-panel-publish (in-place update)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/openprep-pine-panel-publish.yml/dispatches" \
            -d '{"ref":"main","inputs":{"regenerate":"true","allow_create":"false"}}'

      - name: Write dispatch summary
        run: |
          {
            echo "### Open-Prep panel publish dispatched"
            echo ""
            echo "- dispatched workflow: \`openprep-pine-panel-publish.yml\`"
            echo "- dispatched inputs: \`regenerate=true, allow_create=false\`"
          } >> "$GITHUB_STEP_SUMMARY"
