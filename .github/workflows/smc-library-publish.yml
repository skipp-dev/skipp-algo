# live-window: any-trigger  # F-V6-F2.1: kein eigener Cron — dieser Workflow
# haengt an workflow_run des Refresh, der den Zeitplan traegt.
name: smc-library-publish

# Der veroeffentlichende Teil des Bibliotheks-Refresh, herausgeloest am
# 2026-08-13.
#
# WARUM ES DIESE DATEI GIBT. `smc-library-refresh` hielt die Gruppe
# `tradingview-session` ueber seine volle Laufzeit -- rund 140 Minuten, von denen
# **13** eine TradingView-Sitzung brauchen. Der Rest ist lokales Python: allein
# `Run pre-publish strict release gates` misst 59,4 min und laeuft, belegbar aus
# der Schrittfolge, VOR dem Schreiben des TV-Zustands. Die Gruppe hat einen
# Platz; bei 18-21 Laeufen pro Werktag standen ~42 h Nachfrage gegen 24 h, und
# die Schlange wuchs um ~18 h pro Tag. Gemessene Wartezeiten: 22 bis 36,5 h.
# `tv-save-consumer-source` steht in derselben FIFO-Schlange, weshalb die
# Verifikation der Kundenoberflaechen anderthalb Tage zu spaet kam.
#
# WARUM ZWEI WORKFLOWS UND NICHT ZWEI JOBS. `concurrency:` stand auf
# WORKFLOW-Ebene; ein Job-Split haette die Sperrzeit nicht angefasst. Die Gruppe
# auf Job-Ebene zu setzen waere kleiner, ist aber unbelegt: im Repo gibt es 67
# Workflow-Ebene-Blöcke und keinen einzigen auf Job-Ebene. `queue: max` -- am
# 2026-08-06 eingefuehrt, weil unter der Vorgabe `queue: single` der naechste
# Ankoemmling den Wartenden STORNIERTE -- waere dort ungeprueft. Ein stiller
# Rueckfall ins Verwerfen von Laeufen waere schlimmer als der Stau, weil er
# unsichtbar ist. Deshalb erbt diese Datei den Block wortgleich.
#
# Plan und alle Messungen:
# docs/superpowers/plans/2026-08-13-tradingview-session-lock-split.md

on:
  workflow_run:
    workflows: ["smc-library-refresh"]
    types: [completed]
  # Nachtraeglich veroeffentlichen, wenn ein Refresh-Lauf durch war, aber die
  # Veroeffentlichung scheiterte. `source_run_id` waehlt den Refresh-Lauf, aus
  # dem die Uebergabe gezogen wird.
  workflow_dispatch:
    inputs:
      hosted_runner_override:
        description: "GitHub-hosted runner label to use instead of the default"
        required: false
        default: ""
      source_run_id:
        description: "Refresh run id to publish from (default: latest successful)"
        required: false
        default: ""

concurrency:
  # WORTGLEICH aus smc-library-refresh uebernommen. Zehn weitere Workflows
  # teilen sich diese Gruppe; sie serialisiert CI gegen CI auf EINEM
  # TradingView-Konto, nicht gegen die Browser-Sitzung des Betreibers.
  # cancel-in-progress bleibt false: diese Laeufe speichern Layouts und
  # veroeffentlichen Skripte, ein Wartender muss warten und darf nie
  # vordraengen. queue: max haelt die Schlange FIFO statt sie zu verwerfen.
  # Diese Gruppe serialisiert CI gegen CI, sie serialisiert NICHT das Konto:
  # die eigene Browser-Sitzung des Betreibers ist ein second, unserialised writer —
  # Schreiber auf denselben Layouts, und TradingView autosave schreibt von
  # dort ungefragt mit (vom Betreiber bestaetigt 2026-08-01: autosave aktiv,
  # und ein Chart-Tab dieses Kontos stand einen ganzen Tag offen, waehrend
  # Laeufe Layouts mutierten -- nichts hier wusste davon). Kein Mechanismus erkennt oder
  # schliesst diese Sitzung aus; mutierende Laeufe stimmen sich mit dem
  # Betreiber per Absprache ab, nicht per Code.
  group: tradingview-session
  cancel-in-progress: false
  queue: max

# Rechte NUR dort, wo sie gebraucht werden (zizmor excessive-permissions):
# der Workflow selbst braucht keine.
permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  # REFRESH_DATE steht NICHT in env: der Wert kommt aus der Uebergabedatei
  # und wird als steps.handoff.outputs.refresh_date gelesen. Der Umweg
  # ueber $GITHUB_ENV waere eine zweite Quelle fuer denselben Wert (und
  # eine zizmor github-env-Feststellung).
defaults:
  run:
    shell: bash

jobs:
  select-runner:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
      runner_environment: ${{ steps.resolve.outputs.runner_environment }}
      resolution_reason: ${{ steps.resolve.outputs.resolution_reason }}
      matched_runner_name: ${{ steps.resolve.outputs.matched_runner_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Resolve worker runner
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          SMC_FORCE_GH_HOSTED: ${{ vars.SMC_FORCE_GH_HOSTED }}
        run: |
          # Library refresh is a long-running cron/workflow_run batch job, so
          # prefer the priority cron Windows runner when one is online and idle.
          python scripts/resolve_workflow_runner.py \
            --repository "${{ github.repository }}" \
            --hosted-runner "${{ inputs.hosted_runner_override != '' && inputs.hosted_runner_override || (vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest') }}" \
            --custom-label "${{ vars.SMC_PRIORITY_CRON_SELF_HOSTED_LABEL || vars.SMC_SELF_HOSTED_LABEL }}"


  publish:
    permissions:
      contents: write        # Commit des Versions-Bumps
      pull-requests: write   # bot-PR + auto-merge
      actions: read          # dawidd6/action-download-artifact zieht die
                             # Uebergabe ueber die Actions-REST-API
    # Bei `workflow_run` nur nach einem erfolgreichen Refresh; ein manueller
    # Aufruf traegt seine eigene Verantwortung.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.runs_on_json) }}
    timeout-minutes: 240

    steps:
      # Dieser Job urteilt ueber eine Nutzlast, die ein ANDERER Lauf erzeugt
      # hat. Ohne explizite ref checkt er die Spitze von main aus — gemessen am
      # 2026-08-14 war das bei 7 von 7 workflow_run-Publishes ein ANDERER Baum
      # als der des Refresh (1 bis 7 Commits Abstand): ein Refresh laeuft bis
      # zu drei Stunden, main zieht derweil weiter. Einmal traf es eine
      # Messgrundlage — Publish 31770344682 las ein neueres
      # reports/smc_measurement_baseline_summary.json als der Refresh
      # 31752985708, der seine Nutzlast erzeugt hatte. Gates, Skripte und
      # Vertragsdaten muessen aus dem Baum kommen, den der Refresh vermessen
      # hat; die Nutzlast wird unten ueber genau diesen Baum entpackt.
      #
      # Der Commit-/PR-Schritt am Ende ist darauf vorbereitet: er re-ankert
      # ausdruecklich auf origin/main, wenn der Checkout dahinter liegt
      # ("main advanced since checkout"), per File-weisem checkout der
      # regenerierten Pfade. Diese Aenderung macht den dort dokumentierten
      # Normalfall zum Regelfall, sie fuehrt keinen neuen Zustand ein.
      #
      # Die Aufloesung laeuft VOR dem Checkout und darf den Baum deshalb nicht
      # brauchen: reine gh-API-Aufloesung. Leerer ref = Default-Verhalten (Spitze von
      # main) — nur beim manuellen Dispatch ohne source_run_id, der laut
      # Job-Kommentar ohnehin seine eigene Verantwortung traegt.
      - name: Resolve the tree this payload was produced from
        id: source_tree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            ref="$WORKFLOW_RUN_HEAD_SHA"
          elif [ -n "${SOURCE_RUN_ID:-}" ]; then
            ref="$(gh api "repos/${REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)"
          else
            ref=""
            echo "::warning::manueller Dispatch ohne source_run_id — Checkout faellt auf die Spitze von main zurueck, nicht auf den Baum, der die Nutzlast erzeugt hat."
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "resolved ref='${ref}' for event=${EVENT_NAME}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.source_tree.outputs.ref }}
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          persist-credentials: false

      # ── Python + Node setup ─────────────────────────────────────
      - name: Set up pinned Python (GitHub-hosted)
        if: needs.select-runner.outputs.runner_environment == 'github-hosted'
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve Python 3.12 interpreter
        run: |
          if [[ "${{ needs.select-runner.outputs.runner_environment }}" == "github-hosted" ]]; then
            python -c "import sys; raise SystemExit('GitHub-hosted Python bootstrap did not resolve Python 3.12.' if sys.version_info[:2] != (3, 12) else 0)"
            echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
            exit 0
          fi

          if command -v python >/dev/null 2>&1; then
            if python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"; then
              echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if command -v py >/dev/null 2>&1; then
            python_bin="$(py -3.12 -c "import sys; print(sys.executable)")"
            echo "SMC_PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
            exit 0
          fi

          # Additional fallback candidates for self-hosted Linux/macOS runners
          # that expose the interpreter under a versioned name.
          for candidate in python3.12 python3; do
            if command -v "$candidate" >/dev/null 2>&1; then
              if "$candidate" -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)" 2>/dev/null; then
                echo "SMC_PYTHON_BIN=$candidate" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          done

          echo "::error::Self-hosted runner is missing a usable Python 3.12 interpreter (tried \`python\`, \`py -3.12\`, \`python3.12\`, \`python3\`)."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Mirrors ci.yml: GHA cache backend returns HTTP 400 on the
          # Windows self-hosted runner. Disable the GHA cache layer there;
          # uv keeps its on-disk cache regardless.
          enable-cache: ${{ needs.select-runner.outputs.runner_environment == 'github-hosted' && 'true' || 'false' }}
          cache-dependency-glob: |
            requirements*.txt

      - name: Install Python dependencies
        run: |
          # F-V8-perf (2026-05-18): pip -> uv. uv installs into the same
          # interpreter site-packages (no venv needed here), preserving the
          # downstream "$SMC_PYTHON_BIN script.py" contract.
          # WF-012 (2026-05-20): on the GitHub-hosted fallback the resolved
          # interpreter has no venv; --system is required so uv installs into
          # the system site-packages instead of erroring out. Mirrors the
          # rolling-benchmark and producer workflows.
          uv pip install --python "$SMC_PYTHON_BIN" --system -r requirements.txt pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            # Fall back to package.json so the cache key stays stable even
            # if the npx probe ever changes its output format.
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        # apt install of Chromium system libs is fast on github-hosted but
        # cannot be cached across runs (apt state lives outside _work).
        # On self-hosted Windows there are no deps to install; the command
        # is a no-op so it's safe to run unconditionally.
        run: npx playwright install-deps chromium

      # ── Snapshot pre-generation state ───────────────────────────

      # ── Uebergabe aus dem Refresh-Lauf ──────────────────────────
      # `workflow_run` traegt KEINE Job-Outputs des ausloesenden Laufs. Die
      # Entscheidungen reisen deshalb als Datei im selben Artefakt wie die
      # erzeugte Bibliothek und werden hier nach $GITHUB_OUTPUT zurueckgelesen.
      # Damit haengt keine Bedingung an einer API, die sie nicht liefert.
      - name: Download refresh payload
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: smc-library-refresh.yml
          run_id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          name: refresh-payload
          path: .
          if_no_artifact_found: fail

      - name: Read refresh handoff
        id: handoff
        run: |
          set -euo pipefail
          FILE=artifacts/ci/refresh_handoff.json
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE fehlt im Uebergabe-Artefakt — der Refresh-Lauf hat nichts uebergeben."
            exit 1
          fi
          cat "$FILE"
          "$SMC_PYTHON_BIN" - "$FILE" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          # Nur bekannte Schluessel weiterreichen: ein unerwarteter Schluessel
          # aus einer aelteren Refresh-Fassung soll auffallen, nicht still
          # eine Bedingung fuellen.
          expected = ("changed", "publish_allowed", "breaking", "reason",
                      "first_failed_test", "first_failed_test_line", "refresh_date")
          missing = [k for k in expected if k not in data]
          if missing:
              raise SystemExit(f"handoff unvollstaendig, fehlend: {missing}")
          for key in expected:
              value = str(data[key]).replace("\n", " ")
              print(f"{key}={value}")
          PY

      # Ein Refresh ohne Aenderung publiziert nichts. Der Wert steht hier
      # trotzdem nicht als Job-`if`, damit ein fehlgeleiteter Aufruf im Log
      # sichtbar endet statt als "skipped" zu verschwinden.
      - name: Stop when the refresh changed nothing
        if: steps.handoff.outputs.changed != 'true'
        run: |
          echo "::notice::Refresh meldete changed=${{ steps.handoff.outputs.changed }} — nichts zu veroeffentlichen."
          exit 0

      # Fail BEFORE the first TradingView write, not after it.
      #
      # Von 2026-08-13 21:17Z bis 2026-08-14 04:51Z scheiterte dieser Workflow
      # an sechs Laeufen in Folge, und zwar jedes Mal NACH dem erfolgreichen
      # "Publish library to TradingView": die Nach-Tore fanden keine
      # Struktur-Artefakte, also wurde nichts aufgezeichnet. TradingView zog
      # dem Manifest davon (238 gegen 230 gemessen am 2026-08-14), und jeder
      # Consumer-Rollout blieb an der Drift-Pruefung haengen.
      #
      # Diese Verweigerung hat den Ausfall NICHT beendet — das tat #4693
      # (fehlende Zugangsdaten im Consumer-Re-Pin). Seit 12:30Z laeuft der
      # Publish wieder gruen, aber provider_health meldet in genau diesen
      # gruenen Laeufen weiter 84 MISSING_ARTIFACT; blockierend ist es nur
      # deshalb nicht, weil `daily_export_absent` das Gate herabstuft
      # ("producer export for this run's date is not published yet", gemessen
      # in Lauf 31823202979). Die fehlende Uebergabe ist also unveraendert da
      # und wird von einer unabhaengigen Bedingung verdeckt. Genau deshalb
      # steht die Pruefung hier: sie ist an die Uebergabe gebunden, nicht an
      # das Wetter der Nach-Tore.
      #
      # Die Verweigerung haengt am MARKER des Refresh, nicht an einem
      # Kreuzvergleich gegen structure_artifact_availability.json. Der
      # Unterschied ist nicht kosmetisch: dieser Job checkt die Spitze von main
      # aus, nicht den Baum des Refresh, der seine Nutzlast erzeugt hat (7 von
      # 7 workflow_run-Publishes am 2026-08-14). Eine Verweigerung, die nur auf
      # den Verfuegbarkeitsbericht schaut, wuerde deshalb jede Nutzlast eines
      # Refresh VOR dieser Aenderung ablehnen — und bei stuendlicher Kadenz und
      # bis zu drei Stunden Refresh-Laufzeit sind davon staendig mehrere
      # unterwegs. Der Marker macht die Uebergabe selbstsynchronisierend:
      # geschrieben vom selben Schritt, der sie hochlaedt, also koennen Absicht
      # und Inhalt nicht auseinanderlaufen. Kein Marker = aeltere Nutzlast als
      # der Vertrag: warnen und weiterfahren.
      - name: Refuse to publish without the handed-over structure artifacts
        run: |
          set -euo pipefail
          "$SMC_PYTHON_BIN" - <<'PY'
          import json
          import pathlib
          import sys

          marker = pathlib.Path("artifacts/ci/structure_artifact_handover.json")
          if not marker.exists():
              print(
                  f"::warning::{marker} fehlt — diese Uebergabe stammt von einem Refresh "
                  "vor dem Handover-Vertrag. Keine Verweigerung, aber die Nach-Tore "
                  "koennen die Struktur-Artefakte verfehlen."
              )
              sys.exit(0)

          declared = json.loads(marker.read_text(encoding="utf-8"))
          directory = pathlib.Path(declared["directory"])
          arrived = [path for path in directory.rglob("*") if path.is_file()] if directory.is_dir() else []

          print(f"Refresh uebergab {declared['file_count']} Dateien in {directory}; angekommen: {len(arrived)}.")

          if len(arrived) < int(declared["file_count"]):
              print(
                  f"::error::Der Refresh hat {declared['file_count']} Struktur-Artefakte "
                  f"uebergeben, angekommen sind {len(arrived)}. Ohne sie scheitern die "
                  "Nach-Tore NACH dem Publish und die Veroeffentlichung waere nicht "
                  "aufzeichenbar. Siehe den Upload-Kommentar in smc-library-refresh.yml."
              )
              sys.exit(1)
          PY

      - name: Restore sufficiently deep Databento production export bundle
        id: restore_export_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.handoff.outputs.refresh_date }}
          DATABENTO_MIN_TRADE_DAYS: "15"
        run: |
          set -euo pipefail
          "$SMC_PYTHON_BIN" scripts/restore_databento_export_bundle.py

      - name: Flatten downloaded Databento export bundle
        id: flatten_export_bundle
        if: |
          steps.restore_export_bundle.outputs.found_artifact == 'true'
        run: |
          set -euo pipefail
          ROOT=artifacts/smc_microstructure_exports
          shopt -s nullglob
          # Only flatten subdirs whose name matches the producer artifact-name
          # convention (smc-databento-production-export-YYYY-MM-DD-<runid>).
          # This keeps unrelated co-located subdirs (none today, but defensive)
          # untouched.
          moved=0
          overwritten=0
          for sub in "$ROOT"/smc-databento-production-export-*; do
            [ -d "$sub" ] || continue
            echo "==> Flattening $sub"
            for entry in "$sub"/* "$sub"/.[!.]*; do
              [ -e "$entry" ] || continue
              base=$(basename "$entry")
              if [ -e "$ROOT/$base" ]; then
                echo "::notice::Producer bundle overrides local working-set copy: $ROOT/$base"
                overwritten=$((overwritten + 1))
              fi
              mv -f "$entry" "$ROOT/$base"
              moved=$((moved + 1))
            done
            rmdir "$sub"
          done
          echo "==> Flattened $moved entries ($overwritten overwrote a local working-set copy)"
          echo "moved_entries=$moved" >> "$GITHUB_OUTPUT"
          echo "overwritten_entries=$overwritten" >> "$GITHUB_OUTPUT"

      - name: Verify Databento production export bundle is present
        env:
          REFRESH_DATE: ${{ steps.handoff.outputs.refresh_date }}
        id: verify_export_bundle
        run: |
          set -euo pipefail
          if ls artifacts/smc_microstructure_exports/databento_volatility_production_*_manifest.json >/dev/null 2>&1; then
            echo "bundle_present=true" >> "$GITHUB_OUTPUT"
            NEWEST=$(ls -1t artifacts/smc_microstructure_exports/databento_volatility_production_*_manifest.json | head -1)
            echo "::notice::Restored Databento production manifest: ${NEWEST}"
            # The glob above carries no date, so it is satisfied by ANY manifest
            # of any age -- while the message this step prints names
            # ${REFRESH_DATE}. That gap is what let the 2026-08-14 night runs
            # pass here on a day-old bundle and then die in the release gates on
            # MISSING_ARTIFACT. Read the date the manifest actually covers.
            # Schema-Drift laut, Nachtmodus leise: has() zuerst -- der
            # Exporter emittiert trade_dates_covered UNBEDINGT
            # (scripts/databento_production_export.py, Manifest-Builder),
            # Fehlen heisst also Umbenennung oder Korruption, nie "noch kein
            # Export". Mit `// []` hinter 2>/dev/null liefen die Release-Gates
            # nach einem Rename fuer immer im --daily-export-absent-Nachtmodus,
            # gruen -- Sweep-Fund 2026-08-15, dieselbe Klasse wie #4738/#4743.
            # Ein korruptes Manifest scheitert bereits am has()-Parse, laut.
            if ! jq -e 'has("trade_dates_covered")' "${NEWEST}" >/dev/null; then
              echo "::error::${NEWEST} carries no trade_dates_covered -- exporter schema drift or a corrupt manifest, not a pending export; refusing to soften the release gates."
              exit 1
            fi
            if jq -e --arg d "${REFRESH_DATE}" \
                 '.trade_dates_covered | index($d) != null' \
                 "${NEWEST}" >/dev/null; then
              echo "bundle_for_date=true" >> "$GITHUB_OUTPUT"
            else
              echo "bundle_for_date=false" >> "$GITHUB_OUTPUT"
              # NOT an error: outside data hours the producer simply has not run
              # for this date yet. The release gates are told so explicitly and
              # downgrade their data-absent failures instead of blocking the
              # consumer re-pin and the commit that sit behind them.
              echo "::notice::Databento bundle does not cover ${REFRESH_DATE} yet — release gates run with --daily-export-absent."
            fi
            exit 0
          fi
          # F-V5-D1 (2026-05-01): automated consumers MUST not generate or
          # publish against a stale / missing producer bundle. Hard-fail
          # with a clickable annotation that points at the upstream workflow
          # so triage starts in the right place.
          echo "bundle_present=false" >> "$GITHUB_OUTPUT"
          echo "::error file=.github/workflows/smc-databento-production-export-sharded.yml::Producer artifact missing for ${REFRESH_DATE}; refresh aborted. Re-run smc-databento-production-export-sharded and then re-trigger smc-library-refresh."
          exit 1

      # ── Provider credential preflight ───────────────────────────
      # Gate generation on provider credential health so a delinquent
      # Databento invoice (HTTP 402) or a missing/expired key fails fast
      # here instead of burning ~2.5h of generation before the runner is
      # shut down (see run #412). Shares scripts/credential_health_check.py
      - name: Write TradingView storage state
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          mkdir -p automation/tradingview/auth
          "$SMC_PYTHON_BIN" - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET']
          trimmed = raw.strip()
          if not trimmed:
            raise SystemExit('TV_STORAGE_STATE secret is empty')

          if trimmed.startswith('{'):
            payload = trimmed
          else:
            try:
              payload = gzip.decompress(base64.b64decode(trimmed)).decode('utf-8')
            except Exception as exc:
              raise SystemExit(f'TV_STORAGE_STATE is neither raw JSON nor gzip+base64: {exc}')

          try:
            json.loads(payload)
          except json.JSONDecodeError as exc:
            raise SystemExit(f'Invalid TV_STORAGE_STATE JSON payload: {exc}')

          output_path = Path('automation/tradingview/auth/storage-state.json')
          output_path.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Validate TradingView storage state JSON
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        run: |
          "$SMC_PYTHON_BIN" - <<'PY'
          import json
          from pathlib import Path

          path = Path("automation/tradingview/auth/storage-state.json")
          try:
              json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid TV_STORAGE_STATE JSON in {path}: {exc}")
          PY

      - name: Run TradingView readonly preflight
        id: tv_preflight
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          TV_STEP_TIMEOUT_MS: "90000"
          TV_PREFLIGHT_MAX_ATTEMPTS: "3"
          TV_SCREENSHOT_DIR: artifacts/tradingview/screenshots
        run: |
          # Retry wrapper: TV/Playwright steps occasionally flake (e.g. addCurrentScriptToChart
          # timing out while the chart iframe is still hydrating). Retry the whole preflight
          # process up to TV_PREFLIGHT_MAX_ATTEMPTS with exponential backoff before failing
          # the job, so a single transient browser hiccup does not silently re-stall the
          # publish pipeline (see PR #2415 for the surfacing fix that exposed this flake).
          #
          # Bundle B telemetry: emit one JSONL line per attempt to
          # artifacts/tradingview/preflight_retry_log.jsonl and preserve each
          # attempt's preflight JSON as tv_preflight_ci.attempt_${n}.json so a
          # post-mortem can distinguish "1x flake then green" from "3x identical
          # deterministic failure = real DOM drift" without parsing log strings.
          set +e
          mkdir -p artifacts/tradingview
          retry_log="artifacts/tradingview/preflight_retry_log.jsonl"
          : > "$retry_log"
          max_attempts="${TV_PREFLIGHT_MAX_ATTEMPTS:-3}"
          attempt=1
          backoff=10
          status=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::TradingView readonly preflight (attempt ${attempt}/${max_attempts})"
            started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns=$(date +%s)
            npx tsx scripts/tv_preflight.ts \
              --config automation/tradingview/preflight-smc-mainline-open-only.json \
              --execution-mode readonly \
              --out artifacts/tradingview/tv_preflight_ci.json
            status=$?
            end_ns=$(date +%s)
            ended_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            duration=$(( end_ns - start_ns ))
            preserved="artifacts/tradingview/tv_preflight_ci.attempt_${attempt}.json"
            if [ -f artifacts/tradingview/tv_preflight_ci.json ]; then
              cp artifacts/tradingview/tv_preflight_ci.json "$preserved"
            else
              preserved=""
            fi
            echo "::endgroup::"
            will_retry="false"
            if [ "$status" -ne 0 ] && [ "$attempt" -lt "$max_attempts" ]; then
              will_retry="true"
            fi
            env A="$attempt" M="$max_attempts" S="$status" SA="$started_at" EA="$ended_at" D="$duration" P="$preserved" WR="$will_retry" \
              python -c "import json,os,sys; json.dump({'attempt':int(os.environ['A']),'max_attempts':int(os.environ['M']),'exit_code':int(os.environ['S']),'started_at':os.environ['SA'],'ended_at':os.environ['EA'],'duration_seconds':int(os.environ['D']),'output_preserved_as':os.environ['P'] or None,'will_retry':os.environ['WR']=='true'}, sys.stdout); sys.stdout.write('\n')" \
              >> "$retry_log"
            if [ "$status" -eq 0 ]; then
              echo "preflight succeeded on attempt ${attempt}"
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning title=TradingView preflight flake::attempt ${attempt} failed (exit ${status}); retrying in ${backoff}s"
              sleep "$backoff"
              backoff=$(( backoff * 3 ))
            fi
            attempt=$(( attempt + 1 ))
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=TradingView preflight failed::All ${max_attempts} attempts failed (last exit ${status})"
            # Emit a compact summary so a reader can immediately tell flake vs
            # deterministic-failure without downloading the artifact bundle.
            if [ -f "$retry_log" ]; then
              {
                echo ""
                echo "### TradingView preflight retry log"
                echo ""
                echo '```jsonl'
                cat "$retry_log"
                echo ''
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit "$status"

      - name: Publish library to TradingView
        id: publish
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          # 2026-07-22: 90000 -> 240000. The publish step loads the generated
          # library into the TradingView Pine editor and adds it to a chart.
          # A provider-enriched library is ~83 KB (UNIVERSE_TICKERS carries
          # ~6900 symbols) vs ~13.6 KB for the static one — 6x the content to
          # write and compile. Two consecutive enriched publishes (runs
          # 29938507420, 29942451978) died at EXACTLY the 90 s budget inside
          # addCurrentScriptToChart, while the last static publish passed.
          # The readonly preflight keeps 90000 (it writes nothing); only this
          # write step gets the larger budget. The 240-min job cap still bounds
          # a genuine hang.
          TV_STEP_TIMEOUT_MS: "240000"
          # 2026-07-31 (issue #4238): the 2026-07-13 incident fix — point failure
          # screenshots at the uploaded tree — was applied to the readonly
          # preflight and the post-release validation, but NOT to this step, the
          # one that has been failing since 2026-07-30. Its screenshots kept
          # landing in the default automation/tradingview/reports/screenshots,
          # which the artifact upload (artifacts/tradingview/) never captures, so
          # the publish outage shipped no image of itself at all.
          TV_SCREENSHOT_DIR: artifacts/tradingview/screenshots
        run: |
          npx tsx scripts/tv_publish_micro_library.ts \
            --manifest pine/generated/smc_micro_profiles_generated.json \
            --core SMC_Long_Dip_Suite.pine \
            --release-manifest artifacts/tradingview/library_release_manifest.json

      - name: Run TradingView post-release validation
        id: tv_post_release_raw
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        # CONTINUE-ON-ERROR-INTENTIONAL: TV automation is flaky external integration;
        # outcome is consumed by downstream alert step (steps.tv_post_release_raw.outcome)
        # rather than treated as hard fail.
        continue-on-error: true
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          # Incident 2026-07-13: failure screenshots default to
          # automation/tradingview/reports/screenshots, which the artifact
          # upload (artifacts/tradingview/ glob) never captured — the drift
          # diagnosis had to be reproduced locally. Point them at the
          # uploaded tree so every failure ships its screenshot evidence.
          TV_SCREENSHOT_DIR: artifacts/tradingview/screenshots
        run: |
          npx tsx scripts/tv_preflight.ts \
            --config automation/tradingview/preflight-smc-mainline.json \
            --execution-mode readonly \
            --out artifacts/tradingview/tv_post_release_validation.json

      - name: "⚠️ Warn: Run TradingView post-release validation"
        if: always() && steps.tv_post_release_raw.outcome == 'failure'
        run: |
          echo "::warning::Step 'Run TradingView post-release validation' failed silently (soft-fail step)"

      - name: Best-effort normalize TradingView post-release validation
        id: tv_post_release
        if: always() && steps.publish.outcome == 'success' && steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        # CONTINUE-ON-ERROR-INTENTIONAL: the normalizer emits the canonical post-release verdict; fail-on gate enforces blocking statuses later.
        continue-on-error: true
        run: |
          if "$SMC_PYTHON_BIN" scripts/run_smc_post_release_validation.py \
              --release-manifest artifacts/tradingview/library_release_manifest.json \
              --validation-report artifacts/tradingview/tv_post_release_validation.json \
              --ci-mode \
              --output artifacts/ci/smc_post_release_validation_report.json; then
            _normalizer_rc=0
          else
            _normalizer_rc=$?
          fi
          "$SMC_PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("artifacts/ci/smc_post_release_validation_report.json")
          if not report_path.exists():
            print("::warning::Post-release validation normalizer did not write a report")
            raise SystemExit(0)

          try:
            report = json.loads(report_path.read_text(encoding="utf-8"))
          except Exception as exc:
            print(f"::warning::Post-release validation report is unreadable: {exc}")
            raise SystemExit(0)

          classification = report.get("failure_classification") if isinstance(report, dict) else {}
          failures = report.get("failures") if isinstance(report, dict) else []
          primary = classification.get("primary_blocker") if isinstance(classification, dict) else None
          codes = [
            str(item.get("code"))
            for item in failures
            if isinstance(item, dict) and item.get("code")
          ]
          status = report.get("overall_status", "unknown") if isinstance(report, dict) else "unknown"
          print(f"Post-release validation normalized status: {status}")
          if primary:
            print(f"Post-release validation primary blocker: {primary}")
          if codes:
            print(f"Post-release validation failure codes: {', '.join(codes)}")
          with Path.cwd().joinpath("artifacts/ci/post_release_summary.txt").open("w", encoding="utf-8") as handle:
            handle.write(f"status={status}\n")
            if primary:
              handle.write(f"primary_blocker={primary}\n")
            if codes:
              handle.write(f"failure_codes={','.join(codes)}\n")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
            with open(step_summary, "a", encoding="utf-8") as summary:
              summary.write("### TradingView post-release normalization\n\n")
              summary.write(f"- Status: `{status}`\n")
              if primary:
                summary.write(f"- Primary blocker: `{primary}`\n")
              if codes:
                summary.write(f"- Failure codes: `{', '.join(codes)}`\n")
          PY
          exit "${_normalizer_rc}"

      - name: Run strict release gates
        id: release_gates
        if: always() && steps.publish.outcome == 'success' && steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          BUNDLE_FOR_DATE: ${{ steps.verify_export_bundle.outputs.bundle_for_date }}
        run: |
          # Only when the producer has not published THIS run's date yet. Any
          # other value -- including an empty one, which means the check above
          # did not run -- keeps every gate blocking.
          extra=()
          if [ "${BUNDLE_FOR_DATE}" = "false" ]; then
            extra+=(--daily-export-absent)
          fi
          "$SMC_PYTHON_BIN" scripts/run_smc_release_gates.py \
            --post-release-validation-report artifacts/ci/smc_post_release_validation_report.json \
            --measurement-baseline-summary reports/smc_measurement_baseline_summary.json \
            ${extra[@]+"${extra[@]}"} \
            --output artifacts/ci/smc_post_release_gates_report.json

      - name: Refresh gate evidence summary after post-release validation
        if: always()
        run: |
          "$SMC_PYTHON_BIN" scripts/collect_smc_gate_evidence.py \
            --input-glob "artifacts/ci/smc_*_report.json" \
            --output artifacts/ci/smc_refresh_evidence_summary.json

      - name: Extract provider health signals
        if: always()
        run: |
          "$SMC_PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path

          alerts: list[dict] = []
          warnings: list[dict] = []
          report = {}
          for report_path in (
            Path("artifacts/ci/smc_post_release_gates_report.json"),
            Path("artifacts/ci/smc_pre_release_gates_report.json"),
            Path("artifacts/ci/smc_release_gates_report.json"),
          ):
            if not report_path.exists():
              continue
            try:
              loaded = json.loads(report_path.read_text(encoding="utf-8"))
            except Exception:
              continue
            if isinstance(loaded, dict):
              report = loaded
              break

          if report:
            for gate in report.get("gates", []):
              if isinstance(gate, dict) and gate.get("name") == "provider_health":
                details = gate.get("details", {})
                if isinstance(details, dict):
                  raw_alerts = details.get("domain_alerts", [])
                  if isinstance(raw_alerts, list):
                    alerts = [item for item in raw_alerts if isinstance(item, dict)]
                  raw_warnings = details.get("warnings", [])
                  if isinstance(raw_warnings, list):
                    warnings = [item for item in raw_warnings if isinstance(item, dict)]
                break

          def summarize(alert: dict) -> str:
            code = str(alert.get("code") or "")
            domain = str(alert.get("domain") or "unknown")
            symbol = str(alert.get("symbol") or "?")
            timeframe = str(alert.get("timeframe") or "?")
            planned = str(alert.get("planned_source") or "")
            actual = str(alert.get("actual_source") or "")
            status = str(alert.get("status") or "")
            if code.startswith("FALLBACK_"):
              detail = f"{actual or 'unknown'} <- {planned or 'unknown'}"
            else:
              detail = status or "unknown"
            return f"- {code}: {domain} {symbol}/{timeframe} ({detail})"

          def summarize_warning(row: dict) -> str:
            code = str(row.get("code") or "UNKNOWN")
            symbol = str(row.get("symbol") or "").strip()
            timeframe = str(row.get("timeframe") or "").strip()
            suffix = f" {symbol}/{timeframe}" if symbol and timeframe else ""
            return f"- {code}:{suffix}" if suffix else f"- {code}"

          info_count = sum(1 for item in alerts if str(item.get("severity") or "") == "info")
          warn_count = sum(1 for item in alerts if str(item.get("severity") or "") == "warn")
          rendered_lines = "\n".join(summarize(item) for item in alerts[:5])
          rendered_warning_lines = "\n".join(summarize_warning(item) for item in warnings[:5])

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
            handle.write(f"PROVIDER_DOMAIN_ALERT_COUNT={len(alerts)}\n")
            handle.write(f"PROVIDER_DOMAIN_INFO_COUNT={info_count}\n")
            handle.write(f"PROVIDER_DOMAIN_WARN_COUNT={warn_count}\n")
            handle.write(f"PROVIDER_HEALTH_WARNING_COUNT={len(warnings)}\n")
            handle.write("PROVIDER_DOMAIN_ALERT_LINES<<EOF\n")
            if rendered_lines:
              handle.write(rendered_lines + "\n")
            handle.write("EOF\n")
            handle.write("PROVIDER_HEALTH_WARNING_LINES<<EOF\n")
            if rendered_warning_lines:
              handle.write(rendered_warning_lines + "\n")
            handle.write("EOF\n")
          PY

      # ── Version bump + commit (skip when unchanged or breaking) ─
      - name: Bump library version in all pine consumers
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        env:
          # The checkout runs with persist-credentials: false, so `origin`
          # carries NO credentials and a bare `git fetch origin main` dies with
          # "could not read Username for 'https://github.com'" -- exit 128,
          # measured 2026-08-14 in run 31793906137. The fetch arrived with
          # #4653 (read consumers from current main, not from a day-old tree)
          # and could not run until now: the TradingView queue was saturated,
          # so this step never once reached a runner after that merge.
          #
          # Same explicit-token-URL seam the reattest step and "Commit and push
          # changes" already use, rather than mutating the remote for the rest
          # of the job.
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          # Incident 2026-07-13: the generator manifest's library_version is a
          # HARDCODED constant (1) — it never reflected TradingView's real,
          # per-publish-incrementing version. Repinning from it rewrote every
          # consumer to /1 (the 2026-03-23 first publish) on every refresh, so
          # consumers compiled against a 15KB March library while TV was at
          # v152 — CE10272 "Undeclared identifier" on every modern mp.* symbol.
          # Read the REAL published version from the publisher's release
          # manifest instead (written fresh by the publish step this run,
          # facade-verified since the same incident).
          NEW_VERSION=$(jq -r '.library.publishedVersion' artifacts/tradingview/library_release_manifest.json)
          if [ -z "${NEW_VERSION}" ] || [ "${NEW_VERSION}" = "null" ]; then
            echo "::error::library.publishedVersion missing or null in artifacts/tradingview/library_release_manifest.json — refusing to repin consumers."
            exit 1
          fi
          if ! [[ "${NEW_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::library.publishedVersion '${NEW_VERSION}' is not an integer — refusing to repin consumers."
            exit 1
          fi
          # /1 is the known-stale sentinel of the pre-incident evidence chain
          # (self-referential UI parsing yielded expected==published==1). A
          # modern publish can never legitimately be version 1 again — treat
          # it as broken evidence and SKIP the repin (keep current pins)
          # rather than regressing every consumer back to the March library.
          if [ "${NEW_VERSION}" = "1" ]; then
            echo "::warning::library.publishedVersion is 1 (stale-evidence sentinel) — skipping consumer repin to avoid regressing pins to the 2026-03 library."
            exit 0
          fi
          PIN_PATTERN='import preuss_steffen/smc_micro_profiles_generated/[0-9]*'
          REPLACEMENT="import preuss_steffen/smc_micro_profiles_generated/${NEW_VERSION}"
          # Enumerate every top-level .pine that pins the library. Fixture
          # and generated paths are excluded — they have their own
          # snapshot flow. Closes the 2026-04-22 gap where only
          # SMC_Long_Dip_Suite.pine was repinned, leaving 13 other
          # consumers stranded on the previous library version.
          #
          # Vorfall 2026-08-12 (PR #4646, Lauf 1192): Liste UND Inhalt kommen
          # ab jetzt vom AKTUELLEN main, nicht aus dem Arbeitsbaum. Dieser Lauf
          # checkt `main` beim Start aus und läuft bis zu einem Tag weiter — er
          # wartet auf den TradingView-Publish. Committet er die Consumer danach
          # VOLLSTÄNDIG aus diesem Arbeitsbaum, steht alles, was inzwischen an
          # ihnen gemergt wurde, als Rücknahme im Commit. Genau so verschwand
          # die Entfernung des Operator-Vokabulars aus vier Kundenoberflächen
          # (#4639) 59 Sekunden nach ihrem Merge wieder — ungesehen, weil
          # bot/*-PRs die schweren Gates überspringen und automatisch mergen.
          # BUMP_REMOTE is a test seam (unset in CI), the same one the reattest
          # and fast-forward steps use, so the fragment can be executed against
          # a real local repository instead of only being read.
          git fetch --quiet "${BUMP_REMOTE:-https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}" main
          mapfile -t PINE_CONSUMERS < <(git grep -lE "${PIN_PATTERN}" FETCH_HEAD -- \
            '*.pine' \
            ':(exclude)tests/**' \
            ':(exclude)pine/**' \
            ':(exclude)node_modules/**' | sed 's|^FETCH_HEAD:||' | sort -u)
          if [ ${#PINE_CONSUMERS[@]} -eq 0 ]; then
            echo "::error::No pine consumers found for library pin. Refusing to proceed."
            exit 1
          fi
          git checkout FETCH_HEAD -- "${PINE_CONSUMERS[@]}"
          echo "Pinning ${#PINE_CONSUMERS[@]} pine consumers to library ${NEW_VERSION}:"
          printf '  %s\n' "${PINE_CONSUMERS[@]}"
          for f in "${PINE_CONSUMERS[@]}"; do
            sed -i "s|${PIN_PATTERN}|${REPLACEMENT}|g" "$f"
            if ! grep -qF "${REPLACEMENT}" "$f"; then
              echo "::error::Failed to pin ${f} to library version ${NEW_VERSION}."
              exit 1
            fi
          done
          # Die Zusage, die der Lauf über sich selbst BEWEISEN muss: an einer
          # Kundenoberfläche ändert er die Pin-Zeile und sonst nichts. Der
          # Rückgriff auf FETCH_HEAD oben macht das wahr; diese Prüfung macht
          # es nachweisbar — und lässt den Lauf abbrechen statt still eine
          # fremde Änderung zu überschreiben, falls je wieder ein Schritt
          # dazwischen an diesen Dateien schreibt.
          # Prüflogik und Fälle: scripts/check_pine_consumer_repin.py,
          # tests/test_pine_consumer_repin_guard.py.
          PIN_BASE="${RUNNER_TEMP}/pin-base"
          rm -rf "${PIN_BASE}"
          for f in "${PINE_CONSUMERS[@]}"; do
            mkdir -p "${PIN_BASE}/$(dirname "$f")"
            git show "FETCH_HEAD:$f" > "${PIN_BASE}/$f"
          done
          "$SMC_PYTHON_BIN" scripts/check_pine_consumer_repin.py \
            --base-dir "${PIN_BASE}" \
            --expected-version "${NEW_VERSION}" \
            "${PINE_CONSUMERS[@]}"
          # The core-import SNIPPET is a copy-paste example users paste into a
          # chart, so its `import .../N as mp` must track the PUBLISHED version
          # like any consumer. It lives under the excluded pine/ tree (the
          # generated LIBRARY file there has its own version and must NOT be
          # touched), so the enumeration above skips it — repin it explicitly.
          # It regenerates to /1 (generation runs BEFORE publish, so the real
          # version is unknown then) and was never bumped afterward: the
          # pine-library-version-monitor (2026-07-13) caught the resulting
          # /1-vs-published skew.
          SNIPPET="pine/generated/smc_micro_profiles_core_import_snippet.pine"
          if [ -f "${SNIPPET}" ] && grep -qE "${PIN_PATTERN}" "${SNIPPET}"; then
            sed -i "s|${PIN_PATTERN}|${REPLACEMENT}|g" "${SNIPPET}"
            if ! grep -qF "${REPLACEMENT}" "${SNIPPET}"; then
              echo "::error::Failed to pin snippet ${SNIPPET} to library version ${NEW_VERSION}."
              exit 1
            fi
            echo "Pinned core-import snippet ${SNIPPET} to library ${NEW_VERSION}."
          fi

      # ── R1 attestation notice ───────────────────────────────────
      # The bump above repins EVERY pine consumer, and SMC_Event_Overlay.pine is
      # one of them. It is also one of the two Pine sources
      # scripts/smc_r1_rollout_contract.py hashes into the R1 rollout contract
      # and compares against a dated evidence artifact, so this refresh can —
      # and twice did — kill the attestation: #4284 (2026-08-01, repaired four
      # hours later by the manual re-attestation PR #4290) and #4371
      # (2026-08-04, unnoticed; main stayed red on
      # tests/test_check_tv_unattested_sources.py for the next unrelated PR).
      #
      # Drift is reported, never blocked. The library bump is legitimate and
      # must still produce its PR; what was missing is that the run told nobody
      # the attestation had died, so the required operator follow-up (a live
      # TradingView re-attestation, which no automation can perform) was
      # invisible. The run_pine_guard arm in smc-fast-pr-gates.yml (#4376) is
      # what stops the resulting PR merging silently: a pine touch now pulls
      # the checkout and "Guard R1-attested sources" onto the bot PR, without
      # dragging in the whole heavy suite.
      #
      # NO verdict this step reaches fails it. Not drift, not a crash, not an
      # empty roster. The only way this step can go red is if writing
      # $GITHUB_STEP_SUMMARY / $GITHUB_ENV itself fails, which is a runner
      # fault rather than anything this check concluded.
      #
      # That is deliberate, and the cost of the alternative is larger than
      # "the refresh PR is lost". Step order in job `refresh`: `Publish library
      # to TradingView` is 37, this notice is 45, `Commit and push changes` is
      # 46 — and the commit step's `if:` carries an implicit success(). A fatal
      # exit here therefore leaves the library PUBLISHED to TradingView with
      # the repo pins never committed: the 2026-07-13 divergence class the
      # commit step's own comment block documents ("~6 weeks committed !=
      # published, run green"). Under GitHub's default `bash -e` any uncaught
      # non-zero exit would do exactly that, so the handling below is what
      # keeps this comment true.
      #
      # Nothing green is printed on a failure path either, which is the part
      # that actually matters. An empty or short roster does NOT print
      # "Checked 0 attested source(s) … still describes them" — a green
      # all-clear that would survive indefinitely because it is
      # indistinguishable from success. It goes through the same
      # "## R1 attestation check could not run" report as a raised exception:
      # loud, in the job summary AND in the PR body, saying the attestation is
      # UNKNOWN rather than intact. The floor itself is pinned by
      # tests/test_fast_gates_attested_pine_coverage.py, which imports the same
      # MIN_ATTESTED_SOURCES rather than re-typing the number.
      #
      # That test does NOT run on every pull request, and saying so here was
      # wrong. It sits in the "Run pin / ledger drift guard" step of
      # smc-fast-pr-gates.yml, and that step is gated
      # `if: steps.gate.outputs.run_heavy == 'true'` — which is precisely false
      # for the `bot/library-refresh-*` PR this workflow opens, whose diff is
      # data-only. Being listed in that step's file list, in
      # tests/_fast_inventory.py and in the silent-skip coverage test puts a
      # file INTO the step; none of the three makes the step run. What does run
      # on those PRs is #4376's `run_pine_guard` arm, which pulls in the
      # checkout plus `Guard R1-attested sources` and nothing else. Adding a
      # contract target touches a .py file, so the floor pin does run for its
      # own trigger — the claim was too broad, not inverted.
      #
      # The roster is DERIVED from the contract, never hand-listed here, so a
      # third attested source joins this notice automatically — the same rule
      # tests/test_fast_gates_attested_pine_coverage.py enforces for the
      # run_pine_guard arm, whose trigger is path-shaped and therefore blind to
      # an attested target registered outside *.pine / pine/generated/*.
      # It is derived UNFILTERED, matching that test: every contract target is
      # hashed, so every target un-attests the rollout when it changes,
      # whatever its extension.
      #
      # The resolution prose is IMPORTED from
      # scripts/check_tv_unattested_sources.RESOLUTION, not re-typed. Two
      # producers report this same drift and a hand-copy here would go stale the
      # first time a resolution path changes — the defect class this PR exists
      # to close, applied to prose instead of to a file list.
      # Runs BEFORE the drift report, deliberately. The report answers "did
      # this run rewrite an attested source"; holding first makes the honest
      # answer no, so the PR it opens is mergeable and auto-merge fires as it
      # did before 2026-08-04. Ordering the other way would leave the report
      # describing a rewrite that no longer reaches the commit.
      #
      # Why hold rather than re-attest: evidence costs a mutating TradingView
      # session, and the export chain fires 9x per weekday. Measured 2026-08-04
      # -- #4405 (pin /184) and #4429 (/185) both open with a third run
      # generating /186, none of them mergeable, where the same PRs merged in
      # ~35s before the guard existed. An attested companion moves only in a
      # deliberate re-attestation PR; everything else advances here.
      - name: Hold R1-attested sources at their attested content
        id: r1_hold
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        run: '"$SMC_PYTHON_BIN" -m scripts.hold_r1_attested_sources'

      - name: Report R1 attestation drift caused by this refresh
        id: r1_attestation
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        run: |
          "$SMC_PYTHON_BIN" - <<'PY'
          import os
          import subprocess
          import traceback

          GUARD = "tests/test_check_tv_unattested_sources.py::test_the_guard_reads_the_registered_evidence_not_a_second_copy"

          def cannot_run(reason: str, detail: str) -> str:
            """The ONE report for every path that did not reach a verdict.

            Crash and vacuous-roster share it on purpose: both mean the
            attestation state is unknown, and neither may render as an
            all-clear. Nothing green is printed on either path.
            """
            return (
              "## R1 attestation check could not run\n"
              "\n"
              f"{reason}\n"
              "\n"
              "This refresh could NOT determine whether it invalidated an R1-attested\n"
              "source, so treat the attestation as UNKNOWN, not as intact. Run\n"
              f"`{GUARD}`\n"
              "against this branch before merging.\n"
              "\n"
              "```\n"
              f"{detail}"
              "```\n"
            )

          try:
            from scripts.check_tv_unattested_sources import (
              RESOLUTION,
              drifted_attested_targets,
            )
            from scripts.smc_r1_rollout_contract import (
              EXECUTION_EVIDENCE,
              MIN_ATTESTED_SOURCES,
              ROOT,
              build_rollout_contract,
            )

            attested = sorted({str(t["path"]) for t in build_rollout_contract()["targets"]})
            evidence = EXECUTION_EVIDENCE.relative_to(ROOT).as_posix()
            # DISTINCT PATHS, while MIN_ATTESTED_SOURCES is a floor on contract
            # TARGETS. Two targets can name one file, so paths <= targets: this
            # comparison can only be stricter than intended, never looser. It
            # may raise a false "vacuous roster" — which reports UNKNOWN and
            # costs a look — and can never wave through a roster that really
            # collapsed. The safe direction, deliberately.
            floor = MIN_ATTESTED_SOURCES
            roster_ok = len(attested) >= floor

            # The roster is checked BEFORE the diff, not after, and on
            # `attested` itself rather than only on the floor. `git diff
            # --name-only HEAD -- <paths>` with an EMPTY path list is not "no
            # files" — the pathspec vanishes and git answers about every file
            # in the tree, so the step would report the whole repository as
            # rewritten attested sources. Guarding on the floor alone would
            # leave that reachable the day MIN_ATTESTED_SOURCES is set to 0,
            # which is exactly when nobody is watching this step.
            stale: list[str] = []
            drifted: list[str] = []
            if attested and roster_ok:
              diff = subprocess.run(
                ["git", "diff", "--name-only", "HEAD", "--", *attested],
                capture_output=True,
                text=True,
                check=True,
              )
              stale = sorted(line.strip() for line in diff.stdout.splitlines() if line.strip())
              # The second, INDEPENDENT question. `stale` answers "did this run
              # rewrite an attested source"; it says nothing about whether the
              # registered evidence still describes them, and an empty git diff
              # was previously published as if it answered both. It cannot: the
              # rollout can already be un-attested when this run starts — #4371
              # did exactly that and sat unnoticed for hours. So compare the
              # hashes too, using the guard that owns the comparison rather
              # than re-deriving it here, which would measure one
              # implementation against another instead of against the evidence.
              drifted = sorted(item["path"] for item in drifted_attested_targets())
          except Exception:
            detail = traceback.format_exc()
            print("::error::R1 attestation check could not run; see the job summary")
            print(detail)
            summary = cannot_run("The derivation raised.", detail)
            # The PR body gets the SAME verdict without the traceback. A
            # traceback carries the runner's absolute checkout path and
            # whatever a frame happened to interpolate, and the PR body is
            # public and unbounded in width — while the job summary and the run
            # log, which do carry it, are not. The reviewer still learns the
            # attestation is UNKNOWN and where to look.
            notice = cannot_run(
              "The derivation raised.",
              "The traceback is in this run's job summary and log.\n",
            )
          else:
            if not roster_ok:
              # NOT an all-clear. A roster that observed nothing would otherwise
              # print "Checked 0 attested source(s) … still describes them",
              # which is indistinguishable from success and would survive
              # indefinitely. Reported as unknown, exactly like a crash — and,
              # exactly like a crash, without failing the step and stranding a
              # published library on uncommitted pins.
              print(
                f"::error::derived {len(attested)} attested source(s) from "
                f"scripts/smc_r1_rollout_contract.py (expected at least {floor}) — "
                "refusing to report a vacuous R1 all-clear"
              )
              summary = notice = cannot_run(
                f"Derived only {len(attested)} attested source(s) from "
                f"scripts/smc_r1_rollout_contract.py; expected at least {floor}. "
                "Refusing to report a vacuous R1 all-clear.",
                "".join(f"{path}\n" for path in attested) or "(empty roster)\n",
              )
            elif stale:
              listed = "\n".join(f"- `{path}`" for path in stale)
              summary = notice = (
                "## R1 attestation invalidated by this refresh\n"
                "\n"
                "This run rewrote the following R1-attested source(s):\n"
                "\n"
                f"{listed}\n"
                "\n"
                f"`{evidence}` still records the previous hashes, so it stops describing\n"
                f"what is deployed the moment this PR merges. `{GUARD}`\n"
                "fails until this is resolved — on main, and on every unrelated PR\n"
                "branched off it.\n"
                "\n"
                "```\n"
                f"{RESOLUTION.format(evidence=evidence)}"
                "```\n"
              )
              print(
                "::warning::R1 attestation invalidated by this refresh: "
                f"{', '.join(stale)} — see the job summary and the PR body"
              )
            elif drifted:
              # Un-attested, but NOT by this run. Reported separately because
              # the remedy is the same while the blame is not, and because the
              # previous version of this step published an ALL-CLEAR here: the
              # roster had not moved in this run, so `stale` was empty, and the
              # sentence "the evidence still describes them" went out about
              # hashes nobody had read. Narrow but real — it needs an evidence
              # artifact already drifted plus a repin that is a no-op for every
              # attested target, and one of the attested sources carries no
              # libraryPin at all, so that second half happens on its own.
              # (Named nowhere here on purpose: the roster is derived, and a
              # test forbids a filename in this step so it cannot be
              # hand-maintained back into existence.)
              listed = "\n".join(f"- `{path}`" for path in drifted)
              summary = notice = (
                "## R1 attestation was already invalid before this refresh\n"
                "\n"
                "This run rewrote no R1-attested source, but the registered evidence\n"
                "does not attest the current content of:\n"
                "\n"
                f"{listed}\n"
                "\n"
                f"`{evidence}` stopped describing what is deployed before this run\n"
                f"started, so `{GUARD}`\n"
                "was already failing on main and on every PR branched off it. This\n"
                "refresh did not cause it and does not fix it.\n"
                "\n"
                "```\n"
                f"{RESOLUTION.format(evidence=evidence)}"
                "```\n"
              )
              print(
                "::warning::R1 attestation was already invalid before this refresh: "
                f"{', '.join(drifted)} — see the job summary and the PR body"
              )
            else:
              # The ONLY path that reports an all-clear, and it is now reached
              # only after BOTH questions were answered: nothing attested moved
              # in this run, AND every attested hash still matches the
              # registered evidence. The second half is what makes the sentence
              # below true; without it this branch asserted an attestation from
              # an empty `git diff`, which never looked at a hash.
              notice = ""
              summary = (
                "## R1 attestation unaffected\n"
                "\n"
                f"Checked {len(attested)} attested source(s) "
                f"({', '.join(attested)}); none changed in this run, and every\n"
                f"one still hashes to what `{evidence}` attests, so it still\n"
                "describes them.\n"
              )
              print(
                "::notice::No R1-attested source changed in this refresh and "
                f"every attested hash still matches {evidence}."
              )

          # Called exactly once, outside every branch: the job summary for the
          # run log, a STEP OUTPUT for the PR body in the commit step below.
          # This is the only statement in the step that can fail it, and only on
          # a runner fault (unwritable or unset summary/output file) — never on
          # a verdict this check reached.
          #
          # $GITHUB_OUTPUT, not $GITHUB_ENV. An env write is visible to every
          # LATER step in the job, so a value this step derives becomes ambient
          # state for steps that never asked for it; an output is addressed
          # (`steps.r1_attestation.outputs.notice`) and reaches only the step
          # that names it. tv-save-consumer-source.yml documents the same rule
          # for the same need, and zizmor rates the env form a `github-env`
          # HIGH — but its audit is shell-pattern-based and did not see this
          # one, because the write happens inside a Python heredoc. Measured
          # 2026-08-04 with the pinned zizmor 1.25.2 --offline: four
          # `github-env` HIGHs in this file, none of them this step. The
          # ratchet could not have caught the regression; the rule still binds.
          #
          # The delimiter is GROWN until it cannot occur in the value. A fixed
          # one can be collided with by the content it delimits — and this
          # content includes a traceback, so it is neither short nor fully
          # under our control. A collision would end the block early and let
          # the remainder be parsed as further outputs.
          delimiter = "R1_NOTICE_EOF"
          while delimiter in notice:
            delimiter += "_X"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
            handle.write(summary + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"notice<<{delimiter}\n")
            handle.write(notice)
            handle.write(f"\n{delimiter}\n")
          PY

      - name: Commit and push changes
        id: commit_push
        # Incident 2026-07-13: the commit ALSO gated on the RAW validation step
        # outcome (tv_post_release_raw) and the normalizer exit (tv_post_release,
        # rc!=0 for ANY non-ok status) — both fail on the explicitly-TOLERATED
        # external_tv_drift class (surface_drift/PREFLIGHT_FAILED Playwright
        # flakes), dead-lettering the release_gates carve-out for the commit
        # decision. Result: the library kept republishing to TradingView while
        # the committed pine/generated artifacts silently froze (ASOF 2026-05-27
        # vs published 2026-07-13 — ~6 weeks committed != published, run green,
        # only a ::warning). The commit now gates on the PUBLISH outcome plus the
        # policy-aware strict release gates (run_smc_release_gates.py, which
        # classifies external_tv_drift as non-blocking). A genuine blocking
        # verdict still fails release_gates (no continue-on-error) -> job RED ->
        # never a silent skip. Raw validation failures keep their ::warning +
        # alert-notifier visibility.
        if: steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && steps.publish.outcome == 'success' && steps.release_gates.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          REFRESH_DATE: ${{ steps.handoff.outputs.refresh_date }}
          # GH_PAT is required so the bot/* push + `gh pr create` below
          # actually trigger downstream workflows (notably fast-gates).
          # PRs/pushes created with the default GITHUB_TOKEN do NOT spawn
          # child workflows (GitHub suppresses webhook events for token-
          # generated actions), which would leave `gh pr merge --auto`
          # waiting forever on a check that never runs. Falls back to
          # github.token only on forks where the secret is unavailable.
          # See `/memories/repo/bot-pr-needs-pat-not-github-token.md`
          # and tests/test_workflow_gh_pat_discipline.py.
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          # Bound through `env:`, never interpolated into the `run:` script.
          # `${{ }}` inside a shell body is textual substitution before bash
          # sees it, so a value carrying a quote or a `$(` would be executed —
          # zizmor's `template-injection`. Through env: it is only ever data.
          # Empty when the notice step was skipped, which is the same thing the
          # unset variable used to mean.
          R1_ATTESTATION_NOTICE: ${{ steps.r1_attestation.outputs.notice }}
          R1_HOLD_NOTICE: ${{ steps.r1_hold.outputs.notice }}
          # Bound here rather than interpolated into the script: an
          # Actions expression inside `run:` cannot be executed by
          # tests/_workflow_step_shell.py, which is how this step's
          # cleanup is tested. Same value, one substitution earlier.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The repo's `main-governance` ruleset only targets ~DEFAULT_BRANCH,
          # so direct `git push origin HEAD:main` is rejected with GH013
          # ("Required status check 'fast-gates' is expected"). Use the same
          # bot/* PR + auto-merge pattern as run-open-prep-daily.yml and
          # open-prep-outcome-backfill.yml. The CI skip-pattern in
          # smc-fast-pr-gates.yml + ci.yml short-circuits heavy steps for
          # bot/* heads, so the PR merges in seconds without burning CI.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for runtime_path in \
            artifacts/databento_volatility_cache/ \
            artifacts/monitoring/provider_usage.json \
            artifacts/smc_microstructure_exports/smc_live_news_snapshot.json \
            artifacts/smc_microstructure_exports/smc_live_news_state.json; do
            # A missing optional cache path must not make git restore reject
            # every other path in the same invocation (run 29495535495).
            if git ls-files --error-unmatch "$runtime_path" >/dev/null 2>&1; then
              GIT_LFS_SKIP_SMUDGE=1 git -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false restore --source=HEAD --worktree --staged -- "$runtime_path"
            fi
          done
          git add pine/generated/ \
            SMC_Long_Dip_Suite.pine \
            SMC_Long_Dip_Dashboard.pine \
            SMC_Long_Dip_Mobile.pine \
            SMC_Long_Dip_Strategy.pine \
            SMC_Long_Dip_Alerts.pine \
            SMC_Hold_Manager.pine \
            SMC_Confluence_Hub.pine \
            SMC_Structure_Context.pine \
            SMC_Session_Context.pine \
            SMC_Profile_Context.pine \
            SMC_Orderflow_Overlay.pine \
            SMC_Liquidity_Structure.pine \
            SMC_Liquidity_Context.pine \
            SMC_Imbalance_Context.pine \
            SMC_HTF_Confluence.pine \
            SMC_Event_Overlay.pine \
            artifacts/tradingview/library_release_manifest.json
          if ! git diff --quiet; then
            echo "::error::Unexpected tracked changes remain unstaged before refresh commit."
            git status --short
            git diff --name-only
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::notice::No post-publish changes to commit."
            exit 0
          fi

          # The R1 attestation notice (previous step) is carried into the PR
          # body, not only the job summary: the job summary is one click away
          # from a run nobody opens, and #4371 merged green precisely because
          # the state it created was stated nowhere a reviewer would see. Empty
          # when this run changed no attested source.
          PR_BODY="Automated SMC library refresh from \`smc-library-refresh\` (run ${GITHUB_RUN_ID}). Pine library content + manifest. Heavy CI is skipped for bot/* PRs whose diff is data-only (validation already happened in the refresh workflow itself: TV preflight + post-release validation + release gates); a diff touching Pine still runs the R1-attested-source guard."
          if [ -n "${R1_ATTESTATION_NOTICE:-}" ]; then
            PR_BODY="${PR_BODY}"$'\n\n'"${R1_ATTESTATION_NOTICE}"
          fi
          # What the hold step actually held. Carried into the PR body for the
          # same reason as the drift notice: a consumer pinned one version
          # behind the manifest is a deliberate state, and a reviewer who finds
          # it only by diffing two .pine files will read it as a bug.
          if [ -n "${R1_HOLD_NOTICE:-}" ]; then
            PR_BODY="${PR_BODY}"$'\n\n'"${R1_HOLD_NOTICE}"
          fi

          BRANCH="bot/library-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          COMMIT_MSG="chore(pine): library refresh ${REFRESH_DATE} (run ${RUN_NUMBER})"
          git commit -m "$COMMIT_MSG"

          # Re-anchor on CURRENT main before opening the PR.
          #
          # This job branched from whatever main was at checkout. If an earlier
          # refresh merges in between -- which is the normal case at export
          # cadence -- main now carries a different library version, and since
          # every one of the staged files is regenerated wholesale, EVERY
          # version-pinned line collides. The PR lands DIRTY and a human has to
          # rebuild it by hand (#4528, #4543, #4556 were all this, three days
          # running). The supersede step below does not cover it: that closes
          # rival OPEN PRs, while this is main moving underneath a single one.
          #
          # Resolution is per FILE, never per hunk — and the reason is the
          # case that does NOT conflict. Measured on a scratch repo: main
          # changes a generated file's import line, this run regenerates its
          # footer, `git rebase` returns 0 with no conflict at all and leaves
          # one file carrying main's import next to this run's footer. Neither
          # version, no marker, nothing for a human to notice. The loud DIRTY
          # case is the harmless one. `git checkout <commit> -- <paths>` takes
          # the regenerated set as whole files, which is the only state the
          # generator vouches for; `-X theirs` would not fix the silent case
          # because there is no conflict for it to resolve.
          REFRESH_COMMIT="$(git rev-parse HEAD)"
          REFRESH_PATHS="$(git diff --name-only "${REFRESH_COMMIT}^" "${REFRESH_COMMIT}")"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse "${REFRESH_COMMIT}^")" ]; then
            echo "::notice::main advanced since checkout — re-anchoring ${BRANCH} on $(git rev-parse --short origin/main)"
            git checkout -B "$BRANCH" origin/main
            # Unquoted on purpose: one argument per path.
            # shellcheck disable=SC2086
            git checkout "${REFRESH_COMMIT}" -- ${REFRESH_PATHS}
            if git diff --cached --quiet; then
              echo "::notice::current main already carries this regeneration — no PR to open."
              exit 0
            fi
            git commit -m "$COMMIT_MSG"
          fi
          git push -u origin "$BRANCH"
          # F-V6-I2.1 (2026-05-02): previously this `gh pr create` was suffixed
          # with `|| true`, which silently swallowed real PR-creation failures
          # (auth issues, branch-protection refusals, transient API errors) and
          # left the workflow green with no follow-up PR. Surface as ::error::
          # and fail the job so the library refresh cannot be lost.
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --label automated \
            --title "chore(pine): library refresh ${REFRESH_DATE} (run ${RUN_NUMBER})" \
            --body "$PR_BODY"; then
            echo "::error file=.github/workflows/smc-library-refresh.yml::gh pr create failed for ${BRANCH} — see step log for stderr"
            exit 1
          fi
          # CONTINUE-ON-ERROR-INTENTIONAL: enabling auto-merge can race with
          # branch-protection / required-status-check evaluation; the PR itself
          # is already open and reviewable, so we surface as warning rather
          # than failing the job.
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "::warning::auto-merge enable failed for ${BRANCH} (PR is open and reviewable)"

          # Close the siblings this run just superseded.
          #
          # The branch name carries the run id, so every run opens a NEW PR and
          # nothing ever closed an old one. That was invisible while auto-merge
          # cleared each PR in ~35 seconds (#4371, #4284, #4272 all merged
          # within a minute of opening). The moment anything blocks the merge
          # they accumulate at export cadence -- 9 ticks per weekday.
          #
          # Every open bot/library-refresh-* PR is fully contained in this one:
          # same generated file set, later library version. Closing them is
          # dropping a stale copy, not dropping work. Restricted to this exact
          # branch prefix and skips the branch just opened.
          #
          # Failures here are reported, never fatal: the refresh itself has
          # already landed in a PR, and losing the cleanup must not lose that.
          superseded="$(gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"bot/library-refresh-\")) | select(.headRefName != \"${BRANCH}\") | .number" \
            2>/dev/null || true)"
          for pr in ${superseded}; do
            if gh pr close "${pr}" --delete-branch \
              --comment "Superseded by \`${BRANCH}\` — same generated file set at a later library version. Closed by the refresh that replaced it; nothing to salvage."; then
              echo "::notice::closed superseded refresh PR #${pr}"
            else
              echo "::warning::could not close superseded refresh PR #${pr}"
            fi
          done

      # ── Signal alerts (non-blocking) ────────────────────────────
      - name: Evaluate and send alerts
        id: alerts
        if: always() && steps.handoff.outputs.changed == 'true' && steps.handoff.outputs.publish_allowed == 'true' && github.ref == 'refs/heads/main'
        # CONTINUE-ON-ERROR-INTENTIONAL: alert dispatch is best-effort notification;
        # missing TELEGRAM/SMTP secrets or transient delivery errors must not fail
        # the refresh job (artifacts already produced).
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          "$SMC_PYTHON_BIN" scripts/smc_alert_notifier.py \
            --library pine/generated/smc_micro_profiles_generated.pine \
            --state-file artifacts/ci/alert_last_state.json \
            --post-release-report artifacts/ci/smc_post_release_validation_report.json \
            --provider-alerts \
            ${TELEGRAM_BOT_TOKEN:+--telegram-bot-token "$TELEGRAM_BOT_TOKEN"} \
            ${TELEGRAM_CHAT_ID:+--telegram-chat-id "$TELEGRAM_CHAT_ID"} \
            ${SMTP_HOST:+--smtp-host "$SMTP_HOST"} \
            ${SMTP_USER:+--smtp-user "$SMTP_USER"} \
            ${SMTP_PASS:+--smtp-pass "$SMTP_PASS"} \
            ${ALERT_EMAIL_FROM:+--email-from "$ALERT_EMAIL_FROM"} \
            ${ALERT_EMAIL_TO:+--email-to "$ALERT_EMAIL_TO"}

      # ── Upload CI artifacts ─────────────────────────────────────
      # Die Veroeffentlichung erzeugt Evidenz NACH dem Upload im Refresh
      # (Nach-Tore, post-release-Zusammenfassung, R1-Bericht). Ohne diesen
      # zweiten Upload endete sie im Nichts: der Refresh laedt hoch, bevor es
      # sie gibt. Eigener Artefaktname, damit beide Haelften nebeneinander
      # stehen statt einander zu ueberschreiben.
      - name: Upload gate evidence + library artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smc-publish-${{ steps.handoff.outputs.refresh_date }}-${{ github.run_number }}
          path: |
            artifacts/ci/
            artifacts/snapshots/
            pine/generated/
          retention-days: 90

      - name: Upload TradingView validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smc-tradingview-${{ steps.handoff.outputs.refresh_date }}-${{ github.run_number }}
          path: |
            artifacts/tradingview/
          if-no-files-found: ignore
          retention-days: 30

      # ── Status summary ─────────────────────────────────────────
