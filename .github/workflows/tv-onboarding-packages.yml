permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: tv-onboarding-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            arch: x64
            package_name: SMC-Onboarding-Windows-x64
            archive_name: SMC-Onboarding-Windows-x64.zip
          - name: macOS Apple Silicon
            runner: macos-latest
            platform: macos
            arch: arm64
            package_name: SMC-Onboarding-macOS-arm64
            archive_name: SMC-Onboarding-macOS-arm64.tar.gz
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64
            package_name: SMC-Onboarding-macOS-x64
            archive_name: SMC-Onboarding-macOS-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PACKAGE_NAME: ${{ matrix.package_name }}
      ARCHIVE_NAME: ${{ matrix.archive_name }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Type-check onboarding
        run: npm run tsc:check

      - name: Test onboarding behavior
        run: npx tsx --test automation/tradingview/tests/tv_onboarding.test.ts

      - name: Test preflight add-to-chart floor
        # Source-only pin (node: builtins, ~160ms) guarding the 90s
        # add-to-chart floor in scripts/tv_preflight.ts (#3967). It ran in
        # no workflow before this and the only TS runner excluded it via
        # paths, so a follow-up removing the floor would have re-opened the
        # 45s-timeout release-gate failure (run 30023429034).
        run: npx tsx --test automation/tradingview/tests/tv_preflight_add_to_chart_floor.test.ts

      - name: Test hermetic TV pins
        # Mostly source-scan / pure-logic pins. Two named exceptions:
        # tv_chart_error_probe.test.ts launches a real headless Chromium per
        # test (measured 2026-08-03: 931ms / 196ms / 202ms), and the eleven
        # added 2026-08-04 were exempt for history rather than for any
        # technical obstacle — measured together at 103 tests / 0 fail /
        # 808ms LOCALLY, PER LEG, verified to launch no browser. This step
        # runs on all three matrix legs below (Windows x64, macOS arm64,
        # macOS Intel; no Linux leg exists), so every test here — including
        # these eleven — actually executes 3x per workflow run, and this is
        # the first time they have run on Windows. Checked for portability
        # before wiring in: tv_producer_refresh_layouts.test.ts and
        # tv_save_consumer_source.test.ts (all eight path/IO call sites in
        # those two files — five and three) use only node:path
        # path.resolve/path.join — never
        # a raw "/"-joined string — plus fileURLToPath for the repo-root
        # lookup, and tv_save_consumer_source.test.ts's own first test
        # explicitly asserts LF/CRLF hash-equivalence. No platform branch
        # needed; low risk, not merely assumed.
        # They ran in no CI job before; the exempt set in
        # test_fast_gates_silent_skip_coverage.py shrank by exactly these.
        run: npx tsx --test automation/tradingview/tests/context_bus_binding_labels.test.ts automation/tradingview/tests/hand_authored_publisher_facade_authority.test.ts automation/tradingview/tests/pine_library_version_snapshot.test.ts automation/tradingview/tests/selectors.test.ts automation/tradingview/tests/tv_auth_capture_safety.test.ts automation/tradingview/tests/tv_consumer_rollout_evidence.test.ts automation/tradingview/tests/tv_library_publisher_add_to_chart.test.ts automation/tradingview/tests/tv_publish_continue_label.test.ts automation/tradingview/tests/tv_publish_hand_authored_libraries.test.ts automation/tradingview/tests/tv_publish_import_path_evidence.test.ts automation/tradingview/tests/tv_runtime_errors.test.ts automation/tradingview/tests/tv_selectors_strict_mode.test.ts automation/tradingview/tests/tv_otp_entry_plan.test.ts automation/tradingview/tests/tv_totp_token.test.ts automation/tradingview/tests/tv_signin_email_chooser.test.ts automation/tradingview/tests/tv_storage_state_wait.test.ts automation/tradingview/tests/tv_bar_replay.test.ts automation/tradingview/tests/tv_two_factor_inventory.test.ts automation/tradingview/tests/tv_validation_model.test.ts automation/tradingview/tests/tv_open_script_identity.test.ts automation/tradingview/tests/tv_r5_session_diagnostics.test.ts automation/tradingview/tests/tv_r5_htf_availability.test.ts automation/tradingview/tests/tv_publish_button_label.test.ts automation/tradingview/tests/tv_r5_live_no_repaint.test.ts automation/tradingview/tests/tv_r5_chart_state.test.ts automation/tradingview/tests/tv_chart_error_probe.test.ts automation/tradingview/tests/tv_editor_write_readback.test.ts automation/tradingview/tests/tv_rollout_layout_save_points.test.ts automation/tradingview/tests/tv_htf_suite_verdict.test.ts automation/tradingview/tests/tv_publish_absence_diagnostics.test.ts automation/tradingview/tests/tv_input_contract_diagnosis.test.ts automation/tradingview/tests/tv_consumer_refresh_targets.test.ts automation/tradingview/tests/tv_missing_source_row_evidence.test.ts automation/tradingview/tests/tv_instance_contract_coverage.test.ts automation/tradingview/tests/tv_stale_instance_removal.test.ts automation/tradingview/tests/tv_legend_text_visibility.test.ts automation/tradingview/tests/tv_rollout_verify_order.test.ts automation/tradingview/tests/tv_object_tree_removal.test.ts automation/tradingview/tests/tv_out_of_band_drift.test.ts automation/tradingview/tests/tv_pre_mutation_observation.test.ts automation/tradingview/tests/vacuous_claims_ts.test.ts automation/tradingview/tests/tv_auth_probe_precedence.test.ts automation/tradingview/tests/tv_binding_repair.test.ts automation/tradingview/tests/tv_launch_options.test.ts automation/tradingview/tests/tv_preflight_identity_assertion.test.ts automation/tradingview/tests/tv_producer_refresh_layouts.test.ts automation/tradingview/tests/tv_publish_draw_library.test.ts automation/tradingview/tests/tv_publish_hand_lib.test.ts automation/tradingview/tests/tv_publish_bus_library.test.ts automation/tradingview/tests/tv_publish_context_resolvers_library.test.ts automation/tradingview/tests/tv_publish_core_types_library.test.ts automation/tradingview/tests/tv_publish_engine_library.test.ts automation/tradingview/tests/tv_publish_lifecycle_library.test.ts automation/tradingview/tests/tv_publish_observability_library.test.ts automation/tradingview/tests/tv_publish_profile_engine_library.test.ts automation/tradingview/tests/tv_publish_utils_library.test.ts automation/tradingview/tests/tv_publish_micro_library.test.ts automation/tradingview/tests/tv_publish_openprep_panel.test.ts automation/tradingview/tests/tv_publish_overlay_library.test.ts automation/tradingview/tests/tv_read_editor_content.test.ts automation/tradingview/tests/tv_save_consumer_source.test.ts automation/tradingview/tests/tv_readback_hold_manager_alerts.test.ts

      - name: Build portable package
        run: npm run tv:onboarding:package -- --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH" --out-dir dist/tv-onboarding
        shell: bash

      - name: Smoke-test portable package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SMC_ONBOARDING_NO_PAUSE = "1"
          & "dist/tv-onboarding/$env:PACKAGE_NAME/runtime/node.exe" `
            "dist/tv-onboarding/$env:PACKAGE_NAME/app/tv_onboard_consumers.mjs" `
            --self-test --browser-smoke --no-open-report

      - name: Smoke-test portable package on macOS
        if: runner.os == 'macOS'
        run: >-
          "dist/tv-onboarding/$PACKAGE_NAME/Start SMC Onboarding.command"
          --self-test --browser-smoke --no-open-report

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/tv-onboarding/$env:PACKAGE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME"

      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: tar -C dist/tv-onboarding -czf "dist/$ARCHIVE_NAME" "$PACKAGE_NAME"

      - name: Upload portable package
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 30
