# live-window: any-trigger  # Packaging CI runs on push, pull request, and manual dispatch.
name: tv-onboarding-packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tv-onboarding-packages.yml"
      - "automation/tradingview/config/consumer-onboarding.json"
      - "automation/tradingview/lib/**"
      - "automation/tradingview/selectors.ts"
      - "scripts/tv_r5_replay_cases.ts"
      - "scripts/tv_r5_htf_cases.ts"
      - "automation/tradingview/tests/tv_onboarding.test.ts"
      - "automation/tradingview/tests/tv_preflight_add_to_chart_floor.test.ts"
      - "automation/tradingview/tests/tv_open_script_identity.test.ts"
      - "automation/tradingview/tests/tv_r5_session_diagnostics.test.ts"
      - "automation/tradingview/tests/tv_r5_htf_availability.test.ts"
      - "automation/tradingview/tests/tv_publish_button_label.test.ts"
      - "automation/tradingview/tests/tv_r5_live_no_repaint.test.ts"
      - "automation/tradingview/tests/tv_r5_chart_state.test.ts"
      - "automation/tradingview/tests/tv_chart_error_probe.test.ts"
      - "automation/tradingview/tests/tv_editor_write_readback.test.ts"
      - "automation/tradingview/tests/hand_authored_publisher_facade_authority.test.ts"
      - "automation/tradingview/tests/pine_library_version_snapshot.test.ts"
      - "automation/tradingview/tests/selectors.test.ts"
      - "automation/tradingview/tests/tv_consumer_rollout_evidence.test.ts"
      - "automation/tradingview/tests/tv_library_publisher_add_to_chart.test.ts"
      - "automation/tradingview/tests/tv_publish_continue_label.test.ts"
      - "automation/tradingview/tests/tv_publish_hand_authored_libraries.test.ts"
      - "automation/tradingview/tests/tv_publish_import_path_evidence.test.ts"
      - "automation/tradingview/tests/tv_runtime_errors.test.ts"
      - "automation/tradingview/tests/tv_selectors_strict_mode.test.ts"
      - "automation/tradingview/tests/tv_auth_capture_safety.test.ts"
      - "automation/tradingview/tests/tv_otp_entry_plan.test.ts"
      - "automation/tradingview/tests/tv_signin_email_chooser.test.ts"
      - "automation/tradingview/tests/tv_storage_state_wait.test.ts"
      - "automation/tradingview/tests/tv_bar_replay.test.ts"
      - "automation/tradingview/tests/tv_two_factor_inventory.test.ts"
      - "automation/tradingview/tests/tv_validation_model.test.ts"
      - "automation/tradingview/tests/context_bus_binding_labels.test.ts"
      - "docs/tradingview-onboarding/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_tv_onboarding_package.mjs"
      - "scripts/tv_onboard_consumers.ts"
      - "scripts/tv_preflight.ts"
      - "scripts/create_tradingview_storage_state.ts"
      - "scripts/tv_verify_consumer_bindings.ts"
      - "scripts/build_pine_library_version_snapshot.ts"
      - "scripts/smc_bus_manifest.py"
      - "scripts/tv_publish_*.ts"
  pull_request:
    paths:
      - ".github/workflows/tv-onboarding-packages.yml"
      - "automation/tradingview/config/consumer-onboarding.json"
      - "automation/tradingview/lib/**"
      - "automation/tradingview/selectors.ts"
      - "automation/tradingview/tests/tv_onboarding.test.ts"
      - "automation/tradingview/tests/tv_preflight_add_to_chart_floor.test.ts"
      - "automation/tradingview/tests/hand_authored_publisher_facade_authority.test.ts"
      - "automation/tradingview/tests/pine_library_version_snapshot.test.ts"
      - "automation/tradingview/tests/selectors.test.ts"
      - "automation/tradingview/tests/tv_consumer_rollout_evidence.test.ts"
      - "automation/tradingview/tests/tv_library_publisher_add_to_chart.test.ts"
      - "automation/tradingview/tests/tv_publish_continue_label.test.ts"
      - "automation/tradingview/tests/tv_publish_hand_authored_libraries.test.ts"
      - "automation/tradingview/tests/tv_publish_import_path_evidence.test.ts"
      - "automation/tradingview/tests/tv_runtime_errors.test.ts"
      - "automation/tradingview/tests/tv_selectors_strict_mode.test.ts"
      - "automation/tradingview/tests/tv_auth_capture_safety.test.ts"
      - "automation/tradingview/tests/tv_otp_entry_plan.test.ts"
      - "automation/tradingview/tests/tv_signin_email_chooser.test.ts"
      - "automation/tradingview/tests/tv_storage_state_wait.test.ts"
      - "automation/tradingview/tests/tv_bar_replay.test.ts"
      - "automation/tradingview/tests/tv_two_factor_inventory.test.ts"
      - "automation/tradingview/tests/tv_validation_model.test.ts"
      - "automation/tradingview/tests/context_bus_binding_labels.test.ts"
      - "docs/tradingview-onboarding/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build_tv_onboarding_package.mjs"
      - "scripts/tv_onboard_consumers.ts"
      - "scripts/tv_preflight.ts"
      - "scripts/create_tradingview_storage_state.ts"
      - "scripts/tv_verify_consumer_bindings.ts"
      - "scripts/build_pine_library_version_snapshot.ts"
      - "scripts/smc_bus_manifest.py"
      - "scripts/tv_publish_*.ts"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

concurrency:
  group: tv-onboarding-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            arch: x64
            package_name: SMC-Onboarding-Windows-x64
            archive_name: SMC-Onboarding-Windows-x64.zip
          - name: macOS Apple Silicon
            runner: macos-latest
            platform: macos
            arch: arm64
            package_name: SMC-Onboarding-macOS-arm64
            archive_name: SMC-Onboarding-macOS-arm64.tar.gz
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64
            package_name: SMC-Onboarding-macOS-x64
            archive_name: SMC-Onboarding-macOS-x64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PACKAGE_NAME: ${{ matrix.package_name }}
      ARCHIVE_NAME: ${{ matrix.archive_name }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Type-check onboarding
        run: npm run tsc:check

      - name: Test onboarding behavior
        run: npx tsx --test automation/tradingview/tests/tv_onboarding.test.ts

      - name: Test preflight add-to-chart floor
        # Source-only pin (node: builtins, ~160ms) guarding the 90s
        # add-to-chart floor in scripts/tv_preflight.ts (#3967). It ran in
        # no workflow before this and the only TS runner excluded it via
        # paths, so a follow-up removing the floor would have re-opened the
        # 45s-timeout release-gate failure (run 30023429034).
        run: npx tsx --test automation/tradingview/tests/tv_preflight_add_to_chart_floor.test.ts

      - name: Test hermetic TV pins
        # Source-scan / pure-logic pins (no playwright import, verified green
        # in <2s each). They ran in no CI job before; the exempt set in
        # test_fast_gates_silent_skip_coverage.py shrank by exactly these.
        run: npx tsx --test automation/tradingview/tests/context_bus_binding_labels.test.ts automation/tradingview/tests/hand_authored_publisher_facade_authority.test.ts automation/tradingview/tests/pine_library_version_snapshot.test.ts automation/tradingview/tests/selectors.test.ts automation/tradingview/tests/tv_auth_capture_safety.test.ts automation/tradingview/tests/tv_consumer_rollout_evidence.test.ts automation/tradingview/tests/tv_library_publisher_add_to_chart.test.ts automation/tradingview/tests/tv_publish_continue_label.test.ts automation/tradingview/tests/tv_publish_hand_authored_libraries.test.ts automation/tradingview/tests/tv_publish_import_path_evidence.test.ts automation/tradingview/tests/tv_runtime_errors.test.ts automation/tradingview/tests/tv_selectors_strict_mode.test.ts automation/tradingview/tests/tv_otp_entry_plan.test.ts automation/tradingview/tests/tv_signin_email_chooser.test.ts automation/tradingview/tests/tv_storage_state_wait.test.ts automation/tradingview/tests/tv_bar_replay.test.ts automation/tradingview/tests/tv_two_factor_inventory.test.ts automation/tradingview/tests/tv_validation_model.test.ts automation/tradingview/tests/tv_open_script_identity.test.ts automation/tradingview/tests/tv_r5_session_diagnostics.test.ts automation/tradingview/tests/tv_r5_htf_availability.test.ts automation/tradingview/tests/tv_publish_button_label.test.ts automation/tradingview/tests/tv_r5_live_no_repaint.test.ts automation/tradingview/tests/tv_r5_chart_state.test.ts automation/tradingview/tests/tv_chart_error_probe.test.ts automation/tradingview/tests/tv_editor_write_readback.test.ts

      - name: Build portable package
        run: npm run tv:onboarding:package -- --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH" --out-dir dist/tv-onboarding
        shell: bash

      - name: Smoke-test portable package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SMC_ONBOARDING_NO_PAUSE = "1"
          & "dist/tv-onboarding/$env:PACKAGE_NAME/runtime/node.exe" `
            "dist/tv-onboarding/$env:PACKAGE_NAME/app/tv_onboard_consumers.mjs" `
            --self-test --browser-smoke --no-open-report

      - name: Smoke-test portable package on macOS
        if: runner.os == 'macOS'
        run: >-
          "dist/tv-onboarding/$PACKAGE_NAME/Start SMC Onboarding.command"
          --self-test --browser-smoke --no-open-report

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/tv-onboarding/$env:PACKAGE_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME"

      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: tar -C dist/tv-onboarding -czf "dist/$ARCHIVE_NAME" "$PACKAGE_NAME"

      - name: Upload portable package
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 30
