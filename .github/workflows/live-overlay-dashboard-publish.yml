# live-window: any-trigger  # F-V6-F2.1 (2026-06-22): push-mutating publish workflow
name: live-overlay-dashboard-publish

on:
  push:
    branches: [main]
    paths:
      - services/live_overlay_daemon/infra/grafana/dashboard.json
      - services/live_overlay_daemon/infra/grafana/dashboard-signals-experiments.json
      - services/live_overlay_daemon/infra/grafana/dashboard-pre-a0.json
      - scripts/build_pre_a0_dashboard.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run validation only (no publish request)"
        type: boolean
        default: true
      host:
        description: "Grafana host override"
        required: false
        default: "bronzeporridge977.grafana.net"

permissions:
  contents: read

concurrency:
  # Serialize publishes to the shared Grafana dashboard target.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  publish-dashboard:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify live overlay dashboard is up to date
        run: |
          set -euo pipefail

          python scripts/update_overlay_dashboard.py \
            services/live_overlay_daemon/infra/grafana/dashboard.json \
            --check
          python scripts/update_overlay_dashboard.py \
            services/live_overlay_daemon/infra/grafana/dashboard-signals-experiments.json \
            --check
          python scripts/build_pre_a0_dashboard.py --check

      - name: Publish dashboards (or dry-run)
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_HOST: ${{ github.event.inputs.host }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          set -euo pipefail

          HOST="${INPUT_HOST:-bronzeporridge977.grafana.net}"
          DASHBOARDS=(
            "services/live_overlay_daemon/infra/grafana/dashboard.json|cfpozahbhfzswc"
            "services/live_overlay_daemon/infra/grafana/dashboard-signals-experiments.json|cfpozahbhfzswc"
            "services/live_overlay_daemon/infra/grafana/dashboard-pre-a0.json|bfshrlee72tc0d"
          )

          # push -> always publish (mutating workflow);
          # manual runs can be dry-run or publish.
          dry_run="false"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${INPUT_DRY_RUN:-true}" in
              true|false) dry_run="${INPUT_DRY_RUN:-true}" ;;
              *)
                echo "::error::dry_run input must be 'true' or 'false', got: ${INPUT_DRY_RUN}"
                exit 1
                ;;
            esac
          fi

          # Preflight: validate payload generation for EVERY dashboard before
          # mutating anything (audit P2 LOW). Without this, a failure on the
          # 2nd dashboard after the 1st is already published leaves Grafana
          # half-updated.
          for dashboard in "${DASHBOARDS[@]}"; do
            IFS="|" read -r DASHBOARD_PATH FOLDER_UID <<< "${dashboard}"
            echo "Preflight dry-run: validating payload for ${DASHBOARD_PATH} (no network publish)."
            python scripts/publish_overlay_dashboard.py \
              "${DASHBOARD_PATH}" \
              --host "${HOST}" \
              --namespace stacks-1697741 \
              --folder "${FOLDER_UID}" \
              --dry-run \
              --token "dry-run-token" \
              --no-keychain
          done

          if [[ "${dry_run}" == "true" ]]; then
            echo "Manual dry-run complete for all dashboards (no network publish)."
            exit 0
          fi

          test -n "${GRAFANA_API_TOKEN:-}" || {
            echo "::error::GRAFANA_API_TOKEN secret is required for dashboard publish."
            exit 1
          }

          # All dashboards passed preflight — now publish them.
          for dashboard in "${DASHBOARDS[@]}"; do
            IFS="|" read -r DASHBOARD_PATH FOLDER_UID <<< "${dashboard}"
            echo "Publishing ${DASHBOARD_PATH} to ${HOST}."
            python scripts/publish_overlay_dashboard.py \
              "${DASHBOARD_PATH}" \
              --host "${HOST}" \
              --namespace stacks-1697741 \
              --folder "${FOLDER_UID}" \
              --no-keychain
          done
