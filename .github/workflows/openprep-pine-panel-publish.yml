# Open-Prep Pine Panel Publish — plan Workstream B2 (dispatch-first)
# live-window: off-hours-only
#
# Publishes the generated Open-Prep daily panel
# (pine/generated/openprep_daily_panel.pine, an indicator produced by
# scripts/generate_openprep_pine_panel.py) to TradingView. By default it
# regenerates the panel before publishing — preferring the TRADED-universe
# outcomes + setups from data/phase-a-audit over the CI screener outcomes
# committed on main (Option-a decision 2026-07-09) — then runs the
# fail-closed Playwright publisher (scripts/tv_publish_openprep_panel.ts).
#
# Triggers: workflow_dispatch (human / daily-trigger bridge) plus an
# after-hours cron at 23:15 UTC Mon-Fri — deliberately AFTER the 17:30 ET
# local audit-push has landed the day's setups_<DATE>.jsonl +
# outcomes_<DATE>.json on data/phase-a-audit, so the evening publish carries
# the traded levels for the next session. No contents write permissions →
# posture off-hours-only. It never pushes to the repo; it only publishes to
# TradingView and uploads the publish report + screenshots as a run artifact.
#
# First publish: dispatch once with allow_create=true to create the
# "Open-Prep Daily Panel" script; every later run updates it in place.
#
# Required secret:
#   TV_STORAGE_STATE — TradingView Playwright storage-state (raw JSON or gzip+base64)

name: openprep-pine-panel-publish

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate the panel from the newest outcomes (data-branch traded file preferred) before publishing."
        type: boolean
        default: true
      allow_create:
        description: "Allow creating the TradingView script if it does not exist yet (first publish only; default false to avoid duplicate-script creation)."
        type: boolean
        default: false
  schedule:
    # 23:15 UTC Mon-Fri = 19:15/18:15 ET (EDT/EST): after the US close AND
    # after the 17:30 ET audit-push, so the data branch already carries
    # today's traded outcomes + setups. Schedule runs always regenerate.
    - cron: "15 23 * * 1-5"

permissions:
  contents: read

concurrency:
  # 2026-08-01: one AUTOMATED browser session at a time — CI against CI only.
  # This group does NOT serialise the account: the operator's own browser is
  # a second, unserialised writer on the same layouts, and TradingView
  # autosaves from it (operator-confirmed 2026-08-01: autosave active, and a
  # chart tab on this account was open all day while runs mutated layouts —
  # nothing here knew). No mechanism detects or excludes that session;
  # mutating runs coordinate with the operator by convention, not by code.
  # Every workflow below drives the SAME external account, and until now each
  # one only serialised against itself — two of these blocks already said
  # "TradingView is a single shared external target" while keeping a private
  # group, so the guarantee was stated but never implemented. Measured trigger:
  # a manual tv-save-consumer-source dispatch ran while an R4 readback was
  # being prepared; nothing in CI would have stopped them overlapping.
  # cancel-in-progress stays false everywhere: these runs save layouts and
  # publish scripts, so a queued run must wait, never pre-empt.
  group: tradingview-session
  cancel-in-progress: false

# Top-level env so PYTHONUNBUFFERED / PYTHONPATH propagate to every step,
# including the direct python scripts/generate_openprep_pine_panel.py invoke.
env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Force bash for every run: step (the repo can dispatch onto a Windows
# self-hosted runner where the default shell is PowerShell).
defaults:
  run:
    shell: bash

jobs:
  publish-openprep-panel:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install chromium

      - name: Install Playwright system deps (chromium)
        run: npx playwright install-deps chromium

      - name: Regenerate panel (traded data-branch outcomes preferred)
        if: ${{ inputs.regenerate || github.event_name == 'schedule' }}
        env:
          # Scoped auth for the data-branch fetch only. The job checkout runs
          # with persist-credentials: false (hardening: the Playwright/TV steps
          # must not see ambient git credentials — PR #3217), which broke this
          # fetch when the repo went private (fatal: could not read Username).
          GH_TOKEN: ${{ github.token }}
        run: |
          # Option-a decision (2026-07-09): the PUBLISHED panel shows the
          # TRADED universe. The local audit-push (17:30 ET) lands the traded,
          # universe-stamped outcomes_<DATE>.json + setups_<DATE>.jsonl on
          # data/phase-a-audit; prefer that outcomes file whenever its date is
          # >= the newest CI screener file committed on main (which stays the
          # fallback so the panel never goes empty). The realtime producer's
          # fmp_us_mid_large snapshot is deliberately untouched — flipping THAT
          # universe would shrink the 929-symbol signal watchlist to ~10.
          # Fail-soft on every step; a disjoint universe still warns loudly in
          # the generator.
          #
          # URL-scoped token (repo idiom, cf. adr0023-magnitude-shadow-daily):
          # auth lives only in this one fetch command, never in git config, so
          # the persist-credentials: false posture of the job is preserved. The
          # runner masks the token in logs.
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            data/phase-a-audit:refs/remotes/origin/data/phase-a-audit || true
          # `|| true` INSIDE the substitutions: under set -e -o pipefail an
          # empty glob (ls rc=2) or a missing origin/data/phase-a-audit ref
          # (grep rc=1) otherwise kills the assignment line itself — exactly
          # the silent 90ms death this step died of when the fetch broke.
          committed_latest="$(ls artifacts/open_prep/outcomes/outcomes_*.json 2>/dev/null | sort | tail -1 || true)"
          committed_date="$(basename "${committed_latest:-}" .json | sed 's/^outcomes_//')"
          db_latest="$(git ls-tree -r --name-only origin/data/phase-a-audit -- artifacts/open_prep/outcomes/ 2>/dev/null | grep -E 'outcomes_[0-9-]+\.json$' | sort | tail -1 || true)"
          db_date="$(basename "${db_latest:-}" .json | sed 's/^outcomes_//')"
          outcomes_args=()
          panel_date="${committed_date}"
          if [ -n "${db_date}" ] && { [ -z "${committed_date}" ] || [ ! "${db_date}" \< "${committed_date}" ]; }; then
            git show "origin/data/phase-a-audit:${db_latest}" > /tmp/panel_outcomes.json
            outcomes_args=(--outcomes-json /tmp/panel_outcomes.json)
            panel_date="${db_date}"
            echo "panel outcomes: using traded ${db_latest} from data/phase-a-audit"
          else
            echo "panel outcomes: no data-branch file >= ${committed_date:-?} — falling back to committed screener outcomes"
          fi
          setups_args=()
          if [ -n "${panel_date}" ] && git cat-file -e "origin/data/phase-a-audit:cache/live/setups_${panel_date}.jsonl" 2>/dev/null; then
            git show "origin/data/phase-a-audit:cache/live/setups_${panel_date}.jsonl" > /tmp/panel_setups.jsonl
            setups_args=(--setups-json /tmp/panel_setups.jsonl)
            echo "panel levels: joined setups_${panel_date}.jsonl from data/phase-a-audit"
          else
            echo "panel levels: no setups_${panel_date:-?}.jsonl on data/phase-a-audit — levels column renders '–'"
          fi
          python scripts/generate_openprep_pine_panel.py "${outcomes_args[@]}" "${setups_args[@]}"
          # Surface whether the freshly-generated panel matched the committed artifact.
          git --no-pager diff --stat -- pine/generated/openprep_daily_panel.pine pine/generated/openprep_daily_panel.json || true

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          mkdir -p automation/tradingview/auth
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET']
          trimmed = raw.strip()
          if not trimmed:
            raise SystemExit('TV_STORAGE_STATE secret is empty')

          if trimmed.startswith('{'):
            payload = trimmed
          else:
            try:
              payload = gzip.decompress(base64.b64decode(trimmed)).decode('utf-8')
            except Exception as exc:
              raise SystemExit(f'TV_STORAGE_STATE is neither raw JSON nor gzip+base64: {exc}')

          try:
            json.loads(payload)
          except json.JSONDecodeError as exc:
            raise SystemExit(f'Invalid TV_STORAGE_STATE JSON payload: {exc}')

          output_path = Path('automation/tradingview/auth/storage-state.json')
          output_path.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Validate TradingView storage state JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("automation/tradingview/auth/storage-state.json")
          try:
              json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid TV_STORAGE_STATE JSON in {path}: {exc}")
          PY

      - name: Publish Open-Prep panel to TradingView
        id: publish
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          ALLOW_CREATE: ${{ inputs.allow_create && 'true' || 'false' }}
        run: |
          flags=()
          if [ "$ALLOW_CREATE" != "true" ]; then
            flags+=(--no-allow-create)
          fi
          npx tsx scripts/tv_publish_openprep_panel.ts "${flags[@]}"

      - name: Upload publish report + screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openprep-panel-publish-report
          path: |
            automation/tradingview/reports/publish-openprep-panel-*.json
            automation/tradingview/reports/screenshots/**
          if-no-files-found: ignore
          retention-days: 14
