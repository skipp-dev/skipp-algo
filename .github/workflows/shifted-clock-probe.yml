name: shifted-clock-probe
# live-window: any-trigger  # F-V6-F2.1 (2026-05-02)
#
# A MEASUREMENT, not a gate. It answers one question before anyone commits to a
# nightly shifted-clock job: does libfaketime survive this repo's pytest setup on
# a GitHub-hosted runner, and what does it cost?
#
# The `push:` trigger below is deliberately scoped to the probe branch so the
# measurement can run WITHOUT first merging scaffolding into main
# (`workflow_dispatch` only works from the default branch). If the answer is
# "adopt", `push` becomes `schedule` and this comment goes with it.

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: 'libfaketime "start at" instant (advancing, absolute)'
        required: false
        default: '@2028-02-29 12:00:00'
      run_full_suite:
        description: 'Run the two full-suite measurements (adds ~30-60 min)'
        required: false
        default: 'true'
  push:
    branches:
      - 'probe/shifted-clock-measurement'

# Why it cannot be measured on the operator's laptop: libfaketime injects via
# LD_PRELOAD on Linux and DYLD_INSERT_LIBRARIES on macOS, and SIP blocks the
# macOS path. A local run would measure a different mechanism than the one that
# would ship.
#
# Why an ADVANCING clock and not a frozen one: libfaketime's README says
# "Whenever possible, you should use relative offsets or 'start at' dates, and
# not use absolute dates", because a frozen clock returns the same value on
# repeated reads and "is likely to break programs which measure the time passing
# by". The `@` prefix is the "start at" form: an absolute instant that still
# advances. It is deterministic and re-runnable, which a `+1d` offset is not --
# a `+1d` job is itself calendar-coupled, so a failure could never be re-run
# identically.
#
# Why midday on a leap day and not 23:59: a boundary-crossing anchor is
# desirable for finding month/year-roll bugs, but it makes every date assertion
# in the suite racy, which would drown the signal this probe exists to produce.
# Crossing the boundary is a separate decision to take AFTER this measurement.

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PROBE_DIR: /tmp/clockprobe
  # Pinned to the first tagged release that carries the clock_nanosleep fix for
  # wolfcw/libfaketime#426. Lightweight tag v0.9.12 -> this commit.
  FT_COMMIT: 3ccdd344aadf1e317156fa5fb7c881f2c4404778

# NOTE on FAKETIME_DONT_FAKE_MONOTONIC: it is deliberately NOT set here at
# workflow scope. Gate 1 measures the clock with the switch both on and off, and
# a workflow-level env would make the "off" cell unmeasurable. Every later step
# sets it explicitly per invocation.

jobs:
  probe:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      ANCHOR: ${{ inputs.anchor || '@2028-02-29 12:00:00' }}
      RUN_FULL: ${{ inputs.run_full_suite || 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt

      - name: Resolve Python 3.12 interpreter
        shell: bash
        run: |
          python -c "import sys; raise SystemExit('did not resolve Python 3.12' if sys.version_info[:2] != (3, 12) else 0)"
          echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"

      - name: Cache venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-python3.12-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-python3.12-

      - name: Install test dependencies
        uses: ./.github/actions/setup-persistent-venv
        with:
          python-bin: ${{ env.SMC_PYTHON_BIN }}
          requirements-file: requirements.lock
          extra-packages: pytest
          runner-environment: github-hosted

      # The distribution package cannot do this job. Ubuntu ships libfaketime
      # 0.9.10 (released 2022-03-04); the fix for wolfcw/libfaketime#426 landed
      # 2023-06-06 and first shipped in v0.9.11 (2025-05-25). On 0.9.10 the
      # clock_nanosleep TIMER_ABSTIME branch rewrites a CLOCK_MONOTONIC deadline
      # unconditionally, so CPython >= 3.11's time.sleep() -- which sleeps
      # against an absolute CLOCK_MONOTONIC deadline since gh-65501 -- gets a
      # negative deadline and raises OSError(EINVAL). Building the fixed release
      # costs ~10 s; there is no env-var workaround on 0.9.10.
      - name: Build libfaketime (pinned, fixed release)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/wolfcw/libfaketime.git "$RUNNER_TEMP/libfaketime"
          cd "$RUNNER_TEMP/libfaketime"
          git checkout --quiet "$FT_COMMIT"
          make -s -j"$(nproc)"
          lib="$RUNNER_TEMP/libfaketime/src/libfaketime.so.1"
          test -f "$lib"
          echo "FT_LIB=$lib" >> "$GITHUB_ENV"
          echo "built $lib from $FT_COMMIT"
          # Prove the pin actually carries the fix rather than trusting the tag.
          grep -q 'get_fake_monotonic_setting(&fake_monotonic_clock)' src/libfaketime.c \
            && grep -A6 'else if (clock_id == CLOCK_MONOTONIC)' src/libfaketime.c \
            | grep -q 'if (fake_monotonic_clock)' \
            || { echo "::error::pinned source lacks the #426 fix in clock_nanosleep"; exit 1; }

      - name: 'Gate 0: the anchor is not today'
        shell: bash
        run: |
          set -euo pipefail
          # Without this the whole probe could pass for the wrong reason on one
          # calendar day -- the exact class of bug it exists to help find.
          anchor_date="$(echo "$ANCHOR" | sed 's/^@//' | cut -d' ' -f1)"
          real_date="$(date -u +%Y-%m-%d)"
          echo "anchor=$anchor_date real=$real_date"
          if [ "$anchor_date" = "$real_date" ]; then
            echo "::error::anchor equals today; every gate below would be vacuous"
            exit 1
          fi
          echo "ANCHOR_DATE=$anchor_date" >> "$GITHUB_ENV"

      # The previous revision of this step asserted one configuration and died on
      # the first cell, which measured nothing: the failure was OSError(EINVAL)
      # at time.sleep(), so the date check never even ran. Separating the date
      # check from the sleep check, and running the monotonic switch both ways,
      # is what makes the outcome interpretable either way.
      - name: 'Gate 1: measure the clock-shift configuration matrix'
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$PROBE_DIR"
          cat > "$PROBE_DIR/cell.py" <<'PY'
          """One matrix cell: does the date shift, does sleep survive, do timed waits return?

          Each probe is independent and reported even when a later one fails, so a
          cell that breaks still says WHERE it broke.
          """
          import threading
          import time
          from datetime import UTC, date, datetime

          print(f"today={date.today().isoformat()}", flush=True)
          print(f"utc={datetime.now(UTC).date().isoformat()}", flush=True)
          print(f"monotonic={time.monotonic():.1f}", flush=True)

          before = time.time()
          try:
              time.sleep(1.2)
              status = "ok"
          except OSError as exc:
              status = f"OSError{exc.errno}"
          print(f"sleep={status} wall_delta={time.time() - before:.2f}", flush=True)

          # The documented CLOCK_MONOTONIC hazard (libfaketime#142) lives in
          # condition-variable waits, which is what xdist workers and CPython
          # locks sit on. A hang here is the finding.
          before = time.perf_counter()
          threading.Event().wait(0.5)
          print(f"event_wait={time.perf_counter() - before:.2f}", flush=True)
          PY

          run_cell() {
            local label="$1" dont_fake="$2" rc=0 out
            out="$(timeout -s KILL 30 env \
              LD_PRELOAD="$FT_LIB" FAKETIME="$ANCHOR" \
              ${dont_fake:+FAKETIME_DONT_FAKE_MONOTONIC=1} \
              python -u "$PROBE_DIR/cell.py" 2>&1)" || rc=$?
            if [ "$rc" -eq 137 ] || [ "$rc" -eq 124 ]; then
              out="${out}"$'\n'"VERDICT=HANG (killed after 30s)"
            fi
            printf '%s|%s|%s\n' "$label" "$rc" "$(echo "$out" | tr '\n|' '  ')" \
              >> "$PROBE_DIR/matrix.txt"
            echo "--- $label (rc=$rc) ---"
            echo "$out"
          }

          : > "$PROBE_DIR/matrix.txt"
          run_cell "DONT_FAKE_MONOTONIC=1" 1
          run_cell "DONT_FAKE_MONOTONIC unset" ""
          echo "matrix written to $PROBE_DIR/matrix.txt"

      - name: 'Gate 1b: the chosen configuration is actually usable'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          out="$(timeout -s KILL 60 env \
            LD_PRELOAD="$FT_LIB" FAKETIME="$ANCHOR" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            python -u "$PROBE_DIR/cell.py" 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::chosen configuration exited rc=$rc (137/124 means it HUNG)"
            exit 1
          fi
          value_of() { echo "$out" | tr ' ' '\n' | grep "^$1=" | cut -d= -f2; }
          today="$(value_of today)"
          now_utc="$(value_of utc)"
          [ "$today" = "$ANCHOR_DATE" ] || { echo "::error::date.today()=$today != $ANCHOR_DATE"; exit 1; }
          [ "$now_utc" = "$ANCHOR_DATE" ] || { echo "::error::datetime.now(UTC)=$now_utc != $ANCHOR_DATE"; exit 1; }
          [ "$(value_of sleep)" = "ok" ] || { echo "::error::time.sleep() raised $(value_of sleep)"; exit 1; }
          # An advancing clock, not a frozen one, and timed waits that still return.
          python - "$(value_of wall_delta)" "$(value_of event_wait)" <<'PY'
          import sys
          slept, waited = float(sys.argv[1]), float(sys.argv[2])
          if slept <= 0.5:
              raise SystemExit("clock did not advance -- this is a FROZEN clock, not a shifted one")
          if not 0.3 <= waited <= 5.0:
              raise SystemExit(f"Event.wait(0.5) took {waited}s -- the monotonic domain is corrupted")
          PY

      # Not a gate. A shifted wall clock breaks things that have nothing to do
      # with date bombs, and the full-suite diff below is unreadable unless we
      # know which classes those are up front. It reports rather than fails --
      # note the absence of `set -e` and the trailing `|| true`, so no
      # continue-on-error flag is needed to keep an expected TLS failure from
      # stopping the probe.
      - name: 'Gate 1c: inventory the collateral damage (advisory)'
        timeout-minutes: 5
        shell: bash
        run: |
          set -uo pipefail
          timeout -s KILL 90 env \
            LD_PRELOAD="$FT_LIB" FAKETIME="$ANCHOR" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            python -u - > "$PROBE_DIR/collateral.txt" 2>&1 <<'PY'
          import os
          import socket
          import sqlite3
          import ssl
          import subprocess
          import sys
          import time

          def report(label, fn):
              try:
                  print(f"{label}: {fn()}", flush=True)
              except Exception as exc:
                  print(f"{label}: {type(exc).__name__}: {str(exc)[:90]}", flush=True)

          report("subprocess child date", lambda: subprocess.run(
              [sys.executable, "-c", "from datetime import date; print(date.today())"],
              capture_output=True, text=True, timeout=30).stdout.strip())
          report("sqlite CURRENT_TIMESTAMP", lambda: sqlite3.connect(":memory:")
                 .execute("select current_timestamp").fetchone()[0])

          def mtime_skew():
              open("/tmp/_clockprobe_mtime", "w").close()
              return f"{time.time() - os.path.getmtime('/tmp/_clockprobe_mtime'):+.0f}s"

          report("time.time() minus file mtime", mtime_skew)

          def tls():
              ctx = ssl.create_default_context()
              with socket.create_connection(("pypi.org", 443), timeout=15) as raw:
                  with ctx.wrap_socket(raw, server_hostname="pypi.org") as tls_sock:
                      return f"OK {tls_sock.version()}"

          report("TLS handshake to pypi.org", tls)
          PY
          cat "$PROBE_DIR/collateral.txt" || true

      - name: Write the worker-propagation control test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_DIR"
          cat > "$PROBE_DIR/test_clock_reaches_workers.py" <<'PY'
          """Does the shifted clock reach the pytest-xdist WORKERS, not just the parent?

          Deliberately kept out of tests/: it is scaffolding for one measurement, it
          would fail every ordinary run, and the repo's ledgers should not have to
          carry a file that exists for an afternoon.
          """
          import os
          from datetime import UTC, date, datetime

          import pytest

          EXPECTED = os.environ["CLOCKPROBE_EXPECTED_DATE"]


          @pytest.mark.parametrize("shard", range(8))
          def test_the_shifted_clock_reaches_this_worker(shard: int) -> None:
              worker = os.environ.get("PYTEST_XDIST_WORKER", "<no-worker>")
              today = date.today().isoformat()
              now_utc = datetime.now(UTC).date().isoformat()
              assert today == EXPECTED, f"{worker}: date.today()={today} expected={EXPECTED}"
              assert now_utc == EXPECTED, f"{worker}: datetime.now(UTC)={now_utc} expected={EXPECTED}"
          PY
          echo "CLOCKPROBE_EXPECTED_DATE=$ANCHOR_DATE" >> "$GITHUB_ENV"

      - name: 'Gate 2: the control test FAILS without faketime (it is not vacuous)'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python -m pytest "$PROBE_DIR" -q --no-header -p no:cacheprovider > /tmp/neg.log 2>&1 || rc=$?
          tail -3 /tmp/neg.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the control test passed on the REAL clock -- it proves nothing"
            exit 1
          fi
          echo "control correctly fails unshifted (rc=$rc)"

      - name: 'Gate 3: the shifted clock reaches xdist workers at -n 4'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout -s KILL 300 env \
            LD_PRELOAD="$FT_LIB" FAKETIME="$ANCHOR" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            python -m pytest "$PROBE_DIR" -q --no-header \
            -n 4 --dist=loadscope -p no:cacheprovider 2>&1 | tee /tmp/pos.log
          tail -3 /tmp/pos.log

      - name: 'Measure A: full suite on the REAL clock (baseline)'
        if: env.RUN_FULL == 'true'
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          start=$(date +%s)
          python -m pytest tests/ -q --no-header -n 4 -p no:cacheprovider > /tmp/base.log 2>&1 || rc=$?
          {
            echo "BASE_SECONDS=$(( $(date +%s) - start ))"
            echo "BASE_RC=$rc"
            echo "BASE_LINE=$(grep -E '^[0-9]+ (passed|failed)' /tmp/base.log | tail -1)"
          } >> "$GITHUB_ENV"
          tail -3 /tmp/base.log

      - name: 'Measure B: full suite under the shifted clock at -n 4'
        if: env.RUN_FULL == 'true'
        # A hang here is a RESULT, not an accident: it is the documented
        # xdist + LD_PRELOAD hazard. Bound it so the job still reports.
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          start=$(date +%s)
          env LD_PRELOAD="$FT_LIB" FAKETIME="$ANCHOR" FAKETIME_DONT_FAKE_MONOTONIC=1 \
            python -m pytest tests/ -q --no-header -n 4 \
            -p no:cacheprovider > /tmp/shift.log 2>&1 || rc=$?
          {
            echo "SHIFT_SECONDS=$(( $(date +%s) - start ))"
            echo "SHIFT_RC=$rc"
            echo "SHIFT_LINE=$(grep -E '^[0-9]+ (passed|failed)' /tmp/shift.log | tail -1)"
          } >> "$GITHUB_ENV"
          echo "--- failures under the shifted clock (rc=$rc) ---"
          grep -E '^(FAILED|ERROR)' /tmp/shift.log | head -60 || echo "(none)"

      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## shifted-clock probe"
            echo
            echo "| what | value |"
            echo "|---|---|"
            echo "| anchor | \`$ANCHOR\` (${ANCHOR_DATE:-n/a}) |"
            echo "| libfaketime | built from \`${FT_COMMIT:0:12}\` (v0.9.12) |"
            echo "| baseline (real clock, -n 4) | ${BASE_LINE:-not run} — ${BASE_SECONDS:-?}s (rc=${BASE_RC:-?}) |"
            echo "| shifted (-n 4) | ${SHIFT_LINE:-not run} — ${SHIFT_SECONDS:-?}s (rc=${SHIFT_RC:-?}) |"
            echo
            if [ -s "${PROBE_DIR}/matrix.txt" ]; then
              echo "### configuration matrix"
              echo
              echo "| config | rc | observed |"
              echo "|---|---|---|"
              while IFS='|' read -r label rc observed; do
                echo "| \`$label\` | $rc | $observed |"
              done < "$PROBE_DIR/matrix.txt"
              echo
            fi
            if [ -s "${PROBE_DIR}/collateral.txt" ]; then
              echo "### collateral damage (not date bombs — expect these to go red)"
              echo '```'
              cat "$PROBE_DIR/collateral.txt"
              echo '```'
              echo
            fi
            if [ -f /tmp/shift.log ] && [ -f /tmp/base.log ]; then
              echo "### tests that fail ONLY under the shifted clock"
              echo '```'
              comm -13 \
                <(grep -E '^(FAILED|ERROR)' /tmp/base.log | sort -u) \
                <(grep -E '^(FAILED|ERROR)' /tmp/shift.log | sort -u) | head -80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shifted-clock-probe-logs
          path: |
            /tmp/*.log
            /tmp/clockprobe/*.txt
          if-no-files-found: warn
          retention-days: 7
