# live-window: any-trigger  # deploy-live-overlay-daemon (2026-07-07)
#
# Deterministic CI deploy for the live_overlay_daemon Railway service.
#
# Why this exists: Railway's native GitHub auto-deploy for this service is not
# firing (the connection references the pre-rename `skippALGO` org slug; the
# last git-triggered deploy stuck at an old commit), so merges to main did NOT
# reach production and required a manual `railway up`. This workflow makes the
# deploy deterministic: every main push that touches the daemon runs the
# SHA-stamping wrapper, so production tracks main AND `live_overlay_build_info`
# shows the real deployed commit.
#
# Requires the `RAILWAY_TOKEN` secret (a project token for the skipp-algo
# project). Without it the job no-ops with a notice, so this file is inert
# until the secret is added.
#
# If Railway's native auto-deploy is ever repaired, disable one of the two to
# avoid double deploys (prefer this workflow — it stamps the commit).
name: "deploy-live-overlay-daemon"

on:
  push:
    branches: [main]
    paths:
      - "services/live_overlay_daemon/**"
      - "scripts/deploy_live_overlay.sh"
      - ".github/workflows/deploy-live-overlay-daemon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; never cancel an in-flight deploy (a half-applied
  # container swap is worse than a slightly stale one). A newer run waits.
  group: deploy-live-overlay-daemon
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The token is scoped to only the steps that use it (gate/deploy/verify),
      # not checkout/install. A step output gates the rest, because step-level
      # env is not visible to a step's own `if:`.
      - name: Check Railway token presence
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::notice::Missing secret RAILWAY_TOKEN; skipping deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.gate.outputs.run == 'true'
        # SC-02 (supply-chain): exact pin, no floating range. --ignore-scripts
        # blocks arbitrary npm lifecycle scripts from the dependency tree.
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @railway/cli@5.23.3

      - name: Deploy live_overlay_daemon (SHA-stamped)
        id: deploy
        if: steps.gate.outputs.run == 'true'
        # EXACTLY the token-only env `railway up` is proven to work with
        # (2026-07-07 07:49 deploy). Empirically (dispatch 28859622704): adding
        # RAILWAY_PROJECT_ID to the env makes `railway up` fail instantly under
        # a project token, and `railway deployment list` does not work under a
        # project token at all ("No linked project found") -- so the verify
        # step below uses the public GraphQL API instead of the CLI.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_GIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Job start epoch: the verify step accepts only deployments created
          # after this instant, so a stale prior SUCCESS can never false-pass.
          echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          scripts/deploy_live_overlay.sh

      - name: Verify deployment reached SUCCESS
        if: steps.gate.outputs.run == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `railway up --detach` returns after the upload, so a Railway-side
        # build/healthcheck failure would otherwise leave CI green while the old
        # container keeps serving -- the exact silent no-op class this workflow
        # exists to kill. Poll the Railway GraphQL API (project tokens are
        # first-class there, via the Project-Access-Token header; the CLI's
        # `deployment list` rejects them) until a deployment CREATED AFTER the
        # job started reaches a terminal state; fail on anything but SUCCESS.
        run: |
          set -euo pipefail
          started="${{ steps.deploy.outputs.started }}"
          payload='{"query":"query { deployments(first: 1, input: { projectId: \"0616a3b7-7b7f-41d1-8fac-a0b8922c94ca\", environmentId: \"470fbd0f-894d-46cd-8722-6b072d255d99\", serviceId: \"705582c5-ba8b-4c6e-848c-33bffe0a61b0\" }) { edges { node { id status createdAt } } } }"}'
          for i in $(seq 1 42); do
            # Fail-soft per poll (transient API blips), errors VISIBLE.
            resp="$(curl -sS -m 15 -H "Project-Access-Token: ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" https://backboard.railway.com/graphql/v2 || true)"
            errs="$(jq -r '.errors[]?.message // empty' <<<"$resp" || true)"
            [[ -n "$errs" ]] && echo "[$i] GraphQL error: $errs"
            line="$(jq -r '.data.deployments.edges[0].node // empty | [.id, .status, ((.createdAt // "1970-01-01T00:00:00Z") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)] | @tsv' <<<"$resp" || true)"
            IFS=$'\t' read -r dep_id dep_status dep_created <<<"$line" || true
            echo "[$i] newest deployment ${dep_id:0:8}: ${dep_status:-none} created=${dep_created:-?} (job started ${started})"
            if [[ -n "${dep_id:-}" && -n "${dep_created:-}" && "${dep_created:-0}" -ge "${started:-0}" ]]; then
              case "$dep_status" in
                SUCCESS) echo "New deployment healthy."; exit 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED)
                  echo "::error::New deployment ended in status $dep_status"; exit 1 ;;
              esac
            fi
            sleep 20
          done
          echo "::error::No new deployment reached SUCCESS within ~14 min"; exit 1
