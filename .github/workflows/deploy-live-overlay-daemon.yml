# live-window: any-trigger  # deploy-live-overlay-daemon (2026-07-07)
#
# Deterministic CI deploy for the live_overlay_daemon Railway service.
#
# Why this exists: Railway's native GitHub auto-deploy for this service is not
# firing (the connection references the pre-rename `skippALGO` org slug; the
# last git-triggered deploy stuck at an old commit), so merges to main did NOT
# reach production and required a manual `railway up`. This workflow makes the
# deploy deterministic: every main push that touches the daemon runs the
# SHA-stamping wrapper, so production tracks main AND `live_overlay_build_info`
# shows the real deployed commit.
#
# Requires the `RAILWAY_TOKEN` secret (a project token for the skipp-algo
# project). Without it the job no-ops with a notice, so this file is inert
# until the secret is added.
#
# If Railway's native auto-deploy is ever repaired, disable one of the two to
# avoid double deploys (prefer this workflow — it stamps the commit).
name: "deploy-live-overlay-daemon"

on:
  push:
    branches: [main]
    paths:
      - "services/live_overlay_daemon/**"
      - "scripts/deploy_live_overlay.sh"
      - ".github/workflows/deploy-live-overlay-daemon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; never cancel an in-flight deploy (a half-applied
  # container swap is worse than a slightly stale one). A newer run waits.
  group: deploy-live-overlay-daemon
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The token is scoped to only the steps that use it (gate/deploy/verify),
      # not checkout/install. A step output gates the rest, because step-level
      # env is not visible to a step's own `if:`.
      - name: Check Railway token presence
        id: gate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "::notice::Missing secret RAILWAY_TOKEN; skipping deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.gate.outputs.run == 'true'
        # SC-02 (supply-chain): exact pin, no floating range. --ignore-scripts
        # blocks arbitrary npm lifecycle scripts from the dependency tree.
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @railway/cli@5.23.3

      - name: Deploy live_overlay_daemon (SHA-stamped)
        id: deploy
        if: steps.gate.outputs.run == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_GIT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Record the newest deployment BEFORE deploying so the verify step
          # correlates to OUR new deployment (not a stale prior SUCCESS).
          baseline=$(railway deployment list --service live_overlay_daemon \
            --environment production --json 2>/dev/null | jq -r '.[0].id // "none"')
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "Baseline (pre-deploy) newest deployment: $baseline"
          scripts/deploy_live_overlay.sh

      - name: Verify deployment reached SUCCESS
        if: steps.gate.outputs.run == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `railway up --detach` returns after the upload, so a Railway-side
        # build/healthcheck failure would otherwise leave CI green while the old
        # container keeps serving -- the exact silent no-op class this workflow
        # exists to kill. Wait for a NEW deployment to reach a terminal state
        # and fail on anything but SUCCESS.
        run: |
          set -euo pipefail
          baseline="${{ steps.deploy.outputs.baseline }}"
          for i in $(seq 1 42); do
            # `|| true` so a transient API blip yields an empty line instead of
            # tripping set -e; parse via parameter expansion (no read/set -e trap).
            line="$(railway deployment list --service live_overlay_daemon \
              --environment production --json 2>/dev/null \
              | jq -r '.[0] | "\(.id) \(.status)"' || true)"
            id="${line%% *}"; status="${line##* }"
            echo "[$i] newest deployment ${id:0:8}: ${status:-none} (baseline ${baseline:0:8})"
            if [[ -n "$id" && "$id" != "$baseline" ]]; then
              case "$status" in
                SUCCESS) echo "New deployment healthy."; exit 0 ;;
                FAILED|CRASHED|REMOVED|SKIPPED)
                  echo "::error::New deployment ended in status $status"; exit 1 ;;
              esac
            fi
            sleep 20
          done
          echo "::error::New deployment did not reach SUCCESS within ~14 min"; exit 1
