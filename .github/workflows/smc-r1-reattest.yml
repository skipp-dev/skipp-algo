# live-window: off-hours-only  # Pre-US-open cron; this workflow itself never opens a browser.
# It proposes the pin bump and dispatches tv-save-consumer-source (reattest
# mode) on the proposal branch; THAT run does the TradingView writes and still
# refuses inside a declared operator window (scripts/check_tv_operator_window).
#
# The second half of the operator decision of 2026-08-04: the deliberate
# re-attestation PR that scripts/hold_r1_attested_sources.py defers to is
# automated. The refresh holds the two R1-attested companions on their
# attested import pin (9 refresh ticks/day cannot carry an evidence-grade
# TradingView session each); this workflow moves the pin at most once per
# weekday, together with fresh evidence, through the guard's sanctioned door:
# "a PR that lands a fresh rollout with new evidence, passes"
# (scripts/check_r1_attested_sources.py).
#
# Division of labour:
#   here      - decide (attested pin behind the published library?), force-push
#               the FIXED proposal branch bot/r1-reattest with the pin bump,
#               dispatch tv-save-consumer-source on that branch.
#   tv-save   - write pass (saves + rebind), independent verify-only pass,
#               scripts/smc_r1_generate_attestation (fail-closed: pin-only
#               diffs proven by hash reconstruction, else it demands a human),
#               contract regeneration, in-run chain self-check, seeded
#               evidence commit, PR + auto-merge.
#
# The FIXED branch name is deliberate: a run whose dispatched save was refused
# (operator window) or failed leaves only this one branch behind, and the next
# scheduled run force-pushes over it -- no bot/r1-reattest-<run> accumulation,
# which is the treadmill #4435 closed for the refresh.

name: smc-r1-reattest

on:
  schedule:
    # Weekdays 12:07Z: after the morning refresh ticks have moved the
    # published library (refresh normally completes pre-market ~09-13Z),
    # before the US open -- the same pre-market posture as the chained save.
    #
    # Since 2026-08-14 the cron is the FLOOR, not the cadence. Refreshes land
    # 12:57-17:55Z, so a cron-only proposer always re-attested YESTERDAY's
    # final version: SMC_Event_Overlay renders exclusively event-risk fields
    # (NEXT_EVENT_TIME, EVENT_RISK_LEVEL, SYMBOL_EVENT_BLOCKED, ...) and its
    # data ran a structural ~1 trading day behind the fourteen neighbouring
    # consumers -- an overlay whose whole purpose is events showing an older
    # event table than the Suite beside it. The workflow_run trigger below
    # closes that gap; the cron remains so one missed event never strands the
    # pin for good (self-healing floor, watched by the freshness monitor).
    - cron: "7 12 * * 1-5"
  workflow_dispatch: {}
  # Event-driven: re-attest as soon as a consumer-save chain SUCCEEDS on main.
  # That moment is exactly when (a) the published library may have moved and
  # (b) the tradingview-session queue has just freed up for the measuring
  # save this workflow dispatches. Two known traps, both guarded in the job
  # condition below rather than here (workflow_run has no conclusion filter):
  #   * workflow_run also fires on 'cancelled' and 'failure' -- the 2026-08-13
  #     saturated-queue incident showed cancelled completions are routine.
  #   * The measuring save this workflow dispatches IS a
  #     tv-save-consumer-source run (on bot/r1-reattest); without the
  #     head_branch filter every proposal would re-trigger the proposer.
  #
  # zizmor: ignore[dangerous-triggers] -- workflow_run source is the same-repo
  # tv-save-consumer-source (no fork/PR-controlled context reaches it: that
  # workflow has no pull_request trigger), the same argument its two existing
  # consumers carry (tv-post-mutation-verify, tv-save-consumer-source). This
  # job reads only the completed run's conclusion/head_branch from the event,
  # checks out main, and pushes a fixed bot branch; permissions stay
  # contents:read with the push authenticated by GH_PAT as before.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["tv-save-consumer-source"]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash

# F-V6-A2.1: unbuffered Python in every step, including the inline decide
# probes -- a buffered failure message is a silent failure message.
env:
  PYTHONUNBUFFERED: "1"

concurrency:
  # One proposal at a time; a second concurrent run would race the fixed
  # branch and the chain append (which is head-checked and would refuse).
  group: smc-r1-reattest
  cancel-in-progress: false

jobs:
  propose:
    # The two workflow_run guards (see the `on:` comment): only a SUCCESSFUL
    # save-chain on MAIN counts. A cancelled/failed completion means the queue
    # displaced or the save broke -- proposing then would race a TradingView
    # state nobody verified. And the measuring save this workflow dispatches
    # completes on bot/r1-reattest; without the head_branch filter every
    # proposal would re-trigger this proposer in a loop. Cron and manual
    # dispatch pass untouched: github.event.workflow_run is empty for them.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Decide whether the attested pin is behind the published library
        id: decide
        run: |
          set -euo pipefail
          attested="$(python3 -c '
          import pathlib, re
          text = pathlib.Path("SMC_Event_Overlay.pine").read_text(encoding="utf-8")
          match = re.search(r"import preuss_steffen/smc_micro_profiles_generated/(\d+) as mp", text)
          if match is None:
              raise SystemExit("Event Overlay carries no micro-profile import pin")
          print(match.group(1))
          ')"
          published="$(python3 -c '
          import json
          manifest = json.load(open("artifacts/tradingview/library_release_manifest.json"))
          print(int(manifest["library"]["publishedVersion"]))
          ')"
          echo "attested=/${attested} published=/${published}"
          if [ "${attested}" -eq "${published}" ]; then
            echo "Attested pin already matches the published library; nothing to re-attest."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "${attested}" -gt "${published}" ]; then
            # Fail loudly instead of proposing a DOWNGRADE: an attested pin
            # ahead of the manifest means the manifest lags reality (the
            # tv-save drift gate owns that case), not that the pin must move.
            echo "::error::attested pin /${attested} is AHEAD of the manifest /${published} -- refusing to propose a downgrade"
            exit 1
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "target=${published}" >> "$GITHUB_OUTPUT"
          fi

      - name: Force-push the pin-bump proposal branch
        if: steps.decide.outputs.proceed == 'true'
        env:
          # A PAT is required: pushes with the built-in github.token trigger
          # no workflows, so the proposal PR would never get its fast-gates
          # run (same rationale as the refresh's bot/* pushes).
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET: ${{ steps.decide.outputs.target }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          # The heredoc keeps the body free of single quotes: inside a
          # `python3 -c '...'` string, an inner `os.environ['TARGET']` closes
          # the shell quote and Python sees a bare name (NameError -- run
          # 31007122044, the first non-no-op day). `<<'PY'` is unexpanded, so
          # the value still arrives only through the environment.
          TARGET="${TARGET}" python3 <<'PY'
          import os, pathlib, re
          target = int(os.environ["TARGET"])
          path = pathlib.Path("SMC_Event_Overlay.pine")
          text = path.read_text(encoding="utf-8")
          new = re.sub(
              r"(import preuss_steffen/smc_micro_profiles_generated/)\d+( as mp)",
              rf"\g<1>{target}\g<2>",
              text,
              count=1,
          )
          assert new != text, "pin substitution was a no-op"
          path.write_text(new, encoding="utf-8")
          PY
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="bot/r1-reattest"
          # Retire a proposal PR an earlier cycle left open BEFORE the pin-only
          # state becomes its head. `smc-fast-pr-gates` triggers on
          # pull_request/push:main/merge_group -- never on a push to bot/*, so
          # without an open PR this window produces no run at all. With one, the
          # R1 guard correctly reddens it (a pin change whose evidence does not
          # exist yet) and #4894 paid two such runs per stalled cycle.
          #
          # Nothing is lost: this step force-pushes over that branch anyway.
          # Measured on #4894 -- the merge added exactly ONE chain entry
          # (smc_r1_evidence_chain.json | 5 +), i.e. the earlier cycle's
          # evidence commit was already discarded.
          #
          # The stall itself stays observed, and NOT by those red runs: they
          # only mean "an open PR's head is a pin-only state", so a cycle dying
          # before the push produces no signal at all. The outcome is watched by
          # the `Pine consumer pin drifts from published TradingView version`
          # Grafana rule over pine-library-version-monitor (built for exactly
          # this blindness, #3599/#3603; measured firing 2026-08-20T04:35:30Z).
          # workflow-freshness-monitor cannot carry it -- this chain is listed
          # `:any`, so the proposer running is enough to keep it green.
          stale="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" \
            --state open --json number --jq '.[0].number // empty')"
          if [ -n "${stale}" ]; then
            gh pr close --repo "${GITHUB_REPOSITORY}" "${stale}" \
              --comment "Superseded: this cycle force-pushes ${BRANCH} to /${TARGET}. A fresh PR follows once its evidence exists."
          fi
          git checkout -b "${BRANCH}"
          git add SMC_Event_Overlay.pine
          git commit -m "chore(pine): move the R1 Event Overlay pin to /${TARGET} for re-attestation"
          # Non-main, fixed proposal ref; under `set -euo pipefail` a rejected
          # push fails this step loudly instead of dispatching against a
          # branch that never moved.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

      - name: Dispatch the measuring save on the proposal branch
        if: steps.decide.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          gh workflow run tv-save-consumer-source.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref bot/r1-reattest \
            -f reattest=true
