# live-window: off-hours-only  # F-V6-F2.1: schedule-only report generation, no repo writes (emails an Outlook digest)
name: ops-digest-daily

# Daily ops digest -> Outlook email (use case #4). Reads the sweep-trap shadow,
# open_prep feature-importance, and public calibration artifacts from the
# checkout and emails a compact summary via Composio (OUTLOOK_SEND_EMAIL). It is
# inert unless the production Composio key/account + recipient are configured, and
# fail-soft so a delivery hiccup never turns the workflow red.

on:
  schedule:
    # 07:00 UTC — after credential-health-check (06:00) and before open-prep (~08:00).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + log the digest but do not send the email"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ops-digest-daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  digest:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 1

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Hydrate live sweep-trap shadow snapshot
        # sweep-trap-shadow-daily.yml publishes the LIVE snapshot to
        # bot/live-sweep-trap-shadow (only its JSONL ledger is committed back to
        # main); the copy under artifacts/monitoring/ on main is the permanent
        # no-data seed from #3414. Without this the digest reads that seed and
        # reports "0 / 40, INCONCLUSIVE" regardless of how the study is doing.
        # Fail-soft: on any hiccup ops_digest falls back to the seed and says so.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          dest="artifacts/monitoring/latest/sweep_trap_shadow.json"
          mkdir -p "$(dirname "${dest}")"
          tmp="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/artifacts/monitoring/latest/sweep_trap_shadow.json?ref=bot/live-sweep-trap-shadow" \
            -H "Accept: application/vnd.github.raw+json" > "${tmp}" 2>fetch_err.log
          rc=$?
          if [ "${rc}" -ne 0 ] || ! python -c 'import json,sys; json.load(open(sys.argv[1]))' "${tmp}" 2>/dev/null; then
            echo "::warning title=ops-digest::could not fetch the published sweep snapshot (rc=${rc}); digest falls back to the committed seed"
            sed -n '1,5p' fetch_err.log 2>/dev/null
            rm -f "${tmp}"
            exit 0
          fi
          mv "${tmp}" "${dest}"
          echo "::notice title=ops-digest::hydrated live sweep snapshot from bot/live-sweep-trap-shadow"
          exit 0

      - name: Build and send ops digest
        # CONTINUE-ON-ERROR-INTENTIONAL: best-effort convenience digest; a delivery hiccup must never fail the cron.
        continue-on-error: true
        env:
          COMPOSIO_ENVIRONMENT: prod
          COMPOSIO_PROD_API_KEY: ${{ secrets.COMPOSIO_PROD_API_KEY }}
          COMPOSIO_PROD_USER_ID: ${{ vars.COMPOSIO_PROD_USER_ID }}
          COMPOSIO_OUTLOOK_WRITE_ACCOUNT_ID: ${{ vars.COMPOSIO_OUTLOOK_WRITE_ACCOUNT_ID }}
          OPS_DIGEST_EMAIL_TO: ${{ vars.OPS_DIGEST_EMAIL_TO }}
        run: |
          set +e
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          if [ -z "${COMPOSIO_PROD_API_KEY:-}" ] && [ -z "$DRY" ]; then
            echo "::notice title=ops-digest::COMPOSIO_PROD_API_KEY not set — rendering digest only (no send)."
            DRY="--dry-run"
          fi
          # composio_ops talks to the Composio REST API over stdlib urllib —
          # no package to install.
          python scripts/ops_digest.py $DRY --output artifacts/ci/ops_digest.html
          {
            echo "## Ops digest"
            echo ""
            echo '```'
            python scripts/ops_digest.py --dry-run 2>/dev/null | sed -n '1,60p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload rendered digest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ops-digest-html
          path: artifacts/ci/ops_digest.html
          if-no-files-found: ignore
          retention-days: 14
