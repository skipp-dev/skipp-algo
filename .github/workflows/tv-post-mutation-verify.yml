# live-window: any-trigger  # dispatches a READ-ONLY verification; opens no TradingView session of its own
name: tv-post-mutation-verify

# Operator decision 2026-08-01: the operator's full browser is the normal
# production writer on the TradingView account — automation is the guest — and
# the session concurrency group serialises CI against CI only (#4316).
# TradingView autosaves from the operator's browser, so a tab that still holds
# the pre-mutation state can silently write it back minutes after a mutating
# run finished. Until now the first thing that could notice was the 05:17Z
# verify cron: up to a day later. Run 30700389375 is the measured shape of the
# cost — a failed mutation left the managed layout broken for 67 minutes and
# nothing automated was going to look at it that day.
#
# This workflow shortens that window to ~15 minutes: after every MUTATING
# tv-save-consumer-source run it waits and dispatches a read-only verification
# of the same surface.
#
# Two properties are load-bearing and pinned by
# tests/test_workflow_tv_post_mutation_verify_contract.py:
#
#   * The wait happens OUTSIDE the tradingview-session concurrency group. A
#     sleep inside that group would hold the single TradingView account hostage
#     for 15 idle minutes per mutation. Only the dispatched verify run joins
#     the session group, and only when it actually starts.
#
#   * The loop terminates by measurement, not by convention: the trigger fires
#     for EVERY completed tv-save-consumer-source run, including the verify
#     runs this workflow dispatches. The gate reads the completed run's
#     published binding snapshot and exits when executionMode is verify-only.
#     A run whose snapshot is missing (died before upload) is treated as
#     mutating — nobody can prove it did not write, so the cheap re-verify
#     runs. Fail closed, in the direction of looking. Two exceptions, both
#     read from GitHub's own records rather than anyone's claim:
#
#       - decided 2026-08-03: a SKIPPED trigger run exits at the job gate —
#         skipped means the save job never started.
#       - decided 2026-08-22: a trigger run whose SAVE JOB never ran exits at
#         the mode gate. Since #4998 split the save workflow into a
#         supersession-gate job plus the save job, a superseded (or
#         failed-refresh-guard) run completes as SUCCESS with a skipped save
#         job — the 2026-08-03 skipped exit never sees it — and a run
#         cancelled while still queued completes with no jobs at all. Both
#         used to earn a fail-closed verify-only dispatch despite provably
#         never opening a browser. Measured 2026-08-22: 11 queued saves
#         cancelled at 09:40Z produced one dispatch every ~15 min into the
#         already starved tradingview-session queue.

on:
  # zizmor: ignore[dangerous-triggers] -- workflow_run source is the same-repo
  # tv-save-consumer-source (no fork/PR-controlled context reaches it: that
  # workflow has no pull_request trigger). This job checks out the DEFAULT
  # BRANCH read-only and persists no credentials -- workflow_run resolves
  # github.ref/github.sha to the default branch, never to anything the trigger
  # run controlled -- reads one artifact of the completed run, and dispatches
  # with fixed inputs; permissions are actions:write + contents:read only.
  # (Until 2026-08-23 this said "checks out nothing", and it was true: the
  # repair-decision step direct-invoked a scripts/*.py that was therefore not
  # on the runner at all. See the Checkout step below.)
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - tv-save-consumer-source
    types:
      - completed

permissions:
  actions: write # dispatch the verify run and read the trigger run's artifact
  contents: read

concurrency:
  # Deliberately NOT cancel-in-progress: a verify-triggered instance exits in
  # seconds at the loop guard, so the queue stays shallow — and cancelling a
  # sleeping instance when an unrelated verify run completes would silently
  # drop a pending re-verify whose mutation still deserves its +15min look.
  group: tv-post-mutation-verify
  cancel-in-progress: false
  # 2026-08-06: and cancel-in-progress alone never delivered that. Under the
  # default `queue: single` the group holds exactly one pending run and a newer
  # entrant CANCELS it -- the pending re-verify was dropped anyway, just by the
  # queue rule rather than by pre-emption. `queue: max` is what keeps it alive.
  queue: max

env:
  PYTHONUNBUFFERED: "1"
  # Required by tests/test_workflow_invoked_scripts_importable.py and
  # tests/test_workflow_pythonpath_for_direct_invoke.py: the repair-decision
  # step below direct-invokes `python3 scripts/tv_repair_watchdog_decision.py`
  # rather than `python -m scripts.<module>`.
  PYTHONPATH: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  reverify:
    # SKIPPED trigger runs exit here (operator decision 2026-08-03). Skipped
    # means the save job's own gate stopped it before any step ran — GitHub's
    # run state, not an inference — so there is nothing to re-verify. Measured
    # trigger: three red library-refresh crons on 2026-08-03 produced four
    # fail-closed re-verifies (~6 min of TradingView session each) whose only
    # finding was that nothing had been mutated.
    #
    # ONLY skipped. A FAILED run may have mutated before dying — run
    # 30700389375 removed both R1 companions and then failed — so failure,
    # cancelled and timed_out all still get the +15min look via the snapshot
    # gate below. The contract test pins that this condition never grows a
    # failure filter.
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      # The repair-decision step below direct-invokes
      # `python3 scripts/tv_repair_watchdog_decision.py`. A script only runs if
      # it is on the runner. Until 2026-08-23 this job checked out nothing, so
      # that call would have died with "can't open file .../scripts/
      # tv_repair_watchdog_decision.py", exit 2 under `set -euo pipefail`: the
      # job red, steps.repair_decision.outputs.dispatch empty, the watchdog
      # never firing -- and every single-task review saw only its own half.
      # tests/test_workflow_invoked_scripts_importable.py now sweeps EVERY
      # workflow that direct-invokes a scripts/*.py for a checkout in the same
      # job, ahead of the invocation (54 such jobs across 51 workflows; this
      # was the one).
      #
      # FIRST step, deliberately. The mode step below downloads the trigger
      # run's artifact into ./snapshot, and actions/checkout defaults to
      # `clean: true` (`git clean -ffdx`) -- a checkout placed after it would
      # delete the very snapshot the decision reads.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the completed run's execution mode from its snapshot
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mode="unknown"
          if gh run download "${TRIGGER_RUN_ID}" -n tradingview-consumer-bindings -D snapshot 2>/dev/null; then
            mode="$(jq -r '.executionMode // "unknown"' snapshot/tradingview_consumer_bindings.json 2>/dev/null || echo unknown)"
            # A write run that died BEFORE touching anything carries its own
            # proof: the snapshot it uploaded (the upload step runs on failure
            # too) has every mutation counter at zero. Measured 2026-08-22 on
            # run 32499587392, which refused at the library-publish drift gate
            # -- "manifest says 314, TradingView lists 315" -- and uploaded
            # executionMode=write with sourceSavesCompleted 0, layoutSaved
            # false, savedChartUrls []. Reading only executionMode turned each
            # such refusal into a +15min verify dispatch, and with the saves
            # failing systematically that chain sustained itself: 15 dispatches
            # sat 14-15 min behind a completed run that day, flooding the
            # single-slot TradingView queue the drift alerts were waiting on.
            # jq -e is the fail-closed half: a missing field, a changed schema
            # or a corrupt file exits non-zero and the mode stays "write", so
            # only a snapshot that PROVES stillness ends the chain.
            if [ "${mode}" = "write" ] && jq -e '
                  .mutations
                  | has("sourceSavesCompleted") and has("producerInstancesRemoved")
                    and has("consumerInstancesRemoved") and has("bindingsRepaired")
                    and has("layoutSaved") and has("savedChartUrls")
                    and has("abandonedChartUrls") and has("partiallyRepairedChartUrls")
                    and has("savedWithoutAttestation")
                    and .sourceSavesCompleted == 0 and .producerInstancesRemoved == 0
                    and .consumerInstancesRemoved == 0 and .bindingsRepaired == 0
                    and .layoutSaved == false and (.savedChartUrls | length) == 0
                    and (.abandonedChartUrls | length) == 0
                    and (.partiallyRepairedChartUrls | length) == 0
                    and (.savedWithoutAttestation | length) == 0
                ' snapshot/tradingview_consumer_bindings.json >/dev/null 2>&1; then
              mode="write-no-mutation"
            fi
          else
            # No snapshot. Distinguish "the save job never ran" from "died
            # mid-run" via the trigger run's job list — GitHub's own record,
            # the only artifact-free proof that no browser was opened. A run
            # cancelled while queued has zero jobs (measured: run 32560401563);
            # a superseded/guard-skipped run has a save job with conclusion
            # "skipped" (skipped jobs DO carry started_at, so filter by
            # conclusion, measured: run 32467080904). Only an exact count of 0
            # flips the mode — a probe error yields "probe-error" and leaves
            # mode=unknown: fail closed, in the direction of looking.
            save_ran="$(gh api "repos/${GH_REPO}/actions/runs/${TRIGGER_RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "save") | select(.conclusion != "skipped")] | length' 2>/dev/null || echo probe-error)"
            if [ "${save_ran}" = "0" ]; then
              mode="never-ran"
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "trigger run ${TRIGGER_RUN_ID} executionMode: ${mode}"

      # Loop guard. The verify run this workflow dispatches completes and
      # re-triggers this workflow; its snapshot says verify-only and the chain
      # ends here — measured from the artifact, not inferred from event names.
      # Same exit for a trigger run whose save job never ran (superseded,
      # guard-skipped, or cancelled while queued): nothing touched the surface.
      - name: Stop when the completed run provably did not mutate
        if: ${{ steps.mode.outputs.mode == 'verify-only' || steps.mode.outputs.mode == 'never-ran' || steps.mode.outputs.mode == 'write-no-mutation' }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          echo "::notice::completed run was ${MODE} — no re-verification needed"

      - name: Wait 15 minutes before re-reading the mutated surface
        if: ${{ steps.mode.outputs.mode != 'verify-only' && steps.mode.outputs.mode != 'never-ran' && steps.mode.outputs.mode != 'write-no-mutation' }}
        run: sleep 900

      - name: Dispatch the read-only verification
        if: ${{ steps.mode.outputs.mode != 'verify-only' && steps.mode.outputs.mode != 'never-ran' && steps.mode.outputs.mode != 'write-no-mutation' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tv-save-consumer-source.yml/dispatches" \
            -d '{"ref":"main","inputs":{"verify_only":"true"}}'

      # The missing edge from measurement to action (2026-08-23). A verify-only
      # run already holds the freshest bindings snapshot in hand -- this reads
      # it and asks scripts/tv_repair_watchdog_decision.py (pure, no network,
      # independently tested) whether any consumer drifted and a repair is
      # warranted. Loop guard: gated on mode == 'verify-only' only, so a
      # repair-only run's OWN completion (which re-triggers this workflow via
      # the same workflow_run chain) can never ask this question about itself
      # -- decide() also refuses on executionMode != verify-only, so the guard
      # is enforced twice, once at the workflow gate and once inside the pure
      # function it calls.
      - name: Decide whether the layout needs a repair
        id: repair_decision
        if: ${{ always() && steps.mode.outputs.mode == 'verify-only' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # ET, not UTC: the daily dispatch cap must track the trading day the
          # refresh cadence itself runs against, not the runner's own clock --
          # GitHub-hosted runners run UTC. Exported for the WHOLE step so it
          # governs both `date` and jq's strflocaltime below: strflocaltime
          # reads the process's ambient zone, it does not accept a per-call
          # `TZ=` prefix the way a single `date` invocation can. Scoping TZ
          # only to the `date` call (as an earlier draft of this step did)
          # leaves jq computing in the runner's UTC and comparing a UTC
          # bucket-date against an ET "today" string -- measured locally at
          # 02:30Z: with TZ left ambient for jq alone, strflocaltime lands one
          # calendar day off from the ET date the shell had just computed, so
          # the comparison silently mismatches near midnight ET and the cap
          # miscounts. Runner tzdata is not a new dependency here: GitHub's
          # ubuntu-latest images ship the full IANA zoneinfo database already.
          TZ: America/New_York
        run: |
          set -euo pipefail
          # Der Deckel zaehlt die REPARATUR-Dispatches DIESES Waechters, nicht
          # jeden workflow_dispatch des Save-Workflows.
          #
          # Warum die alte Zaehlung falsch war, gemessen statt vermutet: an
          # ET-2026-08-22 gab es 12 workflow_dispatch-Laeufe von
          # tv-save-consumer-source -- und genau 12 Verify-Dispatches, die
          # DIESER Workflow 60 Zeilen weiter oben selbst abgesetzt hat. Die
          # gezaehlte Menge war also zu 100% die eigene Verify-Kette; kein
          # einziger Reparaturlauf war darunter. Mit einem Deckel von 3 waere er
          # ab der ERSTEN Entscheidung des Tages erschoepft gewesen, und jeder
          # Abend haette ein "::error:: Layout repair gave up" geliefert, das
          # "Operator noetig" behauptet, obwohl nichts kaputt ist. Die vier
          # Tage davor: 18/21/25/26 Waechter-Laeufe -- die Verwechslung ist der
          # Normalfall, nicht der Rand.
          #
          # Warum ES SO geht: die REST-API kennzeichnet einen Dispatch nicht mit
          # den Inputs, mit denen er ausgeloest wurde (deshalb war er ueber die
          # Save-Laeufe nicht unterscheidbar). Sie kennzeichnet aber jeden
          # SCHRITT jedes Laufs mit seinem conclusion, und "Dispatch the repair
          # run" laeuft ausschliesslich dann, wenn dieser Waechter eine
          # Reparatur bestellt hat -- das ist die eigene Handlung, direkt
          # abgelesen. Nachgemessen ueber alle 18 Waechter-Laeufe des
          # ET-2026-08-22: 18/18 beantworteten die Schritt-Abfrage, 0
          # Probe-Fehler, 13 s fuer die ganze Schleife.
          #
          # Der Schrittname unten ist ein Vertrag mit dem Schritt "Dispatch the
          # repair run" in dieser Datei -- umbenannt und nicht mitgezogen,
          # zaehlte der Deckel still 0 und der Waechter liefe unbegrenzt. Genau
          # diese Kopplung pinnt
          # tests/test_workflow_tv_post_mutation_verify_contract.py.
          today="$(date +%F)"
          # created>= filtert nach UTC und ist damit eine Obermenge des
          # ET-Tages (ET-Tagesbeginn liegt 4-5 h spaeter); die exakte
          # Tagesgrenze zieht strflocaltime unten unter TZ=America/New_York.
          # total_count zaehlt das ganze gefilterte Fenster, auch ueber die
          # 100er-Seite hinaus -- passt der Tag nicht in eine Seite, ist die
          # Tageszahl UNBEKANNT statt klein: fail closed, sonst waere ein
          # besonders lauter Tag genau der Tag, an dem der Deckel aufgeht.
          runs="$(gh api "repos/${GH_REPO}/actions/workflows/tv-post-mutation-verify.yml/runs?per_page=100&created=%3E%3D${today}")"
          total="$(printf '%s' "$runs" | jq '.total_count')"
          count_flag=""
          [ "${total}" -gt 100 ] && count_flag="--dispatch-count-unknown"
          # Der eigene Lauf ist ausgenommen: sein "Dispatch the repair run"
          # steht noch aus (conclusion null) und wuerde sich sonst selbst
          # gegen den Deckel zaehlen. Ueber die Konkurrenzgruppe laeuft
          # ohnehin hoechstens ein Waechter gleichzeitig.
          printf '%s' "$runs" | jq -r --arg today "$today" --arg self "${GITHUB_RUN_ID}" '
              [.workflow_runs[]
               | select((.created_at | fromdateiso8601 | strflocaltime("%Y-%m-%d")) == $today)
               | select((.id | tostring) != $self)
               | .id] | .[]' > "${RUNNER_TEMP:-/tmp}/watchdog_runs_today.txt"
          count=0
          while IFS= read -r run_id; do
            [ -z "${run_id}" ] && continue
            fired="$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '[.jobs[].steps[]? | select(.name == "Dispatch the repair run") | select(.conclusion != "skipped")] | length' 2>/dev/null || echo probe-error)"
            # Ein Probe-Fehler zaehlt als gefeuert: der Deckel geht im Zweifel
            # frueher zu, nie spaeter.
            [ "${fired}" = "probe-error" ] && fired=1
            count=$((count + fired))
          done < "${RUNNER_TEMP:-/tmp}/watchdog_runs_today.txt"
          echo "repair dispatches today (ET ${today}, own runs): ${count} (window total ${total})"
          # Bewusst BREITER als der Deckel: ein wartender Lauf JEDER Art belegt
          # denselben einzigen Warteplatz der tradingview-session-Gruppe, den
          # eine Reparatur braeuchte. Hier ist das die sichere Richtung (kein
          # zweiter Lauf), waehrend dieselbe Breite beim Deckel den Alarm
          # ausloest -- deshalb wird nur der Deckel verengt.
          in_flight="$(gh api "repos/${GH_REPO}/actions/workflows/tv-save-consumer-source.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          flag=""
          [ "${in_flight}" -gt 0 ] && flag="--repair-in-flight"
          python3 scripts/tv_repair_watchdog_decision.py \
            --snapshot snapshot/tradingview_consumer_bindings.json \
            --repair-dispatches-today "${count}" ${flag} ${count_flag}

      - name: Dispatch the repair run
        if: ${{ always() && steps.repair_decision.outputs.dispatch == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPAIR_REASON: ${{ steps.repair_decision.outputs.reason }}
        run: |
          set -euo pipefail
          echo "::warning title=Layout repair dispatched::${REPAIR_REASON}"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tv-save-consumer-source.yml/dispatches" \
            -d '{"ref":"main","inputs":{"repair_only":"true"}}'

      # The third alarm state (repair succeeded) needs no step of its own: the
      # drift alert derives from the published bindings snapshot, and the next
      # verify run writes it forward without mismatches. This step covers the
      # second: repair attempted and capped -- silence here would mean the cap
      # firing looks identical to "nothing was wrong" from the outside.
      # Zwei Aufgabe-Gruende, beide laut: der erreichte Deckel, und der Fall,
      # in dem der Deckel nicht einmal GEZAEHLT werden konnte (Listenfenster
      # erschoepft). Der zweite ist ebenso operator-wuerdig -- eine gemessene
      # Drift bleibt unrepariert -- und waere sonst der stille Zwilling des
      # ersten. Absichtlich zwei benannte Marker statt eines breiten
      # "fail closed": die schema-fail-closed-Gruende sind bewusst leise.
      - name: Say it when the watchdog gives up
        if: ${{ always() && steps.repair_decision.outputs.dispatch == 'false' && (contains(steps.repair_decision.outputs.reason, 'Deckel erreicht') || contains(steps.repair_decision.outputs.reason, 'Listenfenster erschoepft')) }}
        env:
          REPAIR_REASON: ${{ steps.repair_decision.outputs.reason }}
        run: |
          echo "::error title=Layout repair gave up::${REPAIR_REASON}"

      - name: Write dispatch summary
        if: ${{ steps.mode.outputs.mode != 'verify-only' && steps.mode.outputs.mode != 'never-ran' && steps.mode.outputs.mode != 'write-no-mutation' }}
        env:
          TRIGGER_MODE: ${{ steps.mode.outputs.mode }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo "### Post-mutation verification dispatched"
            echo ""
            echo "- trigger run: ${TRIGGER_RUN_ID} (executionMode: ${TRIGGER_MODE})"
            echo "- dispatched: tv-save-consumer-source.yml verify_only=true after 15 min"
          } >> "$GITHUB_STEP_SUMMARY"
