name: plan-2-8-evaluation
# live-window: mutating-on-cron  # Daily evaluation snapshot

# Automated Plan 2.8 multi-timeframe family evaluation
# Generates daily experiment snapshots for live overlay dashboard panels:
#   - plan_2_8_tf_family_rollup.json (current evaluation state)
#   - plan_2_8_history.jsonl (append daily for trend analysis)
#
# The snapshots power the dashboard "Daily Experiment" panels:
#   * Snapshot Age / Files Scanned
#   * FVG 5m Verdict / BOS 4H Verdict (Phase E2)
#   * Per-family hit-rate tables and trend graphs

on:
  schedule:
    # Daily 04:00 UTC — runs after daily data delivery completes
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_history_append:
        description: 'Skip appending to history.jsonl (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # fallback issue creation uses github.token when GH_PAT is unavailable

# Queue overlapping runs to avoid race conditions on history append
concurrency:
  group: plan-2-8-evaluation
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  evaluate:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Run Plan 2.8 evaluation script
        id: evaluate
        run: |
          set -euo pipefail
          mkdir -p artifacts/evaluation

          # Run evaluation script (placeholder - replace with actual script)
          python scripts/plan_2_8_evaluate.py \
            --output artifacts/evaluation/plan_2_8_tf_family_rollup.json \
            --verbose

          if [ -f artifacts/evaluation/plan_2_8_tf_family_rollup.json ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            files_scanned=$(python -c "import json; print(json.load(open('artifacts/evaluation/plan_2_8_tf_family_rollup.json'))['files_scanned'])")
            echo "files_scanned=$files_scanned" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "files_scanned=0" >> "$GITHUB_OUTPUT"
          fi

      # The history lives on bot/live-experiment-snapshot, not on main, so a
      # fresh checkout starts with no file at all. Appending to that and
      # publishing it REPLACES the accumulated history with a single row —
      # measured 2026-08-07: the published file had 1 row while the sibling
      # producer's had 133. Restore first, and fail closed if we cannot.
      - name: Restore Plan 2.8 history from the published snapshot
        id: restore_history
        if: steps.evaluate.outputs.status == 'success' && !inputs.skip_history_append
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out_history="artifacts/evaluation/plan_2_8_history.jsonl"
          remote_ref="refs/heads/bot/live-experiment-snapshot"
          tracking_ref="refs/remotes/origin/bot/live-experiment-snapshot"
          remote_path="artifacts/experiment/latest/plan_2_8_history.jsonl"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "${out_history}")"
          fetch_error="$(mktemp)"
          if git fetch "${remote_url}" "+${remote_ref}:${tracking_ref}" 2>"${fetch_error}"; then
            :
          elif grep -Eqi "could(n't| not) find remote ref" "${fetch_error}"; then
            echo "::notice::no experiment snapshot branch yet — bootstrapping history"
            rm -f "${fetch_error}"
            exit 0
          else
            echo "::error::failed to restore Plan 2.8 history; refusing to replace the published history with one run"
            rm -f "${fetch_error}"
            exit 1
          fi
          rm -f "${fetch_error}"
          if git cat-file -e "${tracking_ref}:${remote_path}" 2>/dev/null; then
            git show "${tracking_ref}:${remote_path}" > "${out_history}"
            echo "Restored $(wc -l < "${out_history}") Plan 2.8 history rows."
          else
            echo "::notice::snapshot branch carries no history yet — bootstrapping"
          fi

      - name: Append to history JSONL
        if: steps.evaluate.outputs.status == 'success' && !inputs.skip_history_append && steps.restore_history.outcome == 'success'
        run: |
          set -euo pipefail

          # Ensure history file exists (create if first run)
          history_file="artifacts/evaluation/plan_2_8_history.jsonl"
          snapshot="artifacts/evaluation/plan_2_8_tf_family_rollup.json"

          # Extract per_tf data and add captured_at timestamp
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("artifacts/evaluation/plan_2_8_history.jsonl")
          snapshot = json.load(open("artifacts/evaluation/plan_2_8_tf_family_rollup.json"))
          now = datetime.now(timezone.utc)
          history_entry = {
              "captured_at": now.isoformat(),
              "per_tf": snapshot["per_tf"],
          }

          # One row per UTC day: a re-run (manual dispatch, retry) replaces the
          # day's row instead of adding a second one, so the trend cannot
          # double-count a day.
          today = now.date().isoformat()
          kept: list[str] = []
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      kept.append(line)  # never drop a row we cannot parse
                      continue
                  if str(row.get("captured_at", ""))[:10] == today:
                      continue
                  kept.append(json.dumps(row))
          kept.append(json.dumps(history_entry))

          tmp = path.with_suffix(".jsonl.tmp")
          tmp.write_text("\n".join(kept) + "\n", encoding="utf-8")
          os.replace(tmp, path)

          print(f"History now {len(kept)} row(s); today's entry at {history_entry['captured_at']}")
          PY

          # Trim to the newest 30 entries (one per day) to prevent unbounded growth
          if [ -f "${history_file}" ]; then
            line_count=$(wc -l < "${history_file}")
            if [ "$line_count" -gt 30 ]; then
              tail -n 30 "${history_file}" > "${history_file}.tmp"
              mv "${history_file}.tmp" "${history_file}"
              echo "Trimmed history to the newest 30 entries"
            fi
          fi

      - name: Surface evaluation summary
        if: always()
        run: |
          {
            echo "## Plan 2.8 Evaluation Summary"
            echo ""
            echo "Status: \`${{ steps.evaluate.outputs.status }}\`"
            echo "Files Scanned: **${{ steps.evaluate.outputs.files_scanned }}**"
            echo ""
            if [ -f artifacts/evaluation/plan_2_8_tf_family_rollup.json ]; then
              echo "### Snapshot Preview"
              echo '```json'
              head -50 artifacts/evaluation/plan_2_8_tf_family_rollup.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plan-2-8-evaluation-${{ github.run_id }}
          path: |
            artifacts/evaluation/plan_2_8_tf_family_rollup.json
            artifacts/evaluation/plan_2_8_history.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Publish snapshots to rolling bot branch
        # Mirrors credential-health-check.yml: publish to bot/live-experiment-snapshot
        # so the live overlay daemon can fetch via EXPERIMENT_SNAPSHOT_URL without
        # requiring Railway persistent volumes or S3.
        if: steps.evaluate.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GH_PAT not configured; skipping publish to bot/live-experiment-snapshot"
            exit 0
          fi

          snapshot="artifacts/evaluation/plan_2_8_tf_family_rollup.json"
          history="artifacts/evaluation/plan_2_8_history.jsonl"

          if [ ! -s "${snapshot}" ]; then
            echo "No evaluation snapshot produced; nothing to publish."
            exit 0
          fi

          # Copy to stable path
          stable_dir="artifacts/experiment/latest"
          mkdir -p "${stable_dir}"
          cp "${snapshot}" "${stable_dir}/plan_2_8_tf_family_rollup.json"

          if [ -f "${history}" ]; then
            cp "${history}" "${stable_dir}/plan_2_8_history.jsonl"
          fi

          # Preserve the rolling benchmark producer's sibling stable path on
          # this shared branch. The helper fails closed on fetch/push errors.
          python scripts/publish_bot_snapshot.py \
            --branch bot/live-experiment-snapshot \
            --copy "${stable_dir}/plan_2_8_tf_family_rollup.json=${stable_dir}/plan_2_8_tf_family_rollup.json" \
            --copy-if-present "${stable_dir}/plan_2_8_history.jsonl=${stable_dir}/plan_2_8_history.jsonl"

          {
            echo "### ✅ Experiment snapshot published"
            echo ""
            echo "Branch: \`bot/live-experiment-snapshot\`"
            echo "Path: \`artifacts/experiment/latest/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on evaluation failure
        if: always() && (steps.evaluate.outcome == 'failure' || steps.evaluate.outputs.status == 'failed')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Repo hier kann Issues deaktiviert haben -- `gh issue create`
          # wuerde dann fehlschlagen. Vorher war das mit `|| true` komplett
          # stumm geschluckt (kein Alarm, keine Annotation); jetzt zumindest
          # eine sichtbare Warnung statt eines lautlosen No-ops.
          if [ "$(gh repo view "$GH_REPO" --json hasIssuesEnabled --jq '.hasIssuesEnabled')" != "true" ]; then
            echo "::warning title=plan-2-8-evaluation::GitHub Issues sind auf ${GH_REPO} deaktiviert -- kann kein Failure-Issue oeffnen. Die Job-Failure oben ist bis auf Weiteres der Alarm."
            exit 0
          fi

          TITLE="plan-2-8-evaluation: failed — daily run ($(date -u +%Y-%m-%d))"
          BODY_FILE=$(mktemp)
          {
            echo "Daily Plan 2.8 evaluation failed."
            echo ""
            echo "Run: https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Impact"
            echo ""
            echo "Dashboard 'Daily Experiment' panels will show stale data until the next successful run."
            echo ""
            echo "### Action Required"
            echo ""
            echo "1. Review workflow logs for errors"
            echo "2. Fix evaluation script or data availability issues"
            echo "3. Re-run workflow via workflow_dispatch"
          } > "${BODY_FILE}"

          gh issue create \
            --repo "${GH_REPO}" \
            --title "${TITLE}" \
            --body-file "${BODY_FILE}" \
            --label "cron-failure,enhancement" || true
