# live-window: mutating-on-cron  # F-V6-F2.1 (2026-05-02)
name: run-open-prep-daily

# Schedule: 13:00 UTC weekdays — pre-open in both DST regimes (30 min before
# RTH open in EDT, 90 min in EST; see cron comment below). (audit F-V3-14, 2026-05-01)
#
# Daily pre-open scoring run. Generates a fresh `outcomes_<date>.json`
# that the existing `open-prep-outcome-backfill` workflow labels at its
# 22:15 UTC weekday cron (post-close; it measures the 09:30-10:00 ET
# window via Databento RTH bars, but the labels only land in the
# evening). This is what grows the FI labeled-sample corpus toward the
# G1 acceptance gate (>= 5 sequential days of report status=ok, where
# ok requires >= 200 labeled samples). Without this scheduled producer,
# the backfill has nothing new to label and the FI report stays at
# `insufficient_labels`.

on:
  schedule:
    # 13:00 UTC weekdays — covers both DST regimes:
    #   * EDT (UTC-4): 09:00 ET — 30 min before RTH open at 09:30 ET.
    #   * EST (UTC-5): 08:00 ET — 90 min before RTH open at 09:30 ET.
    # Both windows are firmly inside the pre-open window the scorer
    # is designed for.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      universe_source:
        description: "Universe source: fmp_us_mid_large (default) or static"
        required: false
        default: "fmp_us_mid_large"
      top:
        description: "How many ranked candidates to keep"
        required: false
        default: "10"
      trade_cards:
        description: "How many trade cards to generate"
        required: false
        default: "5"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: run-open-prep-daily
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
      runner_environment: ${{ steps.resolve.outputs.runner_environment }}
      resolution_reason: ${{ steps.resolve.outputs.resolution_reason }}
      matched_runner_name: ${{ steps.resolve.outputs.matched_runner_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python-pinned

      - name: Resolve worker runner
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          SMC_FORCE_GH_HOSTED: ${{ vars.SMC_FORCE_GH_HOSTED }}
        run: |
          python scripts/resolve_workflow_runner.py \
            --repository "${{ github.repository }}" \
            --hosted-runner "${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}" \
            --custom-label "${{ vars.SMC_PRIORITY_CRON_SELF_HOSTED_LABEL || vars.SMC_SELF_HOSTED_LABEL }}"

  run:
    needs: select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.runs_on_json) }}
    timeout-minutes: 35
    steps:
      - name: Announce selected runner
        run: |
          echo "runner_environment=${{ needs.select-runner.outputs.runner_environment }}"
          echo "resolution_reason=${{ needs.select-runner.outputs.resolution_reason }}"
          echo "matched_runner_name=${{ needs.select-runner.outputs.matched_runner_name }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # GH_PAT is required so the `bot/*` push + `gh pr create` below
          # trigger the `fast-gates` required check. Workflows opened with
          # the default GITHUB_TOKEN do NOT spawn child workflows, which
          # leaves the PR stuck in BLOCKED with `fast-gates` "expected"
          # forever (observed on PR #103, run 24894798260).
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          persist-credentials: false

      - name: Set up pinned Python (GitHub-hosted)
        if: needs.select-runner.outputs.runner_environment == 'github-hosted'
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve Python 3.12 interpreter
        run: |
          if [[ "${{ needs.select-runner.outputs.runner_environment }}" == "github-hosted" ]]; then
            python -c "import sys; raise SystemExit('GitHub-hosted Python bootstrap did not resolve Python 3.12.' if sys.version_info[:2] != (3, 12) else 0)"
            echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
            exit 0
          fi

          if command -v python >/dev/null 2>&1; then
            if python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"; then
              echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if command -v py >/dev/null 2>&1; then
            python_bin="$(py -3.12 -c "import sys; print(sys.executable)")"
            echo "SMC_PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::Self-hosted runner is missing a usable Python 3.12 interpreter (tried \`python\` and \`py -3.12\`)."
          exit 1

      - name: Install Python dependencies
        run: |
          "$SMC_PYTHON_BIN" -m pip install --upgrade pip
          "$SMC_PYTHON_BIN" -m pip install -r requirements.txt

      - name: Restore provider-usage snapshot from bot/live-open-prep-snapshot
        # H2 fix (2026-07-08): ProviderUsage.flush() accumulates by merging
        # into the LOCAL artifacts/monitoring/provider_usage.json — but that
        # file is untracked, so a fresh CI checkout starts from an empty base
        # and the force-pushed snapshot only ever carried ONE run's deltas.
        # The monthly FMP bandwidth-quota check therefore compared a single
        # day's usage against the 150 GB monthly cap and was effectively
        # inert. Restore the rolling snapshot before the run. A confirmed
        # missing branch is the only cold-start path; transient fetch errors
        # fail closed so cumulative usage cannot reset silently.
        #
        # 2026-07-24: the checkout uses `persist-credentials: false`, so a bare
        # `git fetch origin` carries no token and fails auth on this private
        # repo -- NOT with "could not find remote ref", so it hit the fail-
        # closed `else` and reddened every run since cad5da216 made this step
        # hard-fail. Fetch from the tokened URL, mirroring the proven restore
        # in smc-live-news-refresh.yml.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/monitoring
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fetch_error="$(mktemp)"
          if git fetch "${remote_url}" "+refs/heads/bot/live-open-prep-snapshot:refs/remotes/origin/bot/live-open-prep-snapshot" 2>"${fetch_error}"; then
            :
          elif grep -Eqi "could(n't| not) find remote ref" "${fetch_error}"; then
            echo "::notice::no prior bot/live-open-prep-snapshot branch — starting a fresh accumulation"
            rm -f "${fetch_error}"
            exit 0
          else
            echo "::error::failed to restore bot/live-open-prep-snapshot; refusing to reset cumulative provider usage"
            rm -f "${fetch_error}"
            exit 1
          fi
          rm -f "${fetch_error}"
          if git cat-file -e "origin/bot/live-open-prep-snapshot:artifacts/monitoring/provider_usage.json" 2>/dev/null; then
            git show "origin/bot/live-open-prep-snapshot:artifacts/monitoring/provider_usage.json" \
              > artifacts/monitoring/provider_usage.json
            echo "Restored provider-usage snapshot from bot/live-open-prep-snapshot."
          else
            echo "::error::bot/live-open-prep-snapshot exists but carries no provider-usage snapshot; refusing an implicit counter reset"
            exit 1
          fi

      - name: Produce G3 arm-B candidate weight set
        # STRATEGY_2026_Q3 §G2/§G3: Arm B of the scorer A/B. This must run in the
        # SAME job and BEFORE the scoring step: `weights_candidate.json` lands in
        # artifacts/open_prep/outcomes/, which .gitignore excludes (`outcomes/*.json`),
        # so it cannot persist between runs. Its input — the feature-importance
        # samples — IS tracked, so the set is reproducible from the checkout.
        # Never fails the run: the CLI exits 0 for ok / insufficient_data /
        # drift_blocked, and the `|| echo` below absorbs a genuine error — which
        # only costs the arm-B observation, recorded as status=arm_b_unavailable.
        # No `continue-on-error:` needed; the fallback already yields exit 0.
        run: |
          set -euo pipefail
          "$SMC_PYTHON_BIN" -m open_prep.candidate_weights || \
            echo "::notice::arm-B candidate weights unavailable; run records status=arm_b_unavailable"

      - name: Run open-prep scoring
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          BENZINGA_API_KEY: ${{ secrets.BENZINGA_API_KEY }}
          # Transport-Flip (Massive-Reseller-Key) — repo variable, default direct.
          BENZINGA_PROVIDER: ${{ vars.BENZINGA_PROVIDER || 'direct' }}
          # Benzinga Core News (2026-07-08): per-ticker news via /api/v2/news
          # (BenzingaRestAdapter). FMP's general article feed misses most
          # small-cap gappers; Benzinga's ticker-filtered feed fills that gap,
          # which is where the news_catalyst_score / news_directional_score
          # signal is thinnest. Gate default is OFF; requires BENZINGA_API_KEY.
          OPEN_PREP_ENABLE_BENZINGA_CORE_NEWS: "1"
          OPEN_PREP_LOG_LEVEL: INFO
          OPEN_PREP_CODE_VERSION: ${{ github.sha }}
          # A2 (2026-06-10): env-var indirection for user-supplied inputs.
          INPUT_UNIVERSE: ${{ github.event.inputs.universe_source || 'fmp_us_mid_large' }}
          INPUT_TOP: ${{ github.event.inputs.top || '10' }}
          INPUT_CARDS: ${{ github.event.inputs.trade_cards || '5' }}
        run: |
          set -euo pipefail
          # A2: validate before use.
          [[ "${INPUT_UNIVERSE}" =~ ^[A-Za-z0-9_]+$ ]] || {
            echo "::error::universe_source must be alphanumeric/underscore, got: ${INPUT_UNIVERSE}"; exit 1
          }
          [[ "${INPUT_TOP}" =~ ^[0-9]+$ ]] || {
            echo "::error::top must be a non-negative integer, got: ${INPUT_TOP}"; exit 1
          }
          [[ "${INPUT_CARDS}" =~ ^[0-9]+$ ]] || {
            echo "::error::trade_cards must be a non-negative integer, got: ${INPUT_CARDS}"; exit 1
          }
          mkdir -p artifacts/open_prep/runs
          UNIVERSE="${INPUT_UNIVERSE}"
          TOP="${INPUT_TOP}"
          CARDS="${INPUT_CARDS}"
          DATE_TAG="$(date -u +%Y%m%dT%H%M%SZ)"
          OUT="artifacts/open_prep/runs/run_${DATE_TAG}.json"
          # Stream stdout (the result payload) to a per-run artifact for
          # later inspection; the side-effect we actually care about is
          # `artifacts/open_prep/outcomes/outcomes_<today>.json` which
          # `store_daily_outcomes()` writes during the run and which the
          # outcome-backfill workflow later resolves into FI labels.
          "$SMC_PYTHON_BIN" -m open_prep.run_open_prep \
            --universe-source "$UNIVERSE" \
            --top "$TOP" \
            --trade-cards "$CARDS" \
            --pre-open-only \
            > "$OUT"
          echo "Wrote run payload: $OUT ($(wc -c < "$OUT") bytes)"
          ls -la artifacts/open_prep/outcomes/ || true

      - name: Refresh provider-usage snapshot heartbeat
        run: |
          set -euo pipefail
          "$SMC_PYTHON_BIN" - <<'PY'
          from datetime import UTC, datetime

          from newsstack_fmp.provider_usage import snapshot_path, touch_snapshot

          now = datetime.now(UTC)
          if not touch_snapshot(
              snapshot_path(),
              month=now.strftime("%Y-%m"),
              now_iso=now.isoformat(),
          ):
              raise SystemExit("provider-usage snapshot heartbeat failed")
          PY

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: run-open-prep-${{ github.run_id }}
          path: |
            artifacts/open_prep/runs/
            artifacts/open_prep/outcomes/
          if-no-files-found: warn

      - name: Publish open-prep snapshot to rolling bot branch
        # Task F-V8 (2026-06-23): the artifact upload above is the
        # authoritative per-run snapshot, but downstream consumers (the
        # realtime-signals producer) need a git-tracked, stable-path copy
        # of latest_open_prep_run.json. The `main-governance` ruleset blocks
        # bare pushes to main and a daily PR would add noise, so — exactly
        # like smc-live-news-refresh — we force-update the dedicated
        # `bot/live-open-prep-snapshot` branch (allowed: `bot/*` is excluded
        # from the ruleset). No `continue-on-error`: the block is fail-loud so
        # a permanently broken push (expired PAT, ruleset change) shows red.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          # quote_reference (below) fetches FMP adjusted-EOD for previous_close +
          # ADV. Without it the step refuses to publish a new snapshot, preserving
          # the last-good explicit 15-session denominator.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # --adv-source databento (below) replaces the FMP consolidated ADV with
          # the EQUS.MINI ohlcv-1d subset ADV. Live-verified 2026-07-28 over 29
          # common sessions for eight liquid symbols: EQUS.MINI carries only
          # 2.6-4.9% of consolidated volume, so a consolidated ADV denominator
          # suppresses every databento-path volume gate roughly 20-38x
          # (permanent HOLIDAY_SUSPECT, dead A0 pace gates).
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          set -euo pipefail
          SNAPSHOT="artifacts/open_prep/latest/latest_open_prep_run.json"
          if [ ! -f "$SNAPSHOT" ]; then
            echo "::warning::run produced no $SNAPSHOT; skipping snapshot publish."
            exit 0
          fi
          # Degraded-empty guard (2026-07-06): a run whose FMP calls all failed
          # (e.g. invalid API key -> HTTP 401 across the board) still writes a
          # structurally valid but EMPTY snapshot. Publishing it force-replaces
          # the last-good snapshot and blanks the realtime signals-producer
          # watchlist (observed 2026-07-04/05: sp-watchlist-empty fired for
          # 2 days after an all-401 run overwrote the rolling branch). Fail
          # loud BEFORE the push so the branch keeps serving last-good data.
          "$SMC_PYTHON_BIN" - "$SNAPSHOT" <<'PY'
          import json, sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          ranked = len(data.get("ranked_v2") or [])
          quotes = len(data.get("enriched_quotes") or [])
          telemetry = (data.get("run_status") or {}).get("quote_telemetry") or {}
          all_failed = bool(telemetry.get("quote_fetch_all_failed"))
          if all_failed or (ranked == 0 and quotes == 0):
              print(
                  "::error::open-prep run is degraded-empty "
                  f"(ranked_v2={ranked}, enriched_quotes={quotes}, "
                  f"quote_fetch_all_failed={all_failed}); refusing to overwrite "
                  "the last-good bot/live-open-prep-snapshot branch."
              )
              sys.exit(1)
          print(f"snapshot content OK: ranked_v2={ranked}, enriched_quotes={quotes}")
          PY
          # Ride the same bot branch with the provider API-usage snapshot.
          # The shared publisher isolates git state in a temporary tree and
          # preserves every remote file not explicitly replaced here.
          USAGE_SNAPSHOT="artifacts/monitoring/provider_usage.json"
          # Build the daily quote-reference (previous_close + ADV for the
          # ~900-symbol producer universe) from the just-validated run, so the
          # RT_QUOTE_SOURCE=databento quote path has the two fields FMP's
          # batch-quote omits. Rides the SAME bot branch as the watchlist so a
          # fresh producer container fetches it via QUOTE_REFERENCE_SNAPSHOT_URL.
          # The Databento overlay stays fail-soft (last-good artifact), but the
          # FMP 15-session reference is mandatory: publishing a new watchlist
          # without it would silently reactivate opaque profile averageVolume.
          QUOTE_REF="artifacts/open_prep/latest/quote_reference.json"
          FMP_QUOTE_REF="artifacts/open_prep/latest/quote_reference_fmp.json"
          if "$SMC_PYTHON_BIN" -m open_prep.quote_reference \
               --open-prep-run "$SNAPSHOT" --output "$QUOTE_REF" \
               --fmp-output "$FMP_QUOTE_REF" --adv-source databento; then
            echo "quote_reference built OK -> ${QUOTE_REF}"
          else
            echo "::warning::Databento quote_reference build failed; keeping its last-good artifact"
          fi
          if [ ! -s "$FMP_QUOTE_REF" ]; then
            echo "::error::FMP 15-session ADV reference missing; refusing an opaque profile-ADV snapshot"
            exit 1
          fi
          "$SMC_PYTHON_BIN" scripts/apply_fmp_adv_reference.py \
            --snapshot "$SNAPSHOT" --reference "$FMP_QUOTE_REF"
          "$SMC_PYTHON_BIN" scripts/publish_bot_snapshot.py \
            --branch bot/live-open-prep-snapshot \
            --copy "${SNAPSHOT}=${SNAPSHOT}" \
            --copy-if-present "${USAGE_SNAPSHOT}=${USAGE_SNAPSHOT}" \
            --copy-if-present "${QUOTE_REF}=${QUOTE_REF}" \
            --copy-if-present "${FMP_QUOTE_REF}=${FMP_QUOTE_REF}"

      - name: Commit fresh outcomes via auto-merge PR
        # The repo's `main-governance` ruleset targets only ~DEFAULT_BRANCH,
        # so we can push to fresh `bot/*` branches and open an auto-merge PR.
        # Final merge into `main` still goes through pull_request +
        # required_status_checks. We MUST authenticate with GH_PAT (not the
        # default GITHUB_TOKEN) for both the push and `gh pr create` — GitHub
        # suppresses workflow triggers for events generated by GITHUB_TOKEN,
        # which leaves the required `fast-gates` check "expected" forever and
        # the PR stuck in BLOCKED (observed on PR #103, run 24894798260).
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add artifacts/open_prep/outcomes/ || true
          # G3 arm-B paired observations — this is the sample the §G3 decision
          # gate consumes, so it has to accumulate in the repo rather than being
          # discarded with the runner.
          git add artifacts/open_prep/ab_arms/ || true
          if git diff --staged --quiet; then
            echo "No new outcomes to commit."
            exit 0
          fi
          BRANCH="bot/run-open-prep-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git commit -m "chore(open_prep): daily run outcomes ${GITHUB_RUN_ID}"
          git push -u origin "$BRANCH"
          # F-V6-I2.1 (2026-05-02): previously this `gh pr create` was suffixed
          # with `|| true`, which silently swallowed real PR-creation failures
          # (auth issues, branch-protection refusals, transient API errors) and
          # left the workflow green with no follow-up PR. Surface as ::error::
          # and fail the job so the daily outcomes cannot be lost.
          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --label automated \
            --title "chore(open_prep): daily run outcomes ${GITHUB_RUN_ID}" \
            --body "Automated pre-open scoring run from \`run-open-prep-daily\` (run ${GITHUB_RUN_ID}). Adds today's outcomes_*.json so the outcome-backfill workflow can label it later for the FI corpus."; then
            echo "::error file=.github/workflows/run-open-prep-daily.yml::gh pr create failed for ${BRANCH} — see step log for stderr"
            exit 1
          fi
          # CONTINUE-ON-ERROR-INTENTIONAL: enabling auto-merge can race with
          # branch-protection / required-status-check evaluation; the PR itself
          # is already open and reviewable, so we surface as warning rather
          # than failing the job.
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "::warning::auto-merge enable failed for ${BRANCH} (PR is open and reviewable)"
