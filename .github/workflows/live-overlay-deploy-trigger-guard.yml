# live-window: off-hours-only  # daily read-only Railway drift check (cron 06:17 off-peak; permissions: contents:read, no writes)
# Drift guard: the live_overlay_daemon Railway service must stay CI-only —
# i.e. have NO native GitHub deploy trigger. A native trigger has no path
# filter, so it redeploys the daemon on every push to main (2026-07-24:
# ~23/day, most touching nothing in the daemon), wiping the bar cache and
# resetting uptime. See services/live_overlay_daemon/OPS.md.
#
# Requires the read-capable Railway API secrets the railway_metrics bridge
# already uses: RAILWAY_API_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_ENVIRONMENT_ID
# (optionally RAILWAY_LIVE_OVERLAY_SERVICE_ID). Without them the script prints
# SKIP and the job passes, so this file is inert until the secrets are added.
name: "live-overlay-deploy-trigger-guard"

on:
  schedule:
    - cron: "17 6 * * *" # daily, off-peak
  workflow_dispatch:
    inputs:
      probe_credentials:
        description: >-
          Measure which Railway fields each credential may read, instead of
          asserting (read-only, always green). The daily assert is the
          authoritative check — use this only to see, side by side, what each
          credential can actually read. If the guard is red, suspect the IDs
          before the token: Railway answers an unresolvable serviceId with the
          same "Not Authorized" it gives a rejected credential (#4359).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-overlay-deploy-trigger-guard
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Assert no native Railway deploy trigger
        env:
          # ACCOUNT token, Authorization: Bearer. A project token cannot drive
          # this guard: measured 2026-08-03 (run 30831201160), project tokens
          # get "Not Authorized" for deploymentTriggers even with their correct
          # Project-Access-Token header, while the same query with an
          # account-scoped token returns data. See the script's docstring.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_LIVE_OVERLAY_SERVICE_ID: ${{ secrets.RAILWAY_LIVE_OVERLAY_SERVICE_ID }}
          # Probe mode only: the deploy workflow's project token is the one
          # credential PROVEN to answer a Railway query from a runner (it polls
          # `deployments` after every `railway up`), so the probe must be able
          # to ask it too. The assert path never reads it — project tokens are
          # measured to be denied deploymentTriggers (#4345).
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROBE_CREDENTIALS: ${{ inputs.probe_credentials }}
        run: |
          set -euo pipefail
          if [[ "${PROBE_CREDENTIALS:-false}" == "true" ]]; then
            python scripts/check_live_overlay_deploy_trigger.py --probe
          else
            python scripts/check_live_overlay_deploy_trigger.py
          fi
