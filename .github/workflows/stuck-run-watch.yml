name: stuck-run-watch
# live-window: mutating-on-cron  # schedule + issues:write (Stillstands-Alert)

# Meldet Laeufe, die nicht enden. Der Workflow-Fehleralarm sieht nur
# ENDZUSTAENDE ("latest run failed", noDataState: OK) — ein Lauf, der ewig
# `queued` oder `in_progress` bleibt, erzeugt kein `failure` und taucht in
# keiner Regel auf, waehrend er required Kontexte und damit jeden offenen PR
# blockiert.
#
# Zwei Ursachen, dieselbe Unsichtbarkeit:
#   * queued — kein Runner nimmt das Label an (falscher Wert in einer
#     Repo-Variablen, totes self-hosted-Label auf einer der select-runner-Lanes).
#     runner-label-variable-watch (#5178) schliesst DIESE Ursache; hier geht es
#     um die Sichtbarkeit unabhaengig von der Ursache.
#   * in_progress — ein Job haengt und seine `timeout-minutes` killt ihn nicht
#     (validate (4), #4939/#4949).
#
# Alle 2 h zur Minute 17, versetzt gegen die 06:xx-Morgencrons und gegen
# runner-label-variable-watch (:40). Ein Stillstand soll innerhalb von zwei
# Stunden auffallen, nicht erst am naechsten Morgen — er kostet durchgehend
# Runner-Minuten und blockiert Merges.
# Beobachtet vom workflow-freshness-monitor (6:any); ohne diesen Eintrag waere
# der Cron von Geburt an unsichtbar
# (tests/test_scheduled_workflow_observation_inventory.py).
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/check_stuck_workflow_runs.py"
      - ".github/workflows/stuck-run-watch.yml"

permissions:
  contents: read

concurrency:
  group: stuck-run-watch
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}

defaults:
  run:
    shell: bash

jobs:
  watch:
    # LITERAL, ohne Operator-Override — dieselbe begruendete Ausnahme wie bei
    # runner-label-variable-watch: eine Sonde, die meldet, dass Laeufe nicht
    # starten, darf nicht an derselben Runner-Wahl haengen wie die Laeufe, ueber
    # die sie urteilt. Gepinnt als Paar in
    # tests/test_workflow_runner_pinned.py (Eintrag existiert UND Job ist noch
    # literal).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # actions:read — `GET /repos/.../actions/runs` ueber das Job-Token.
      actions: read
      # issues:write nur hier (least privilege).
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          # Liest nur, schiebt nie; `gh` bringt sein eigenes Token mit.
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Stehende Laeufe suchen
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python -m scripts.check_stuck_workflow_runs --repo "$GITHUB_REPOSITORY" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # NICHT hier exiten: der Issue-Step braucht das Ergebnis, der letzte
          # Step bringt rc zurueck an die Oberflaeche. rc=8 ist KEIN Erfolg.

      - name: Open or update the one issue
        if: steps.probe.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "$(gh repo view "$GH_REPO" --json hasIssuesEnabled --jq '.hasIssuesEnabled')" != "true" ]; then
            echo "::warning title=stuck-run-watch::GitHub Issues sind auf ${GH_REPO} deaktiviert -- kein Alert-Issue moeglich. Step Summary und der Job-Fail sind bis auf Weiteres der Alarm."
            exit 0
          fi
          title="Laeufe stehen: ein Workflow endet nicht"
          if [ "$PROBE_RC" = "8" ]; then
            title="Stillstands-Sonde konnte nicht messen"
          fi
          body="$(printf '%s\n' \
            "Die Sonde \`scripts/check_stuck_workflow_runs.py\` hat mit rc=${PROBE_RC} geurteilt." \
            "" \
            "Warum das dringend ist: ein Lauf, der nicht endet, erzeugt **kein** \`failure\` und" \
            "taucht in keiner Alarmregel auf — waehrend er required Kontexte und damit jeden" \
            "offenen PR blockiert und durchgehend Runner-Minuten kostet." \
            "" \
            "Welcher Lauf, wie lange, und in welchem Status steht in der Step Summary:" \
            "${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "\`queued\` zu lange = kein Runner nimmt das Label an (Label/Selektor pruefen)." \
            "\`in_progress\` zu lange = der Job haengt (Log lesen, \`timeout-minutes\` pruefen).")"
          existing="$(gh issue list --repo "$GH_REPO" --state open \
            --search "$title in:title" --json number --jq '.[0].number // ""')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi

      - name: Fail the job when something stands or the probe is off
        if: always() && steps.probe.outputs.rc != '' && steps.probe.outputs.rc != '0'
        env:
          PROBE_RC: ${{ steps.probe.outputs.rc }}
        run: |
          echo "::error title=stuck-run-watch::Sonde beendete mit rc=${PROBE_RC} (1 = ein Lauf steht, 8 = Sonde ungueltig) -- siehe Step Summary und das Alert-Issue."
          exit 1
