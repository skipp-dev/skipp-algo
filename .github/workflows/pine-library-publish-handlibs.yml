name: pine-library-publish-handlibs
# live-window: mutating-on-cron  # Scheduled ordered publish+repin of the hand-authored SMC++ libraries (2026-07-13)

# Runs the ordered publish+repin helper (scripts/tv_publish_hand_authored_libraries.ts,
# `npm run tv:publish-handlibs`, added in #3610) on a schedule so the hand-authored
# SMC++ library chain stays reconciled with TradingView without manual sequencing.
#
# The helper is DEPENDENCY-ORDERED (core_types → utils → dependents) and
# IDEMPOTENT: TradingView no-ops an unchanged publish (no version bump), so a
# run only bumps a library whose repo source actually changed; every run also
# repins consumers to the real facade-verified published versions, reconciling
# any drift the pine-library-version-monitor flagged.
#
# SAFETY MODEL (why this is safe to run unattended):
#   * Publishing requires a real authenticated TV session — the job FAILS fast
#     if TV_STORAGE_STATE is absent (it cannot silently no-op like the monitor).
#   * It never pushes to main. Repin edits the helper makes are captured in a
#     fresh branch and opened as a PR for human review; until that PR merges the
#     monitor's drift alert simply stays lit (self-covering).
#   * Each publish is facade-verified (#3609) so a successful publish reports the
#     real version instead of a false failure.
#
# The pine-library-version-monitor tells you WHEN drift appears; this closes it.

on:
  # workflow_dispatch first — an operator can run it on demand at any time.
  workflow_dispatch:
  schedule:
    # 04:00 UTC Sundays — weekend, outside the US trading window. Weekly is
    # deliberate: hand-authored library source changes are rare, and each run
    # drives a real (if idempotent) TradingView publish flow for 8 libraries.
    - cron: "0 4 * * 0"

permissions:
  # contents: write to push the repin branch; pull-requests: write to open the PR.
  contents: write
  pull-requests: write

concurrency:
  # 2026-08-01: one AUTOMATED browser session at a time — CI against CI only.
  # This group does NOT serialise the account: the operator's own browser is
  # a second, unserialised writer on the same layouts, and TradingView
  # autosaves from it (operator-confirmed 2026-08-01: autosave active, and a
  # chart tab on this account was open all day while runs mutated layouts —
  # nothing here knew). No mechanism detects or excludes that session;
  # mutating runs coordinate with the operator by convention, not by code.
  # Every workflow below drives the SAME external account, and until now each
  # one only serialised against itself — two of these blocks already said
  # "TradingView is a single shared external target" while keeping a private
  # group, so the guarantee was stated but never implemented. Measured trigger:
  # a manual tv-save-consumer-source dispatch ran while an R4 readback was
  # being prepared; nothing in CI would have stopped them overlapping.
  # cancel-in-progress stays false everywhere: these runs save layouts and
  # publish scripts, so a queued run must wait, never pre-empt.
  group: tradingview-session
  cancel-in-progress: false
  # 2026-08-06: cancel-in-progress governs only the RUNNING run, so `false`
  # never protected the waiter. Under the default `queue: single` a group holds
  # exactly one pending run and the next entrant CANCELS it -- that is what
  # dropped dispatches here. `queue: max` queues up to 100 runs FIFO instead.
  queue: max

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          # Publishing REQUIRES a real session — fail fast (unlike the monitor,
          # which self-covers). A silent no-auth run would leave libraries stale.
          if [ -z "${TV_STORAGE_STATE_SECRET:-}" ]; then
            echo "::error::TV_STORAGE_STATE not configured — cannot publish. Aborting."
            exit 1
          fi
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET'].strip()
          payload = raw if raw.startswith('{') else gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          json.loads(payload)  # validate
          out = Path('automation/tradingview/auth/storage-state.json')
          out.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Ordered publish + repin
        id: publish
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
        run: |
          # `set +e` FIRST, and it is load-bearing. The `defaults:` block near
          # the top of this file sets `run: shell: bash`, so Actions runs this
          # block as `bash --noprofile --norc -eo pipefail {0}` — -e is already
          # on before the first line executes, and `set -uo pipefail` below adds
          # -u without clearing it. The failing pipeline would then end the step
          # immediately.
          #
          # Measured 2026-08-04 under that exact invocation: with -e left on and
          # the publish failing, the step exits with the publish's own rc and
          # $GITHUB_OUTPUT stays EMPTY. Neither rc= nor changed= is ever
          # written, so `Open repin PR` reads an empty `changed`, skips, and the
          # repins that already succeeded are lost. The partial-progress
          # behaviour the comment below promises could not run on a single one
          # of the runs it exists for.
          #
          # This step must never fail on a verdict it reached. Failing the run
          # is the job of `Fail the run if a publish failed` at the end, which
          # reads BOTH statuses this step publishes.
          # silent-skip-ok: -e is off only so the two pipeline statuses reach
          # $GITHUB_OUTPUT; the dedicated final step ends the run red on a
          # non-zero rc, a non-zero log_rc, and on an empty rc.
          set +e
          set -uo pipefail
          npm run tv:publish-handlibs | tee /tmp/handlib_publish.log
          # ONE capture, both members. A plain assignment resets PIPESTATUS to
          # (0) — measured 2026-08-04 — so reading [1] on the line after
          # `rc=${PIPESTATUS[0]}` yields nothing at all, and under `set -u` that
          # unbound reference would end the step at exactly the point this fix
          # exists to keep alive.
          status=("${PIPESTATUS[@]}")
          rc=${status[0]}
          log_rc=${status[1]}
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          # With -e off, a `tee` that dies (unwritable or full /tmp) no longer
          # ends the step — and its status is NOT the publish's. Unpublished it
          # would finish the run GREEN with no log, while every error message
          # here points at a `handlib-publish-log` artifact that was never
          # written. Under -e that case failed the run; publishing log_rc is
          # what keeps it failing.
          echo "log_rc=${log_rc}" >> "$GITHUB_OUTPUT"
          # The changed-set is measured in the R1-hold step below, AFTER the
          # attested companions are restored — measured here it would count
          # diffs the hold is about to take back, and a run whose only edit
          # was an attested companion would open an empty PR.

      # Customer-surface hold (pin-only door), BEFORE the R1 hold measures
      # the changed-set the PR will carry: `repinAllConsumers` rewrites every
      # consumer .pine and the PR step stages '*.pine' wholesale from a
      # checkout that is publish-chain-old by now — the same stale-tree
      # revert class the refresh paid for on 2026-08-12 (#4646). Classified
      # against a fresh fetch of main: identical/pin-only passes, anything
      # else is restored to current-main content (that file then advances
      # with the next publish). The R1 companions are excluded — their
      # stricter hold below owns them. Roster, classifier, fail-closed floor:
      # scripts/hold_customer_surfaces.py, executed by
      # tests/test_hold_customer_surfaces_wiring.py.
      - name: Hold customer surfaces unless the change is pin-only
        id: surface_hold
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          # Explicit-token fetch (persist-credentials: false strips origin's
          # auth); BUMP_REMOTE is the refresh chain's test seam, unset in CI.
          git fetch --quiet "${BUMP_REMOTE:-https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}" main
          SURFACE_BASE="${RUNNER_TEMP}/surface-hold-base"
          rm -rf "${SURFACE_BASE}"
          # Same enumeration as the refresh chain's hold: every root .pine
          # carrying ANY owner import pin, read from the JUST-fetched main.
          # repinAllConsumers rewrites every `import preuss_steffen/<lib>/<n>`
          # line, so hand-lib-only surfaces (SMC_Breakout_Overlay.pine) are
          # candidates too — under the old generated-library pattern they
          # were rewritten without ever being enumerated (the #5145 gap).
          # SMC++ library SOURCES are excluded: not customer surfaces; their
          # mid-run seam stays with the publish chain's repin proof + R1
          # hold. Coverage is derived and executed by
          # tests/test_hold_customer_surfaces_wiring.py. No mapfile — the
          # executing test runs this block under whatever bash the developer
          # has, including 3.2.
          SURFACE_CANDIDATES=()
          while IFS= read -r f; do
            SURFACE_CANDIDATES+=("$f")
          done < <(git grep -lE '^import[[:space:]]+preuss_steffen/' FETCH_HEAD -- \
            '*.pine' \
            ':(exclude)tests/**' \
            ':(exclude)pine/**' \
            ':(exclude)node_modules/**' \
            ':(exclude)SMC++/**' | sed 's|^FETCH_HEAD:||' | sort -u)
          if [ ${#SURFACE_CANDIDATES[@]} -eq 0 ]; then
            echo "::error::no customer-surface candidates on current main — refusing to report an all-clear over nothing"
            exit 1
          fi
          for f in "${SURFACE_CANDIDATES[@]}"; do
            mkdir -p "${SURFACE_BASE}/$(dirname "$f")"
            git show "FETCH_HEAD:$f" > "${SURFACE_BASE}/$f"
          done
          python3 -m scripts.hold_customer_surfaces --base-dir "${SURFACE_BASE}" --repo . "${SURFACE_CANDIDATES[@]}"

      - name: Hold R1-attested sources at their attested content
        id: r1_hold
        run: |
          set -euo pipefail
          # Same sanctioned door as the refresh (smc-library-publish.yml
          # step "Hold R1-attested sources"): repinAllConsumers rewrites
          # every consumer .pine, including the R1-attested companions, and
          # an attested source may not change while the registered evidence
          # still describes the previous content. Until 2026-08-14 this
          # writer path did not know the hold — the next smc_utils bump in
          # the Sunday run would have killed the R1 evidence exactly the way
          # #4284/#4371 did from the refresh path before it learned this
          # step. The module derives the roster from the live rollout
          # contract (no second list) and fails closed on an empty roster,
          # and a failure here fails the JOB: better no repin PR at all than
          # one that de-attests a companion.
          python3 -m scripts.hold_r1_attested_sources
          # The changed-set, measured on the tree the PR would actually
          # carry. The release manifest is part of it on purpose: the FIRST
          # verified run writes manifest entries even when no library
          # content changed (idempotent publishes still observe the live
          # version), and a porcelain check scoped to '*.pine' alone would
          # read that run as changed=false — no PR, observation lost.
          if git status --porcelain -- '*.pine' artifacts/tradingview/handlib_release_manifest.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload publish log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handlib-publish-log-${{ github.run_id }}
          path: /tmp/handlib_publish.log
          if-no-files-found: warn
          retention-days: 14

      - name: Open repin PR
        # r1_hold's changed, not publish's: only the post-hold tree tells the
        # truth about what this PR would carry.
        if: steps.r1_hold.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PUBLISH_RC: ${{ steps.publish.outputs.rc }}
          R1_HELD: ${{ steps.r1_hold.outputs.held }}
          SURFACE_HELD: ${{ steps.surface_hold.outputs.held }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GH_PAT not configured; cannot open the repin PR. The publishes that succeeded happened but their repins are not captured — run tv:publish-handlibs locally and commit."
            exit 0
          fi
          # Since 2026-08-04 this step also runs when the publish FAILED
          # mid-chain, which is the whole point of the partial-progress path.
          # The reviewer of that PR must not be told the chain completed: the
          # helper stops at the first failure and only repins what it published
          # AND verified, so the diff is consistent but PARTIAL, and the run
          # that produced it is red.
          if [ "${PUBLISH_RC:-}" = "0" ]; then
            _title="chore(pine): repin consumers after scheduled hand-lib publish"
            _summary="The ordered publish+repin helper published the changed hand-authored SMC++ libraries (facade-verified) and repinned their consumers to the real published versions."
          else
            _title="chore(pine): PARTIAL repin — hand-lib publish exited ${PUBLISH_RC:-<empty>}"
            _summary="**PARTIAL — the run that produced this is RED.** \`tv:publish-handlibs\` exited \`${PUBLISH_RC:-<empty>}\`: a publish or its facade verification failed mid-chain. The helper stops at the first failure and repins only libraries it published AND verified, so this diff is consistent but INCOMPLETE — the libraries after the failure point are untouched and the monitor's drift alert will stay lit for them. Fix the failure and re-run before treating the chain as reconciled."
          fi
          # The reviewer must learn that companions were held OUT of this diff
          # — a repin PR that silently omits two consumers reads as a bug, and
          # the omission is the R1 policy working as designed.
          if [ -n "${R1_HELD:-}" ] && [ "${R1_HELD}" != "[]" ]; then
            _summary="${_summary} **R1 hold:** the attested companion(s) ${R1_HELD} were restored to their attested content and are NOT repinned here; they advance only through the automated re-attestation chain (smc-r1-reattest.yml)."
          fi
          # A held customer surface reads as a missing repin in the diff; say
          # it was held on purpose (change beyond the pin, restored to
          # current-main content — scripts/hold_customer_surfaces.py).
          if [ -n "${SURFACE_HELD:-}" ] && [ "${SURFACE_HELD}" != "[]" ]; then
            _summary="${_summary} **Customer-surface hold:** ${SURFACE_HELD} changed beyond their import pins during this run and were restored to current-main content; their pins advance with the next publish."
          fi
          branch="bot/handlib-repin-${GITHUB_RUN_ID}"
          _remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          # Manifest and pins travel in ONE commit: the manifest claims "TV
          # holds /N", the pins claim "consumers use /N" — split across two
          # commits, the currency gate (tests/test_handlib_release_manifest.py)
          # would be red between them by construction.
          git add -- '*.pine' 'SMC++'/*.pine artifacts/tradingview/handlib_release_manifest.json
          git commit -m "chore(pine): repin consumers after scheduled hand-lib publish (run ${GITHUB_RUN_ID})"
          # Push to a fresh per-run branch (never main); a unique branch never
          # needs a force-push. Wrap so a push failure warns instead of
          # hard-failing after the publishes already happened.
          if git push "${_remote_url}" "HEAD:refs/heads/${branch}"; then
            # Do NOT swallow a real PR-creation failure (auth/ruleset/rate-limit)
            # — that would finish green without ever opening the PR. The per-run
            # branch is unique, so "already exists" cannot occur; fail loudly.
            if ! gh pr create \
              --base main \
              --head "${branch}" \
              --title "${_title}" \
              --body "Automated by \`pine-library-publish-handlibs.yml\` (run ${GITHUB_RUN_ID}). ${_summary} Review the pin diff, then merge to clear the monitor drift alert. See the run's \`handlib-publish-log\` artifact for the publish output."; then
              echo "::error file=.github/workflows/pine-library-publish-handlibs.yml::gh pr create failed for ${branch} — see step log for stderr. The publishes happened; open the PR manually from ${branch}."
              exit 1
            fi
            # Operator decision 2026-08-15: the CLEAN weekly observation PR
            # auto-merges, consistent with the refresh's repin PRs (#4435).
            # Every Sunday run rewrites publishedAt for all ten verified
            # libraries, so even a zero-pin-movement week produces this PR —
            # reviewing a timestamp diff by hand carries no information, and
            # unmerged observation PRs would pile up on per-run branches.
            # DELIBERATELY rc-gated: a PARTIAL repin (publish failed
            # mid-chain, run ends red) keeps requiring human eyes — its diff
            # is consistent but incomplete, and auto-landing it would clear
            # half the drift while looking like all of it. Failure to arm
            # auto-merge only warns: the PR exists either way, and fast-gates
            # still gates the actual merge.
            if [ "${PUBLISH_RC:-}" = "0" ]; then
              if ! gh pr merge "${branch}" --auto --squash; then
                echo "::warning::auto-merge could not be armed for ${branch}; merge it manually once fast-gates is green."
              fi
            fi
          else
            echo "::error::push failed for ${branch}; the publishes happened but repins were not captured — push ${branch} manually."
            exit 1
          fi

      - name: Fail the run if a publish failed
        if: always()
        # Through `env:`, not expanded into the `run:` block. Both values are
        # step outputs and the repo already fixed this class twice for the same
        # reason (smc-r4-context-readback.yml, smc-library-refresh.yml): an
        # expansion becomes CODE before bash parses the line, while an env var
        # is only ever data. Measured 2026-08-04 with the pinned zizmor 1.25.2:
        # this file reports two `template-injection` findings on the expanded
        # form and none on this one. They are informational, so the fast-gates
        # ratchet (high/medium only) never counted them — which is exactly how
        # a known-bad pattern spreads.
        env:
          RC: ${{ steps.publish.outputs.rc }}
          LOG_RC: ${{ steps.publish.outputs.log_rc }}
        run: |
          rc="${RC:-}"
          log_rc="${LOG_RC:-}"
          # An EMPTY rc is a different failure from a non-zero one, and saying
          # so is the difference between a legible run and "exited " with no
          # number. It means the publish step never reached its output writes —
          # the shape this workflow shipped with until 2026-08-04, where -e
          # ended that step on the failing pipeline. `${rc:-1}` below already
          # fails the run in that case, so this only names it; the gate was
          # never fail-open.
          if [ -z "${rc}" ]; then
            echo "::error::the publish step produced no rc at all — it exited before writing its outputs, so any repins it made were not captured. Check the handlib-publish-log artifact and the 'Ordered publish + repin' step log."
            exit 1
          fi
          if [ "${rc:-1}" != "0" ]; then
            echo "::error::tv:publish-handlibs exited ${rc} — a publish/verify failed. See the handlib-publish-log artifact."
            exit 1
          fi
          # The publish succeeded but its LOG pipeline did not. Under the old
          # -e this ended the step; with -e off it would otherwise finish green
          # while `Upload publish log` warns (if-no-files-found: warn) and every
          # message above points at an artifact that does not exist. A run whose
          # evidence was never written is not a green run.
          if [ "${log_rc:-1}" != "0" ]; then
            echo "::error::the publish succeeded but the log pipeline (tee) exited ${log_rc:-<empty>} — /tmp/handlib_publish.log was not written or is truncated, so the handlib-publish-log artifact this run points at is missing its evidence."
            exit 1
          fi
          echo "All hand-authored libraries published/verified in order."
