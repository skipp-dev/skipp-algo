name: smc-r4-context-readback
# live-window: manual-only

# R4 Context readback / binding measurement, on demand.
#
# Why this workflow exists
# ------------------------
# The R4 shadow evidence was captured by hand from a local machine
# (docs/SMC_CONTEXT_BUS_R4_RUNBOOK.md runs tv_preflight.ts directly), which is
# why closing R4 has always waited on a person being at a keyboard. Nothing
# about it actually needs one: the TradingView session is fully automated in
# CI — TV_STORAGE_STATE is refreshed every 48 h by
# tradingview-storage-refresh.yml, with TV_USERNAME / TV_PASSWORD /
# TV_TOTP_SECRET as the headless-login fallback.
#
# The measurement is also stale on its own terms. The recorded 60/60 binding
# readback was captured against commit 393dafedd; #4263 has since changed both
# SMC_Context_Bus.pine and SMC_Context_Overlay.pine and moved the contract from
# 60 channels to 62. Whatever readback mechanism is used, that number has to be
# re-measured against the current contract.
#
# Default mode is READONLY on purpose. A readonly run answers "do all 62
# channels still bind after #4263?" without writing anything to the account.
# Mutating runs (which create/save scripts and modify a layout) must be
# selected explicitly, per the authorization discipline the R4 and R2.4
# evidence artifacts record.

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "readonly = measure only; mutating = may create/save scripts and modify the layout"
        type: choice
        options:
          - readonly
          - mutating
        default: readonly
      chart_url:
        description: "TradingView chart/layout to run against (empty = TradingView default chart)"
        type: string
        default: "https://www.tradingview.com/chart/Jb2Vp6xs/"
      config:
        description: "Preflight config for the read-back measurement"
        type: string
        default: automation/tradingview/preflight-r4-context-shadow.json
      rebind_config:
        description: "Rollout config used by the mutating rebind (ignored when readonly)"
        type: string
        default: automation/tradingview/config/consumer-rollout-r4-context.json

env:
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read

concurrency:
  # 2026-08-01: one AUTOMATED browser session at a time — CI against CI only.
  # This group does NOT serialise the account: the operator's own browser is
  # a second, unserialised writer on the same layouts, and TradingView
  # autosaves from it (operator-confirmed 2026-08-01: autosave active, and a
  # chart tab on this account was open all day while runs mutated layouts —
  # nothing here knew). Since 2026-08-03 a mutating run of THIS workflow can be
  # excluded by an operator-declared window (TV_OPERATOR_ACTIVE, see the gate
  # step below) and measures out-of-band drift against its own published
  # baseline before it writes. An UNDECLARED operator session is still
  # invisible while it is open; only what it wrote is detectable, afterwards.
  # Every workflow below drives the SAME external account, and until now each
  # one only serialised against itself — two of these blocks already said
  # "TradingView is a single shared external target" while keeping a private
  # group, so the guarantee was stated but never implemented. Measured trigger:
  # a manual tv-save-consumer-source dispatch ran while an R4 readback was
  # being prepared; nothing in CI would have stopped them overlapping.
  # cancel-in-progress stays false everywhere: these runs save layouts and
  # publish scripts, so a queued run must wait, never pre-empt.
  group: tradingview-session
  cancel-in-progress: false
  # 2026-08-06: cancel-in-progress governs only the RUNNING run, so `false`
  # never protected the waiter. Under the default `queue: single` a group holds
  # exactly one pending run and the next entrant CANCELS it -- that is what
  # dropped dispatches here. `queue: max` queues up to 100 runs FIFO instead.
  queue: max

# Load-bearing here, not boilerplate: runs-on resolves to the Windows
# self-hosted runner whenever SMC_GH_HOSTED_RUNNER is set, and every run: step
# below is bash (set -euo pipefail, heredocs) which PowerShell cannot parse.
defaults:
  run:
    shell: bash

jobs:
  readback:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # 2026-08-03 (Finding: this workflow is a SECOND caller of
      # tv_batch_consumer_rollout.ts, same as tv-save-consumer-source.yml,
      # and had none of that workflow's operator-window protection). Same
      # mechanism, same script: the operator's browser is the normal writer
      # on this TradingView account and autosaves from it, so a mutating run
      # starting mid-window races an unserialised second writer. The
      # repository variable holds an EXPIRY, not a boolean, so a forgotten
      # claim cannot block this workflow past its own timestamp -- see
      # scripts/check_tv_operator_window.py.
      #
      # Placed immediately after Checkout -- the script needs nothing else
      # from this job -- and before every setup step below (pinned Python,
      # Node, uv, Playwright), so a refusal costs about a second instead of
      # the several minutes those installs take. Readonly dispatches are
      # exempt: they write nothing, so gating them would only suppress a
      # read that is safe regardless of the operator's window.
      - name: Refuse to mutate inside the operator's TradingView window
        if: inputs.execution_mode == 'mutating'
        env:
          TV_OPERATOR_ACTIVE: ${{ vars.TV_OPERATOR_ACTIVE }}
        run: python3 -m scripts.check_tv_operator_window

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Resolve Python 3.12 interpreter
        # setup-python-pinned installs the interpreter but exports no path, and
        # every Python step below runs as "$SMC_PYTHON_BIN". Without this the
        # variable is empty: run 30683157375 expanded it to "" and the
        # storage-state heredoc died with exit 127 (command not found). The step
        # before it, `uv pip install --python "$SMC_PYTHON_BIN"`, had tolerated
        # the empty value and reported success — which is exactly why the gap
        # survived to the first live run. This job is GitHub-hosted only, so one
        # pinned check suffices.
        run: |
          python -c "import sys; raise SystemExit('pinned Python bootstrap did not resolve 3.12' if sys.version_info[:2] != (3, 12) else 0)"
          echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: "true"
          cache-dependency-glob: |
            requirements*.txt

      - name: Install Python dependencies
        run: |
          uv pip install --python "$SMC_PYTHON_BIN" --system -r requirements.txt pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          mkdir -p automation/tradingview/auth
          "$SMC_PYTHON_BIN" - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET']
          trimmed = raw.strip()
          if not trimmed:
            raise SystemExit('TV_STORAGE_STATE secret is empty')

          if trimmed.startswith('{'):
            payload = trimmed
          else:
            try:
              payload = gzip.decompress(base64.b64decode(trimmed)).decode('utf-8')
            except Exception as exc:
              raise SystemExit(f'TV_STORAGE_STATE is neither raw JSON nor gzip+base64: {exc}')

          try:
            json.loads(payload)
          except json.JSONDecodeError as exc:
            raise SystemExit(f'Invalid TV_STORAGE_STATE JSON payload: {exc}')

          output_path = Path('automation/tradingview/auth/storage-state.json')
          output_path.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Record what this run was authorized to do
        run: |
          set -euo pipefail
          mkdir -p artifacts/tradingview
          "$SMC_PYTHON_BIN" - <<'PY'
          import json
          import os
          from pathlib import Path

          # The R2.4 and R4 evidence artifacts record a per-session
          # authorization. A dispatched run has one too — the dispatch itself —
          # so capture it in the same shape instead of leaving the provenance
          # of a CI-driven session undocumented.
          record = {
              "schemaVersion": 1,
              "trigger": "workflow_dispatch",
              "actor": os.environ["GH_ACTOR"],
              "runId": os.environ["GH_RUN_ID"],
              "executionMode": os.environ["EXECUTION_MODE"],
              "chartUrl": os.environ["CHART_URL"],
              "config": os.environ["PREFLIGHT_CONFIG"],
              "publicationAllowed": False,
              "alertCreationAllowed": False,
          }
          Path("artifacts/tradingview/r4_readback_authorization.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(record, indent=2))
          PY
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_RUN_ID: ${{ github.run_id }}
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          CHART_URL: ${{ inputs.chart_url }}
          PREFLIGHT_CONFIG: ${{ inputs.config }}

      # R4 runs a DIFFERENT config (rebind_config) against DIFFERENT verify
      # targets than tv-save-consumer-source.yml's consumer-rollout, so
      # comparing this run against THAT workflow's published snapshot would
      # always read "unknown" -- it never measured R4's targets. R4 publishes
      # its own snapshot below, to a DISTINCT path on the same
      # bot/live-tradingview-bindings branch, and this step fetches that same
      # path back as the pre-mutation baseline. Mechanics copied from
      # tv-save-consumer-source.yml's "Fetch the published binding baseline":
      # gh api against the branch (git itself has no credential here --
      # Checkout above uses persist-credentials: false), base64-decoded into
      # place. A missing baseline is not an error -- it is the "unknown"
      # verdict, and tv_batch_consumer_rollout.ts decides that downstream.
      #
      # On the FIRST run nothing has been published at this path yet, so this
      # warns, out-of-band drift reads "unknown", and the mutating run's
      # report.ok goes red on that alone. That first red is EXPECTED, not a
      # regression -- this repo already has precedent for a gate that starts
      # honestly red rather than silently passing on zero measurements (the
      # overhead gate's BASELINE phase). It stays red until the first
      # mutating run publishes a snapshot for the next one to compare against.
      #
      # Gated to mutating only: a readonly dispatch never reaches the rebind
      # step below (tv_batch_consumer_rollout.ts is not invoked at all in
      # readonly mode), so nothing on that path would ever read this file.
      - name: Fetch the published R4 binding baseline
        if: inputs.execution_mode == 'mutating'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/monitoring/previous
          out="artifacts/monitoring/previous/tradingview_r4_context_bindings.json"
          path="artifacts/monitoring/latest/tradingview_r4_context_bindings.json"
          if gh api "repos/${GH_REPO}/contents/${path}?ref=bot/live-tradingview-bindings" \
               --jq '.content' 2>/dev/null | base64 -d > "${out}"; then
            echo "Baseline fetched: $(wc -c < "${out}") bytes"
          else
            rm -f "${out}"
            echo "::warning::No published R4 binding baseline — out-of-band drift will report as unknown (expected on the first run; see the comment on this step)."
          fi

      - name: Rebind the overlay and SAVE the layout (mutating only)
        id: rebind
        if: inputs.execution_mode == 'mutating'
        # tv_preflight.ts never calls saveChangedChartLayout — measured, zero
        # call sites. Driving it in mutating mode rebinds inside its own session
        # and discards everything when the session ends, which reads back as a
        # green 62/62 that persists nothing. That exact trap is on record twice:
        # in the original R4 evidence ("a force-rebind run reports 60/60 inside
        # its own session even when nothing persists") and in the header of
        # tv_repair_binding_e2e.ts after #4289.
        #
        # tv_batch_consumer_rollout.ts is the tool that persists: it rebinds,
        # saves per layout, and discards by reloading when a repair came out
        # unclean. The R4 config carries an EMPTY saveTargets, so no Pine source
        # is pushed — this run only touches bindings and the layout.
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          TV_STEP_TIMEOUT_MS: "90000"
          TV_CHART_URL: ${{ inputs.chart_url }}
          TV_SCREENSHOT_DIR: artifacts/tradingview/screenshots
          TV_FORCE_REBIND: "true"
          # Saving the BUS source is not enough: the instance already applied to
          # the layout stays on the OLD version and would keep exposing the old
          # 60 outputs, so the overlay's two new inputs would have nothing to
          # bind to. refreshChartScriptInstance removes and re-applies the
          # producer so the chart carries the saved version. The plan resolver
          # rejects this without TV_FORCE_REBIND, which is set above.
          TV_REFRESH_PRODUCER: "true"
          # Through env, not interpolated into the shell: a dispatch input
          # expanded directly into `run:` is a template-injection sink
          # (zizmor high). The value reaches the CLI as an ordinary argument.
          REBIND_CONFIG: ${{ inputs.rebind_config }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tradingview/screenshots
          npx tsx scripts/tv_batch_consumer_rollout.ts \
            --config "$REBIND_CONFIG" \
            --baseline artifacts/monitoring/previous/tradingview_r4_context_bindings.json \
            --out artifacts/tradingview/r4_rebind_rollout.json

      # Publishes THIS run's own snapshot -- the file the rebind step above
      # just wrote via --out -- to the same bot/live-tradingview-bindings
      # branch the fetch step above reads back on the next run, at the
      # DISTINCT path that step targets. Mechanics copied from
      # tv-save-consumer-source.yml's "Publish latest binding snapshot": git
      # config, force-with-lease against the remote ref so a concurrent
      # publisher cannot be silently clobbered; a push failure warns rather
      # than failing the job, since the uploaded artifact remains available.
      #
      # One addition beyond a literal copy, and it is load-bearing: this
      # directory is SHARED. tv-save-consumer-source.yml already publishes
      # artifacts/monitoring/latest/tradingview_consumer_bindings.json on
      # this exact branch, and live_overlay_daemon polls it in production
      # (services/live_overlay_daemon/config.py, TRADINGVIEW_BINDINGS_
      # SNAPSHOT_URL). tv-save-consumer-source.yml's publish step was
      # correct as the branch's SOLE producer -- it stages only its own
      # file, so committing on top of a fresh `actions/checkout` (which does
      # not carry artifacts/monitoring/latest/ at all; it is bot-branch-only
      # content) discards whatever else was there. Copying that step's
      # mechanics unchanged into a SECOND producer of the same directory
      # would make each publish silently delete the other's file the moment
      # it becomes the new tip -- ADR-0024 §5 names this exact case
      # ("publishers... with more than one producer must seed from the
      # fetched remote tip and replace only their owned paths"). So: fetch
      # first, seed stable_dir from the fetched tip BEFORE adding this run's
      # file, then stage the whole directory rather than only the one path.
      #
      # This protects tv-save-consumer-source.yml's file from an R4 publish,
      # and that workflow now seeds symmetrically, so an R4 file survives its
      # publishes too. Both directions were proven by round-tripping the two
      # `run:` bodies against a throwaway bare repo, not by reading them.
      # A third producer on this branch MUST seed the same way or it will
      # delete both existing files on its first push.
      #
      # Gated on `steps.rebind.conclusion` -- 'success' or 'failure', never
      # 'skipped' or 'cancelled' -- for the same reason tv-save-consumer-
      # source.yml gates its publish on `steps.save.conclusion` rather than
      # always(): a run the operator-window gate refused, or a readonly
      # dispatch that never touches the rebind step at all, has nothing
      # fresh on disk. Republishing then would force stale (or absent)
      # content over the last real observation instead of leaving it alone.
      - name: Publish latest R4 binding snapshot
        if: ${{ always() && (steps.rebind.conclusion == 'success' || steps.rebind.conclusion == 'failure') }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          snapshot="artifacts/tradingview/r4_rebind_rollout.json"
          if [ -z "${GH_TOKEN:-}" ] || [ ! -s "${snapshot}" ]; then
            echo "::warning::Cannot publish R4 binding snapshot (missing GH_PAT or snapshot)."
            exit 0
          fi
          # Same rule as tv-save-consumer-source.yml's publish step, same
          # branch, same reason: steps.rebind.conclusion says the step RAN,
          # not that it observed anything. Both producers write reports from
          # scripts/tv_batch_consumer_rollout.ts, so both carry the reading in
          # tradingViewObserved.bindings, and an empty one replacing a full
          # one is what left the 2026-08-14 R1 re-attestation unable to attest
          # (run 31823203037 poisoned the baseline; run 31824430346 paid).
          # Counted rather than `if ! jq ...` for the same reason as the sibling:
          # that form answers "observed nothing" and "jq broke" identically, by
          # not publishing and staying green.
          observed_bindings="$(jq '(.tradingViewObserved.bindings // []) | if type == "array" then length else error("tradingViewObserved.bindings is not an array") end' "${snapshot}")"
          if [ "${observed_bindings}" -eq 0 ]; then
            echo "::notice::This run observed no TradingView bindings — the published baseline is left untouched."
            exit 0
          fi
          # Same operator decision as the sibling publisher in
          # tv-save-consumer-source.yml (2026-08-15): only a COMPLETE
          # observation becomes the baseline; a partial one leaves the last
          # complete one in place. Complete is relative to THIS run's config:
          # rebind_config is operator-supplied per dispatch, so a complete run
          # against a narrower target set legitimately publishes a narrower
          # baseline -- the next larger dispatch then reads ONE honest
          # "unknown" (baseline does not cover every verify target). That
          # first red is the config change surfacing, not a gate defect.
          expected_bindings="$(jq '.bindings.expectedConsumers // error("report carries no bindings.expectedConsumers -- the coverage gate cannot tell partial from broken")' "${snapshot}")"
          if [ "${observed_bindings}" -ne "${expected_bindings}" ]; then
            echo "::notice::This run observed only ${observed_bindings} of ${expected_bindings} TradingView bindings — a partial reading must not become the baseline; the published one is left untouched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # R4_SNAPSHOT_REMOTE is unset in Actions and exists so the contract
          # test can execute this fragment WHOLE -- push included -- against a
          # local repository, mirroring TV_SNAPSHOT_REMOTE in the sibling
          # publisher. Both bodies are proven by round-tripping them against a
          # throwaway bare repo, not by reading them.
          remote_url="${R4_SNAPSHOT_REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
          remote_ref="refs/heads/bot/live-tradingview-bindings"
          tracking_ref="refs/remotes/origin/bot/live-tradingview-bindings"
          zero_sha="0000000000000000000000000000000000000000"
          git fetch "${remote_url}" "+${remote_ref}:${tracking_ref}" 2>/dev/null || true
          expected_sha="$(git rev-parse --verify "${tracking_ref}" 2>/dev/null || echo "${zero_sha}")"
          stable_dir="artifacts/monitoring/latest"
          mkdir -p "${stable_dir}"
          if [ "${expected_sha}" != "${zero_sha}" ]; then
            git checkout "${expected_sha}" -- "${stable_dir}" 2>/dev/null || true
          fi
          cp "${snapshot}" "${stable_dir}/tradingview_r4_context_bindings.json"
          git add -f "${stable_dir}"
          git commit -m "[skip ci] chore: refresh R4 context binding snapshot"
          if git push "--force-with-lease=${remote_ref}:${expected_sha}" "${remote_url}" "HEAD:${remote_ref}"; then
            echo "Published R4 context binding snapshot to bot/live-tradingview-bindings."
          else
            echo "::warning::R4 context binding snapshot push failed; uploaded artifact remains available."
          fi

      - name: Run TradingView preflight
        id: preflight
        # For a mutating run this is the proof, not a formality: a SEPARATE
        # process with a fresh session and a fresh page load. An in-session
        # re-read cannot distinguish "persisted" from "still in memory"; a new
        # process can only see what the layout save actually kept.
        #
        # 2026-08-03 (Finding, run-30700389375-shaped): this step used to have
        # no `if:` at all, which GitHub Actions implicitly treats as
        # `success()` -- so a rebind that mutated and then FAILED skipped the
        # one step that could prove whether the layout it just touched was
        # left broken. `success()` alone still covers the two cases that must
        # keep working exactly as before: readonly mode (the rebind step
        # above never runs, its 'skipped' conclusion does not count against
        # success()) and a fully green mutating run. The added
        # `steps.rebind.conclusion == 'failure'` clause is the one thing that
        # changes: a rebind that ran and failed now still reaches this proof.
        # Deliberately NOT always() -- that would also fire after an earlier
        # setup step failed (no storage state, no browser dependencies, no
        # session to read with), which is exactly the case success() alone
        # already excludes and must keep excluding.
        if: ${{ !cancelled() && (success() || steps.rebind.conclusion == 'failure') }}
        env:
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_STATE_MAX_AGE_HOURS: "72"
          TV_STEP_TIMEOUT_MS: "90000"
          TV_CHART_URL: ${{ inputs.chart_url }}
          TV_SCREENSHOT_DIR: artifacts/tradingview/screenshots
          TV_PREFLIGHT_REPORT: artifacts/tradingview/r4_readback_preflight.json
          # Same reason as the rebind step above. This one shipped in #4281 and
          # was already inside the zizmor baseline, so fixing it here lowers the
          # ratchet rather than merely holding it.
          PREFLIGHT_CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tradingview/screenshots
          npx tsx scripts/tv_preflight.ts \
            --config "$PREFLIGHT_CONFIG" \
            --execution-mode readonly \
            --out artifacts/tradingview/r4_readback_preflight.json

      - name: Summarise the measurement
        if: always()
        run: |
          set -euo pipefail
          report=artifacts/tradingview/r4_readback_preflight.json
          if [ ! -f "$report" ]; then
            echo "No preflight report produced — see the step log above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$SMC_PYTHON_BIN" - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          from scripts.smc_context_bus_manifest import MAX_CHANNELS

          report = json.loads(
              Path("artifacts/tradingview/r4_readback_preflight.json").read_text(encoding="utf-8")
          )
          print("## R4 Context readback\n")
          print(f"- execution mode: `{os.environ['EXECUTION_MODE']}`")
          print(f"- contract channels today: **{MAX_CHANNELS}**")
          print(f"- report `ok`: **{report.get('ok')}**\n")
          print("```json")
          print(json.dumps(report, indent=2)[:4000])
          print("```")
          PY
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode }}

      - name: Upload readback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r4-context-readback
          path: |
            artifacts/tradingview/r4_readback_preflight.json
            artifacts/tradingview/r4_readback_authorization.json
            artifacts/tradingview/r4_rebind_rollout.json
            artifacts/tradingview/screenshots/**
          if-no-files-found: warn
          retention-days: 30
