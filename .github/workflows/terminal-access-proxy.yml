# live-window: any-trigger
name: Terminal access proxy

on:
  pull_request:
    paths:
      - "services/terminal_access_proxy/**"
      - "scripts/run_terminal_candidate_mirror.py"
      - "scripts/start_terminal_service.sh"
      - "tests/test_terminal_candidate_mirror.py"
      - "Dockerfile"
      - ".github/workflows/terminal-access-proxy.yml"
  push:
    branches: [main]
    paths:
      - "services/terminal_access_proxy/**"
      - "scripts/run_terminal_candidate_mirror.py"
      - "scripts/start_terminal_service.sh"
      - "tests/test_terminal_candidate_mirror.py"
      - "Dockerfile"
      - ".github/workflows/terminal-access-proxy.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/terminal_access_proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/terminal_access_proxy/go.mod
          cache: false
      - run: go test ./...
      - run: go build ./...
