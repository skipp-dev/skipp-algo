# live-window: mutating-on-cron  # F-V6-F2.1 (2026-05-02)
name: smc-measurement-benchmark-rolling

# E3 — Rolling Benchmark (Q3/Q4 plan §2.2 E3).
#
# Runs the measurement-benchmark harness daily against the same 20-symbol
# universe as the weekly full-corpus job, but writes its artifacts under
# a dated sub-directory and keeps only the most recent 30 days on the
# upload-artifact path. This gives us:
#
#   * a 30-day rolling window for drift detection alongside the
#     weekly lifetime snapshot (from smc-measurement-benchmark.yml), and
#   * a daily cadence that the Phase F / Phase G auto-tuner can consume
#     without waiting a full calendar week.
#
# Nothing in this workflow mutates the checked-in lifetime corpus or
# production calibration — it is purely observational.

on:
  # Workflow-Audit HOCH-1 (2026-06): cron offset is NOT an ordering
  # guarantee. Ein fest gelegter 13:00-Tick raste seinerzeit gegen den noch
  # laufenden 12:00-Export und scheiterte in ~8/10 Cron-Laeufen an
  # "Producer artifact missing for <date>". Deshalb ist `workflow_run` der
  # WEG (Muster F-V4-J3 aus smc-library-refresh.yml) und der Cron nur das
  # NETZ fuer verlorene oder verzoegerte workflow_run-Ereignisse.
  #
  # 2026-08-29 — drei Zahlen in diesem Block waren veraltet und haben die
  # Kadenz jahrelang falsch begruendet. Am Code nachgezaehlt:
  #   * Der Producer laeuft NEUN Ticks je Werktag (08,10,12,14,16,18,20,21,22
  #     UTC), nicht 2x. Der Satz "so this consumer can now fire up to 2x/day
  #     … safe and intentional" wurde fuer zwei Laeufe geschrieben und trug
  #     seither acht (gemessen 27.8.: 366 Runner-Minuten).
  #   * Sein Budget ist 120 min (`timeout-minutes` am producer-Job), nicht 240.
  #   * Die Begruendung "re-benching the same artifact is idempotent" war
  #     schlicht falsch: `captured_at` fiel sekundengenau auf `now()` zurueck,
  #     jeder Lauf schrieb eine eigene Zeile. Seit #5190 stimmt sie wieder
  #     (--captured-at + --replace-on-duplicate).
  #
  # Die Kadenz haengt seit #5191 nicht mehr an der Zahl der Fires, sondern am
  # `cadence-gate`-Job: Fenster A 11:00-12:30 UTC bedient die Tages-Gates ab
  # 13:30, Fenster B ab 20:00 UTC traegt die reifsten Labels. Ueberzaehlige
  # Fires kosten nur diesen Gate-Job.
  workflow_run:
    workflows: ["smc-databento-production-export-sharded"]
    types: [completed]
    branches: [main]
  schedule:
    # Die Netze liegen IN den beiden Fenstern, nicht daneben. Der alte
    # Einzel-Tick um 16:30 konnte die Tages-Gates (13:30/14:00/15:00 UTC)
    # grundsaetzlich nicht mehr bedienen — er lag hinter ihnen. Solange
    # `workflow_run` trug, fiel das nicht auf; genau das ist der Zustand, den
    # eine Redundanz von acht Fires verdeckt.
    #
    # 12:15 = Producer-Tick 10:00 + volles 120-min-Budget + 15 min Puffer.
    # Bis dahin liegt das Tagesartefakt vor (oder der Producer ist gescheitert),
    # und ein ~46-Minuten-Lauf ist gegen 13:01 fertig — vor dem ersten
    # Konsumenten um 13:30.
    #
    # 22:15 = Producer-Tick 20:00 + Budget + Puffer, also im Fenster B.
    # Ohne diesen Tick bliebe an einem Tag mit komplett verlorener
    # workflow_run-Zustellung der reife Abendlauf aus.
    #
    # Beide feuern nur wirksam, wenn der Tag sonst leer bliebe: das
    # `cadence-gate` ueberspringt sie, sobald ihr Fenster bedient ist. Im
    # Normalbetrieb kosten sie je einen Gate-Job von wenigen Sekunden.
    # Mon-Fri wie der Producer (keine Wochenend-Ticks → kein frisches
    # Artefakt zu konsumieren).
    - cron: "15 12 * * 1-5"
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (default: full 20-sym universe)"
        required: false
        default: ""
      timeframes:
        # Timeframe expansion (2026-06-19): full canonical benchmark set.
        description: "Comma-separated timeframes (default: 5m,10m,15m,30m,1H,4H,1D)"
        required: false
        default: "5m,10m,15m,30m,1H,4H,1D"
      reseed_accumulated:
        # 2026-07-06: one-time un-poisoning of the accumulated FamilyEvent
        # pool. The pool was built for weeks by the pre-score-persistence
        # accumulator, which stripped the score off every aged event, so the
        # magnitude walk-forward saw ~0 usable samples. When true, the
        # accumulate step ignores the (poisoned) previous artifact and uses
        # the committed clean rebuild as --previous instead, so subsequent
        # runs grow from a healthy base. Dispatch ONCE; leave false normally.
        description: "One-time: reseed the accumulated pool from the committed clean rebuild"
        required: false
        type: boolean
        default: false

permissions:
  # WF-AUTH-1 (2026-06-26): the rolling benchmark must both (a) read cross-
  # workflow artifacts from the canonical producer via the GitHub Actions REST
  # API and (b) force-update the bot/live-experiment-snapshot branch so the
  # Grafana experiment daemon sees fresh rollups. `contents: write` is required
  # for the push; `actions: read` is required for artifact listing/download.
  # Keep workflow-level default as read-only and elevate write only on the
  # mutating job below (least-privilege layout).
  contents: read
  actions: read

concurrency:
  group: smc-measurement-benchmark-rolling
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"  # F-V5-A2 (2026-05-01)
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
defaults:
  run:
    shell: bash

jobs:
  # Entscheidet VOR allem Teuren, ob dieser Fire ueberhaupt laufen muss.
  # Der Producer hat neun Ticks je Werktag, `workflow_run` feuerte also bis
  # zu neunmal — obwohl der Kopfkommentar oben von zwei Laeufen ausgeht.
  # Gemessen 2026-08-29: acht Laeufe, 366 Runner-Minuten an einem Werktag.
  #
  # Die Entscheidung liegt bewusst auf JOB-Ebene, nicht als Schritt im
  # Worker: ein uebersprungener Job fuehrt seine 15 `if: always()`-Schritte
  # gar nicht erst aus. Eine Schranke im Job muesste jede einzelne davon
  # mittragen, und jede vergessene waere ein roter Lauf.
  #
  # Die Regel selbst (zwei Fenster, Blindheit ⇒ laufen) steht in
  # scripts/decide_rolling_benchmark_run.py und ist dort tabellengetrieben
  # geprueft — hier laeuft nur die Abfrage des heutigen Zustands.
  # Der Name ist NICHT `gate`: so heisst ein required Status-Check aus
  # smc-fast-pr-gates.yml, und zwei Jobs gleichen Namens melden denselben
  # Kontext. tests/test_required_checks_reach_the_merge_queue.py hat genau
  # das gefangen (2026-08-29) — der Waechter loest required Kontexte ueber
  # Jobnamen auf und sah diesen Workflow ploetzlich als Melder von `gate`.
  cadence-gate:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      window: ${{ steps.decide.outputs.window }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Der Gate-Job liest nur und entscheidet; er pusht nichts. Ohne
          # diese Zeile persistiert die Action den Token in .git/config und
          # zizmor meldet `artipacked` (medium) — gemessen 2026-08-29.
          persist-credentials: false
      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned
      - name: Decide whether this fire has to run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Env-Indirektion statt direkter ${{ }}-Interpolation im run-Block:
          # dieselbe Haertung wie in ci.yml (Audit M-1). Der zizmor-Ratchet
          # meldet direkte Interpolation als template-injection — gemessen
          # 2026-08-29 an genau diesem Schritt (high 97->98, medium 52->53).
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_WORKFLOW: ${{ github.workflow }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_PRODUCER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # Der Job, der die Arbeit macht. Muss der Job-Id unten entsprechen —
          # tests/test_decide_rolling_benchmark_run.py haelt beide zusammen.
          GATE_WORKER_JOB: rolling-benchmark
        run: |
          # Die heutigen Laeufe DIESES Workflows. Schlaegt die Abfrage fehl,
          # bleibt RUNS leer — und die Entscheidung faellt fail-open auf
          # LAUFEN (siehe Modul-Docstring: ein Gate, das bei Blindheit
          # ueberspringt, stoppt den Benchmark still und dauerhaft).
          RUNS="$(gh run list \
            --repo "${GATE_REPOSITORY}" \
            --workflow "${GATE_WORKFLOW}" \
            --created "$(date -u +%Y-%m-%d)" \
            --limit 50 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | {id: .databaseId, conclusion, created_at: .createdAt}]' 2>/dev/null || true)"
          # Welche davon haben den Worker wirklich gefahren? `conclusion=success`
          # sagt es NICHT: ein Fire, den dieses Gate ueberspringt, endet ebenfalls
          # gruen (Gate-Job success, Worker skipped). Gemessen 2026-10-01: die
          # uebersprungenen 09:xx/10:xx-Fires "bedienten" seit dem 31.8. jeden
          # Tag Fenster A, das Tagesartefakt entstand erst nach 20:00 UTC und
          # promotion-gate-daily (14:00 UTC) fand in 17 von 18 Laeufen nichts.
          # Nur der Job-Befund unterscheidet beide Faelle. Faellt eine Abfrage
          # aus, fehlt die Id — und ein Lauf ohne Befund bedient kein Fenster.
          WORKED=""
          for run_id in $(gh run list \
            --repo "${GATE_REPOSITORY}" \
            --workflow "${GATE_WORKFLOW}" \
            --created "$(date -u +%Y-%m-%d)" \
            --limit 50 \
            --json databaseId,conclusion \
            --jq '.[] | select(.conclusion == "success") | .databaseId' 2>/dev/null || true); do
            WORKED="${WORKED} $(gh api "repos/${GATE_REPOSITORY}/actions/runs/${run_id}/jobs" \
              --jq ".jobs[] | select(.name == \"${GATE_WORKER_JOB}\" and .conclusion == \"success\") | .run_id" 2>/dev/null || true)"
          done
          python scripts/decide_rolling_benchmark_run.py \
            --event-name "${GATE_EVENT_NAME}" \
            --producer-conclusion "${GATE_PRODUCER_CONCLUSION}" \
            --todays-runs "${RUNS}" \
            --worked-run-ids "${WORKED}"

  select-runner:
    # Kein Runner wird aufgeloest, wenn ohnehin nichts laeuft. Dieser Job
    # lief bisher bei JEDEM Producer-Abschluss mit, auch nach Fehllaeufen.
    needs: cadence-gate
    if: ${{ needs.cadence-gate.outputs.run == 'true' }}
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      # WF-AUTH-1: runner inventory query uses the repo-level Actions runners
      # REST endpoint; `actions: read` is required.
      actions: read
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
      runner_environment: ${{ steps.resolve.outputs.runner_environment }}
      resolution_reason: ${{ steps.resolve.outputs.resolution_reason }}
      matched_runner_name: ${{ steps.resolve.outputs.matched_runner_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Resolve worker runner
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SMC_FORCE_GH_HOSTED: ${{ vars.SMC_FORCE_GH_HOSTED }}
        run: |
          # The rolling benchmark is an off-hours batch workload, so it
          # should prefer the priority cron Windows runner when one is idle.
          python scripts/resolve_workflow_runner.py \
            --repository "${{ github.repository }}" \
            --hosted-runner "${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}" \
            --custom-label "${{ vars.SMC_PRIORITY_CRON_SELF_HOSTED_LABEL || vars.SMC_SELF_HOSTED_LABEL }}"

  rolling-benchmark:
    # Workflow-Audit HOCH-1: when triggered by workflow_run, only proceed
    # if the producer succeeded (mirror of F-V4-J3 in
    # smc-library-refresh.yml). Manual workflow_dispatch and the
    # scheduled safety-net cron bypass this guard.
    # Die Producer-Bedingung bleibt woertlich; das Kadenz-Gate kommt als
    # zweite Bedingung dazu (`gate` prueft sie ebenfalls, aber diese Zeile
    # ist der Vertrag dieses Jobs und darf nicht von einem anderen abhaengen).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.cadence-gate.outputs.run == 'true' }}
    needs: [cadence-gate, select-runner]
    runs-on: ${{ fromJson(needs.select-runner.outputs.runs_on_json) }}
    # 60 -> 120 (frame-fix 2026-07-13): genuine full-session intraday frames
    # carry ~2.3k events/pair instead of ~2 — even after the PIT day-bucket +
    # vectorized bar-index optimizations (~675s -> ~54s for the heaviest pair)
    # the 140-pair sweep needs headroom beyond 60 minutes.
    timeout-minutes: 120
    permissions:
      # WF-AUTH-1: this is the only job that pushes updates to
      # bot/live-experiment-snapshot and reads producer artifacts.
      contents: write
      actions: read

    steps:
      - name: Announce selected runner
        run: |
          echo "runner_environment=${{ needs.select-runner.outputs.runner_environment }}"
          echo "resolution_reason=${{ needs.select-runner.outputs.resolution_reason }}"
          echo "matched_runner_name=${{ needs.select-runner.outputs.matched_runner_name }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pinned Python (GitHub-hosted)
        if: needs.select-runner.outputs.runner_environment == 'github-hosted'
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve Python 3.12 interpreter
        run: |
          if [[ "${{ needs.select-runner.outputs.runner_environment }}" == "github-hosted" ]]; then
            python -c "import sys; raise SystemExit('GitHub-hosted Python bootstrap did not resolve Python 3.12.' if sys.version_info[:2] != (3, 12) else 0)"
            echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
            exit 0
          fi

          if command -v python >/dev/null 2>&1; then
            if python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"; then
              echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if command -v py >/dev/null 2>&1; then
            python_bin="$(py -3.12 -c "import sys; print(sys.executable)")"
            echo "SMC_PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::Self-hosted runner is missing a usable Python 3.12 interpreter (tried \`python\` and \`py -3.12\`)."
          exit 1

      # F-V8-perf (2026-05-18): uv installer (mirrors ci.yml + smc-library-refresh).
      # On GitHub-hosted we enable the built-in wheel cache; on self-hosted we
      # rely on the local on-disk uv cache and skip the actions/cache layer.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ needs.select-runner.outputs.runner_environment == 'github-hosted' && 'true' || 'false' }}
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: |
          # WF-012 (2026-05-20): ``uv pip install --python python ...`` on a
          # GitHub-hosted setup-python interpreter expects an existing venv and
          # fails with "No virtual environment found". Install into the resolved
          # interpreter's system environment instead; this mirrors the producer
          # workflows and keeps self-hosted Python-path resolution intact.
          uv pip install --python "$SMC_PYTHON_BIN" --system -r requirements.txt pytest

      - name: Resolve run date + output dir
        id: meta
        run: |
          RUN_DATE="$(date -u +'%Y-%m-%d')"
          echo "run_date=${RUN_DATE}" >> "$GITHUB_OUTPUT"
          echo "out_dir=artifacts/ci/measurement_benchmark_rolling/${RUN_DATE}" >> "$GITHUB_OUTPUT"

      # F-V8-D1 (2026-05-14): The rolling benchmark calls
      # `scripts/run_smc_measurement_benchmark.py --require-evidence`, which
      # via `smc_integration.measurement_evidence.build_measurement_evidence`
      # loads source bars from the canonical Databento production export
      # bundle at `artifacts/smc_microstructure_exports/`. Without that bundle
      # the run produces zero-event pairs across all symbols/TFs and the
      # --require-evidence guard hard-fails. Until 2026-05-14 this workflow
      # had NO download-step at all — explaining the red streak since the
      # F-V5-D2/D3 cutover from actions/cache to upload/download-artifact.
      #
      # Mirror the library-refresh fetch + flatten pattern: pull today's
      # producer artifact (or the most recent same-prefix fallback), then
      # flatten the nested subdir into the export-dir root so the
      # non-recursive `_manifest_candidates` glob can find the manifest.
      #
      # F-V8-D4 (2026-05-16): replace direct action unzip with an explicit
      # REST-download + zip-validate loop to survive transient artifact
      # download corruption (e.g. `Invalid LOC header`) without relying on
      # control-plane reruns.
      - name: Restore Databento production export bundle (today + fallback with retry)
        id: restore_export_bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
        run: |
          set -euo pipefail
          # F-V8-perf (2026-05-18): extracted to scripts/restore_databento_export_bundle.py
          # for lintability / unit-test coverage. Behavior is bit-identical to the
          # pre-extraction heredoc (see F-V8-D4 above).
          "$SMC_PYTHON_BIN" scripts/restore_databento_export_bundle.py

      # Flatten the nested `<root>/smc-databento-production-export-*/...`
      # layout from the restored producer artifact directory.
      #
      # F-V8-D3 (2026-05-14): The repo ships a baseline
      # `artifacts/smc_microstructure_exports/smc_live_news_snapshot.json`
      # (and `_state.json`) which is also present in the producer bundle.
      # The producer copy is always the canonical source-of-truth; pre-
      # F-V5-D3 the actions/cache restore overwrote silently. Use `mv -f`
      # and emit `::notice::` annotations listing each overwrite so audits
      # stay visible.
      #
      # Skip when no artifact was restored — verify_export_bundle below
      # produces the canonical missing-bundle annotation.
      - name: Flatten downloaded Databento export bundle
        id: flatten_export_bundle
        if: steps.restore_export_bundle.outputs.found_artifact == 'true'
        run: |
          set -euo pipefail
          ROOT=artifacts/smc_microstructure_exports
          shopt -s nullglob
          moved=0
          overwritten=0
          for sub in "$ROOT"/smc-databento-production-export-*; do
            [ -d "$sub" ] || continue
            echo "==> Flattening $sub"
            for entry in "$sub"/* "$sub"/.[!.]*; do
              [ -e "$entry" ] || continue
              base=$(basename "$entry")
              if [ -e "$ROOT/$base" ]; then
                echo "::notice::Producer bundle overrides existing $ROOT/$base"
                overwritten=$((overwritten + 1))
              fi
              mv -f "$entry" "$ROOT/$base"
              moved=$((moved + 1))
            done
            rmdir "$sub"
          done
          echo "==> Flattened $moved entries ($overwritten overwrote a pre-existing file)"
          echo "moved_entries=$moved" >> "$GITHUB_OUTPUT"
          echo "overwritten_entries=$overwritten" >> "$GITHUB_OUTPUT"

      # Hard-fail when the canonical bundle is missing: --require-evidence
      # below would fail anyway, but with a confusing "no pair produced
      # measurement evidence" message that hides the real upstream cause.
      # Surfacing the clickable annotation pointing at the producer workflow
      # keeps triage in the right place.
      - name: Verify Databento production export bundle is present
        id: verify_export_bundle
        run: |
          set -euo pipefail
          if ls artifacts/smc_microstructure_exports/databento_volatility_production_*_manifest.json >/dev/null 2>&1; then
            NEWEST=$(ls -1t artifacts/smc_microstructure_exports/databento_volatility_production_*_manifest.json | head -1)
            echo "bundle_present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Restored Databento production manifest: ${NEWEST}"
            exit 0
          fi
          echo "bundle_present=false" >> "$GITHUB_OUTPUT"
          echo "::error file=.github/workflows/smc-databento-production-export-sharded.yml::Producer artifact missing for ${{ steps.meta.outputs.run_date }}; rolling benchmark aborted. Re-run smc-databento-production-export-sharded and then re-trigger smc-measurement-benchmark-rolling."
          exit 1

      # #2667: produce REAL per-TF structure artifacts before the benchmark
      # runs, so each chart TF scores its own structural events. Without
      # these, the contract layer aliases the legacy single-file 1D artifact
      # onto every intraday TF (``legacy_tf_fallback``) and all per-TF
      # benchmark slices are clones — the Plan 2.8 Phase-E2 verdicts were
      # void because of exactly this (ADR 2026-06-10, docs/DECISIONS.md).
      # The exporter resamples the bundle's second-level bars to each TF and
      # writes reports/smc_structure_artifacts/manifest_<tf>.json +
      # <SYMBOL>_<tf>.structure.json, which the provider resolves FIRST.
      # Per-symbol failures land in the manifest errors[] (exporter still
      # exits 0); a hard exporter crash only warns HERE — since ADR-0027
      # the availability gate below then fails closed, so the benchmark
      # no longer silently runs on the legacy fallback.
      # This step also resolves + validates SYMBOLS/TIMEFRAMES once and
      # publishes them via GITHUB_ENV so the benchmark step cannot drift.
      - name: Export per-TF structure artifacts (un-void Plan 2.8 Phase-E2)
        env:
          # A2 (2026-06-10): env-var indirection for user-supplied inputs.
          INPUT_SYMBOLS: ${{ github.event.inputs.symbols }}
          INPUT_TIMEFRAMES: ${{ github.event.inputs.timeframes || '5m,10m,15m,30m,1H,4H,1D' }}
          # Issue #3872 (ADR-0023 1D track): the long-history 1D fetch below
          # uses the same guarded Databento loaders as the production export.
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          set -euo pipefail
          SYMBOLS="${INPUT_SYMBOLS}"
          if [ -z "${SYMBOLS}" ]; then
            SYMBOLS="AAPL,MSFT,AMZN,GOOGL,META,NVDA,TSLA,JPM,BAC,GS,MS,V,UNH,JNJ,HD,XOM,CVX,COP,OXY,CAT"
          else
            # A2: only uppercase letters and commas (ticker list — no shell metacharacters).
            [[ "${SYMBOLS}" =~ ^[A-Z,]+$ ]] || {
              echo "::error::symbols must be a comma-separated list of uppercase tickers, got: ${SYMBOLS}"; exit 1
            }
          fi
          # Canonical timeframe set for rolling benchmark.
          TIMEFRAMES="${INPUT_TIMEFRAMES}"
          # A2: digits + m/H/D/W/M + commas only.
          [[ "${TIMEFRAMES}" =~ ^[0-9mHDWM,]+$ ]] || {
            echo "::error::timeframes must be a comma-separated list like '5m,10m,15m,30m,1H,4H,1D', got: ${TIMEFRAMES}"; exit 1
          }
          echo "SMC_BENCH_SYMBOLS=${SYMBOLS}" >> "$GITHUB_ENV"
          echo "SMC_BENCH_TIMEFRAMES=${TIMEFRAMES}" >> "$GITHUB_ENV"

          # Issue #3872: the rolling bundle spans only ~21 trading days —
          # structurally too short for 1D warmup + label horizons (FVG=20
          # daily bars), so the 1D slice yields zero FamilyEvents and the
          # governed live-1D magnitude track starves. Fetch a long daily
          # history (420 trading days, 20 symbols — a few thousand ohlcv-1d
          # rows) and feed it to BOTH 1D consumers: the structure exporter
          # (--workbook, sole daily source when no bundle root is passed)
          # and the measurement harness (SMC_DAILY_BARS_WORKBOOK_OVERRIDE),
          # so detection and labeling see the SAME long frame. Fail-soft:
          # without the workbook the 1D slice keeps today's starved-but-
          # alarmed behaviour (plane_starved heartbeats + gap guard).
          # The benchmark step references this FIXED path statically via its
          # env block (no dynamic GITHUB_ENV write — zizmor github-env
          # ratchet); the harness override falls through cleanly when the
          # file is absent, so fail-soft needs no env plumbing.
          DAILY_HISTORY_XLSX="artifacts/ci/benchmark_daily_history.xlsx"
          rc=0
          "$SMC_PYTHON_BIN" scripts/fetch_benchmark_daily_history.py \
            --symbols "${SYMBOLS}" \
            --output "${DAILY_HISTORY_XLSX}" || rc=$?
          if [ "${rc}" != "0" ] || [ ! -s "${DAILY_HISTORY_XLSX}" ]; then
            echo "::warning title=benchmark-daily-history::long-history 1D fetch failed (rc=${rc}); 1D slice falls back to the short bundle daily_bars (zero events, alarmed by plane_starved heartbeats + gap guard)."
            rm -f "${DAILY_HISTORY_XLSX}"
          fi

          for tf in ${TIMEFRAMES//,/ }; do
            # 1D with a long-history workbook: pass --workbook WITHOUT
            # --export-bundle-root — an explicit workbook alone makes it the
            # sole daily source (write_structure_artifacts_from_workbook
            # nulls the bundle root), while the 21-day bundle daily_bars
            # would win over the workbook if both were passed.
            if [ "${tf}" = "1D" ] && [ -s "${DAILY_HISTORY_XLSX}" ]; then
              TF_SOURCE_ARGS=(--workbook "${DAILY_HISTORY_XLSX}")
            else
              TF_SOURCE_ARGS=(--export-bundle-root artifacts/smc_microstructure_exports)
            fi
            if "$SMC_PYTHON_BIN" scripts/export_smc_structure_artifacts_from_workbook.py \
                --timeframe "${tf}" \
                --symbols "${SYMBOLS}" \
                "${TF_SOURCE_ARGS[@]}" \
                > "structure_export_${tf}.json"; then
              "$SMC_PYTHON_BIN" -c "import json; m = json.load(open('structure_export_${tf}.json')); c = m['counts']; print(f\"::notice title=per-tf-structure::tf=${tf} written={c['artifacts_written']} errors={c['errors']}\")"
            else
              echo "::warning title=per-tf-structure::exporter crashed for tf=${tf}; benchmark will use the legacy fallback for this TF"
            fi
          done
          # Per-tf JSON is consumed inline above; drop it so it never leaks into
          # later steps' working tree or uploaded artifacts.
          rm -f structure_export_*.json

      - name: Prove primary structure artifacts are available
        run: |
          "$SMC_PYTHON_BIN" -m scripts.verify_structure_artifact_availability \
            --timeframes "${SMC_BENCH_TIMEFRAMES}" \
            --expect-symbols "${SMC_BENCH_SYMBOLS}" \
            --max-age-seconds 86400 \
            --output "${{ steps.meta.outputs.out_dir }}/structure_artifact_availability.json"

      - name: Run daily rolling benchmark
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          # Issue #3872: long-history daily bars for the 1D pairs, written by
          # the fetch in the per-TF export step. FIXED literal path (no
          # dynamic GITHUB_ENV write — zizmor github-env ratchet); when the
          # fetch failed the file is absent and _load_source_bars falls
          # through to the default resolution with a logged warning.
          SMC_DAILY_BARS_WORKBOOK_OVERRIDE: artifacts/ci/benchmark_daily_history.xlsx
          # WS4a shadow-observe: log sweep_trap_* quality into the event ledgers
          # (observe-only; does NOT affect the score — confluence reads the coarse
          # SWEEP_QUALITY_SCORE). Consumed by sweep-trap-shadow-daily.yml. ARMING:
          # set the repo variable ENABLE_SWEEP_TRAP=1 (centralized per F-003-YAML;
          # empty => flag off => shadow collects nothing).
          ENABLE_SWEEP_TRAP: ${{ vars.ENABLE_SWEEP_TRAP }}
          # Reaction-zone shadow study (observe-only, same wiring pattern):
          # ARMING = set the repo variable ENABLE_REACTION_ZONE_STUDY=1. Until
          # then the producer stays dark and the piggybacked evaluator in
          # sweep-trap-shadow-daily reports no_samples (rc 5, green).
          ENABLE_REACTION_ZONE_STUDY: ${{ vars.ENABLE_REACTION_ZONE_STUDY }}
        run: |
          set -euo pipefail
          # SYMBOLS/TIMEFRAMES resolved + validated by the per-TF structure
          # export step above (single source of truth — #2667).
          #
          # --strict-structure-tf (frame audit 2026-07-13): hard-fail if any
          # pair regresses to the legacy 1D-onto-intraday aliasing fallback.
          # NOTE: this guard does NOT detect degenerate bar frames (per-TF
          # artifacts that resolve cleanly but are 1-bar/day resamples — all
          # intraday slices clones, long-horizon families unscorable). That
          # condition is disclosed as frame_integrity in
          # benchmark_run_manifest.json + a run warning.
          #
          # --strict-frame-distinctness (armed after #3616/#3619, proof run
          # 29285965312: all intraday TFs on genuine frames, FVG 10.8k scored
          # events): hard-fail when an intraday TF degenerates to <= 1
          # bar/trading day — that now means the producer's
          # benchmark_universe_ohlcv_1m frame went missing, and the honest
          # reaction is a red run, not silently-cloned per-TF slices.
          #
          # --scoring-anchor-window-days 5 (2026-07-13): each rolling run
          # scores only events anchored in the trailing 5 trading-day window
          # of the frame — full-window re-scoring blew the 120-min budget on
          # real frames (run 29276673623 timed out); older events reach the
          # corpus via the accumulated pool. Disclosed per pair in
          # frame_integrity.skipped_out_of_window_counts.
          # --scoring-anchor-window-days-daily 40 (issue #3872): the 5-day
          # intraday window can never admit a COMPLETED 1D event — 1D label
          # horizons span up to 20 daily bars, so every anchor inside a
          # 5-day trailing window is still censored. Daily frames are tiny
          # (420 bars/symbol), so the wider window costs nothing.
          "$SMC_PYTHON_BIN" scripts/run_smc_measurement_benchmark.py \
            --symbols "${SMC_BENCH_SYMBOLS}" \
            --timeframes "${SMC_BENCH_TIMEFRAMES}" \
            --output-dir "${{ steps.meta.outputs.out_dir }}" \
            --require-evidence \
            --strict-structure-tf \
            --strict-frame-distinctness \
            --scoring-anchor-window-days 5 \
            --scoring-anchor-window-days-daily 40

      - name: Zone priority + testable calibration (rolling)
        if: always()
        run: |
          "$SMC_PYTHON_BIN" scripts/smc_zone_priority_calibration.py \
            --benchmark-dir "${{ steps.meta.outputs.out_dir }}" \
            --output-path "${{ steps.meta.outputs.out_dir }}/zone_priority_calibration.json"

      - name: FVG label audit (rolling)
        if: always()
        run: |
          "$SMC_PYTHON_BIN" scripts/fvg_label_audit.py \
            --benchmark-dir "${{ steps.meta.outputs.out_dir }}" \
            --output-path "${{ steps.meta.outputs.out_dir }}/fvg_label_audit.json"

      - name: Plan 2.8 Phase 1 per-TF family rollup
        # Aggregates scoring_<symbol>_<tf>.json artifacts emitted by the
        # rolling benchmark into per-TF event counts + per-family HRs +
        # the two Phase-E2 verdicts (FVG 5m vs baseline, BOS 4H vs
        # baseline). Streams the Markdown view to the step summary so
        # operators can eyeball progress toward the W8 deliverable
        # without downloading artifacts. Fail-soft so a rollup hiccup
        # cannot mask the benchmark outcome.
        if: always()
        run: |
          set +e
          "$SMC_PYTHON_BIN" scripts/plan_2_8_tf_family_rollup.py \
            --scoring-root "${{ steps.meta.outputs.out_dir }}" \
            --timeframes   "5m,10m,15m,30m,1H,4H,1D" \
            --output       "${{ steps.meta.outputs.out_dir }}/plan_2_8_tf_family_rollup.json" \
            --format       md \
            > /tmp/rollup.md 2>/dev/null
          if [ -s /tmp/rollup.md ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat /tmp/rollup.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          true

      - name: Restore Plan 2.8 rolling history
        id: restore_history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out_history="${{ steps.meta.outputs.out_dir }}/plan_2_8_history.jsonl"
          remote_ref="refs/heads/bot/live-experiment-snapshot"
          tracking_ref="refs/remotes/origin/bot/live-experiment-snapshot"
          remote_path="artifacts/ci/measurement_benchmark_rolling/latest/plan_2_8_history.jsonl"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fetch_error="$(mktemp)"
          if git fetch "${remote_url}" "+${remote_ref}:${tracking_ref}" 2>"${fetch_error}"; then
            :
          elif grep -Eqi "could(n't| not) find remote ref" "${fetch_error}"; then
            echo "::notice::no prior experiment snapshot branch — bootstrapping rolling history"
            rm -f "${fetch_error}"
            exit 0
          else
            echo "::error::failed to restore Plan 2.8 history; refusing to replace rolling history with one run"
            rm -f "${fetch_error}"
            exit 1
          fi
          rm -f "${fetch_error}"
          if git cat-file -e "${tracking_ref}:${remote_path}" 2>/dev/null; then
            mkdir -p "$(dirname "${out_history}")"
            git show "${tracking_ref}:${remote_path}" > "${out_history}"
            echo "Restored $(wc -l < "${out_history}") Plan 2.8 history rows."
          else
            echo "::notice::experiment snapshot branch has no rolling history yet — bootstrapping"
          fi

      - name: Plan 2.8 history archive (snapshot append)
        # Folds today's rollup into docs/plan_2_8_history.jsonl so the
        # weekly trend digest has a stable, idempotent source of truth.
        # Fail-soft: a missing rollup or a write hiccup must not affect
        # the benchmark run outcome. The snapshot is uploaded as part
        # of the standard rolling-bench artifact bundle.
        if: always() && steps.restore_history.outcome == 'success'
        run: |
          set +e
          rollup="${{ steps.meta.outputs.out_dir }}/plan_2_8_tf_family_rollup.json"
          if [ -s "${rollup}" ]; then
            # --captured-at: ohne diesen Wert faellt captured_at auf
            # `now()` SEKUNDENGENAU zurueck, und die Dedup-Zusage des
            # Skripts traegt hier nicht — jeder Lauf schreibt eine Zeile.
            # Gemessen 2026-08-29: bis zu 9 Fires/Werktag (workflow_run je
            # Producer-Tick), damit deckte die Rotation auf 366 Zeilen ~40
            # Tage statt der weiter unten behaupteten ~1 Jahr.
            # --replace-on-duplicate: der juengste Lauf des Tages gewinnt.
            # Der Bench scort ein 5-Tage-Ankerfenster; spaetere Laeufe sehen
            # nachgereifte Labels (derselbe Grund, aus dem der
            # Accumulate-Schritt auf "laengste forward_closes" dedupliziert).
            # Ohne die Flagge behielte die Datei den FRUEHESTEN Schnappschuss
            # und wuerfe die Reifung weg.
            "$SMC_PYTHON_BIN" scripts/plan_2_8_history_archive.py \
              --rollup  "${rollup}" \
              --history "${{ steps.meta.outputs.out_dir }}/plan_2_8_history.jsonl" \
              --captured-at "${{ steps.meta.outputs.run_date }}T00:00:00Z" \
              --replace-on-duplicate \
              || true
          fi
          true

      - name: Plan 2.8 history rotate (trim snapshots)
        # Caps the rolling history JSONL so long-running benches don't
        # balloon the artifact bundle or slow the weekly digest. Default
        # policy: keep at most 366 snapshots (~1y of daily runs) and drop
        # anything older than 400 days. Fail-soft: rotation errors must
        # never affect the benchmark run outcome.
        if: always() && steps.restore_history.outcome == 'success'
        run: |
          set +e
          history="${{ steps.meta.outputs.out_dir }}/plan_2_8_history.jsonl"
          if [ -s "${history}" ]; then
            "$SMC_PYTHON_BIN" scripts/plan_2_8_history_rotate.py \
              --history      "${history}" \
              --max-rows     366 \
              --max-age-days 400 \
              || true
          fi
          true

      - name: Plan 2.8 history validate (integrity check)
        # Non-destructive shape + uniqueness check on the rotated
        # history. Fail-soft: a validation hit only surfaces in the
        # step summary; it must not affect the bench run outcome.
        if: always() && steps.restore_history.outcome == 'success'
        run: |
          set +e
          history="${{ steps.meta.outputs.out_dir }}/plan_2_8_history.jsonl"
          report="${{ steps.meta.outputs.out_dir }}/plan_2_8_history_validate.json"
          if [ -s "${history}" ]; then
            "$SMC_PYTHON_BIN" scripts/plan_2_8_history_validate.py \
              --history "${history}" \
              --output  "${report}" \
              --quiet
            if [ -s "${report}" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo '## Plan 2.8 history validate' >> "${GITHUB_STEP_SUMMARY}"
              echo '```json' >> "${GITHUB_STEP_SUMMARY}"
              cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
              echo '```' >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
          true

      - name: Publish experiment snapshot to rolling bot branch
        # Mirrors smc-live-news-refresh.yml's "Publish snapshot to rolling
        # bot branch": the live-overlay daemon reads the daily experiment
        # rollup + history from the rolling `bot/live-experiment-snapshot`
        # branch via the GitHub Contents API (EXPERIMENT_SNAPSHOT_URL /
        # EXPERIMENT_HISTORY_URL) so the Grafana experiment panels reflect the
        # freshest CI run instead of a stale Docker-baked seed. A bare push to
        # main is blocked by the `main-governance` ruleset; `bot/*` is excluded,
        # so we force-update the dedicated branch. The uploaded benchmark
        # artifact bundle above remains the authoritative archive. The two
        # files are copied to a STABLE `latest/` path so the daemon URL never
        # has to track the dated run directory.
        if: always() && steps.restore_history.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out_dir="${{ steps.meta.outputs.out_dir }}"
          rollup="${out_dir}/plan_2_8_tf_family_rollup.json"
          history="${out_dir}/plan_2_8_history.jsonl"
          # Fail-soft on missing inputs: the rollup + history steps above are
          # both fail-soft, so a hiccup there must not turn this delivery step
          # red. Only a genuine push failure (expired PAT, ruleset change)
          # should surface as a job failure.
          if [ ! -s "${rollup}" ] && [ ! -s "${history}" ]; then
            echo "No experiment rollup/history produced this run; nothing to publish."
            exit 0
          fi
          stable_dir="artifacts/ci/measurement_benchmark_rolling/latest"
          mkdir -p "${stable_dir}"
          [ -s "${rollup}" ]  && cp "${rollup}"  "${stable_dir}/plan_2_8_tf_family_rollup.json"
          [ -s "${history}" ] && cp "${history}" "${stable_dir}/plan_2_8_history.jsonl"
          # Sole producer on this branch since plan-2-8-evaluation was retired
          # (2026-08-08); the seed-then-replace shape stays, because dropping it
          # would silently delete any sibling path a future producer adds. Publish
          # from the real remote tip so the two workflows preserve each
          # other's stable paths instead of force-replacing the whole branch.
          "$SMC_PYTHON_BIN" scripts/publish_bot_snapshot.py \
            --branch bot/live-experiment-snapshot \
            --copy-if-present "${stable_dir}/plan_2_8_tf_family_rollup.json=${stable_dir}/plan_2_8_tf_family_rollup.json" \
            --copy-if-present "${stable_dir}/plan_2_8_history.jsonl=${stable_dir}/plan_2_8_history.jsonl"

      - name: Stage databento export manifest into the bundle dir
        # The manifest (carrying universe_survivorship_bias_risk) is restored to
        # artifacts/smc_microstructure_exports/ — outside out_dir. Copy the newest
        # one in so it rides THIS artifact and reaches the promotion gate
        # (build_promotion_gate_bundle --universe-manifest). Fail-soft.
        if: always()
        run: |
          set +e
          out_dir="${{ steps.meta.outputs.out_dir }}"
          mkdir -p "${out_dir}"
          NEWEST=$(ls -1t artifacts/smc_microstructure_exports/databento_volatility_production_*_manifest.json 2>/dev/null | head -1)
          if [ -n "${NEWEST}" ]; then
            cp "${NEWEST}" "${out_dir}/" && echo "staged manifest: ${NEWEST}"
          else
            echo "no databento export manifest to stage (survivorship provenance absent)"
          fi
          true

      - name: Upload rolling benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # If an early bootstrap step fails before `meta` runs, keep
          # upload-artifact syntactically valid so the real failure remains the
          # earlier step instead of a secondary "Input required: path" red
          # herring. Missing fallback path only warns (default behavior).
          name: smc-measurement-benchmark-rolling-${{ steps.meta.outputs.run_date || 'unknown' }}
          path: ${{ steps.meta.outputs.out_dir || 'artifacts/ci/measurement_benchmark_rolling' }}
          if-no-files-found: warn
          retention-days: 30
          # Idempotent same-day reruns (manual or backfill) must not 409.
          overwrite: true

      # ADR-0023 §4.1: upload scored FamilyEvent records as a separate
      # artifact so the magnitude-shadow workflow can download them via
      # dawidd6/action-download-artifact without pulling the full
      # benchmark bundle.
      - name: Upload scored family events (ADR-0023)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scored-family-events-${{ steps.meta.outputs.run_date || 'unknown' }}
          path: ${{ steps.meta.outputs.out_dir || 'artifacts/ci/measurement_benchmark_rolling' }}/scored_family_events.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      # ADR-0023 Option B (Issue #2706): rolling accumulation of FamilyEvent
      # records across the last 30 days of daily benchmark runs.
      #
      # A single day's run yields only ~9% of events with score + triggered
      # return (MIN_OOS_SAMPLES=40 never reached).  By downloading the previous
      # accumulated snapshot (retention 32 days), merging today's events, and
      # re-uploading, the pool grows across successive days until the walk-
      # forward calibration has enough out-of-sample folds.
      #
      # Deduplication key: the event_id (id-less events: (family, anchor_ts)).
      # Tie-break: longest
      # forward_closes (newest daily run extends the outcome window the most).
      # Events older than 30 days are pruned from the pool each run.
      #
      # Fail-soft: if the download or the accumulation step fails, the daily
      # individual artifact (step above) is still available as a fallback and
      # the rolling-bench run is not marked failed.
      - name: Download previous accumulated family events (ADR-0023 Option B)
        id: dl_accumulated
        if: always()
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: smc-measurement-benchmark-rolling.yml
          name: scored-family-events-accumulated
          path: artifacts/ci/scored_family_events_accumulated_prev
          workflow_conclusion: success
          # 2026-07-29: without search_artifacts the action checks ONLY the
          # newest completed run — one run without the artifact broke the
          # accumulate chain SELF-PERPETUATINGLY (publishable=false => no
          # upload => next run finds nothing either; zero uploads in the
          # last 45+ success runs until the reseed dispatch). Walk back to
          # the most recent run that actually carries it (within 32d
          # retention). Same idiom as smc-library-refresh.yml.
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Accumulate family events across rolling window (ADR-0023 Option B)
        id: accumulate_events
        if: always()
        env:
          OUT_DIR: ${{ steps.meta.outputs.out_dir || 'artifacts/ci/measurement_benchmark_rolling' }}
          RESEED: ${{ inputs.reseed_accumulated }}
          RESEED_SEED_FILE: artifacts/ci/scored_family_events_accumulated_reseed.json
        run: |
          set -euo pipefail
          CURRENT="${OUT_DIR}/scored_family_events.json"
          PREV_DIR="artifacts/ci/scored_family_events_accumulated_prev"
          PREV=""
          # Reseed path (one-time dispatch): ignore the poisoned downloaded
          # pool and merge today's events onto the committed clean rebuild
          # instead, so the re-uploaded artifact becomes a healthy baseline.
          if [ "${RESEED}" = "true" ] && [ -s "${RESEED_SEED_FILE}" ]; then
            PREV="${RESEED_SEED_FILE}"
            echo "::notice ::reseed_accumulated=true — merging today onto the committed clean rebuild ${RESEED_SEED_FILE}"
          elif [ -d "${PREV_DIR}" ]; then
            PREV="$(find "${PREV_DIR}" -name 'accumulated_family_events.json' -type f 2>/dev/null | head -1)"
          fi
          ACCUMULATED="${OUT_DIR}/accumulated_family_events.json"
          if [ -z "${PREV}" ] || [ ! -s "${PREV}" ]; then
            echo "::warning::previous accumulated pool was not restored; preserving the last-good canonical artifact and leaving today's daily artifact as fallback"
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=("--current" "${CURRENT}" "--output" "${ACCUMULATED}" "--max-age-days" "30")
          ARGS+=("--previous" "${PREV}")
          # Pool-continuity guard (issue #3872 post-mortem): on 2026-07-13 an
          # empty-list merge (JSON '[]' passes the -s file check below)
          # REPLACED the canonical pool and the lineage rebuilt from
          # single-day snapshots. rc=4 from the guard lands in the same
          # publishable=false branch as any failure — last-good stays
          # canonical; a deliberate rebuild goes through reseed_accumulated.
          ARGS+=("--max-shrink-fraction" "0.5")
          set +e
          "$SMC_PYTHON_BIN" scripts/accumulate_family_events.py "${ARGS[@]}"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ] || [ ! -s "${ACCUMULATED}" ]; then
            echo "::warning::accumulate_family_events failed or produced empty output; preserving the last-good canonical artifact"
            rm -f "${ACCUMULATED}"
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "accumulated_path=${ACCUMULATED}" >> "$GITHUB_OUTPUT"
          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: Upload accumulated family events (ADR-0023 Option B)
        if: always() && steps.accumulate_events.outputs.publishable == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scored-family-events-accumulated
          path: ${{ steps.accumulate_events.outputs.accumulated_path || format('{0}/accumulated_family_events.json', steps.meta.outputs.out_dir || 'artifacts/ci/measurement_benchmark_rolling') }}
          if-no-files-found: warn
          retention-days: 32
          overwrite: true

      - name: F2 dual-arm contextual calibration (G3 wiring)
        # Plan §2.3 F2 / §2.4 G3. Re-scores the per-event JSONL ledgers
        # produced above twice — once with the global family weights
        # (control arm) and once with the contextual fallback cascade
        # (treatment arm) — and writes the two artifact trees the
        # f2-promotion-gate-daily workflow consumes. Without this step
        # the gate exits status=skipped indefinitely and the 30-day
        # SPRT countdown never starts. Fail-soft: a non-zero exit must
        # NOT mark the rolling-bench run failed; it only means the
        # promotion-gate stays on status=skipped that day.
        if: always()
        env:
          RUN_DATE: ${{ steps.meta.outputs.run_date }}
          OUT_DIR:  ${{ steps.meta.outputs.out_dir }}
        run: |
          set +e
          "$SMC_PYTHON_BIN" scripts/f2_apply_contextual_calibration.py \
            --control-dir          "${OUT_DIR}" \
            --contextual-cal       "${OUT_DIR}/zone_priority_contextual_calibration.json" \
            --global-cal           "${OUT_DIR}/zone_priority_calibration.json" \
            --output-dir-control   "artifacts/ci/f2/static_global_weights/${RUN_DATE}" \
            --output-dir-treatment "artifacts/ci/f2/contextual_weights/${RUN_DATE}"
          rc=$?
          {
            echo "## F2 dual-arm wiring (G3)"
            echo ""
            echo "- run_date: ${RUN_DATE}"
            echo "- exit_code: ${rc}"
            echo "- control:   artifacts/ci/f2/static_global_weights/${RUN_DATE}"
            echo "- treatment: artifacts/ci/f2/contextual_weights/${RUN_DATE}"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          # Fail-soft: an empty-events rc=2 or a missing-input rc=1 must
          # not affect the rolling-bench outcome. The promotion-gate
          # workflow surfaces the same condition as status=skipped.
          exit 0

      - name: Upload F2 dual-arm artifacts
        # Published as a separate, named artifact so the
        # f2-promotion-gate-daily workflow can pull it via the
        # cross-workflow artifact mechanism this repo uses
        # (`dawidd6/action-download-artifact` or `gh run download`,
        # depending on the consumer).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: f2-dual-arm-${{ steps.meta.outputs.run_date }}
          path: artifacts/ci/f2/
          retention-days: 45
          if-no-files-found: ignore
