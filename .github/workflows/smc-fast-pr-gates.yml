      # 2026-08-01: three green PRs in one day changed a workflow and broke a
      # guard that reads it but is not on the pinned list below (#4288, #4291,
      # #4302). Adding one more file each time closes the instance, not the
      # class -- and a roster rule cannot close it either: 571 test files read a
      # workflow and 484 are unlisted. So the selection follows the DIFF. A PR
      # that touches no workflow pays nothing; one that touches a workflow runs
      # every guard that reads it, listed or not.
      - name: Run every guard that reads a CI surface this PR changed
        if: steps.gate.outputs.run_heavy == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=500 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          # The pathspec must stay a superset of _CONFIG_SURFACES in
          # scripts/select_workflow_guards.py — a surface the selector knows but
          # the diff never hands it is a guard nobody runs. Widened 2026-08-06:
          # this fed only .github/workflows/, so a PR editing .github/dependabot.yml
          # selected nothing and the guard for the change it made ran after merge.
          # tests/test_select_workflow_guards.py pins the superset relation.
          changed="$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}" -- \
            .github/workflows/ \
            .github/dependabot.yml \
            .github/actions/ \
            package.json \
            pyproject.toml \
            requirements.txt \
            services/*/requirements.txt)"
          if [ -z "${changed}" ]; then
            echo "No CI surface changed in this pull request."
            exit 0
          fi
          echo "Changed CI surfaces:"
          echo "${changed}" | sed 's/^/  /'
          # shellcheck disable=SC2086
          guards="$(python -m scripts.select_workflow_guards ${changed})"
          if [ -z "${guards}" ]; then
            echo "::warning::no guard reads the changed workflows"
            exit 0
          fi
          echo "Guards selected by the diff:"
          echo "${guards}" | sed 's/^/  /'
          # shellcheck disable=SC2086
          python -m pytest ${guards} -q --no-header

      # 2026-08-16: #4752 removed the Hold-Manager legacy route and merged
      # green. This gate's pytest lists are fixed smoke sets, and ci.yml is
      # status-only on pull requests BY DESIGN -- so the test that imports the
      # changed module and fails deterministically on that tree first ran on
      # the main push: two red main runs and a cross-session misdiagnosis
      # before #4755 repaired it. Same class-closure as the guard selector
      # above, for production Python: a PR that changes no production module
      # pays nothing; one that changes a module runs every test that imports
      # it directly. Population measured 2026-08-16 over the last 60 merged
      # PRs: 55 select nothing, median of the rest 5 files, max 12;
      # structural worst case (most-imported module, open_prep.realtime_
      # signals) 26 files. tests/test_select_reverse_import_tests.py pins the
      # cost model and this wiring.
      - name: Run every test that imports a production module this PR changed
        if: steps.gate.outputs.run_heavy == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=500 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          # The whole diff, no pathspec: the selector is the single filter
          # authority (non-.py and tests/ are excluded there, where the rule
          # is executable and tested).
          changed="$(git diff --name-only "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${changed}" ]; then
            echo "Empty diff; nothing to select."
            exit 0
          fi
          # shellcheck disable=SC2086
          selected="$(python -m scripts.select_reverse_import_tests ${changed})"
          if [ -z "${selected}" ]; then
            echo "No production module changed; no reverse-import tests selected."
            exit 0
          fi
          echo "Tests selected by reverse import:"
          echo "${selected}" | sed 's/^/  /'
          # Deliberately NO --maxfail=1 on this stage: the selection is small
          # (measured above) and a masked second failure is the known trap.
          # shellcheck disable=SC2086
          python -m pytest ${selected} -q --no-header

