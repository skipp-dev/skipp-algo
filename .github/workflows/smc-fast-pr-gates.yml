            tests/test_trade_context.py \
            tests/test_trade_context_bracket_coherence.py \
            tests/test_smc_live_signal_fields.py

      - name: Run terminal coverage subset
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          python -m pytest -q --maxfail=1 \
            -n auto --dist=worksteal \
            --cov-fail-under=20 \
            --cov=streamlit_terminal \
            --cov=streamlit_terminal_alerts \
            --cov=streamlit_terminal_config \
            --cov=streamlit_terminal_pure \
            --cov=streamlit_terminal_runtime \
            --cov=terminal_export \
            --cov=terminal_notifications \
            --cov=terminal_ui_helpers \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:artifacts/ci/terminal_coverage.xml \
            tests/test_streamlit_terminal_import.py \
            tests/test_streamlit_terminal_config.py \
            tests/test_streamlit_terminal_runtime.py \
            tests/test_streamlit_terminal_alerts.py \
            tests/test_terminal_notifications.py \
            tests/test_terminal_export_dispatch.py \
            tests/test_terminal_candidate_mirror.py \
            tests/test_streamlit_terminal_feed_state.py \
            tests/test_streamlit_terminal_pure_functions.py \
            | tee artifacts/ci/terminal_coverage.txt

      - name: Layer violation guard (F-08)
        if: steps.gate.outputs.run_heavy == 'true'
        run: python scripts/check_layer_violations.py

      - name: Render fast gate summary
        if: always() && steps.gate.outputs.run_heavy == 'true'
        run: |
          python scripts/render_ci_gate_summary.py \
            --report artifacts/ci/smc_fast_health_report.json \
            --enforcement hard \
            || echo "::warning::Fast gate summary skipped (report not found)."

      - name: Upload fast gate report
        if: always() && steps.gate.outputs.run_heavy == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smc-fast-health-report
          path: |
            artifacts/ci/smc_fast_health_report.json
            artifacts/ci/terminal_coverage.txt
            artifacts/ci/terminal_coverage.xml
          if-no-files-found: ignore

  # The required status check of the `main-governance` ruleset.
  #
  # It cannot be `fast-gates` itself. That job carries `needs: select-runner`,
  # and GitHub is explicit about what that means: "A job that is skipped will
  # report its status as 'Success'. It will not prevent a pull request from
  # merging, even if it is a required check" -- with "A job depends on a failed
  # job" listed as a way in. So a failing `select-runner` skipped `fast-gates`,
  # the skip reported Success, and the pull request was mergeable with no gate
  # having run. Measured 2026-08-06; over the preceding 60 runs `select-runner`
  # never failed, so this was structural rather than realised.
  #
  # GitHub's prescribed remedy is this shape: "Use `always()` with `needs` for
  # required checks that depend on other jobs" -- plus an explicit test of
  # `needs.*.result`, because `always()` alone only makes the job RUN; it does
  # not make it fail.
  #
  # `always()` and not `!cancelled()`: a gate skipped on cancellation reports
  # Success and reopens the hole. The usual argument against `always()` -- a run
  # that hangs to its timeout -- is about jobs that fetch sources or talk to a
  # network. This one checks out nothing and reads two strings.
  gate:
    name: gate
    needs: [select-runner, fast-gates]
    if: always()
    # Deliberately NOT select-runner's chosen runner: a failed selection must
    # not take the job that reports the failure down with it. Same operator
    # override as select-runner itself, which is the form the runner-pinning
    # guard accepts.
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Refuse anything that is not a real pass
        env:
          SELECT_RUNNER_RESULT: ${{ needs.select-runner.result }}
          FAST_GATES_RESULT: ${{ needs.fast-gates.result }}
        run: |
          set -uo pipefail
          select="${SELECT_RUNNER_RESULT:-empty}"
          gates="${FAST_GATES_RESULT:-empty}"
          echo "select-runner=${select} fast-gates=${gates}"
          if [ "${select}" = "success" ] && [ "${gates}" = "success" ]; then
            echo "Gates passed: select-runner=${select}, fast-gates=${gates}." \
              >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          {
            echo "## Merge gate refused"
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| select-runner | \`${select}\` |"
            echo "| fast-gates | \`${gates}\` |"
            echo
            echo "A \`skipped\` here is not a pass: GitHub reports a skipped job"
            echo "as Success to branch protection, which is the hole this job"
            echo "exists to close."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "::error::merge gate refused — select-runner=${select}, fast-gates=${gates}"
          exit 1
