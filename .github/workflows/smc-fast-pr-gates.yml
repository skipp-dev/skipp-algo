# live-window: any-trigger  # F-V6-F2.1 (2026-05-02)
name: smc-fast-pr-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # merge_group: `fast-gates` is the only required check, so it MUST run on the
  # merge-queue ref — otherwise an enabled merge queue would wait forever for a
  # check that never dispatches. The heavy-gate logic below already runs the full
  # suite on any non-`pull_request` event, so the merged batch is fully validated.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # (F-V5-A2 originally introduced this on 2026-05-01; F-V6-A2 expanded the
  # comment but kept the same key — the duplicate from a prior rebase merge
  # made GitHub Actions reject this workflow as invalid YAML.)
  PYTHONUNBUFFERED: "1"

defaults:
  run:
    shell: bash

jobs:
  select-runner:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs_on_json: ${{ steps.resolve.outputs.runs_on_json }}
      runner_environment: ${{ steps.resolve.outputs.runner_environment }}
      resolution_reason: ${{ steps.resolve.outputs.resolution_reason }}
      matched_runner_name: ${{ steps.resolve.outputs.matched_runner_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Resolve worker runner
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          SMC_FORCE_GH_HOSTED: ${{ vars.SMC_FORCE_GH_HOSTED }}
        run: |
          # fast-gates is merge-critical: always prefer github-hosted so a
          # crashed/offline self-hosted runner cannot hold the merge queue
          # indefinitely (self-hosted timeout-minutes is only enforced by the
          # runner itself; a dead runner causes a 6h hang).
          # SMC_CI_SELF_HOSTED_LABEL can still force a dedicated label when set;
          # the PRIORITY_CRON fallback is intentionally excluded here.
          python scripts/resolve_workflow_runner.py \
            --repository "${{ github.repository }}" \
            --hosted-runner "${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}" \
            --custom-label "${{ vars.SMC_CI_SELF_HOSTED_LABEL || '' }}"

  fast-gates:
    needs: select-runner
    runs-on: ${{ fromJson(needs.select-runner.outputs.runs_on_json) }}
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read  # list changed files for the bot/* path allow-list

    steps:
      # Bot data-only PRs (e.g. `bot/run-open-prep-*`, `bot/outcome-backfill-*`)
      # only touch data/docs/generated artifacts and never change source code,
      # so the heavy SMC integration suite would just burn ~22 min for no signal.
      # We keep this job (the ruleset requires `fast-gates` as a status check)
      # but short-circuit the heavy steps for such PRs.
      #
      # Audit P2 HIGH: skipping on branch NAME alone let arbitrary code ride a
      # `bot/*` branch to main untested. We now verify the *changed paths*: heavy
      # gates are skipped ONLY when every changed file is a data/docs/generated
      # artifact. Any source path (*.py, scripts/, services/, .github/, …) forces
      # heavy gates. Fail closed (run heavy) on any error listing the diff.
      - name: Determine if heavy gates should run
        id: gate
        env:
          # env-indirection instead of direct ${{ }} interpolation in run: block
          # — hardens against script-injection via branch names (Audit M-1).
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" || "$HEAD_REF" != bot/* ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # bot/* PR — inspect the changed paths.
          if ! files=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' 2>/dev/null); then
            echo "Could not list PR files — running heavy gates (fail-closed)."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$files" ]]; then
            echo "Empty PR file list — running heavy gates (fail-closed)."
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          heavy=false
          pine=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              # Pine is published to TradingView, never executed by CI or the
              # Python services, so it stays out of the HEAVY suite — but it is
              # exactly what the R1 evidence attests, and that is a different
              # axis from execution risk. Flag it separately so the R1 guard
              # still runs. Measured 2026-08-04: #4371 changed
              # SMC_Event_Overlay.pine, "Guard R1-attested sources" was SKIPPED
              # on its own PR, it merged green, and every unrelated PR has been
              # red on that guard since — the one producer the guard exists to
              # stop was the one it could not see.
              *.pine|pine/generated/*) pine=true ;;
            esac
            case "$f" in
              # Data/docs/generated artifacts the bot workflows legitimately
              # produce.
              artifacts/*|docs/*|reports/*|pine/generated/*|*.pine) ;;
              *)
                heavy=true
                echo "non-data path on bot/* PR forces heavy gates: $f"
                ;;
            esac
          done <<< "$files"
          if [[ "$heavy" == "true" ]]; then
            echo "Bot PR ($HEAD_REF) touches source paths — running heavy gates."
          else
            echo "Bot data-only PR ($HEAD_REF); skipping heavy fast-gates."
          fi
          if [[ "$pine" == "true" ]]; then
            echo "Pine touched — the R1-attested-source guard runs regardless of heavy gates."
          fi
          echo "run_heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "run_pine_guard=$pine" >> "$GITHUB_OUTPUT"

      # Also on a pine-only bot PR: without a checkout the R1 guard below cannot
      # run at all, which is how it came to be skipped for the only producer it
      # was built to stop.
      - name: Checkout
        if: steps.gate.outputs.run_heavy == 'true' || steps.gate.outputs.run_pine_guard == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Audit P2 MED: enforce the single-maintainer authorship mandate. Every
      # commit in the PR range must be authored AND committed by an approved
      # identity (see scripts/check_commit_authors.py + .mailmap); catches an
      # accidental corporate-config (spreuss_cisco) commit that would otherwise
      # merge unnoticed.
      - name: Enforce approved commit authors
        if: steps.gate.outputs.run_heavy == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=500 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          python scripts/check_commit_authors.py --range "${BASE_SHA}..${HEAD_SHA}"

      # The R1 contract claims `authorized_execution_completed` with no open
      # gates, which is only true while the registered evidence still attests to
      # the current sources. test_smc_r1_rollout_contract.py checks that, but it
      # is not on the fast list below — it runs in the main-push job, AFTER the
      # merge. The library-refresh bot went through that hole twice (#4272
      # /179->/180, #4284 ->/182), both times green at merge time. This guard is
      # diff-scoped on purpose: main is already drifted, so a standing-state
      # check here would fail every PR in the repo, including the repair.
      - name: Guard R1-attested sources
        if: (steps.gate.outputs.run_heavy == 'true' || steps.gate.outputs.run_pine_guard == 'true') && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # On the pine-only lane (run_heavy=false) none of the Python setup
          # steps run, so this `python` is whatever the runner image ships and
          # the import chain must be stdlib+repo only. That lane had never
          # executed once as of 2026-08-04 -- measured across 45 fast-gates
          # runs, every one is guard+setup both-ran or both-skipped -- so print
          # what it resolved. The first pine-touching bot PR is the observation;
          # tests/test_check_r1_attested_sources.py enforces the purity half.
          python -VV
          git fetch --depth=500 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          python -m scripts.check_r1_attested_sources --range "${BASE_SHA}..${HEAD_SHA}"

      # Der schmale Schnitt (2026-08-13): `bot/*` überspringt weiterhin ALLES
      # Schwere — nur dieser Wächter läuft mit. Er kostet Bruchteile einer
      # Sekunde und schliesst die Lücke, durch die der Bibliothekslauf die vier
      # Kundenoberflächen DREIMAL unbeobachtet auf den Stand vor der
      # Bereinigung zurückdrehte (#4646, #4665; repariert als #4650, #4652,
      # #4666 — jedes Mal von Hand, jedes Mal nachdem es gemergt war).
      # `tests/test_customer_surface_vocabulary.py` steht zwar auf der fast-
      # Liste, die läuft aber nur bei run_heavy=true — also nie auf genau der
      # Spur, auf der der Refresh fährt.
      # Wie die R1-Spur: kein Python-Setup, deshalb Stdlib-only. Verifiziert
      # 2026-08-13 gegen einen nackten CPython 3.9 ohne installierte Pakete.
      - name: Guard customer chart surfaces
        if: steps.gate.outputs.run_heavy == 'true' || steps.gate.outputs.run_pine_guard == 'true'
        run: |
          python -m scripts.check_customer_surface_vocabulary

      - name: Announce selected runner
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          echo "runner_environment=${{ needs.select-runner.outputs.runner_environment }}"
          echo "resolution_reason=${{ needs.select-runner.outputs.resolution_reason }}"
          echo "matched_runner_name=${{ needs.select-runner.outputs.matched_runner_name }}"

      - name: Set up pinned Python (GitHub-hosted)
        if: steps.gate.outputs.run_heavy == 'true' && needs.select-runner.outputs.runner_environment == 'github-hosted'
        uses: ./.github/actions/setup-python-pinned
        with:
          cache: pip
          cache-dependency-path: requirements.txt

      # YAML-aware workflow lints below need PyYAML. The full dev install runs
      # only after `Install uv` further down; install just PyYAML here so the
      # lints stay an early-failing pre-flight check (~1s extra) instead of
      # being deferred until after the heavier resolve/install steps.
      - name: Install workflow-lint deps (PyYAML)
        if: steps.gate.outputs.run_heavy == 'true'
        # SC-02 (supply-chain audit 2026-06-14): exact pin, no floating >=.
        run: python -m pip install --quiet "pyyaml==6.0.3"

      # Guard: every workflow file must declare `defaults: run: shell: bash`
      # so jobs behave identically on the Windows self-hosted runner and on
      # ubuntu-latest. YAML-aware (rejects the string-in-comment false-pass
      # that the previous `grep -q` loop accepted); sub-second.
      - name: Lint workflow shell defaults
        if: steps.gate.outputs.run_heavy == 'true'
        run: python scripts/lint_workflow_defaults.py

      # Guard: every workflow must declare `permissions:` (top-level or per-job)
      # so GITHUB_TOKEN runs at least-privilege. OWASP A05; replaces the
      # legacy pytest pin (deleted in this PR) with a fast-failing CI lint.
      - name: Lint workflow permissions
        if: steps.gate.outputs.run_heavy == 'true'
        run: python scripts/lint_workflow_permissions.py

      # Guard: every workflow must set `env.PYTHONUNBUFFERED` (top-level or
      # per-job) so Python stdout/stderr reaches the GHA log in real time.
      # F-V5-A2 / F-CI-O1; replaces the legacy pytest pin (deleted in this PR).
      - name: Lint workflow PYTHONUNBUFFERED
        if: steps.gate.outputs.run_heavy == 'true'
        run: python scripts/lint_workflow_pythonunbuffered.py

      # Workflow-Audit 2026-06: actionlint as a hard gate. Catches GHA
      # template-engine syntax errors (e.g. `$\{\{ ... \}\}` inside run-block
      # shell comments -> HTTP 422 on dispatch; see A9b.2a post-mortem,
      # PR #2083) that PyYAML-based smoke tests structurally CANNOT see,
      # plus expression typos and invalid needs/outputs refs. shellcheck
      # integration is explicitly DISABLED (-shellcheck=): the existing
      # main baseline carries pre-existing shell findings (research
      # workflows, exit-with-template patterns) that are out of scope
      # for this template-engine gate; adopting shellcheck would be a
      # separate ratchet decision. Version pinned via actionlint-py wheel.
      - name: actionlint (workflow template/expression lint)
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          # SC-02 (supply-chain audit 2026-06-14): drop wildcard prefix match;
          # pin to full version for deterministic installs.
          python -m pip install --quiet "actionlint-py==1.7.12.24"
          actionlint -no-color -shellcheck=

      # Workflow-Audit 2026-06: zizmor as a RATCHET, not a hard zero-gate.
      # The existing inventory carries 91 high / 52 medium findings
      # (mostly template-injection + artipacked) that cannot be burned
      # down in one PR. The budgets below pin the status quo: any PR that
      # ADDS a medium that exceeds budget+ severity finding fails; shrinking
      # the budgets as findings get fixed is encouraged (lower both numbers
      # in the same PR that fixes findings).
      - name: zizmor (workflow security ratchet)
        if: steps.gate.outputs.run_heavy == 'true'
        env:
          # Baseline measured 2026-06-12 (offline mode, zizmor 1.25.2).
          # high 92→91 on PR #2741: excessive-permissions finding in
          # f2-promotion-gate-daily.yml resolved by moving issues:write to
          # job-level in promotion-gate. medium 53→52 (artipacked fix).
          # high 91→92 (2026-07-22): dangerous-triggers for the new
          # workflow_run chain in tv-save-consumer-source.yml (post-refresh
          # auto-save + producer instance refresh). Risk assessed: the
          # upstream smc-library-refresh runs only on schedule/dispatch —
          # never from fork PRs — the job gates on conclusion == 'success',
          # and the workflow holds contents:read only.
          # high 92→91 (2026-08-01): both template-injection sinks in
          # smc-r4-context-readback.yml resolved — the dispatch inputs now
          # reach the CLI through env instead of being expanded into `run:`.
          # One of the two shipped in #4281 and was already inside the 92, so
          # this PR fixes more than it adds and the budget shrinks with it.
          # high 91→93 (2026-08-04): NOT a regression — the scan was widened
          # from .github/workflows/ to all three action-pin surfaces, and the
          # two added findings were always there, in
          # .github/actions/setup-persistent-venv/action.yml (github-env,
          # confidence Low: writes to GITHUB_PATH and GITHUB_ENV). The ratchet
          # counted zero findings from composite actions and workflow templates
          # because it never opened them. Measured both ways with the pinned
          # 1.25.2: workflows-only {High 91, Medium 51}, all three surfaces
          # {High 93, Medium 51}. Widening it matters beyond bookkeeping —
          # zizmor rates an unpinned `uses:` High, which is the one thing that
          # would have caught a mutable tag in the composite while the Python
          # guards were blind to it (#4448 follow-up).
          # 2026-08-13: 93 -> 97. smc-library-publish.yml traegt vier High-Funde:
          # dangerous-triggers (workflow_run — die Bauform selbst), sowie
          # template-injection und github-env x2 aus dem Setup-Block, der
          # wortgleich aus smc-library-refresh stammt und dort schon in der
          # Grundlinie steht. Was sich beheben liess, ist behoben: Rechte auf
          # Job-Ebene statt Workflow-Ebene (-2) und REFRESH_DATE ohne Umweg
          # ueber $GITHUB_ENV (-1), zusammen 7 -> 4. Der Wert 95 ist auf dem
          # rebasierten Baum mit derselben gepinnten zizmor-Fassung (1.25.2)
          # GEMESSEN — und zwar ueber ALLE DREI Verzeichnisse, die dieser
          # Schritt auditiert. Ein Lauf nur ueber .github/workflows/ zaehlt
          # 95 und fuehrt zuverlaessig zur falschen Zahl.
          ZIZMOR_HIGH_BUDGET: "97"
          ZIZMOR_MEDIUM_BUDGET: "52"
        run: |
          python -m pip install --quiet "zizmor==1.25.2"
          zizmor --no-progress --offline --format json \
            .github/workflows/ .github/actions/ .github/workflow-templates/ \
            > zizmor_report.json || true
          python - <<'PY'
          import json, os, sys
          findings = json.load(open("zizmor_report.json"))
          high = sum(1 for f in findings if f["determinations"]["severity"] == "High")
          medium = sum(1 for f in findings if f["determinations"]["severity"] == "Medium")
          hb = int(os.environ["ZIZMOR_HIGH_BUDGET"])
          mb = int(os.environ["ZIZMOR_MEDIUM_BUDGET"])
          print(f"zizmor: high={high} (budget {hb}), medium={medium} (budget {mb})")
          ok = True
          if high > hb:
              print(f"::error title=zizmor-ratchet::high-severity findings rose {hb} -> {high}. New workflow code introduced a security finding (run `zizmor --offline .github/workflows/ .github/actions/ .github/workflow-templates/` locally).")
              ok = False
          if medium > mb:
              print(f"::error title=zizmor-ratchet::medium-severity findings rose {mb} -> {medium}. New workflow code introduced a security finding (run `zizmor --offline .github/workflows/ .github/actions/ .github/workflow-templates/` locally).")
              ok = False
          if ok and (high < hb or medium < mb):
              print(f"::notice title=zizmor-ratchet::findings below budget (high {high}/{hb}, medium {medium}/{mb}) — consider lowering ZIZMOR_*_BUDGET in smc-fast-pr-gates.yml to lock in the improvement.")
          sys.exit(0 if ok else 1)
          PY

      # ── TypeScript vacuity guard ──────────────────────────────────────
      # The Python half of this guard (scripts/detect_vacuous_claims.py) has
      # gated merges since #4355. The TypeScript half shipped with #4356/#4381
      # and gated NOTHING: it ran only in tv-onboarding-packages.yml, and
      # `fast-gates` is the only required check by design (ADR-0011). So the
      # analyzer that finds "green without observing anything" in the
      # TradingView automation could go red for weeks without blocking a
      # single merge — a guard about unobserved checks, itself unobserved.
      #
      # Gated on run_heavy like every other guard here, and that is sufficient
      # rather than a compromise: the data-only exemption in the gate step
      # above is `artifacts/*|docs/*|reports/*|pine/generated/*|*.pine`, so a
      # PR touching any .ts file forces heavy. The only PRs that skip this are
      # the ones that cannot contain TypeScript.
      #
      # Measured cost on the required lane (tv-onboarding-packages run
      # 30885490507, 2026-08-04): Set up Node 12s, npm ci 3s, and the scan
      # itself under a second against 55 files.
      - name: Set up Node for the TypeScript vacuity guard
        if: steps.gate.outputs.run_heavy == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        if: steps.gate.outputs.run_heavy == 'true'
        run: npm ci

      - name: Guard against vacuous TypeScript claims
        if: steps.gate.outputs.run_heavy == 'true'
        run: npx tsx --test automation/tradingview/tests/vacuous_claims_ts.test.ts

      - name: Install uv
        if: steps.gate.outputs.run_heavy == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt

      - name: Resolve Python 3.12 interpreter
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          if [[ "${{ needs.select-runner.outputs.runner_environment }}" == "github-hosted" ]]; then
            python -c "import sys; raise SystemExit('GitHub-hosted Python bootstrap did not resolve Python 3.12.' if sys.version_info[:2] != (3, 12) else 0)"
            echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
            exit 0
          fi

          if command -v python >/dev/null 2>&1; then
            if python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"; then
              echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          if command -v py >/dev/null 2>&1; then
            python_bin="$(py -3.12 -c "import sys; print(sys.executable)")"
            echo "SMC_PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error::Self-hosted runner is missing a usable Python 3.12 interpreter (tried \`python\` and \`py -3.12\`)."
          exit 1

      # Ein PR, der Code aendert, den nur ein Workflow ausfuehrt und kein Test
      # importiert, zeigt seine Wirkung erst im echten Lauf. Ohne Ledger-
      # Eintrag verdunstet "noch nicht bewiesen" still zu "wird schon stimmen":
      # am 2026-08-23 lag #5013 dreizehn Stunden auf einem Zustand, der von
      # "schlafend, also in Ordnung" nicht zu unterscheiden war.
      # Diff-bezogen und OHNE Netz — fast-gates ist der einzige required Check.
      #
      # NICHT neben "Guard R1-attested sources" platziert (Fix-Runde 1,
      # 2026-08-24): dieser Waechter importiert tomllib (>=3.11) direkt und
      # ueber scripts/proof_ledger.py. An der Nachbarposition -- vor jedem
      # Python-Setup, stdlib-3.9-sicher gehalten wie R1/customer-surface --
      # waere das ein ModuleNotFoundError beim Import, auf jedem Heavy-PR.
      # Er laeuft deshalb erst NACH "Resolve Python 3.12 interpreter": das ist
      # die einzige Stelle in diesem Job, die auf BEIDEN Lanes (github-hosted
      # ueber die Bootstrap-Assertion, self-hosted ueber `python`/`py -3.12`)
      # tatsaechlich einen 3.12-Interpreter erzwingt und mit einer benannten
      # ::error:: statt einem Traceback scheitert -- kein zusaetzlicher
      # Versions-Guard noetig, dieser Schritt liefert bereits einen; ein
      # zweiter haette dasselbe Blast-Radius-Problem (jeder Heavy-PR rot) nur
      # mit hoeflicherem Text. `$SMC_PYTHON_BIN` statt `python`, weil die
      # self-hosted-`py -3.12`-Variante einen Pfad setzt, der nicht zwingend
      # das `python` in PATH ist. Braucht run_heavy=='true' (nie den
      # Pine-only-Lane) -- die Pine-only-Lane KANN laut der bot-Allow-Liste
      # oben (Zeile ~134: `artifacts/*|docs/*|reports/*|pine/generated/*|*.pine`,
      # matcht nie einen `.github/workflows/*.yml`-Pfad) ohnehin keinen
      # beweispflichtigen Diff enthalten, deshalb ist die engere Bedingung
      # (ohne `run_pine_guard`) hier korrekt und nicht bloss zufaellig
      # ungefaehrlich.
      - name: Guard the proof ledger
        if: (steps.gate.outputs.run_heavy == 'true') && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$SMC_PYTHON_BIN" -VV
          git fetch --depth=500 origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
          "$SMC_PYTHON_BIN" -m scripts.check_proof_ledger --range "${BASE_SHA}..${HEAD_SHA}"

      - name: Install dependencies
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          "$SMC_PYTHON_BIN" -m venv .venv
          uv pip install --python .venv -r requirements.txt pytest
          # Expose venv for all subsequent steps in this job
          if [[ -d "$GITHUB_WORKSPACE/.venv/Scripts" ]]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Validate live-overlay daemon requirements
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          "$SMC_PYTHON_BIN" -m pip install --dry-run -r services/live_overlay_daemon/requirements.txt

      - name: Build live-overlay daemon Docker image
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          # Drift guard: verify daemon Dockerfile still builds from repository root context.
          # Tagged so the start-up probe below can run the SAME image.
          docker build -f services/live_overlay_daemon/Dockerfile -t live-overlay-daemon:ci .

      - name: Probe that the built image can actually start
        if: steps.gate.outputs.run_heavy == 'true'
        run: |
          # `docker build` proves the image BUILDS, never that it STARTS. From
          # 2026-07-23 to 2026-08-05 the declared image raised
          # ModuleNotFoundError('databento_usage') on import and the build step
          # stayed green throughout. Importing the entrypoint module is the
          # cheapest check that covers the whole module-level import graph.
          docker run --rm --entrypoint python live-overlay-daemon:ci \
            -c "import services.live_overlay_daemon.main; import holidays; print('start-up imports OK')"

