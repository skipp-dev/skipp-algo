name: tradingview-storage-refresh
# live-window: mutating-on-cron  # F-V6-F2.1 (schedule-only + Actions secret write token)

# Automated zero-touch refresh of the TV_STORAGE_STATE secret.
#
# Background
# ----------
# smc-library-refresh.yml enforces TV_STORAGE_STATE_MAX_AGE_HOURS=72.
# After the 72 h TTL expires the library-refresh workflow fails and the
# entire TradingView publish chain is blocked until the cookie is
# manually re-captured.
#
# This workflow solves that by proactively refreshing the cookie every
# 48 h (well before the 72 h deadline).  The normal path bootstraps from
# the current TV_STORAGE_STATE secret, verifies that it still opens a
# TradingView chart, and writes a freshly validated storage-state back.
# If the bootstrap session is no longer accepted by TradingView, the
# workflow can fall back to headless login via:
#   TV_USERNAME    — TradingView account e-mail / username
#   TV_PASSWORD    — account password
#   TV_TOTP_SECRET — TOTP seed (Base32) from the Authenticator-App 2FA
#                    setup page; used by otplib to generate the 6-digit
#                    code without human intervention.
#
# On success the freshly captured JSON is written back to the repo secret
# TV_STORAGE_STATE via `gh secret set`, using TV_STORAGE_STATE_WRITE_TOKEN.
# GH_PAT remains for issue/bot-branch workflows; the secret writer is split
# out because bot/PR PATs may not be allowed to mutate Actions secrets.
#
# If login fails (CAPTCHA, IP block, TradingView anti-bot) the job
# fails loudly and the credential-health-check.yml daily probe will
# catch the stale cookie before any downstream consumer runs.
#
# Required secrets
# ----------------
#   TV_STORAGE_STATE — current Playwright storage-state JSON or gzip+base64
#   TV_USERNAME      — optional fallback TradingView login e-mail / username
#   TV_PASSWORD      — optional fallback TradingView password
#   TV_TOTP_SECRET   — optional fallback TOTP Base32 seed
#   GH_PAT           — optional fallback token for failure issue creation
#   TV_STORAGE_STATE_WRITE_TOKEN — token allowed to update Actions secrets
#
# The workflow intentionally does NOT fall back to github.token because
# github.token cannot write repository secrets.

on:
  schedule:
    # 03:00 UTC daily. 2026-08-18 (Grenzgaenger A6, operator decision): the
    # old */2 cadence had NO retry, so a single failed run (real case 04.08.)
    # meant a 96 h gap against the 72 h TTL — session dead before the next
    # tick. Daily keeps a failed run at a 48 h gap (>=24 h margin), and the
    # in-run retry below absorbs transient capture flakes on top.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_fresh_login:
        description: Ignore TV_STORAGE_STATE and exercise username/password/TOTP login
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate the capture without updating TV_STORAGE_STATE
        required: false
        type: boolean
        default: true
      confirm_session_disconnect:
        description: Acknowledge that a fresh login can disconnect the active TradingView session
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # needed by the failure-notification step (gh issue create)

# Never cancel a running refresh — a half-written secret is worse than
# waiting for the previous run to finish.
concurrency:
  # 2026-08-01: deliberately NOT in the shared `tradingview-session` group.
  # This job maintains or probes the credential the other TradingView
  # workflows depend on, and it is short (~1 min). smc-library-refresh runs
  # ~216 min and three times per trading day, so a shared group would park
  # credential maintenance behind up to eleven hours of publishing — which is
  # how a 72 h cookie TTL turns into an outage, and how a stale-cookie probe
  # stops being timely. Read-only or secret-writing, never layout-mutating.
  group: tradingview-storage-refresh
  cancel-in-progress: false
  # 2026-08-06: cancel-in-progress protects only the RUNNING run. The default
  # `queue: single` cancels the one pending run as soon as a newer tick enters
  # the group, so a refresh could be dropped without ever running. `queue: max`
  # lets up to 100 ticks queue instead of displacing each other.
  queue: max

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TV_FORCE_FRESH_LOGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fresh_login == true && 'true' || 'false' }}
  TV_REFRESH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
  TV_CONFIRM_SESSION_DISCONNECT: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_session_disconnect == true && 'true' || 'false' }}
  TV_STORAGE_SESSION_OWNER: github-actions:${{ github.actor }}:${{ github.run_id }}

jobs:
  refresh:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Preflight refresh mode
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_TOTP_SECRET: ${{ secrets.TV_TOTP_SECRET }}
        run: |
          set -euo pipefail
          echo "Refresh mode: force_fresh_login=${TV_FORCE_FRESH_LOGIN} dry_run=${TV_REFRESH_DRY_RUN}"
          echo "Session owner: ${TV_STORAGE_SESSION_OWNER}"
          if [ "${TV_FORCE_FRESH_LOGIN}" != "true" ]; then
            exit 0
          fi
          if [ "${TV_CONFIRM_SESSION_DISCONNECT}" != "true" ]; then
            echo "::error::force_fresh_login requires confirm_session_disconnect=true because TradingView may disconnect another active session."
            exit 1
          fi
          for variable_name in TV_USERNAME TV_PASSWORD TV_TOTP_SECRET; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::${variable_name} is required for force_fresh_login."
              exit 1
            fi
          done
          echo "Fresh-login prerequisites are configured; secret values remain masked."

      - name: Preflight GitHub secret write token
        if: env.TV_REFRESH_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.TV_STORAGE_STATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN is not configured; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" >/dev/null; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN cannot access the Actions secrets API for ${GITHUB_REPOSITORY}; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          echo "TV_STORAGE_STATE_WRITE_TOKEN can access the Actions secrets API."

      # xvfb provides a virtual display as a safety net for any HEADED debug run.
      # NOTE: the capture below runs --headless (TV_HEADLESS=1) and does NOT use
      # this display today — Xvfb only matters if the run is ever flipped headed.
      # Screen size 1440x1100 is deliberately the STORAGE_STATE_CAPTURE_VIEWPORT
      # from scripts/create_tradingview_storage_state.ts — keep the two in sync,
      # or a headed run would clip the browser window.
      - name: Start virtual display (xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb 2>/dev/null || true
          Xvfb :99 -screen 0 1440x1100x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies (including otplib)
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Prepare current storage state bootstrap
        if: env.TV_FORCE_FRESH_LOGIN != 'true'
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get("TV_STORAGE_STATE_SECRET", "").strip()
          if not raw:
              print("::warning::TV_STORAGE_STATE secret is empty; capture must use TV_USERNAME/TV_PASSWORD fallback.")
              sys.exit(0)

          if raw.startswith("{"):
              payload = raw
          else:
              try:
                  payload = gzip.decompress(base64.b64decode(raw)).decode("utf-8")
              except Exception as exc:
                  print(f"::warning::Could not decode TV_STORAGE_STATE bootstrap; capture must use login fallback: {exc}")
                  sys.exit(0)

          try:
              json.loads(payload)
          except json.JSONDecodeError as exc:
              print(f"::warning::Invalid TV_STORAGE_STATE bootstrap JSON; capture must use login fallback: {exc}")
              sys.exit(0)

          path = Path("automation/tradingview/auth/bootstrap-storage-state.json")
          path.write_text(payload if payload.endswith("\n") else payload + "\n", encoding="utf-8")
          print(f"Prepared TradingView storage-state bootstrap: {path}")
          PY

      - name: Capture TradingView storage state
        id: capture
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_TOTP_SECRET: ${{ secrets.TV_TOTP_SECRET }}
          TV_STORAGE_STATE_INPUT: automation/tradingview/auth/bootstrap-storage-state.json
          # TV_HEADLESS=1 activates headless mode in the script — a headless
          # browser does NOT use the Xvfb display; DISPLAY=:99 above is only a
          # safety net for headed debug runs.
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          TV_STORAGE_SESSION_LOCK_FILE: ${{ runner.temp }}/tradingview-storage-refresh.lock
          # Tight timeout: if automated login doesn't complete in 3 min
          # something is wrong (CAPTCHA / layout change) — fail fast.
          TV_STORAGE_WAIT_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          capture_args=(--headless)
          if [ "${TV_FORCE_FRESH_LOGIN}" = "true" ]; then
            capture_args+=(--force-fresh-login)
          else
            capture_args+=(--input-storage-state automation/tradingview/auth/bootstrap-storage-state.json)
          fi
          capture_args+=(--out automation/tradingview/auth/storage-state.json)
          # 2026-08-18 (Grenzgaenger A6): one in-run retry for transient
          # capture flakes (network, slow TV frontend). Attempt 2 overwrites
          # --out completely, so a torn first attempt cannot leak through.
          # Persistent failures (CAPTCHA, layout change) still fail the run
          # after two attempts and reach the failure-notification step.
          if ! npx tsx scripts/create_tradingview_storage_state.ts "${capture_args[@]}"; then
            echo "::warning::capture attempt 1 failed — retrying once in 60s"
            sleep 60
            npx tsx scripts/create_tradingview_storage_state.ts "${capture_args[@]}"
          fi

      # Drop every cookie that is not TradingView's own BEFORE validating and
      # writing back. The capture bootstraps from the previous secret, so ad and
      # tracking cookies from the chart page piled up run after run until the
      # capture outgrew Linux's 128 KiB limit for one environment string: from
      # 2026-09-08 every refresh died in the next step with
      # "/usr/bin/python: Argument list too long" (exit 126) and the secret aged
      # past its TTL. The prune also keeps the payload far below the 48 KB
      # secret limit, and it refuses (fails the run, secret untouched) if no
      # TradingView sessionid cookie survives.
      - name: Prune captured storage state to TradingView cookies
        run: python scripts/tv_prune_storage_state.py automation/tradingview/auth/storage-state.json

      - name: Validate captured storage state
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          # The capture is handed over as a FILE (--tv-storage-state-file), never
          # as TV_STORAGE_STATE="$(cat ...)": an environment string above 128 KiB
          # fails before Python even starts (see the prune step above).
          # This refresh mints ONLY the TV storage-state, so its exit code must
          # reflect ONLY the tv_storage_state_age probe. `overall_severity` is
          # computed from the probes that actually RUN, so EVERY non-TV probe must
          # be skipped here — otherwise a keyless non-TV probe returns `error`,
          # `overall` becomes error, the script exits 2 (set -e), and a perfectly
          # good TV capture is discarded. That is exactly what broke 2026-07-09→11:
          # Benzinga became load-bearing 2026-07-08 but was not skipped here, so
          # every refresh failed on it while the capture itself succeeded (age
          # 0.0h) and the cookie aged to 99.5h. KEEP THIS SKIP-LIST COMPLETE: any
          # probe added to credential_health_check.py must be skipped here too, or
          # it will silently break the TV refresh again. (The fail-loud contract
          # forbids soft error overrides, so the exit code — not a swallowed
          # failure — is the gate; that is why every non-TV probe is skipped.)
          # That prose rule went unenforced and went stale: PR #4333 (2026-08-03)
          # added probe_composio_accounts without a --skip-composio here. This
          # workflow uses Composio zero times (before this change `grep -ci
          # composio` on this file returned 0) — it mints only the TV cookie —
          # so the empty COMPOSIO_PROD_API_KEY would have returned `error` and
          # discarded a good capture on the next scheduled run (last run
          # 2026-08-03T04:16Z predates #4333, which is the only reason this file
          # is still green). Skipping, not granting an unused credential, is the
          # fix. The rule is now MACHINE-ENFORCED by
          # tests/test_credential_probe_consumers.py, which derives the consumer
          # set from .github/workflows/*.yml and runs on the required path.
          python scripts/credential_health_check.py \
              --tv-storage-state-file automation/tradingview/auth/storage-state.json \
              --tv-max-age-hours 72 \
              --skip-gh-pat \
              --skip-databento \
              --skip-fmp \
              --skip-benzinga \
              --skip-finnhub \
              --skip-newsapi \
              --skip-composio \
              --output artifacts/ci/cred-health.json
          python - <<'EOF'
          import json, sys
          report = json.load(open("artifacts/ci/cred-health.json"))
          # Find the tv_storage_state_age probe in the probes list.
          probes = {p["name"]: p for p in report.get("probes", [])}
          tv = probes.get("tv_storage_state_age", {})
          severity = tv.get("severity", "unknown")
          if severity not in ("ok",):
              print(f"Captured storage state failed validation: {tv}", file=sys.stderr)
              sys.exit(1)
          print(f"Storage state validation passed: {tv}")
          EOF

      - name: Write refreshed secret back to GitHub
        if: env.TV_REFRESH_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.TV_STORAGE_STATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN is not configured; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          # Compress + base64-encode exactly as smc-library-refresh.yml expects.
          PAYLOAD=$(python3 - <<'PYEOF'
          import base64, gzip, json, pathlib, sys
          raw = pathlib.Path("automation/tradingview/auth/storage-state.json").read_bytes()
          # Validate it's parseable JSON before writing.
          json.loads(raw)
          compressed = gzip.compress(raw, compresslevel=9)
          payload = base64.b64encode(compressed).decode()
          # An Actions secret holds at most 48 KB. Fail with the reason instead
          # of letting `gh secret set` reject an oversized payload.
          if len(payload) > 48_000:
              print(f"::error::Storage state payload is {len(payload)} bytes after gzip+base64; "
                    "Actions secrets are limited to 48 KB. The existing TV_STORAGE_STATE is unchanged.",
                    file=sys.stderr)
              sys.exit(1)
          print(payload, end="")
          PYEOF
          )
          printf '%s' "$PAYLOAD" | gh secret set TV_STORAGE_STATE \
            --repo "${{ github.repository }}"
          echo "TV_STORAGE_STATE secret updated successfully."

      - name: Report success
        run: |
          set -euo pipefail
          AUTH_MODE=$(jq -r '.meta.authMode // "unknown"' automation/tradingview/auth/storage-state.json)
          TOTP_ENTERED=$(jq -r '.meta.totpEntered // false' automation/tradingview/auth/storage-state.json)
          TOTP_SUBMITTED=$(jq -r '.meta.totpSubmitted // false' automation/tradingview/auth/storage-state.json)
          {
            echo "### TradingView storage state validated"
            echo ""
            echo "- Authentication path: \`${AUTH_MODE}\`"
            echo "- TOTP entered/submitted: \`${TOTP_ENTERED}/${TOTP_SUBMITTED}\`"
            echo "- Session owner: \`${TV_STORAGE_SESSION_OWNER}\`"
            if [ "${TV_REFRESH_DRY_RUN}" = "true" ]; then
              echo "- Secret update: skipped (dry run); existing \`TV_STORAGE_STATE\` is unchanged"
            else
              echo "- Secret update: completed after validation"
              echo "- Next automatic refresh scheduled in ~48 h"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # On failure: open an issue so the operator knows the automated
      # refresh broke (CAPTCHA / layout change / IP block).
      - name: File failure issue
        if: failure() && env.TV_REFRESH_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          # Repo hier kann Issues deaktiviert haben -- `gh issue create`
          # wuerde dann fehlschlagen und den Operator nie erreichen, ohne
          # dass irgendwo eine sichtbare Warnung dazu steht.
          if [ "$(gh repo view "${{ github.repository }}" --json hasIssuesEnabled --jq '.hasIssuesEnabled')" != "true" ]; then
            echo "::warning title=tradingview-storage-refresh::GitHub Issues sind auf ${{ github.repository }} deaktiviert -- kann kein Failure-Issue oeffnen. Die Job-Failure oben ist bis auf Weiteres der Alarm; TV_STORAGE_STATE manuell pruefen."
            exit 0
          fi

          # Body via mktemp + --body-file (same pattern as meta-watchdog.yml),
          # never an inline heredoc-in-command-substitution: bash parses
          # backticks inside that substitution, so every code span had to be
          # backslash-escaped -- and a quoted heredoc emits the backslash
          # verbatim, so the issue shipped with broken markdown (the fenced
          # bash block never rendered as a code block). See #3640.
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<'EOF'
          The automated TradingView storage-state refresh failed at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          **Likely causes**
          - `TV_STORAGE_STATE_WRITE_TOKEN` missing or lacking access to Actions secrets
          - Existing `TV_STORAGE_STATE` bootstrap session is no longer accepted by TradingView
          - CAPTCHA / IP-based anti-bot challenge (most common)
          - TradingView login page layout changed (script selectors need update)
          - `TV_TOTP_SECRET` rotated or TOTP clock skew
          - `TV_USERNAME` / `TV_PASSWORD` missing or changed

          **Immediate action**
          Capture a FRESH session locally (headed browser, real login), then upload
          exactly that file:
          ```bash
          npm run tv:storage-state   # writes automation/tradingview/auth/storage-state.json
          npm run tv:auth-security   # validates the capture before upload
          gh secret set TV_STORAGE_STATE --repo ${{ github.repository }} \
            < automation/tradingview/auth/storage-state.json
          ```
          Do **not** re-upload an older local `storage-state.json`: pushing a stale
          payload over a newer secret clobbers a live session and keeps this cron
          broken (see #3640 — a 06-29 capture overwrote a fresh 07-13 session).
          Runbook: `docs/tradingview-storage-state-capture-runbook.md`

          **Note:** This job failed before it could establish a session, so the
          validity of the current `TV_STORAGE_STATE` is UNKNOWN here — this failure
          is itself consistent with the stored bootstrap session already being
          rejected. Check the `tv_storage_state_age` probe in
          `credential-health-check` for its actual age.
          EOF

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔐 tradingview-storage-refresh failed — manual cookie refresh required" \
            --body-file "$BODY_FILE" \
            --label "cron-failure,bug"
