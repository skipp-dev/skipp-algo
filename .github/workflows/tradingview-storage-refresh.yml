name: tradingview-storage-refresh
# live-window: mutating-on-cron  # F-V6-F2.1 (schedule-only + Actions secret write token)

# Automated zero-touch refresh of the TV_STORAGE_STATE secret.
#
# Background
# ----------
# smc-library-refresh.yml enforces TV_STORAGE_STATE_MAX_AGE_HOURS=72.
# After the 72 h TTL expires the library-refresh workflow fails and the
# entire TradingView publish chain is blocked until the cookie is
# manually re-captured.
#
# This workflow solves that by proactively refreshing the cookie every
# 48 h (well before the 72 h deadline).  The normal path bootstraps from
# the current TV_STORAGE_STATE secret, verifies that it still opens a
# TradingView chart, and writes a freshly validated storage-state back.
# If the bootstrap session is no longer accepted by TradingView, the
# workflow can fall back to headless login via:
#   TV_USERNAME    — TradingView account e-mail / username
#   TV_PASSWORD    — account password
#   TV_TOTP_SECRET — TOTP seed (Base32) from the Authenticator-App 2FA
#                    setup page; used by otplib to generate the 6-digit
#                    code without human intervention.
#
# On success the freshly captured JSON is written back to the repo secret
# TV_STORAGE_STATE via `gh secret set`, using TV_STORAGE_STATE_WRITE_TOKEN.
# GH_PAT remains for issue/bot-branch workflows; the secret writer is split
# out because bot/PR PATs may not be allowed to mutate Actions secrets.
#
# If login fails (CAPTCHA, IP block, TradingView anti-bot) the job
# fails loudly and the credential-health-check.yml daily probe will
# catch the stale cookie before any downstream consumer runs.
#
# Required secrets
# ----------------
#   TV_STORAGE_STATE — current Playwright storage-state JSON or gzip+base64
#   TV_USERNAME      — optional fallback TradingView login e-mail / username
#   TV_PASSWORD      — optional fallback TradingView password
#   TV_TOTP_SECRET   — optional fallback TOTP Base32 seed
#   GH_PAT           — optional fallback token for failure issue creation
#   TV_STORAGE_STATE_WRITE_TOKEN — token allowed to update Actions secrets
#
# The workflow intentionally does NOT fall back to github.token because
# github.token cannot write repository secrets.

on:
  schedule:
    # 03:00 UTC on odd days-of-month (1,3,…,31) — ~every 48 h, worst-case
    # gap 48 h. The TTL is 72 h, so this keeps a >=24 h safety margin.
    - cron: "0 3 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write  # needed by the failure-notification step (gh issue create)

# Never cancel a running refresh — a half-written secret is worse than
# waiting for the previous run to finish.
concurrency:
  group: tradingview-storage-refresh
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Preflight GitHub secret write token
        env:
          GH_TOKEN: ${{ secrets.TV_STORAGE_STATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN is not configured; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/public-key" >/dev/null; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN cannot access the Actions secrets API for ${GITHUB_REPOSITORY}; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          echo "TV_STORAGE_STATE_WRITE_TOKEN can access the Actions secrets API."

      # xvfb provides a virtual display as a safety net for any HEADED debug run.
      # NOTE: the capture below runs --headless (TV_HEADLESS=1) and does NOT use
      # this display today — Xvfb only matters if the run is ever flipped headed.
      # Screen size 1440x1100 is deliberately the STORAGE_STATE_CAPTURE_VIEWPORT
      # from scripts/create_tradingview_storage_state.ts — keep the two in sync,
      # or a headed run would clip the browser window.
      - name: Start virtual display (xvfb)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb 2>/dev/null || true
          Xvfb :99 -screen 0 1440x1100x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Set up Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies (including otplib)
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Prepare current storage state bootstrap
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64
          import gzip
          import json
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get("TV_STORAGE_STATE_SECRET", "").strip()
          if not raw:
              print("::warning::TV_STORAGE_STATE secret is empty; capture must use TV_USERNAME/TV_PASSWORD fallback.")
              sys.exit(0)

          if raw.startswith("{"):
              payload = raw
          else:
              try:
                  payload = gzip.decompress(base64.b64decode(raw)).decode("utf-8")
              except Exception as exc:
                  print(f"::warning::Could not decode TV_STORAGE_STATE bootstrap; capture must use login fallback: {exc}")
                  sys.exit(0)

          try:
              json.loads(payload)
          except json.JSONDecodeError as exc:
              print(f"::warning::Invalid TV_STORAGE_STATE bootstrap JSON; capture must use login fallback: {exc}")
              sys.exit(0)

          path = Path("automation/tradingview/auth/bootstrap-storage-state.json")
          path.write_text(payload if payload.endswith("\n") else payload + "\n", encoding="utf-8")
          print(f"Prepared TradingView storage-state bootstrap: {path}")
          PY

      - name: Capture TradingView storage state
        id: capture
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
          TV_TOTP_SECRET: ${{ secrets.TV_TOTP_SECRET }}
          TV_STORAGE_STATE_INPUT: automation/tradingview/auth/bootstrap-storage-state.json
          # TV_HEADLESS=1 activates headless mode in the script — a headless
          # browser does NOT use the Xvfb display; DISPLAY=:99 above is only a
          # safety net for headed debug runs.
          TV_HEADLESS: "1"
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          # Tight timeout: if automated login doesn't complete in 3 min
          # something is wrong (CAPTCHA / layout change) — fail fast.
          TV_STORAGE_WAIT_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          npx tsx scripts/create_tradingview_storage_state.ts \
            --headless \
            --input-storage-state automation/tradingview/auth/bootstrap-storage-state.json \
            --out automation/tradingview/auth/storage-state.json

      - name: Validate captured storage state
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          # credential_health_check.py reads TV_STORAGE_STATE as raw JSON content.
          # This refresh mints ONLY the TV storage-state, so its exit code must
          # reflect ONLY the tv_storage_state_age probe. `overall_severity` is
          # computed from the probes that actually RUN, so EVERY non-TV probe must
          # be skipped here — otherwise a keyless non-TV probe returns `error`,
          # `overall` becomes error, the script exits 2 (set -e), and a perfectly
          # good TV capture is discarded. That is exactly what broke 2026-07-09→11:
          # Benzinga became load-bearing 2026-07-08 but was not skipped here, so
          # every refresh failed on it while the capture itself succeeded (age
          # 0.0h) and the cookie aged to 99.5h. KEEP THIS SKIP-LIST COMPLETE: any
          # probe added to credential_health_check.py must be skipped here too, or
          # it will silently break the TV refresh again. (The fail-loud contract
          # forbids soft error overrides, so the exit code — not a swallowed
          # failure — is the gate; that is why every non-TV probe is skipped.)
          TV_STORAGE_STATE="$(cat automation/tradingview/auth/storage-state.json)" \
            python scripts/credential_health_check.py \
              --tv-max-age-hours 72 \
              --skip-gh-pat \
              --skip-databento \
              --skip-fmp \
              --skip-benzinga \
              --skip-newsapi \
              --output artifacts/ci/cred-health.json
          python - <<'EOF'
          import json, sys
          report = json.load(open("artifacts/ci/cred-health.json"))
          # Find the tv_storage_state_age probe in the probes list.
          probes = {p["name"]: p for p in report.get("probes", [])}
          tv = probes.get("tv_storage_state_age", {})
          severity = tv.get("severity", "unknown")
          if severity not in ("ok",):
              print(f"Captured storage state failed validation: {tv}", file=sys.stderr)
              sys.exit(1)
          print(f"Storage state validation passed: {tv}")
          EOF

      - name: Write refreshed secret back to GitHub
        env:
          GH_TOKEN: ${{ secrets.TV_STORAGE_STATE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TV_STORAGE_STATE_WRITE_TOKEN is not configured; cannot rotate TV_STORAGE_STATE."
            exit 1
          fi
          # Compress + base64-encode exactly as smc-library-refresh.yml expects.
          PAYLOAD=$(python3 - <<'PYEOF'
          import base64, gzip, json, pathlib, sys
          raw = pathlib.Path("automation/tradingview/auth/storage-state.json").read_bytes()
          # Validate it's parseable JSON before writing.
          json.loads(raw)
          compressed = gzip.compress(raw, compresslevel=9)
          print(base64.b64encode(compressed).decode(), end="")
          PYEOF
          )
          printf '%s' "$PAYLOAD" | gh secret set TV_STORAGE_STATE \
            --repo "${{ github.repository }}"
          echo "TV_STORAGE_STATE secret updated successfully."

      - name: Report success
        run: |
          echo "### TradingView storage state refreshed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cookie captured headlessly with TOTP and written back to \`TV_STORAGE_STATE\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Next automatic refresh scheduled in ~48 h." >> "$GITHUB_STEP_SUMMARY"

      # On failure: open an issue so the operator knows the automated
      # refresh broke (CAPTCHA / layout change / IP block).
      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
        run: |
          # Repo hier kann Issues deaktiviert haben -- `gh issue create`
          # wuerde dann fehlschlagen und den Operator nie erreichen, ohne
          # dass irgendwo eine sichtbare Warnung dazu steht.
          if [ "$(gh repo view "${{ github.repository }}" --json hasIssuesEnabled --jq '.hasIssuesEnabled')" != "true" ]; then
            echo "::warning title=tradingview-storage-refresh::GitHub Issues sind auf ${{ github.repository }} deaktiviert -- kann kein Failure-Issue oeffnen. Die Job-Failure oben ist bis auf Weiteres der Alarm; TV_STORAGE_STATE manuell pruefen."
            exit 0
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔐 tradingview-storage-refresh failed — manual cookie refresh required" \
            --body "$(cat <<'EOF'
          The automated TradingView storage-state refresh failed at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          **Likely causes**
          - \`TV_STORAGE_STATE_WRITE_TOKEN\` missing or lacking access to Actions secrets
          - Existing \`TV_STORAGE_STATE\` bootstrap session is no longer accepted by TradingView
          - CAPTCHA / IP-based anti-bot challenge (most common)
          - TradingView login page layout changed (script selectors need update)
          - \`TV_TOTP_SECRET\` rotated or TOTP clock skew
          - \`TV_USERNAME\` / \`TV_PASSWORD\` missing or changed

          **Immediate action**
          Run \`npm run tv:storage-state\` locally, log in manually, then update the secret:
          \`\`\`bash
          gh secret set TV_STORAGE_STATE --repo skippALGO/skipp-algo
          \`\`\`

          **Note:** The current \`TV_STORAGE_STATE\` is still valid until its 72 h TTL expires.
          Check \`credential-health-check\` for its remaining age.
          EOF
          )" \
            --label "cron-failure,bug"
