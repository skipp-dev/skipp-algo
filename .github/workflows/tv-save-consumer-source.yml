name: tv-save-consumer-source
# live-window: off-hours-only  # Daily cron verifies saved-source hashes + bindings read-only; TradingView is mutated by manual dispatch AND by the post-refresh chain (workflow_run) below.
# Manual dispatch can push fresh repo source and explicitly refresh the producer chart instance.
#
# workflow_run chain (2026-07-22): a SUCCESSFUL smc-library-refresh triggers a
# WRITING save with TV_REFRESH_PRODUCER + TV_FORCE_REBIND. Without this the
# applied Suite chart instance stays frozen on the old library version until an
# operator re-adds it by hand — Pine imports are mandatorily version-pinned and
# TradingView never re-resolves applied instances ('Library 9d alt' incident,
# 2026-07-22). Trade-off (accepted): refreshChartScriptInstance re-adds the
# Suite with DEFAULT inputs, so custom inputs edited directly on the applied
# instance do not survive the refresh; persistent tweaks belong in the saved
# script source. The refresh normally completes pre-market (~09-13Z), so the
# chained save stays inside the off-hours posture on normal days.

# Pushes the CURRENT repo source of the hand-authored CONSUMER scripts (indicators/
# strategies — SMC_Long_Dip_Dashboard, SMC_Long_Dip_Strategy, …) into their EXISTING TradingView
# saved scripts, via one shared-browser batch (open → paste → save →
# compile-verify → verify chart bindings). Unlike the library publishers, consumers are not "published";
# they are the operator's saved chart scripts, which froze months ago on old
# imports (Core Engine pinned every lib at /1 → CE10271/CE10272). The repo is
# SSOT; this recompiles the saved copies against the current library surface.
#
# Scheduled runs invoke the explicit --verify-only execution plan, which
# structurally disables source saves, producer refresh, binding repair, and
# layout save before the browser opens. Writing paths: manual dispatch, and the
# workflow_run chain after a successful library refresh (which also refreshes
# the applied producer chart instance).
#
# Safety:
#   * Requires a real authenticated TV session — fails fast if TV_STORAGE_STATE
#     is absent (no silent no-op).
#   * The batch opens each script by EXACT saved name; a wrong/
#     unknown name simply fails to open (no wrong-script paste) and is reported
#     as a per-entry miss — the run continues and summarizes hits vs misses.
#   * Each save compile-verifies before reporting ok; the chart bindings of
#     every consumer-rollout.json verifyTarget (Decision Board through the R1
#     companions) are checked afterwards in that same browser session.
#
# The `mapping` input is a JSON array of {"source": "<repo .pine>", "scriptName":
# "<exact saved TV name>"}. Default covers the saved names known from the repo /
# current product manifest; override it to correct operator-specific saved names.

on:
  schedule:
    - cron: "17 5 * * *"
    # Evening read-only look. Operator-caused drift on a day with no CI run was
    # otherwise invisible until the next morning; this halves the worst case to
    # ~12h. After the US close, so the off-hours posture holds.
    - cron: "17 21 * * *"
  # zizmor: ignore[dangerous-triggers] -- workflow_run source is the same-repo
  # smc-library-refresh on the default branch (no fork/PR-controlled context);
  # this consumer only re-saves repo-owned sources with repo secrets it
  # already holds for schedule/dispatch runs (#3893 cadence fix).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - smc-library-refresh
    types:
      - completed
  workflow_dispatch:
    inputs:
      mapping:
        description: 'JSON array of {"source","scriptName"} pairs (empty = built-in default)'
        required: false
        default: ""
      verify_only:
        description: "Read sources and bindings without any TradingView mutation"
        type: boolean
        required: false
        default: false
      repair_e2e:
        description: "Temporarily drift one Dashboard binding, repair it, and reverify"
        type: boolean
        required: false
        default: false
      force_rebind:
        description: "Re-select every BUS source to replace stale TradingView parent IDs"
        type: boolean
        required: false
        default: false
      refresh_producer:
        description: "Remove and re-add SMC Long-Dip Suite; requires force_rebind=true"
        type: boolean
        required: false
        default: false
      r1_rollback_drill:
        description: "Remove BOTH R1 companions from the managed layout, prove the removal survives a reload, then restore and rebind them"
        type: boolean
        required: false
        default: false
      r1_restore_companions:
        description: "Repair only: put both R1 companions back, rebind them to the attested count, and prove it across a reload (no removal)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  # Read-only, and only for the workflow_run path: the chain has to find the
  # bot/library-refresh-* PR that carries the refresh commit before it can
  # check that commit out. See "Await the refresh commit on main" below.
  pull-requests: read

concurrency:
  # 2026-08-01: one AUTOMATED browser session at a time — CI against CI only.
  # This group does NOT serialise the account: the operator's own browser is
  # a second, unserialised writer on the same layouts, and TradingView
  # autosaves from it (operator-confirmed 2026-08-01: autosave active, and a
  # chart tab on this account was open all day while runs mutated layouts —
  # nothing here knew). No mechanism detects or excludes that session;
  # mutating runs coordinate with the operator by convention, not by code.
  # Every workflow below drives the SAME external account, and until now each
  # one only serialised against itself — two of these blocks already said
  # "TradingView is a single shared external target" while keeping a private
  # group, so the guarantee was stated but never implemented. Measured trigger:
  # a manual tv-save-consumer-source dispatch ran while an R4 readback was
  # being prepared; nothing in CI would have stopped them overlapping.
  # cancel-in-progress stays false everywhere: these runs save layouts and
  # publish scripts, so a queued run must wait, never pre-empt.
  group: tradingview-session
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  save:
    # Only a SUCCESSFUL library refresh may trigger the writing chain: after a
    # failed refresh the repo pin/library state is unknown, and saving then
    # could roll consumers onto a half-published state.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # The workflow_run event fires when smc-library-refresh COMPLETES, but the
      # refresh does not push its output: it opens bot/library-refresh-<run id>-*
      # and auto-merges it, which settles SECONDS LATER. Measured 2026-08-01:
      # this chain started 02:55:28Z and the refresh PR (#4284) merged 02:55:48Z,
      # so at checkout time both the event's head_sha (the parent) AND main's tip
      # were still the pre-refresh tree. The run then re-saved the OLD consumer
      # sources to TradingView and verified them against the OLD repo — reporting
      # sources.drifted=0 while every consumer on the operator chart stayed one
      # library version behind, until someone dispatched by hand.
      #
      # Nothing inside the run could catch it. The rollout's provenance compares
      # library.expectedVersion against library.publishedVersion, and BOTH are
      # fields of the same manifest file in the checked-out tree, so a stale tree
      # agrees with itself: that run reported matches=true at version 180 while
      # main was already on 182.
      #
      # So wait for the COMMIT instead of for the workflow. The refresh names its
      # branch after its own run id, which is exactly what this event carries, so
      # the PR is identifiable rather than guessed at.
      - name: Await the refresh commit on main
        id: refresh_commit
        if: github.event_name == 'workflow_run'
        env:
          # Canonical binding required by tests/test_workflow_gh_pat_discipline.py
          # for every `gh pr` call. This step only READS, so github.token alone
          # would function — but the discipline is uniform on purpose: the rule
          # cannot tell a read from a write without parsing the subcommand, and
          # an exception here would be one more thing that has to stay true.
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
          REFRESH_RUN_ID: ${{ github.event.workflow_run.id }}
          # Auto-merge on a bot/* PR skips heavy CI and lands in seconds; the
          # observed gap was 20s. This is the outer bound before we would rather
          # fail loudly than write a tree we cannot vouch for.
          AWAIT_TIMEOUT_SECONDS: "600"
        run: |
          set -euo pipefail
          prefix="bot/library-refresh-${REFRESH_RUN_ID}-"
          deadline=$(( SECONDS + AWAIT_TIMEOUT_SECONDS ))
          while :; do
            # Sorted newest-first; the PR we want was created minutes ago.
            pr=$(gh pr list --repo "$REPO" --state all --limit 100 \
                   --json number,headRefName,state,mergeCommit \
                   --jq "[.[] | select(.headRefName | startswith(\"${prefix}\"))] | first // empty")

            if [ -z "$pr" ]; then
              # The refresh only opens a PR when the regeneration actually
              # changed something ("No post-publish changes to commit."), so an
              # absent PR is a legitimate no-op, not a lost commit.
              echo "::notice::No ${prefix}* PR exists — the refresh reported no post-publish changes, so main already carries its output."
              exit 0
            fi

            number=$(jq -r '.number' <<<"$pr")
            state=$(jq -r '.state' <<<"$pr")
            sha=$(jq -r '.mergeCommit.oid // ""' <<<"$pr")

            if [ "$state" = "MERGED" ] && [ -n "$sha" ]; then
              echo "::notice::Refresh commit ${sha} (PR #${number}) is on main; checking that out."
              echo "sha=${sha}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$state" = "CLOSED" ]; then
              echo "::error::PR #${number} for refresh run ${REFRESH_RUN_ID} was closed without merging. Refusing to save a tree that is not the refresh output."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              # Deliberately fatal. Continuing would reproduce exactly the defect
              # this step exists to close, and would report it as green.
              echo "::error::PR #${number} for refresh run ${REFRESH_RUN_ID} did not merge within ${AWAIT_TIMEOUT_SECONDS}s (state ${state}). Merge it and re-dispatch this workflow."
              exit 1
            fi

            echo "PR #${number} is ${state}; waiting for the auto-merge to land."
            sleep 15
          done

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Prefer the exact refresh commit resolved above. It is empty when the
          # refresh changed nothing, and for schedule/dispatch the whole step is
          # skipped — both fall through to main's tip, which is correct there.
          ref: ${{ steps.refresh_commit.outputs.sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch) || '' }}
          fetch-depth: 1
          persist-credentials: false

      # The operator's browser is the normal production writer on this account
      # and automation is the guest; the tradingview-session group serialises
      # CI against CI only. This is the one direction that can be excluded
      # honestly: CI starting while the operator is working. The variable holds
      # an EXPIRY, so a forgotten claim cannot block this workflow past its own
      # timestamp -- see scripts/check_tv_operator_window.py.
      #
      # Read-only runs are exempt on purpose: they write nothing, and gating
      # them would let an open window suppress the evening verification.
      - name: Refuse to mutate inside the operator's TradingView window
        if: ${{ github.event_name != 'schedule' && github.event.inputs.verify_only != 'true' }}
        env:
          TV_OPERATOR_ACTIVE: ${{ vars.TV_OPERATOR_ACTIVE }}
        run: python3 -m scripts.check_tv_operator_window

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          if [ -z "${TV_STORAGE_STATE_SECRET:-}" ]; then
            echo "::error::TV_STORAGE_STATE not configured — cannot save consumer scripts. Aborting."
            exit 1
          fi
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET'].strip()
          payload = raw if raw.startswith('{') else gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          json.loads(payload)  # validate
          out = Path('automation/tradingview/auth/storage-state.json')
          out.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      # The comparison baseline is the observation the LAST run published to
      # bot/live-tradingview-bindings. Fetched over the API rather than with
      # git: the checkout above sets persist-credentials: false, so no
      # credential is available to git here.
      #
      # A missing baseline is not an error. It is the "unknown" verdict, and the
      # rollout decides that -- a first run, or a pruned branch, must not fail a
      # step that has measured nothing.
      - name: Fetch the published binding baseline
        if: ${{ github.event_name != 'schedule' && github.event.inputs.verify_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/monitoring/previous
          out="artifacts/monitoring/previous/tradingview_consumer_bindings.json"
          path="artifacts/monitoring/latest/tradingview_consumer_bindings.json"
          if gh api "repos/${GH_REPO}/contents/${path}?ref=bot/live-tradingview-bindings" \
               --jq '.content' 2>/dev/null | base64 -d > "${out}"; then
            echo "Baseline fetched: $(wc -c < "${out}") bytes"
          else
            rm -f "${out}"
            echo "::warning::No published binding baseline — out-of-band drift will report as unknown."
          fi

      # Runs on EVERY trigger, before the browser opens. The 2026-08-01
      # un-attestation arrived through the workflow_run chain, not a dispatch,
      # so watching only the manual path would leave the door that was used.
      # It does not block the save: skipping the drifted targets would freeze
      # them on an old pinned library while the producer moves on.
      # A step OUTPUT, not $GITHUB_ENV: writing the environment file is a
      # zizmor `github-env` high finding, and an output is what this actually
      # is -- one value, consumed by two named steps.
      - name: Detect R1-attested sources this save would un-attest
        id: attestation
        run: |
          set -euo pipefail
          unattested="$(python3 -m scripts.check_tv_unattested_sources \
            --config automation/tradingview/config/consumer-rollout.json)"
          echo "unattested=${unattested}" >> "$GITHUB_OUTPUT"

      - name: Save or read-only verify consumers in one browser session
        id: save
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          # Sources the registered R1 evidence no longer attests. They are
          # saved like every other consumer; the rollout records them so the
          # report cannot come back green while the evidence goes stale.
          TV_UNATTESTED_SOURCES: ${{ steps.attestation.outputs.unattested }}
          TV_VERIFY_ONLY: ${{ github.event_name == 'schedule' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only || 'false' }}
          # [] remains a legacy-compatible belt-and-suspenders guard. The
          # actual no-write contract is --verify-only below.
          TV_CONSUMER_MAPPING_JSON: ${{ github.event_name == 'schedule' && '[]' || github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only == 'true' && '[]' || github.event.inputs.mapping }}
          # workflow_run (post-refresh chain) writes with producer refresh +
          # rebind; the rollout script hard-fails on refresh-without-rebind,
          # so both flags flip together here.
          TV_FORCE_REBIND: ${{ github.event_name == 'workflow_run' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebind || 'false' }}
          TV_REFRESH_PRODUCER: ${{ github.event_name == 'workflow_run' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_producer || 'false' }}
        run: |
          args=()
          if [ "${TV_VERIFY_ONLY}" = "true" ]; then
            args+=(--verify-only)
          fi
          npx tsx scripts/tv_batch_consumer_rollout.ts "${args[@]}"

      - name: Controlled repair E2E
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_e2e == 'true' && github.event.inputs.verify_only != 'true' }}
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
        run: npx tsx scripts/tv_repair_binding_e2e.ts

      # Between its two saves the managed layout genuinely carries no
      # companions, so nothing is evaluating there. Opt-in only, and never
      # alongside a read-only run.
      #
      # Repair must run even when the step above went red, and run 30701657039
      # is why: with the companions missing, that step reports "Existing chart
      # instance not found" for both and fails -- so the repair for exactly that
      # damage was skipped and the layout stayed broken. The rollback drill
      # keeps the opposite rule: a red verification means the layout is not in
      # the state its baseline assumes, and removing things then proves nothing.
      #
      # Both arms read steps.save.conclusion rather than always(): if an earlier
      # step failed, save never ran, there is no authenticated browser session,
      # and running the drill would only produce a second, misleading failure.
      - name: R1 companion rollback drill
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.verify_only != 'true' && (
          (github.event.inputs.r1_restore_companions == 'true' && (steps.save.conclusion == 'success' || steps.save.conclusion == 'failure')) ||
          (github.event.inputs.r1_rollback_drill == 'true' && steps.save.conclusion == 'success')) }}
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          # Repair mode. The removal half is skipped entirely, so this is the
          # only way to put the companions back after a drill that removed them
          # and could not restore them (run 30700389375) -- re-running the full
          # drill dies in its baseline precondition before its recovery block
          # is armed.
          TV_DRILL_RESTORE_ONLY: ${{ github.event.inputs.r1_restore_companions }}
        run: npx tsx scripts/tv_r1_companion_rollback_drill.ts

      - name: Upload binding snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tradingview-consumer-bindings
          path: artifacts/monitoring/tradingview_consumer_bindings.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest binding snapshot
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          snapshot="artifacts/monitoring/tradingview_consumer_bindings.json"
          if [ -z "${GH_TOKEN:-}" ] || [ ! -s "${snapshot}" ]; then
            echo "::warning::Cannot publish TradingView binding snapshot (missing GH_PAT or snapshot)."
            exit 0
          fi
          stable_dir="artifacts/monitoring/latest"
          mkdir -p "${stable_dir}"
          cp "${snapshot}" "${stable_dir}/tradingview_consumer_bindings.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_ref="refs/heads/bot/live-tradingview-bindings"
          tracking_ref="refs/remotes/origin/bot/live-tradingview-bindings"
          git add -f "${stable_dir}/tradingview_consumer_bindings.json"
          git commit -m "[skip ci] chore: refresh TradingView binding snapshot"
          git fetch "${remote_url}" "+${remote_ref}:${tracking_ref}" 2>/dev/null || true
          zero_sha="0000000000000000000000000000000000000000"
          expected_sha="$(git rev-parse --verify "${tracking_ref}" 2>/dev/null || echo "${zero_sha}")"
          if git push "--force-with-lease=${remote_ref}:${expected_sha}" "${remote_url}" "HEAD:${remote_ref}"; then
            echo "Published TradingView binding snapshot to bot/live-tradingview-bindings."
          else
            echo "::warning::TradingView binding snapshot push failed; uploaded artifact remains available."
          fi

      # Last, so the snapshot is uploaded and published first: this run pushed
      # content the registered evidence does not attest, which needs a human,
      # and a green run would say the opposite. Deliberately NOT always() --
      # it reports the un-attestation, not an unrelated failure.
      - name: Fail the run when an R1-attested source was saved un-attested
        if: ${{ steps.attestation.outputs.unattested != '' && steps.attestation.outputs.unattested != '[]' }}
        env:
          TV_UNATTESTED_SOURCES: ${{ steps.attestation.outputs.unattested }}
        run: |
          set -euo pipefail
          {
            echo "## R1-attested sources were saved un-attested"
            echo
            echo "This run pushed these saved scripts to TradingView, as intended --"
            echo "the deployment stays consistent with the repository. What it also"
            echo "did is end the registered R1 evidence's claim about them: it"
            echo "attests different content, so it no longer describes what is live."
            echo
            echo '```'
            echo "${TV_UNATTESTED_SOURCES}"
            echo '```'
            echo
            echo "Re-attest with a NEW dated evidence artifact, or revert the source"
            echo "change and re-run to push the attested content back."
            echo
            echo "Do not edit the existing dated artifact to match today's hashes:"
            echo "that falsifies a measurement rather than repeating it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::R1-attested sources saved un-attested: ${TV_UNATTESTED_SOURCES}"
          exit 1
