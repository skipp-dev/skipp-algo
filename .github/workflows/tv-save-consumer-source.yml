name: tv-save-consumer-source
# live-window: off-hours-only  # Daily cron verifies saved-source hashes + bindings read-only; TradingView is mutated by manual dispatch AND by the post-refresh chain (workflow_run) below.
# Manual dispatch can push fresh repo source and explicitly refresh the producer chart instance.
#
# workflow_run chain (2026-07-22): a SUCCESSFUL smc-library-refresh triggers a
# WRITING save with TV_REFRESH_PRODUCER + TV_FORCE_REBIND. Without this the
# applied Suite chart instance stays frozen on the old library version until an
# operator re-adds it by hand — Pine imports are mandatorily version-pinned and
# TradingView never re-resolves applied instances ('Library 9d alt' incident,
# 2026-07-22). Trade-off (accepted): refreshChartScriptInstance re-adds the
# Suite with DEFAULT inputs, so custom inputs edited directly on the applied
# instance do not survive the refresh; persistent tweaks belong in the saved
# script source. The refresh normally completes pre-market (~09-13Z), so the
# chained save stays inside the off-hours posture on normal days.

# Pushes the CURRENT repo source of the hand-authored CONSUMER scripts (indicators/
# strategies — SMC_Dashboard, SMC_Core_Engine, …) into their EXISTING TradingView
# saved scripts, via one shared-browser batch (open → paste → save →
# compile-verify → verify chart bindings). Unlike the library publishers, consumers are not "published";
# they are the operator's saved chart scripts, which froze months ago on old
# imports (Core Engine pinned every lib at /1 → CE10271/CE10272). The repo is
# SSOT; this recompiles the saved copies against the current library surface.
#
# Scheduled runs force an empty save mapping and therefore inspect saved-source
# hashes and dropdown assignments without writing. Writing paths: manual
# dispatch, and the workflow_run chain after a successful library refresh
# (which also refreshes the applied producer chart instance).
#
# Safety:
#   * Requires a real authenticated TV session — fails fast if TV_STORAGE_STATE
#     is absent (no silent no-op).
#   * The batch opens each script by EXACT saved name; a wrong/
#     unknown name simply fails to open (no wrong-script paste) and is reported
#     as a per-entry miss — the run continues and summarizes hits vs misses.
#   * Each save compile-verifies before reporting ok; existing Dashboard,
#     Strategy, Alerts, Setup Check, Breakout, and Confluence chart bindings are
#     checked afterwards in that same browser session.
#
# The `mapping` input is a JSON array of {"source": "<repo .pine>", "scriptName":
# "<exact saved TV name>"}. Default covers the saved names known from the repo /
# current product manifest; override it to correct operator-specific saved names.

on:
  schedule:
    - cron: "17 5 * * *"
  # zizmor: ignore[dangerous-triggers] -- workflow_run source is the same-repo
  # smc-library-refresh on the default branch (no fork/PR-controlled context);
  # this consumer only re-saves repo-owned sources with repo secrets it
  # already holds for schedule/dispatch runs (#3893 cadence fix).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - smc-library-refresh
    types:
      - completed
  workflow_dispatch:
    inputs:
      mapping:
        description: 'JSON array of {"source","scriptName"} pairs (empty = built-in default)'
        required: false
        default: ""
      repair_e2e:
        description: "Temporarily drift one Dashboard binding, repair it, and reverify"
        type: boolean
        required: false
        default: false
      force_rebind:
        description: "Re-select every BUS source to replace stale TradingView parent IDs"
        type: boolean
        required: false
        default: false
      refresh_producer:
        description: "Remove and re-add SMC Long-Dip Suite; requires force_rebind=true"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: tv-save-consumer-source
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  save:
    # Only a SUCCESSFUL library refresh may trigger the writing chain: after a
    # failed refresh the repo pin/library state is unknown, and saving then
    # could roll consumers onto a half-published state.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # smc-library-refresh pushes its output commit DURING its run, but the
          # workflow_run event's head_sha is the commit that run STARTED from —
          # the parent of the refresh commit. Defaulting to that head_sha checks
          # out the pre-refresh tree, so the chained save re-saves the OLD source
          # (a no-op) and the fresh consumer source is never pushed to TradingView,
          # leaving "saved consumer source drifts from repo" firing until a manual
          # dispatch. For workflow_run, check out the branch tip instead so the
          # post-refresh source is what gets saved. Empty ref keeps the default
          # (github.sha) for schedule/dispatch, which already land on main's tip.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          if [ -z "${TV_STORAGE_STATE_SECRET:-}" ]; then
            echo "::error::TV_STORAGE_STATE not configured — cannot save consumer scripts. Aborting."
            exit 1
          fi
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET'].strip()
          payload = raw if raw.startswith('{') else gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          json.loads(payload)  # validate
          out = Path('automation/tradingview/auth/storage-state.json')
          out.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Save or read-only verify consumers in one browser session
        id: save
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          # Open the operator's actual chart, not the bare /chart/ account
          # default. gotoChart() falls back to https://www.tradingview.com/chart/
          # when TV_CHART_URL is unset, which resolves to whatever layout the
          # session's IndexedDB cache happens to restore — a chart WITHOUT the
          # SMC consumers after any storage-state re-capture. Pinning the layout
          # makes the binding verify deterministic (2026-07-24 binding-drift
          # incident: a fresh capture dropped the cached layout and every
          # consumer read "instance not found").
          TV_CHART_URL: https://www.tradingview.com/chart/vWgAWyfC/
          # Cron is fail-safe read-only: [] skips every saved-script write.
          TV_CONSUMER_MAPPING_JSON: ${{ github.event_name == 'schedule' && '[]' || github.event.inputs.mapping }}
          # workflow_run (post-refresh chain) writes with producer refresh +
          # rebind; the rollout script hard-fails on refresh-without-rebind,
          # so both flags flip together here.
          TV_FORCE_REBIND: ${{ github.event_name == 'workflow_run' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.force_rebind || 'false' }}
          TV_REFRESH_PRODUCER: ${{ github.event_name == 'workflow_run' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_producer || 'false' }}
        run: |
          npx tsx scripts/tv_batch_consumer_rollout.ts

      - name: Controlled repair E2E
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repair_e2e == 'true' }}
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
        run: npx tsx scripts/tv_repair_binding_e2e.ts

      - name: Upload binding snapshot
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tradingview-consumer-bindings
          path: artifacts/monitoring/tradingview_consumer_bindings.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest binding snapshot
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          snapshot="artifacts/monitoring/tradingview_consumer_bindings.json"
          if [ -z "${GH_TOKEN:-}" ] || [ ! -s "${snapshot}" ]; then
            echo "::warning::Cannot publish TradingView binding snapshot (missing GH_PAT or snapshot)."
            exit 0
          fi
          stable_dir="artifacts/monitoring/latest"
          mkdir -p "${stable_dir}"
          cp "${snapshot}" "${stable_dir}/tradingview_consumer_bindings.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_ref="refs/heads/bot/live-tradingview-bindings"
          tracking_ref="refs/remotes/origin/bot/live-tradingview-bindings"
          git add -f "${stable_dir}/tradingview_consumer_bindings.json"
          git commit -m "[skip ci] chore: refresh TradingView binding snapshot"
          git fetch "${remote_url}" "+${remote_ref}:${tracking_ref}" 2>/dev/null || true
          zero_sha="0000000000000000000000000000000000000000"
          expected_sha="$(git rev-parse --verify "${tracking_ref}" 2>/dev/null || echo "${zero_sha}")"
          if git push "--force-with-lease=${remote_ref}:${expected_sha}" "${remote_url}" "HEAD:${remote_ref}"; then
            echo "Published TradingView binding snapshot to bot/live-tradingview-bindings."
          else
            echo "::warning::TradingView binding snapshot push failed; uploaded artifact remains available."
          fi
