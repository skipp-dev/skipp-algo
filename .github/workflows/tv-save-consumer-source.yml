name: tv-save-consumer-source
# live-window: mutating-on-dispatch  # Push fresh repo source into saved TV consumer scripts (2026-07-13)

# Pushes the CURRENT repo source of the hand-authored CONSUMER scripts (indicators/
# strategies — SMC_Dashboard, SMC_Core_Engine, …) into their EXISTING TradingView
# saved scripts, via scripts/tv_save_consumer_source.ts (open → paste → save →
# compile-verify). Unlike the library publishers, consumers are not "published";
# they are the operator's saved chart scripts, which froze months ago on old
# imports (Core Engine pinned every lib at /1 → CE10271/CE10272). The repo is
# SSOT; this recompiles the saved copies against the current library surface.
#
# DISPATCH-ONLY (no schedule): it writes to the operator's PERSONAL saved scripts,
# so it runs on demand, not on a timer.
#
# Safety:
#   * Requires a real authenticated TV session — fails fast if TV_STORAGE_STATE
#     is absent (no silent no-op).
#   * tv_save_consumer_source opens each script by EXACT saved name; a wrong/
#     unknown name simply fails to open (no wrong-script paste) and is reported
#     as a per-entry miss — the run continues and summarizes hits vs misses.
#   * Each save compile-verifies (assertNoVisibleCompileError) before reporting ok.
#
# The `mapping` input is a JSON array of {"source": "<repo .pine>", "scriptName":
# "<exact saved TV name>"}. Default covers the saved names known from the repo /
# 2026-07-13 incident; override it to add/correct names.

on:
  workflow_dispatch:
    inputs:
      mapping:
        description: 'JSON array of {"source","scriptName"} pairs (empty = built-in default)'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tv-save-consumer-source
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  save:
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw_version
        run: |
          version="$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          if [ -z "$version" ]; then
            version="$(node -p "require('./node_modules/playwright/package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers cache
        id: pw_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ steps.pw_version.outputs.version }}

      - name: Install Playwright browsers (cache miss)
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Write TradingView storage state
        env:
          TV_STORAGE_STATE_SECRET: ${{ secrets.TV_STORAGE_STATE }}
        run: |
          set -euo pipefail
          if [ -z "${TV_STORAGE_STATE_SECRET:-}" ]; then
            echo "::error::TV_STORAGE_STATE not configured — cannot save consumer scripts. Aborting."
            exit 1
          fi
          mkdir -p automation/tradingview/auth
          python3 - <<'PY'
          import base64, gzip, json, os
          from pathlib import Path

          raw = os.environ['TV_STORAGE_STATE_SECRET'].strip()
          payload = raw if raw.startswith('{') else gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          json.loads(payload)  # validate
          out = Path('automation/tradingview/auth/storage-state.json')
          out.write_text(payload if payload.endswith('\n') else payload + '\n', encoding='utf-8')
          PY

      - name: Save consumer source into saved TV scripts
        id: save
        env:
          TV_STORAGE_STATE: automation/tradingview/auth/storage-state.json
          MAPPING_INPUT: ${{ github.event.inputs.mapping }}
        run: |
          set -uo pipefail
          # Built-in default mapping: source .pine -> exact saved TV script name.
          # SMC_Core_Engine's saved name is "SMC Core Engine" (not its title); the
          # rest default to their indicator/strategy title. Override via the
          # `mapping` dispatch input for corrections/additions.
          DEFAULT_MAPPING='[
            {"source":"SMC_Core_Engine.pine","scriptName":"SMC Core Engine"},
            {"source":"SMC_Dashboard.pine","scriptName":"SMC Long-Dip Dashboard v7"},
            {"source":"SMC_Long_Strategy.pine","scriptName":"SMC Long-Dip Strategy v7"},
            {"source":"SMC_Mobile_Dashboard.pine","scriptName":"SMC Mobile v7"}
          ]'
          MAPPING="${MAPPING_INPUT:-}"
          if [ -z "${MAPPING}" ]; then MAPPING="${DEFAULT_MAPPING}"; fi

          # Emit "source<TAB>scriptName" lines for a safe read loop.
          mapfile -t ENTRIES < <(printf '%s' "${MAPPING}" | python3 -c "import json,sys; [print(e['source']+'\t'+e['scriptName']) for e in json.load(sys.stdin)]")
          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "::error::empty mapping"; exit 1
          fi

          hits=0; misses=0
          echo "## TV consumer-source save results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for entry in "${ENTRIES[@]}"; do
            src="${entry%%$'\t'*}"
            name="${entry#*$'\t'}"
            if [ ! -f "${src}" ]; then
              echo "::warning::source not found in repo: ${src} — skipping"
              echo "- ⚠️ \`${src}\` → \"${name}\": repo source missing" >> "$GITHUB_STEP_SUMMARY"
              misses=$((misses+1)); continue
            fi
            echo "▶ saving ${src} → \"${name}\""
            if npx tsx scripts/tv_save_consumer_source.ts --source "${src}" --script-name "${name}"; then
              echo "  ✅ ${name}"
              echo "- ✅ \`${src}\` → \"${name}\"" >> "$GITHUB_STEP_SUMMARY"
              hits=$((hits+1))
            else
              echo "::warning::could not save \"${name}\" (saved script not found under that exact name, or a compile error) — check the name and re-dispatch with a corrected mapping"
              echo "- ❌ \`${src}\` → \"${name}\": not found / compile error" >> "$GITHUB_STEP_SUMMARY"
              misses=$((misses+1))
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**${hits} saved, ${misses} missed.**" >> "$GITHUB_STEP_SUMMARY"
          echo "hits=${hits}" >> "$GITHUB_OUTPUT"
          echo "misses=${misses}" >> "$GITHUB_OUTPUT"
          # A miss is not a hard failure (unknown saved name is expected until the
          # operator confirms it), but zero hits means nothing worked — fail so it
          # is not mistaken for success.
          if [ "${hits}" -eq 0 ]; then
            echo "::error::no consumer scripts were saved (all names missed or errored)."
            exit 1
          fi
