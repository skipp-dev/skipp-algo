# live-window: any-trigger  # F-PINE-LIB-FRESHNESS (2026-07-03)
# Pine Library Freshness Guard
#
# The five hand-authored shared libraries (pine/skipp_*.pine) ship to
# TradingView (imported via `import preuss_steffen/<lib>/1`) but — unlike the
# code-generated libraries under pine/generated/ that their publish workflows
# keep current (micro_profiles via smc-library-refresh.yml, overlay via
# smc-overlay-library-publish.yml) — had no freshness mechanism and could rot.
#
# This workflow runs `scripts/pine_library_freshness.py --check` on a monthly
# cadence (and on PRs touching the libraries or this guard). When a library's
# `// Last refreshed:` marker exceeds the max-age threshold the build turns
# red, prompting a review + refresh PR
# (`python scripts/pine_library_freshness.py --update`).
#
# Lightweight stdlib-only check → runs directly on the hosted runner (no
# self-hosted routing needed; see tests/test_workflow_runner_pinned.py).
name: pine-library-freshness

on:
  schedule:
    - cron: "0 7 1 * *"  # 07:00 UTC on the 1st of each month
  pull_request:
    paths:
      - "pine/skipp_*.pine"
      - "scripts/pine_library_freshness.py"
      - "tests/test_pine_library_freshness.py"
      - ".github/workflows/pine-library-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  freshness-check:
    name: check pine library freshness
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Run pine library freshness check
        run: |
          python scripts/pine_library_freshness.py --check
