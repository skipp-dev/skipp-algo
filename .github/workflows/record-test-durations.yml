# live-window: manual-only  # workflow_dispatch-only durations recording (2026-08-21)
name: record-test-durations

# Misst `.test_durations` DORT, wo die Balance gemeint ist: auf dem Runner.
#
# `ci.yml` nennt seine Aufteilung "duration-balanced matrix sharding
# (pytest-split)". Die Gewichte dafuer kommen aus `.test_durations`. Wer diese
# Datei lokal aufzeichnet, misst die falsche Maschine — und am 2026-08-21 auch
# den falschen Vorgang:
#
#   Eine lokale serielle Aufzeichnung (26030 Tests in EINEM Prozess) blaehte
#   fuenf Tests um das 20- bis 130-fache auf. Gemessen: ein Test stand mit
#   120,62 s in der Datei und brauchte einzeln 10,96 s; ein zweiter mit
#   66,69 s gegen 0,74 s einzeln. Der Median ueber 1213 gemeinsame Tests lag
#   dagegen bei 0,79-1,02 — also kein breiter Drift, sondern genau die
#   schwersten Eintraege, und die bestimmen bei pytest-split den Zuschnitt.
#   Ergebnis auf dem Runner: laengster Shard 358,8 s -> 368,8 s (LAENGER),
#   Spreizung 2,12x -> 4,86x. Belegt in PR #4943, dort widerlegt dokumentiert.
#
# Dieser Workflow bildet die PR-Lane exakt nach, statt sie zu approximieren:
# dieselbe Aufteilung (`--splits 4`), dieselbe Serialitaet innerhalb eines
# Shards (kein `-n`), dieselbe Maschine, ein Prozess je Viertel statt einer
# fuer alles. Jeder Shard schreibt seine eigene Datei, der Merge-Job legt sie
# zusammen und oeffnet den PR.
#
# AUSLOESER ist ausschliesslich `workflow_dispatch`. Der Stolperdraht, der
# sagt WANN, ist `test_the_duration_map_still_covers_the_suite`: er roetet,
# sobald die Datei unter 85 % der Testdateien faellt, und nennt diesen
# Workflow als Reparaturweg. Ein eigener Cron waere hier eine zweite,
# schwaechere Antwort auf dieselbe Frage — und eine weitere unbeobachtete
# geplante Flaeche (siehe #4878).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: record-test-durations
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  record:
    name: record shard ${{ matrix.group }}
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    # Grosszuegiger als die 15-min-Kappe der PR-Lane: ein Aufzeichnungslauf
    # darf nicht an der Kappe sterben, sonst fehlen genau die Gewichte der
    # langsamsten Tests. `faulthandler_timeout` aus pyproject.toml benennt
    # einen Hang trotzdem nach 180 s, statt ihn auszusitzen.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Ein roter Shard darf die anderen drei nicht abschneiden — sonst
      # kostet ein einzelner Fehlschlag die ganze Messung.
      fail-fast: false
      matrix:
        group: ['1', '2', '3', '4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      # Ohne diese drei Schritte laeuft der Recording-Schritt gegen den nackten
      # Tool-Cache-Interpreter und stirbt nach ~10 s mit "No module named
      # pytest" — gemessen an Lauf 32499080475, dem ERSTEN Dispatch dieses
      # Workflows ueberhaupt. `setup-persistent-venv` legt das venv-bin auf
      # GITHUB_PATH, weshalb das blanke `python` im Schritt darunter danach die
      # venv trifft; genau so macht es der validate-Job in ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt

      - name: Resolve Python 3.12 interpreter
        shell: bash
        run: |
          python -c "import sys; raise SystemExit('GitHub-hosted Python bootstrap did not resolve Python 3.12.' if sys.version_info[:2] != (3, 12) else 0)"
          echo "SMC_PYTHON_BIN=python" >> "$GITHUB_ENV"

      - name: Install test dependencies
        uses: ./.github/actions/setup-persistent-venv
        with:
          python-bin: ${{ env.SMC_PYTHON_BIN }}
          requirements-file: requirements.lock
          extra-packages: pytest
          runner-environment: github-hosted

      - name: Record durations for this shard
        run: |
          set -uo pipefail
          # Bewusst OHNE `--maxfail`: ein Fehlschlag darf die Messung nicht
          # abschneiden, sonst fehlen alle Gewichte hinter ihm. Bewusst OHNE
          # `-n`: die PR-Lane faehrt innerhalb eines Shards seriell, und eine
          # unter xdist gemessene Zeit ist nicht die Zeit, die dort anfaellt.
          # `-p no:randomly` haelt die Sammelreihenfolge deterministisch, also
          # vergleichbar zwischen zwei Aufzeichnungen.
          python -m pytest -q -p no:randomly \
            --splits 4 --group "${{ matrix.group }}" \
            --store-durations \
            --durations-path "durations-${{ matrix.group }}.json"
          rc=$?
          # Der Testausgang ist hier NICHT das Ergebnis — die Datei ist es.
          # Ein roter Test macht seine gemessene Dauer nicht ungueltig, und
          # main rot zu melden ist die Aufgabe von `ci.yml`, nicht dieses
          # Laufs. Fehlt die Datei dagegen, ist die Messung wertlos: das
          # scheitert hart.
          if [ ! -s "durations-${{ matrix.group }}.json" ]; then
            echo "::error::shard ${{ matrix.group }} hat keine Durations geschrieben (pytest rc=${rc}) — die Messung ist unbrauchbar."
            exit 1
          fi
          echo "shard ${{ matrix.group }}: pytest rc=${rc}, $(wc -c < "durations-${{ matrix.group }}.json") Bytes"

      - name: Upload shard durations
        # always(): die Messung ist das Ergebnis, nicht der Testausgang. Ein
        # Shard, dessen pytest-Lauf rot endet, hat seine Laufzeiten trotzdem
        # geschrieben — die hier zu verlieren hiesse, die Aufzeichnung an einem
        # Fehlschlag scheitern zu lassen, den ci.yml ohnehin meldet.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: durations-${{ matrix.group }}
          path: durations-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 7

  merge:
    name: merge shards and open PR
    needs: record
    runs-on: ${{ vars.SMC_GH_HOSTED_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python
        uses: ./.github/actions/setup-python-pinned

      - name: Download shard durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: durations-*
          path: /tmp/durations
          merge-multiple: true

      - name: Merge into .test_durations
        id: merge
        run: |
          set -euo pipefail
          python scripts/merge_shard_durations.py \
            --shards /tmp/durations \
            --expected-shards 4 \
            --out .test_durations >> "$GITHUB_OUTPUT"

      - name: Open durations PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COVERAGE: ${{ steps.merge.outputs.coverage }}
          ENTRIES: ${{ steps.merge.outputs.entries }}
          SLOWEST: ${{ steps.merge.outputs.slowest }}
          SLOWEST_TEST: ${{ steps.merge.outputs.slowest_test }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .test_durations; then
            echo "::notice::.test_durations ist unveraendert — kein PR noetig."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT ist nicht konfiguriert; die Messung liegt in den Artefakten, aber kein PR kann geoeffnet werden."
            exit 1
          fi
          branch="bot/test-durations-${GITHUB_RUN_ID}"
          _remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add .test_durations
          git commit -m "chore(ci): .test_durations auf dem Runner neu gemessen (Lauf ${GITHUB_RUN_ID})"
          {
            echo "Aufgezeichnet von \`record-test-durations\`, Lauf \`${GITHUB_RUN_ID}\` — auf dem Runner, nicht lokal."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Eintraege | ${ENTRIES} |"
            echo "| Abdeckung der Testdateien | ${COVERAGE}% |"
            echo "| langsamster Test | ${SLOWEST}s — \`${SLOWEST_TEST}\` |"
            echo
            echo "Vier Shards, je ein eigener Prozess, seriell (\`--splits 4 --group N\`, kein \`-n\`)"
            echo "— dieselbe Form wie die PR-Lane in \`ci.yml\`."
            echo
            echo "Warum nicht lokal: eine lokale Aufzeichnung blaehte am 2026-08-21 fuenf Tests"
            echo "um das 20- bis 130-fache auf und verschlechterte die Balance auf dem Runner"
            echo "(laengster Shard 358,8 s -> 368,8 s). Belegt in #4943."
          } > /tmp/durations_pr_body.md
          if git push "${_remote_url}" "HEAD:refs/heads/${branch}"; then
            if ! gh pr create \
              --base main \
              --head "${branch}" \
              --title "chore(ci): .test_durations auf dem Runner neu gemessen" \
              --body-file /tmp/durations_pr_body.md; then
              echo "::error file=.github/workflows/record-test-durations.yml::gh pr create failed for ${branch} — Branch ist gepusht, PR manuell oeffnen."
              exit 1
            fi
          else
            echo "::error file=.github/workflows/record-test-durations.yml::push failed for ${branch} — die Messung liegt in den Artefakten dieses Laufs."
            exit 1
          fi
