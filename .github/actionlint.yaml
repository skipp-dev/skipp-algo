# actionlint configuration.
#
# 2026-08-06: GitHub shipped `concurrency.queue` on 2026-05-07 (up to 100
# pending runs per group instead of the default `queue: single`, which cancels
# the single pending run whenever a newer entrant arrives). actionlint does not
# know the key yet -- 1.7.12 (2026-03-30, latest release) still validates
# `concurrency` against exactly {group, cancel-in-progress} and reports the
# valid key as a syntax error, which would fail the hard actionlint gate in
# smc-fast-pr-gates.yml.
#
# The ignore is pinned to that one message, so any OTHER unexpected key in a
# concurrency block is still an error. DELETE this file (or just this entry)
# once the pinned actionlint version knows `queue`; leaving a stale ignore in
# place is how a real syntax error later slips through.
paths:
  .github/workflows/**/*.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
