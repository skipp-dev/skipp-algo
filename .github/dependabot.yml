# Dependabot version updates — added 2026-08-04 (#4407), narrowed the same
# day after the initial wave measured the design against reality.
#
# What the first config got wrong, measured 2026-08-04 14:13-14:28Z: groups
# covered only minor+patch, so every MAJOR update escaped the group and
# became its own PR — 9 PRs in 15 minutes (typescript 7, pyarrow 25, tzdata
# 2026.3 twice, a setuptools range widening, plus the 4 intended grouped
# PRs). github-actions was the control group: its group covered all update
# types and produced exactly one PR. On top of that, Dependabot rebases every
# open PR on every main merge — main moved 6+ times that day, so 9 open PRs
# meant a standing rebase-and-CI cascade.
#
# The shape now: ONE grouped PR per ecosystem per week, majors included
# (open-pull-requests-limit: 1 enforces it), and rebase-strategy: disabled so
# a busy main does not turn open update PRs into CI load. Security updates
# are unaffected by these limits and still open immediately.
#
# Surfaces covered (measured 2026-08-04):
#   uv.lock            — locks the pyproject set; consumed by no workflow
#                        (nothing runs `uv sync`), but it is the manifest
#                        Dependabot scans, and 8 workflows install the same
#                        set unpinned via `pip install -e .`. Deliberate
#                        decision: scan-only, not wired into CI.
#   requirements*.txt  — what CI actually installs (fast-gates et al.)
#   package-lock.json  — root + smc_tv_bridge (source of 4 of the 6
#                        historical alerts)
#   github-actions     — 68 workflows pin actions by tag
#
# Why torch is ignored in both Python ecosystems (measured 2026-08-04, #4424
# and #4427 produced the SAME change): torch is pinned across two deliberately
# different lanes in the root directory. requirements-rl.txt is the PyPI lane
# and pins a plain `torch==2.12.1`; requirements-rl-gpu.txt is the CUDA lane,
# carries the repo's only approved non-PyPI index (the PyTorch CDN, SC-03
# allowlist) and pins `torch==2.12.1+cu129`. Dependabot resolves torch through
# that index and then writes the resolved string into BOTH files — so the PyPI
# lane got `torch==2.13.0+cu129`, a PEP 440 local version that cannot exist on
# PyPI (verified: 49 torch releases there, zero with a local version), and
# `pip install -r requirements-rl.txt` could no longer resolve. The two-lane
# split collapses silently in the process. requirements-rl.txt says it itself:
# "Runner type therefore determines the *effective* torch build; compatibility
# must be validated against both lanes." That validation is a human decision,
# so torch moves by hand. tests/test_dependabot_local_version_pins.py holds
# this open for any future locally-versioned pin, not just torch.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "torch"
    groups:
      uv-all:
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/services/a0_fast_detector"
      - "/services/live_overlay_daemon"
      - "/services/mlflow_tracking"
      - "/services/opra_live_daemon"
      - "/services/signals_producer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      - dependency-name: "torch"
    groups:
      pip-all:
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/smc_tv_bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    ignore:
      # typescript majors move by hand. Measured 2026-08-04 against the real
      # 7.0.2 wheel, after #4426 proposed 5.9.3 -> 7.0.2 and turned fast-gates,
      # Windows x64, macOS Intel and macOS Apple Silicon red at once:
      #
      # TypeScript 7 removes the compiler API from the package root. Its
      # `exports` map resolves "." to `./lib/version.cjs` — the version string,
      # nothing else — so `import ts from "typescript"` in
      # scripts/detect_vacuous_claims_ts.ts yields a module with no
      # `ScriptTarget` (hence the runtime "Cannot read properties of undefined
      # (reading 'Latest')") and tsc reports every `ts.*` as missing from
      # namespace `typescript/lib/version`.
      #
      # The API moved to `typescript/unstable/*`, and a port is a REWRITE, not a
      # re-import. Corrected 2026-08-05 — the earlier wording here claimed
      # `forEachChild` "exists in NO subpath", which a review disproved against
      # the real 7.0.2 install. Re-measured: the exported free function is gone,
      # but it survives as a Node METHOD (`dist/ast/ast.d.ts:40`), so every
      # `ts.forEachChild(node, cb)` becomes `node.forEachChild(cb)`; and
      # `isStringLiteralLike` is renamed `isStringLiteralLikeNode`. A surface
      # upstream itself labels "unstable" is, for a guard that gates merges,
      # the wrong trade. The decision is unchanged; only the reason is stated
      # correctly.
      #
      # Corrected again 2026-08-05, this time by unpacking the 7.0.2 tarball
      # rather than reasoning about it. The earlier wording here said parsing
      # "moves to `unstable/sync`'s API -> Project -> program.getSourceFile()".
      # That skipped a mandatory step and named no source: there is no
      # `getSourceFile` on `API` at all. `dist/api/sync/api.d.ts` declares
      # API -> updateSnapshot() -> Snapshot -> getProject(configFileName) |
      # getDefaultProjectForFile() -> Project -> .program ->
      # Program.getSourceFile(). Five hops, anchored on a config file, over an
      # out-of-process client. And there is no lighter route: grepping every
      # `.d.ts` in the wheel finds NO free-standing parse function, and
      # `unstable/ast` (dist/ast/index.d.ts) re-exports ast, astnav, clone, is,
      # jsdoc, scanner, utils and visitor — no parser module exists. The
      # `createSourceFile` in unstable/ast/factory is the FACTORY, taking
      # already-parsed statements. So the rewrite is larger than "swap the
      # import", which is the whole basis of this hold.
      #
      # WHY 6.0.3 AND NOT 5.9: moved 2026-08-05 to the version the vendor
      # designates as the bridge. TypeScript 6.0 is the last release built on
      # the JavaScript codebase (the repo entered maintenance mode 2026-01-08,
      # `npm view typescript@6.1` is a 404, and no 6.1 milestone exists), and
      # it still ships the classic API at the package root — no `exports` map,
      # `main: ./lib/typescript.js`, `bin: {tsc, tsserver}`. Verified before
      # the bump: the 28-test guard suite and `tsc --noEmit` both pass on
      # 6.0.3, and the analyzer returns byte-identical findings across 15
      # probe sources (11 with real hits) on 5.9.3 and 6.0.3.
      #
      # KNOWN, UNRESOLVED RISK of that bridge: Microsoft has published no LTS
      # policy, no security-fix window and no end-of-support date for 6.x. The
      # December-2025 progress post scopes 6.0 servicing to security issues,
      # high-severity regressions against 5.9 and 6.0/7.0 compatibility, and
      # says patches "will be infrequent". Searched 2026-08-05 and found no
      # date — so how long this bridge holds is genuinely unknown, not merely
      # unlooked-up. Note also that the absence of a 6.1 does NOT bound it:
      # patch releases continued (6.0.3 on 2026-04-16).
      #
      # NOT the `@typescript/typescript6` alias the release notes suggest —
      # but not because it would break anything. An earlier draft of this
      # comment claimed its `bin: {tsc6}` would take `tsc`/`tsserver` away and
      # break `tsc:check`. That was reasoned from the manifest and is FALSE;
      # installing the alias and running the script disproves it (rc=0).
      #
      # What it actually is, measured 2026-08-05 by installing it: a 44 KB
      # shim whose ONLY dependency is `@typescript/old: "npm:typescript@^6"`.
      # It resolves to the very same `typescript@6.0.3` this repo now pins
      # directly — `.bin/tsc` links into `@typescript/old`, `tsc --version`
      # prints 6.0.3, and the root import yields the classic API
      # (`ScriptTarget.Latest === 99`, `createSourceFile`, `forEachChild`,
      # `isStringLiteralLike` all present).
      #
      # So the alias is an indirection to identical bytes. It earns its keep
      # only when a project installs TypeScript 7 for `tsc` AND needs the 6.0
      # API under the `typescript` specifier at the same time — the
      # typescript-eslint / Volar case the release notes address. This repo
      # does not install 7, so the layer buys nothing and adds a package whose
      # own version (6.0.2) floats independently of the compiler it resolves
      # to. Plain `typescript@6` is the same compiler, one layer fewer.
      #
      # Minor/patch updates are unaffected and still flow. Revisit when
      # TypeScript ships a stable replacement for the parse+walk API — as of
      # 2026-08-05 there is no date. The 7.0 Beta (2026-04-21), RC (2026-06-18)
      # and GA (2026-07-08) posts all say 7.0 ships without a supported API and
      # target a "new (and different)" one at 7.1; the 7.1 milestone is open
      # with no due date. The "October 2026" figure in secondary write-ups is
      # arithmetic on the GA post's "every 3-4 months" line, not a commitment.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-all:
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "github-actions"
    # `/` means `.github/workflows/` for this ecosystem and NOTHING else —
    # measured 2026-08-04 by what Dependabot's own commit in #4425 (753b7a33e)
    # did and did not touch. It bumped setup-python to v7 in the 18 workflows
    # that reference it and left .github/actions/setup-python-pinned/action.yml
    # on v6, the canonical composite several jobs run via
    # `uses: ./.github/actions/...`. Two setup-python versions in one CI, and
    # nothing was red. (Precision added 2026-08-05: the MERGED #4425 does not
    # carry that split — a companion commit in the same PR repaired it by hand.
    # The blind spot is Dependabot's, not the merged result's.)
    #
    # The same blind spot let .github/workflow-templates/ keep
    # astral-sh/setup-uv v3.2.4 (2024-11-23) while the workflows ran v8.2.0
    # (2026-06-03), and then v9.0.0 (2026-07-21) once #4425 landed — five
    # majors and twenty months, in files copied verbatim into new workflows.
    #
    # Grouping still yields ONE PR across the added directories: this repo's
    # own #4426 is titled "across 2 directories", so the multi-directory shape
    # does not re-open the PR storm this config was narrowed to prevent.
    #
    # tests/test_action_pin_surfaces_agree.py is the actual safety net and does
    # not depend on this entry: it fails the moment two surfaces disagree, so a
    # partial bump is caught even if Dependabot never learns about a surface.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      actions-all:
        update-types: ["major", "minor", "patch"]
